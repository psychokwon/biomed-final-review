 fails to activate the breathing muscles, so **there is no effort**.\n\nThat is why measuring **respiratory effort (chest and abdominal movement)** on polysomnography is the key to telling CSA from OSA.","why":{"0":"Obesity is a risk factor for OSA but not the distinguishing criterion.","1":"Both types are defined by events of at least 10 seconds, so duration does not separate them.","3":"Snoring loudness alone cannot distinguish them.","4":"Total sleep time does not distinguish the two types."},"one":"OSA and CSA are distinguished by whether inspiratory effort (chest and abdominal movement) is present."},"w12_sleep_apnea-6":{"q":"A 48-year-old adult has an apnea-hypopnea index (AHI) of 22 events per hour of sleep. How is the severity classified?","o":["Moderate","Mild","Normal","Cannot be classified by AHI","Severe"],"a":0,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 8","img":[{"u":"img/w12_sleep_apnea/p08.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 8","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"Severity in adults by **AHI (events per hour of sleep)**:\n\n- **Normal**: AHI < 5\n- **Mild**: 5 ≤ AHI < 15\n- **Moderate**: **15 ≤ AHI < 30**\n- **Severe**: AHI ≥ 30\n\nAn AHI of 22 is at least 15 and under 30, so it is **moderate**. Remember the cut points 5, 15 and 30.","why":{"1":"Mild is an AHI of 5 to under 15.","2":"Normal is an AHI under 5.","3":"Adult sleep apnea severity is classified by AHI.","4":"Severe is an AHI of 30 or more."},"one":"Adult AHI: under 5 normal, 5–15 mild, 15–30 moderate, 30 or more severe."},"w12_sleep_apnea-7":{"q":"Apneas and hypopneas lead to sleep fragmentation, hypoxemia, and negative intrathoracic pressure. Which consequence is listed under endocrinopathy?","o":["Pulmonary hypertension","Crashes","Arrhythmia","Diabetes mellitus and insulin resistance","Cognitive dysfunction"],"a":3,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 9","img":[{"u":"img/w12_sleep_apnea/p09.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 9","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"Apneas and hypopneas cause **sleep fragmentation**, **hypoxemia** and **negative intrathoracic pressure**.\n\nThese lead to sympathetic surge, hemodynamic effects on the cardiovascular system, oxidative stress, inflammation, endothelial dysfunction, hypercoagulability and endocrine dysregulation, with four groups of outcomes:\n\n- **Sleepiness**: crashes, reduced quality of life\n- **Neurocognitive effects**: cognitive and executive function\n- **Cardiovascular disease**: hypertension, CAD, CHF, arrhythmia, CVA, pulmonary hypertension\n- **Endocrinopathy**: **diabetes mellitus, insulin resistance**","why":{"0":"Pulmonary hypertension falls under cardiovascular disease.","1":"Crashes are a consequence of sleepiness.","2":"Arrhythmia falls under cardiovascular disease.","4":"Cognitive dysfunction falls under neurocognitive effects."},"one":"The endocrinopathy outcomes of sleep apnea are diabetes mellitus and insulin resistance."},"w12_sleep_apnea-8":{"q":"Which is listed among the symptoms of sleep apnea, and what fraction of people with sleep apnea don't know they have it?","o":["Nocturia; about 10%","Nocturia; about 90%","Fever; about 10%","Weight loss; about 50%","Increased appetite; about 25%"],"a":1,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 10, 11","img":[{"u":"img/w12_sleep_apnea/p10.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 10","w":1200,"h":675},{"u":"img/w12_sleep_apnea/p11.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 11","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"Sleep apnea symptoms are shown as a cycle: **insomnia, snoring, dry mouth/throat, morning headache, memory loss, attention deficit, depression/moodiness, fatigue, nocturia and impotence**.\n\nAnd **90% of people who have sleep apnea don't know they have it**, which is why dental screening matters.","why":{"0":"Nocturia is right, but the fraction unaware is 90%, not 10%.","2":"Fever is not listed as a symptom, and the fraction is 90%.","3":"Weight loss is not listed; obesity is a risk factor instead.","4":"Increased appetite is not on the list, and the fraction is 90%."},"one":"Sleep apnea symptoms include nocturia, morning headache and dry mouth, and 90% of those affected don't know they have it."},"w12_sleep_apnea-9":{"q":"What are the three types of sleep apnea?","o":["Acute, chronic, and recurrent","Central, peripheral, and spinal","Obstructive, restrictive, and reactive","Mild, moderate, and severe","Obstructive, central, and mixed/complex"],"a":4,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 12, 51","img":[{"u":"img/w12_sleep_apnea/p12.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 12","w":1200,"h":675},{"u":"img/w12_sleep_apnea/p51.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 51","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"The **three types of sleep apnea** (a starred item):\n\n- **Obstructive sleep apnea (OSA)**: caused by **collapse of the airway** during sleep\n- **Central sleep apnea (CSA)**: caused by **failure of the brain to activate the muscles of breathing** during sleep\n- **Mixed/complex sleep apnea**: both together\n\nMild, moderate and severe are **severity** grades by AHI, not types.","why":{"0":"Acute, chronic and recurrent are not the classification of sleep apnea types.","1":"Peripheral and spinal sleep apnea are not listed types.","2":"Restrictive and reactive are not types of sleep apnea.","3":"Mild, moderate and severe are AHI severity grades."},"one":"The three types of sleep apnea are obstructive (OSA), central (CSA) and mixed/complex."},"w12_sleep_apnea-10":{"q":"In central sleep apnea with a chronic increase in blood CO2, what breathing pattern results?","o":["Wheezing with prolonged expiration","A single long apnea each night","Repetitive cycles of fast breathing followed by slow breathing and apnea (Cheyne-Stokes breathing)","Continuous rapid shallow breathing without pauses","Breathing that stops only when the airway collapses"],"a":2,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 13, 14","img":[{"u":"img/w12_sleep_apnea/p13.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 13","w":1200,"h":675},{"u":"img/w12_sleep_apnea/p14.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 14","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"With a **chronic** increase in blood CO2, the brain ultimately ignores the oxygen level and **monitors the blood CO2 level to determine the next breath**; there is more tolerance to CO2.\n\nThis sets up a loop:\n1. Breathing slows or stops → 2. CO2 builds up in the blood → 3. Rate of breathing increases → 4. CO2 drops too low → 5. Drive and rate of breathing decrease → back to 1\n\nThe result is **repetitive cycles of fast breathing followed by slow breathing and apnea**, called **Cheyne-Stokes breathing**.","why":{"0":"Wheezing with prolonged expiration is a finding of asthma.","1":"It is a repeating fast-slow-apnea cycle, not one long apnea.","3":"This pattern is cyclic breathing that includes pauses.","4":"Breathing that stops because the airway collapses is obstructive sleep apnea."},"one":"Chronic high CO2 in central sleep apnea produces Cheyne-Stokes breathing: repeating cycles of fast, slow and absent breathing."},"w12_sleep_apnea-11":{"q":"How is central sleep apnea treated?","o":["In infants by tracheostomy in all cases","In adults by uvulopalatopharyngoplasty","In adults by oral appliance therapy only","It is never treated because all patients outgrow it","In adults by treating the underlying heart disease, medication interaction, high altitude or other primary problem; in infants with an apnea alarm"],"a":4,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 15","img":[{"u":"img/w12_sleep_apnea/p15.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 15","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**Treatment of central sleep apnea** (a starred item):\n\n- **Adults**: treat the **underlying heart disease, medication interaction, high altitude or other primary problem**. Since the problem is the brain's breathing signal, treating the cause is key.\n- **Infants** (usually with prematurity or other congenital disorders): an **apnea alarm**. Most infants **outgrow** the CSA episodes unless there is a congenital problem.","why":{"0":"Infants are managed with an apnea alarm, and most outgrow it.","1":"UPPP is a surgical treatment for OSA.","2":"Oral appliances mainly address the anatomic airway problem of OSA.","3":"Most infants outgrow it; that does not apply to all patients, including adults."},"one":"CSA is treated by addressing the underlying cause in adults and with an apnea alarm in infants, most of whom outgrow it."},"w12_sleep_apnea-12":{"q":"What is the sequence of events in obstructive sleep apnea?","o":["The brain stops sending signals → no breathing effort → CO2 builds up","Bronchial smooth muscle spasms → wheezing → mucus plugs","The airway collapses or becomes obstructed → unsuccessful effort to breathe → blood oxygen drops → the brain awakens to a shallower sleep level and signals a gasp of air","The tongue moves forward → the airway widens → snoring stops","Blood oxygen drops first → the airway then collapses → the patient sleeps more deeply"],"a":2,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 16","img":[{"u":"img/w12_sleep_apnea/p16.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 16","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"What obstructive sleep apnea is and what causes it (a starred item):\n\n1. **The airway collapses or becomes obstructed**\n2. **Unsuccessful effort to take a breath**\n3. **Blood oxygen levels drop**\n4. **The brain awakens to a more shallow level of sleep**, signalling the body to wake up and take a breath (a gasp of air)\n\nThis repeats through the night, fragmenting sleep and causing daytime sleepiness.","why":{"0":"No signal from the brain and no effort describes central sleep apnea.","1":"Smooth muscle spasm and mucus plugs are the pathophysiology of asthma.","3":"Moving the tongue forward to open the airway is what oral appliances aim for, not the OSA sequence.","4":"Airway obstruction comes first and the oxygen drop follows; the patient wakes to a lighter sleep."},"one":"OSA: airway collapse → failed breathing effort → oxygen drop → arousal to lighter sleep with a gasp."},"w12_sleep_apnea-13":{"q":"Which is part of the dentist's role in obstructive sleep apnea?","o":["Treating central sleep apnea with oral appliances","Screening for OSA risk factors, referring to an appropriate health professional, and providing oral appliance therapy with regular dental and sleep medical follow-up","Diagnosing OSA independently without a sleep physician","Prescribing CPAP pressures without a sleep study","Performing tracheostomy in the dental office"],"a":1,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 17, 27, 3","img":[{"u":"img/w12_sleep_apnea/p17.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 17","w":1200,"h":675},{"u":"img/w12_sleep_apnea/p27.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 27","w":1200,"h":675},{"u":"img/w12_sleep_apnea/p03.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 3","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**The dentist's role**:\n- **Screening** patients for OSA risk factors\n- **Referring** to an appropriate health professional as indicated\n- Providing **oral appliance therapy**, followed by **regular dental and sleep medical follow-up**\n\nIn more detail, the main role of the dental sleep medicine dentist is to screen for risk factors, give sleep hygiene and health advice for prevention, deliver OA treatment when recommended, **refer patients to the sleep physician for objective assessment of successful titration**, and, when managing sleep bruxism and TMD, rule out conditions such as insomnia, headache or GERD that are concomitant with OSA.","why":{"0":"Oral appliances mainly address the anatomic airway problem, i.e. OSA.","2":"Diagnosis and objective assessment are referred to the sleep physician.","3":"CPAP is medical treatment; the dentist's role is screening, referral and oral appliances.","4":"Tracheostomy is not part of the dentist's role."},"one":"The dentist's OSA role is screening, referral, and oral appliance therapy with follow-up."},"w12_sleep_apnea-14":{"q":"When a dentist screens for OSA risk factors, which group lists oral/craniofacial findings?","o":["Gingival recession, attrition only on incisors, fluorosis","Low Mallampati score, prognathism, small tongue","Clubbing, cyanosis, pedal edema","Retrognathia, high arched palate, enlarged tonsils or tongue, enlarged tori, high Mallampati score","Short face, wide nasal passages, small tonsils"],"a":3,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 18","img":[{"u":"img/w12_sleep_apnea/p18.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 18","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"The dentist's **screening of OSA risk factors** has two groups:\n\n- **Oral/craniofacial findings**: **retrognathia**, **high arched palate**, **enlarged tonsils or tongue**, **enlarged tori**, **high Mallampati score**\n- **History/systemic factors**: poor sleep, supine sleep position, obesity, hypertension, morning headache or orofacial pain, bruxism\n\nWhat they share is that they all **narrow the upper airway**.","why":{"0":"Gingival recession and fluorosis are not on the OSA risk list.","1":"The risk factors are a high Mallampati score, retrognathia and an enlarged tongue.","2":"Clubbing, cyanosis and pedal edema are not OSA screening items.","4":"The risk factors are a long face, small nasal passage and enlarged tonsils."},"one":"Oral OSA screening findings: retrognathia, high arched palate, large tonsils/tongue, enlarged tori, high Mallampati score."},"w12_sleep_apnea-15":{"q":"In the Mallampati airway classification, which class means the soft palate is not visible?","o":["Class IV","Class I","Class III","Class II","Class 0"],"a":0,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 19","img":[{"u":"img/w12_sleep_apnea/p19.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 19","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**Mallampati classification**:\n- **Class I**: soft palate and **entire uvula** visible\n- **Class II**: soft palate and part of the uvula visible\n- **Class III**: soft palate and base of the uvula visible\n- **Class IV**: **soft palate not visible**\n\nIn the **Mallampati maneuver**, patients are told not to emit sounds but to open the mouth as wide as possible and **protrude the tongue as far as possible**. In the **modified Mallampati**, they open the mouth as wide as possible without emitting sounds. Higher classes mean a narrower airway and higher OSA risk.","why":{"1":"Class I shows the soft palate and the entire uvula.","2":"Class III shows the soft palate and the base of the uvula.","3":"Class II shows the soft palate and part of the uvula.","4":"There is no Class 0 in this scheme."},"one":"Mallampati Class IV means the soft palate is not visible; higher classes mean higher OSA risk."},"w12_sleep_apnea-16":{"q":"Which is listed as an extraoral feature associated with OSA?","o":["Edentulism","Macroglossia","Evidence of bruxism","Neck circumference >17 inches in males or >16 inches in females","Elongated soft palate"],"a":3,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 20","img":[{"u":"img/w12_sleep_apnea/p20.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 20","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"OSA-associated features are extraoral or intraoral.\n\n- **Extraoral**: **neck circumference >17 inches (males) or >16 inches (females)**, retrognathic profile, **Class II malocclusion**, long face, small nasal passage\n- **Intraoral**: macroglossia, narrow high-vaulted hard palate, elongated soft palate, enlarged low-lying uvula, enlarged tonsils and adenoids, evidence of bruxism, overjet, erosion associated with GERD, edentulism","why":{"0":"Edentulism is an intraoral feature.","1":"Macroglossia is an intraoral feature.","2":"Evidence of bruxism is an intraoral feature.","4":"An elongated soft palate is an intraoral feature."},"one":"Extraoral OSA features: neck >17 in (men) or >16 in (women), retrognathic profile, Class II malocclusion, long face, small nasal passage."},"w12_sleep_apnea-17":{"q":"In the STOP-BANG questionnaire, what do \"B,\" \"A,\" and \"N\" stand for?","o":["Bruxism; Asthma; Nocturia","BMI greater than 30; Age over 50; Neck circumference greater than 40 cm","BMI greater than 25; Age over 65; Neck circumference greater than 35 cm","Breathing pauses; Alcohol use; Napping","Blood pressure; Apnea observed; Nasal obstruction"],"a":1,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 21","img":[{"u":"img/w12_sleep_apnea/p21.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 21","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"The high-risk **STOP-BANG questionnaire**:\n\n- **S**noring: loud snoring (louder than talking or heard through closed doors)?\n- **T**ired: often tired, fatigued or sleepy during the day?\n- **O**bserved apnea: has anyone seen you stop breathing during sleep?\n- **P**ressure: high blood pressure?\n- **B**MI: **greater than 30**\n- **A**ge: **over 50**\n- **N**eck circumference: **greater than 40 cm**\n- **G**ender: male\n\nSTOP covers symptoms and history; BANG covers physical traits.","why":{"0":"Bruxism, asthma and nocturia are not STOP-BANG items.","2":"The cut-offs are wrong: BMI 30, age 50, neck 40 cm.","3":"Breathing pauses, alcohol and napping are not what BANG stands for.","4":"Pressure (P) and observed apnea (O) are on the STOP side, and N is neck circumference, not nasal obstruction."},"one":"In STOP-BANG, B, A and N are BMI >30, age >50 and neck circumference >40 cm."},"w12_sleep_apnea-18":{"q":"OSA treatment should be tailored to each patient. Which is one of the four phenotype traits used to tailor therapy?","o":["Low hematocrit","Strong airway dilator muscle response","High loop gain (big breathing response at O2 return)","High arousal threshold only","Normal anatomy in every patient"],"a":2,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 22","img":[{"u":"img/w12_sleep_apnea/p22.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 22","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**OSA treatment should be tailored to each patient**, choosing therapy by four traits:\n\n1. **Anatomy/genetic**: devices (CPAP, oral appliance, sleep position corrector, nasal dilator, etc.), surgery (nose, tonsils/adenoids, hyoid, bariatric, maxillo-mandibular, etc.), other (orthodontics, weight loss, exercise, etc.)\n2. **Weak response of airway dilator muscles**: medication to raise muscle reactivity, hypoglossal nerve stimulation, oropharyngeal exercises, hormone replacement therapy, TMS\n3. **High loop gain (big breathing response at O2 return)**: oxygen supplement, oxygen plus CPAP, acupuncture\n4. **High probability of sleep arousal**: CBT, exercise, medication to reduce sleep instability (e.g. trazodone)\n\nMenopause, sleep position, poor life habits and fluid retention are considered around them.","why":{"0":"Hematocrit is not one of the OSA phenotype traits.","1":"The trait is a weak, not strong, airway dilator muscle response.","3":"The trait is a high probability of sleep arousal, and it is only one of four.","4":"Anatomy is a key trait, and not every patient has normal anatomy."},"one":"The four tailoring traits: anatomy, weak dilator muscle response, high loop gain and high arousal probability."},"w12_sleep_apnea-19":{"q":"How common is OSA, and how many people with OSA are receiving treatment?","o":["0.1% of all ages; all are receiving treatment","Prevalence is decreasing because the population is less obese","15% of children, 2% of older adults; 50% are receiving treatment","20% of children, 50% of adults; 90% are receiving treatment","2–3% of children, 5–7% of middle-aged adults, >15% of older adults; only 10% are receiving treatment"],"a":4,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 23","img":[{"u":"img/w12_sleep_apnea/p23.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 23","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**How common is OSA**:\n- **Children (2–8 years)**: **2–3%**\n- **Middle-aged adults**: **5–7%**\n- **Older adults (65+)**: **more than 15%**\n- **Increasing** because the population is more obese\n- **Only 10% of people with OSA are currently receiving treatment**\n\nThe points to remember: it becomes more common with age, and most cases are untreated.","why":{"0":"Prevalence is much higher, and only 10% are treated.","1":"Prevalence is increasing because the population is more obese.","2":"It is most common in older adults, not children.","3":"These figures are far too high, and only 10% are treated."},"one":"OSA affects 2–3% of children, 5–7% of middle-aged and >15% of older adults; only 10% are treated."},"w12_sleep_apnea-20":{"q":"Who is at risk for sleep apnea?","o":["Males more than females before 50, and males equal to females after menopause; about 70% of obese people have OSA","African-Americans have half the risk of Caucasians","Only people over 65","Females more than males before age 50","Neck size ≥14 inches in men"],"a":0,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 24","img":[{"u":"img/w12_sleep_apnea/p24.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 24","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**Who is at risk for sleep apnea** (a starred item):\n\n- **Male > female before age 50**; **male = female after menopause**\n- Who has OSA: **70% of obese people**, 30–50% of heart disease patients, **60% of stroke patients**, 14% of NFL players and 34% of NFL linemen\n- **African-Americans have a 2.5 times higher risk than Caucasians**\n\nOther factors:\n- Large neck size (**≥17 inches in men, ≥16 inches in women**)\n- Family history of sleep apnea\n- Gastroesophageal reflux (GERD)\n- Nasal obstruction from a deviated septum, allergies or sinus problems","why":{"1":"African-Americans have a 2.5 times higher risk than Caucasians.","2":"It is more common in older adults, but not limited to people over 65.","3":"Before 50, males are affected more than females.","4":"The threshold is ≥17 inches in men and ≥16 inches in women."},"one":"Before 50 men > women, after menopause equal; 70% of obese and 60% of stroke patients have OSA; African-Americans 2.5x."},"w12_sleep_apnea-21":{"q":"In the interprofessional management approach to OSA, which statement is correct?","o":["Oral appliances have moderate evidence and acceptable compliance, used for most of the sleep duration, but some patients with mild OSA may be nonresponders.","Cognitive behavioral therapy must always be done in person and cannot be offered online.","Sleep-positioning devices can be used without any medical collaboration.","Acupuncture is the first-line treatment with strong evidence.","Collaborative dental and medical follow-up is optional."],"a":0,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 25, 26","img":[{"u":"img/w12_sleep_apnea/p25.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 25","w":1200,"h":675},{"u":"img/w12_sleep_apnea/p26.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 26","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"The five points of the **interprofessional management approach**:\n\n1. **Behavioral approaches**: diet and sleep hygiene advice, correcting poor sleep habits and beliefs, improving the sleep environment. Low-to-moderate evidence. CBT is a recognized approach and is **also available online** as first-line treatment\n2. With medical recommendation, **sleep-positioning devices** (for supine sleep habits) or compression socks for leg fluid retention: moderate evidence, **needs medical collaboration**\n3. **Oral appliances and orthodontic treatment**: **moderate evidence, acceptable compliance**, used for most of the sleep duration. **Some patients with mild OSA may be nonresponders**\n4. If trained, **acupuncture**: moderate evidence, probably responder- and belief-related\n5. **Collaborative dental and medical follow-up is mandatory**\n\nThe clinical algorithm follows the same flow: identify OSA risk (dental screening plus sleep medicine diagnosis and testing) → patient self-management → interventions by health-care providers (non-invasive/reversible, invasive/surgical).","why":{"1":"CBT is also available online as first-line treatment.","2":"Sleep-positioning devices need medical collaboration.","3":"Acupuncture is only an option for trained clinicians, with moderate evidence.","4":"Collaborative dental and medical follow-up is mandatory."},"one":"Oral appliances have moderate evidence and acceptable compliance, and joint dental-medical follow-up is mandatory."},"w12_sleep_apnea-22":{"q":"According to a 2013 study, men and women with 2 or more signs or symptoms of OSA had what risk of first-onset TMD?","o":["10% greater incidence","4 times greater incidence","34.1% lower incidence","No change in risk","73% greater incidence"],"a":4,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 28","img":[{"u":"img/w12_sleep_apnea/p28.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 28","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**Sleep apnea and oral health** go both ways: sleep apnea can contribute to oral problems, and dental problems can also cause sleep apnea.\n\n- **TMJ**: in a 2013 study, men and women with **2 or more** signs/symptoms of OSA had a **73% greater incidence of first-onset TMD**.\n- **Sleep bruxism**: a patient with bruxism, TMD and headache was treated with an oral device for the sleep disorder; headaches decreased by two months and completely resolved after 10 months.\n- **Mouth breathing**: leads to tooth decay, plaque, mouth sores, gingivitis (34.1%) and periodontal disease (62.3%).","why":{"0":"The increase was 73%, not 10%.","1":"Four times is the stroke-risk figure tied to sleep apnea.","2":"34.1% is the gingivitis figure tied to mouth breathing.","3":"Risk rose by 73%."},"one":"Two or more OSA signs/symptoms carry a 73% greater incidence of first-onset TMD."},"w12_sleep_apnea-23":{"q":"Mouth breathing associated with sleep apnea leads to which oral problems, and which dental factor is listed as increasing OSA?","o":["Enamel hypoplasia; fluorosis","Gingivitis (34.1%) and periodontal disease (62.3%); edentulism","Hypercementosis; ankylosis","Increased salivary flow; macrodontia","Only dental fluorosis; supernumerary teeth"],"a":1,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 28, 29","img":[{"u":"img/w12_sleep_apnea/p28.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 28","w":1200,"h":675},{"u":"img/w12_sleep_apnea/p29.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 29","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**Mouth breathing** leads to **tooth decay, plaque, mouth sores, gingivitis (34.1%) and periodontal disease (62.3%)**.\n\nAnother **factor that increases OSA** is **edentulism**: without teeth, the position of the jaw and tongue changes and the airway narrows more easily. **A dental oral assessment can identify such other factors.**","why":{"0":"Enamel hypoplasia and fluorosis are not listed as sleep-apnea-related oral problems.","2":"Hypercementosis and ankylosis are not listed.","3":"Mouth breathing goes with dry mouth, not more saliva, and macrodontia is not listed.","4":"Fluorosis and supernumerary teeth are not listed."},"one":"Mouth breathing causes gingivitis (34.1%) and periodontal disease (62.3%); edentulism increases OSA."},"w12_sleep_apnea-24":{"q":"Which is listed as a predisposing factor for upper airway obstruction in OSA?","o":["Pulmonary fibrosis","Excess surfactant production","Increased alveolar compliance","Anatomic narrowing, abnormal mechanical linkage between airway dilating muscles and airway wall, muscle weakness, and abnormal neural regulation","Bronchial smooth muscle hyperresponsiveness"],"a":3,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 30","img":[{"u":"img/w12_sleep_apnea/p30.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 30","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"Each breath travels **nasal passages (septum and turbinates) → soft palate (uvula) → base of the tongue → throat muscles/tissue → larynx → trachea → lungs**. OSA is a problem of obstruction in the **upper airway** part of that route.\n\nThe four **predisposing factors for upper airway obstruction**:\n1. **Anatomic narrowing**\n2. **Abnormal mechanical linkage between airway dilating muscles and the airway wall**\n3. **Muscle weakness**\n4. **Abnormal neural regulation**","why":{"0":"Pulmonary fibrosis is not an upper airway obstruction factor.","1":"Surfactant is not listed as an OSA predisposing factor.","2":"Alveolar compliance is not listed as an upper airway obstruction factor.","4":"Bronchial smooth muscle hyperresponsiveness is a feature of asthma."},"one":"Four predisposing factors: anatomic narrowing, abnormal mechanical linkage, muscle weakness, abnormal neural regulation."},"w12_sleep_apnea-25":{"q":"Oral appliances (OA) appear to work mainly on which OSA traits, and in which patients are they more effective?","o":["Central traits; patients with Cheyne-Stokes breathing","Low arousal threshold only; patients with insomnia","Anatomic traits, by mechanically opening the airway; individuals with a low loop gain of the ventilatory control reflex","Nonanatomic traits; patients with high loop gain","Impaired ventilatory control; patients with high loop gain"],"a":2,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 31, 32","img":[{"u":"img/w12_sleep_apnea/p31.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 31","w":1200,"h":675},{"u":"img/w12_sleep_apnea/p32.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 32","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**Traits that contribute to OSA**:\n- **Anatomic**: upper airway patency\n- **Nonanatomic**: impaired muscle responsiveness, **low arousal threshold**, impaired ventilatory control\n\n**Effectiveness of OA**: oral appliances appear to work mainly on the **anatomic traits**, **mechanically opening the airway and preventing closure**, probably acting as a mandibular and tongue retainer. They may also reduce sleep arousals in a subgroup and appear more effective in **individuals with a low loop gain of the ventilatory control reflex**.","why":{"0":"Oral appliances open the airway; they are not for central breathing problems.","1":"OA may reduce arousals, but its main action is on anatomic traits.","3":"OA works mainly on anatomic traits and is more effective with low loop gain.","4":"It is more effective with low loop gain, not high."},"one":"Oral appliances act mainly on anatomic traits by opening the airway and work better with low loop gain."},"w12_sleep_apnea-26":{"q":"Regarding comorbidities of sleep apnea, which statement is correct?","o":["Only 5% of patients with severe OSA have hypertension.","Hypertension and sleep apnea are unrelated.","Coronary artery disease has the highest prevalence of sleep apnea among comorbidities.","Sleep apnea is rare in obesity (under 10%).","Sleep apnea is found in about 83% of patients with drug-resistant hypertension."],"a":4,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 33, 34","img":[{"u":"img/w12_sleep_apnea/p33.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 33","w":1200,"h":675},{"u":"img/w12_sleep_apnea/p34.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 34","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**Prevalence of sleep apnea in comorbidities** (highest first):\n- **Drug-resistant hypertension 83%**\n- Obesity 77%\n- Congestive heart failure 76%\n- Pacemakers 59%\n- Atrial fibrillation 49%\n- Diabetes 48%\n- All hypertension 37%\n- Coronary artery disease 30%\n\n**Hypertension links**: **30–83%** of patients with hypertension have sleep apnea, and **43% of patients with mild OSA and 69% with severe OSA** have hypertension.","why":{"0":"69% of patients with severe OSA have hypertension.","1":"They are closely linked: 30–83% of hypertensive patients have sleep apnea.","2":"Coronary artery disease is lowest on the list, at 30%.","3":"Prevalence in obesity is high, at 77%."},"one":"83% of patients with drug-resistant hypertension have sleep apnea, and 69% of severe OSA patients have hypertension."},"w12_sleep_apnea-27":{"q":"How is OSA diagnosed and evaluated? Which is a subjective method?","o":["Pulse oximetry during a sleep study","Polysomnography","The Epworth Sleepiness Scale","Multiple Sleep Latency Test","Maintenance of Wakefulness Test"],"a":2,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 35","img":[{"u":"img/w12_sleep_apnea/p35.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 35","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**Methods to diagnose and evaluate OSA**:\n\n- **Subjective**: the **Epworth Sleepiness Scale**, self-report tests to establish severity, medical history\n- **Objective**: **polysomnography (sleep study)** (most emphasized), Multiple Sleep Latency Test, Maintenance of Wakefulness Test\n\nThe Epworth scale is a questionnaire in which patients rate their own daytime sleepiness, so it is subjective.","why":{"0":"Pulse oximetry is a polysomnography measurement and is objective.","1":"Polysomnography is the classic objective method.","3":"The Multiple Sleep Latency Test is objective.","4":"The Maintenance of Wakefulness Test is objective."},"one":"The Epworth Sleepiness Scale is subjective; polysomnography, MSLT and MWT are objective."},"w12_sleep_apnea-28":{"q":"In polysomnography, which recording measures eye movements?","o":["EEG","Pulse oximetry","EMG","EOG","ECG of the chest wall"],"a":3,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 36, 37","img":[{"u":"img/w12_sleep_apnea/p36.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 36","w":1200,"h":675},{"u":"img/w12_sleep_apnea/p37.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 37","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**Polysomnography** (a starred item) records brain waves, blood oxygen, heart rate and breathing, and muscle movements (eyes, legs) during the sleep study, to **determine whether lapses in breathing are due to airway blockage or irregular signals from the brain**.\n\nParameters measured:\n1. Brain waves – **EEG** (electroencephalogram)\n2. Eye movements – **EOG** (electro-oculogram)\n3. Muscle activity – **EMG** (electromyogram)\n4. Oral and nasal airflow\n5. Respiratory effort: chest and abdominal movement\n6. Audio recording of snoring loudness\n7. Blood oxygen – pulse oximetry\n8. Video monitoring during the study","why":{"0":"EEG records brain waves.","1":"Pulse oximetry measures blood oxygen.","2":"EMG records muscle activity.","4":"Eye movements are not measured with an ECG; the parameter is the EOG."},"one":"In polysomnography, EEG = brain waves, EOG = eye movements, EMG = muscle activity."},"w12_sleep_apnea-29":{"q":"Which are the non-surgical treatments for OSA?","o":["Behavioral changes, medication, CPAP, and oral/dental appliances","Palate implants and hyoid suspension","Uvulopalatopharyngoplasty and genioglossus advancement","Maxillomandibular advancement only","Tracheostomy and bariatric surgery"],"a":0,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 38, 39, 40","img":[{"u":"img/w12_sleep_apnea/p38.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 38","w":1200,"h":675},{"u":"img/w12_sleep_apnea/p39.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 39","w":1200,"h":675},{"u":"img/w12_sleep_apnea/p40.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 40","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**Non-surgical treatments for OSA**:\n1. **Behavioral changes**: change sleeping position, lose weight, exercise, and common practices to induce sleep and enhance its quality\n2. **Medication**\n3. **CPAP (continuous positive airway pressure)**: air pressure delivered by mask and hose keeps the airway open\n4. **Oral/dental appliance**\n\nAll the other options are surgical treatments.","why":{"1":"Palate implants and hyoid suspension are surgical.","2":"UPPP and genioglossus advancement are surgical.","3":"Maxillomandibular advancement is surgical.","4":"Tracheostomy and bariatric surgery are surgical."},"one":"Non-surgical OSA treatment is behavioral change, medication, CPAP and oral appliances."},"w12_sleep_apnea-30":{"q":"How does an oral/dental appliance such as a tongue retaining device (TRD) treat OSA?","o":["It pushes the tongue backward to seal the oropharynx.","It holds the jaw and tongue forward and the palate up, preventing closure of the airway.","It stimulates the hypoglossal nerve electrically.","It delivers positive air pressure through the nose.","It removes the uvula."],"a":1,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 41","img":[{"u":"img/w12_sleep_apnea/p41.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 41","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**Oral/dental appliances for OSA**, such as a **tongue retaining device (TRD)**, **hold the jaw and tongue forward and the palate up, thus preventing closure of the airway** (a starred item).\n\nThe compromised airway becomes an open airway with the appliance in place, which is what it means that OA works on the anatomic trait.","why":{"0":"Pushing the tongue back would block the airway; the device holds it forward.","2":"Hypoglossal nerve stimulation treats the weak-dilator-muscle phenotype and is not an oral appliance.","3":"Delivering positive pressure is CPAP.","4":"Removing the uvula is surgery such as UPPP."},"one":"An oral appliance (TRD) holds the jaw and tongue forward and the palate up to keep the airway open."},"w12_sleep_apnea-31":{"q":"Which of the following is a surgical option for OSA, and when should surgery be considered?","o":["Epworth Sleepiness Scale; at every visit","CPAP; as the first step before any other therapy","Tongue retaining device; only after tracheostomy","Behavioral therapy; only in children","Uvulopalatopharyngoplasty; only after all the risks, benefits, and alternatives are understood"],"a":4,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 43, 52","img":[{"u":"img/w12_sleep_apnea/p43.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 43","w":1200,"h":675},{"u":"img/w12_sleep_apnea/p52.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 52","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**Surgical options for OSA** (a starred item): **nasal airway** surgery, **palate implants**, **uvulopalatopharyngoplasty (UPPP)**, **tongue reduction**, **genioglossus advancement**, **hyoid suspension**, **maxillomandibular procedures**, **tracheostomy**, **bariatric surgery**, and combinations of these.\n\n**Surgery should be considered only after all the risks, benefits and alternatives are understood.**","why":{"0":"The Epworth Sleepiness Scale is a subjective evaluation tool.","1":"CPAP is non-surgical.","2":"A tongue retaining device is a non-surgical oral appliance.","3":"Behavioral therapy is non-surgical and not limited to children."},"one":"OSA surgery (UPPP, genioglossus advancement, maxillomandibular surgery, palate implants, etc.) is considered only after risks, benefits and alternatives are understood."},"w12_sleep_apnea-32":{"q":"The Pillar procedure is which surgical option for OSA?","o":["Uvulopalatal flap","Tracheostomy","Maxillo-mandibular advancement","Palate implants placed in the soft palate","Genioglossus advancement"],"a":3,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 49, 45, 46, 47, 48","img":[{"u":"img/w12_sleep_apnea/p49.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 49","w":1200,"h":675},{"u":"img/w12_sleep_apnea/p45.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 45","w":1200,"h":675},{"u":"img/w12_sleep_apnea/p46.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 46","w":1200,"h":675},{"u":"img/w12_sleep_apnea/p47.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 47","w":1200,"h":675},{"u":"img/w12_sleep_apnea/p48.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 48","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"The **Pillar procedure** is **palate implants**: a thin rod-shaped **pillar implant** is placed in the **soft palate**.\n\nTell the other OSA operations apart by name and site:\n- **Uvulopalatopharyngoplasty (UPPP)**: surgery on the uvula, soft palate and tonsil region\n- **Maxillo-mandibular advancement**: surgery on the upper and lower jaws\n- **Genioglossus advancement**: surgery at the genioglossus, the muscle that moves the tongue\n- **Uvulopalatal flap**","why":{"0":"The uvulopalatal flap is a separate operation.","1":"Tracheostomy is not palate implants.","2":"Maxillo-mandibular advancement is surgery on the jaws.","4":"Genioglossus advancement is surgery at the genioglossus, not palate implants."},"one":"The Pillar procedure is palate implants placed in the soft palate."},"w12_sleep_apnea-33":{"q":"Which fact about sleep apnea is correct?","o":["OSA is far rarer than asthma or diabetes in the US.","All severe cases are diagnosed.","About 1 in every 15 Americans (6.62%) has moderate to severe OSA, and 75% of severe sleep-disordered breathing cases remain undiagnosed.","Sleep apnea halves the risk of stroke.","The average OSA individual has about 5 apneas per night."],"a":2,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 50","img":[{"u":"img/w12_sleep_apnea/p50.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 50","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**More important facts**:\n- **1 in every 15 Americans (6.62%)** has moderate to severe OSA\n- 1 in 50 individuals (2–4%) has undiagnosed sleep apnea; **75% of severe sleep-disordered breathing (SDB) cases remain undiagnosed**\n- **4 times the risk of stroke**\n- Prevalence similar to **asthma (20 million) and diabetes (23.6 million)** in the US population\n- The average OSA individual has **60 apneas per hour (400 per night)**","why":{"0":"Its prevalence is similar to asthma and diabetes.","1":"75% of severe cases remain undiagnosed.","3":"Sleep apnea raises stroke risk fourfold.","4":"The average is not 5 per night but 60 per hour, about 400 per night."},"one":"1 in 15 Americans has moderate-severe OSA, 75% of severe cases are undiagnosed, stroke risk is 4x, average 60 apneas/hour."},"w12_sleep_apnea-34":{"q":"In the summary, which are listed as complications of OSA?","o":["Fever and lymphadenopathy","High blood pressure, strokes, heart disease, automobile accidents, daytime sleepiness, and difficulty concentrating, thinking and remembering","Asthma attacks and Curschmann spirals","Only snoring","Increased salivary flow and gingival hyperplasia"],"a":1,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 51","img":[{"u":"img/w12_sleep_apnea/p51.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 51","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**Summary** (a starred item):\n- **Sleep apnea**: a reduction or cessation of breathing during sleep\n- **Three types**: CSA, OSA or both\n- **CSA**: caused by **failure of the brain to activate the muscles of breathing** during sleep\n- **OSA**: caused by **collapse of the airway** during sleep\n- **Complications of OSA**: **high blood pressure, strokes, heart disease, automobile accidents, daytime sleepiness, and difficulty concentrating, thinking and remembering**\n- **Diagnosis of OSA**: history, physical examination and **polysomnography**","why":{"0":"Fever and lymphadenopathy are not listed OSA complications.","2":"Asthma attacks and Curschmann spirals are findings of asthma.","3":"Snoring is a symptom; the complication list is much broader.","4":"Increased salivary flow and gingival hyperplasia are not listed OSA complications."},"one":"OSA complications: hypertension, stroke, heart disease, car accidents, daytime sleepiness, cognitive problems; diagnosis is history, exam and polysomnography."},"w12_sleep_apnea-35":{"q":"What does dental sleep medicine focus on?","o":["Management of sleep-related breathing disorders, including snoring and OSA, through oral appliance therapy and upper airway surgery","Treatment of insomnia with sedatives only","Management of central sleep apnea in infants","Orthodontic treatment for esthetics only","Diagnosis of narcolepsy by EEG"],"a":0,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 54","img":[{"u":"img/w12_sleep_apnea/p54.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 54","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**Dental sleep medicine** focuses on the **management of sleep-related breathing disorders, including snoring and obstructive sleep apnea, through oral appliance therapy and upper airway surgery**.\n\n**Dentists pioneered the use of oral appliance therapy for treating OSA and snoring in adults.**","why":{"1":"Treating insomnia with sedatives is not its focus.","2":"Infant CSA is managed with an apnea alarm and is not its focus.","3":"Esthetic orthodontics is not its focus.","4":"Diagnosing narcolepsy is not mentioned."},"one":"Dental sleep medicine manages snoring and OSA with oral appliances and upper airway surgery; dentists pioneered oral appliance therapy."},"w12_sleep_apnea-36":{"q":"Which qualifies a dentist in dental sleep medicine?","o":["Certification by a non-profit organization such as the American Board of Dental Sleep Medicine (ABDSM)","Owning a CPAP machine","Prescribing sedatives for sleep","Completing a general dentistry residency only","Any continuing education course taken more than 10 years ago"],"a":0,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 55","img":[{"u":"img/w12_sleep_apnea/p55.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 55","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**Qualified dentists in dental sleep medicine** meet one of these:\n1. **Certification in dental sleep medicine by a non-profit organization**, such as the **American Board of Dental Sleep Medicine (ABDSM)**\n2. Designation as the **dental director** of a dental sleep medicine facility accredited by a non-profit organization such as the **American Academy of Dental Sleep Medicine (AADSM)**\n3. Recognized **continuing education** in dental sleep medicine from a dental-sleep-medicine-focused non-profit or an accredited dental school **within the last 2 years**","why":{"1":"Owning equipment is not a qualification.","2":"Prescribing sedatives is not a qualification.","3":"A general dentistry residency alone is not a qualification.","4":"Continuing education must be within the last 2 years and recognized, from a dental-sleep-medicine-focused provider."},"one":"Qualification: non-profit certification (e.g. ABDSM), dental director of an AADSM-accredited facility, or recognized CE within 2 years."},"w12_asthma-1":{"q":"According to the 2018 US asthma prevalence data, which group had the highest current asthma prevalence?","o":["White (7.6%)","Hispanic (6.4%)","Children (7.5%)","Black (10.6%)","Males (6.2%)"],"a":3,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 3","img":[{"u":"img/w12_asthma/p03.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 3","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"One reason asthma matters to dental professionals is that **it is common**. Current asthma prevalence in the US, 2018:\n\n- **Age**: children 7.5%, adults 7.7%\n- **Sex**: males 6.2%, **females 9.1%**\n- **Race/ethnicity**: White 7.6%, **Black 10.6%**, Hispanic 6.4%\n\nThe highest group is **Black (10.6%)**, and females are higher than males.","why":{"0":"White at 7.6% is lower than Black at 10.6%.","1":"Hispanic at 6.4% is the lowest of the race groups.","2":"Children at 7.5% are lower than Black at 10.6%.","4":"Males at 6.2% are even lower than females at 9.1%."},"one":"In 2018 US data, Black (10.6%) had the highest asthma prevalence, and females (9.1%) exceeded males (6.2%)."},"w12_asthma-2":{"q":"How is asthma defined?","o":["An irreversible destruction of alveolar walls","A chronic (long-term) inflammatory disease of the airways that is potentially reversible","A collapse of the upper airway during sleep","A disease caused only by genetic factors","An acute infectious disease of the alveoli"],"a":1,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 4, 5","img":[{"u":"img/w12_asthma/p04.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 4","w":1200,"h":675},{"u":"img/w12_asthma/p05.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 5","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"**Definition of asthma** (a starred item): a **chronic (long-term) inflammatory disease of the airways** that is **potentially reversible**.\n\nAsthma is an **episodic, chronic respiratory disorder** centered on **inflammation and hyperresponsiveness of bronchial smooth muscle**. It is included in the WHO Global Action Plan for the Prevention and Control of NCDs and the UN 2030 Agenda for Sustainable Development.","why":{"0":"Destruction of alveolar walls is not the definition, and asthma is potentially reversible.","2":"Upper airway collapse during sleep is obstructive sleep apnea.","3":"Both genetic and environmental factors matter in asthma.","4":"Asthma is not an infection; it is a chronic inflammatory airway disease."},"one":"Asthma is a chronic, potentially reversible inflammatory disease of the airways."},"w12_asthma-3":{"q":"Asthma is described as reversible and inducible. What does \"inducible\" mean?","o":["It can only be induced by exercise.","The narrowing can be reversed with an inhaler.","It is always present and never changes.","It is induced by bacterial infection of the alveoli.","The airway narrowing can be triggered by things such as a pet, smoke, or allergens."],"a":4,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 6","img":[{"u":"img/w12_asthma/p06.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 6","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"Two properties of asthma:\n\n- **Reversible**: the narrowed airway can be opened again, e.g. with an **inhaler**\n- **Inducible**: triggers such as **pets (a cat), smoke and allergens** can narrow the airway\n\nSo asthma is airway narrowing that is set off by triggers and can be reversed with treatment.","why":{"0":"Exercise is only one trigger, not the only one.","1":"Being reversible with an inhaler is the meaning of reversible.","2":"Asthma is episodic and variable.","3":"Asthma is not a bacterial infection of the alveoli."},"one":"Asthma is reversible (an inhaler opens the airway) and inducible (pets, smoke and allergens trigger it)."},"w12_asthma-4":{"q":"During an asthma exacerbation (attack), what happens to the airways?","o":["The alveoli fill with pus.","The trachea ruptures.","They become even narrower in response to something in the environment, which can be life-threatening.","The upper airway collapses only during sleep.","They dilate and stay open."],"a":2,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 7, 8","img":[{"u":"img/w12_asthma/p07.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 7","w":1200,"h":675},{"u":"img/w12_asthma/p08.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 8","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"Asthma is **chronic inflammation in the airways** that makes them **narrow**, so breathing is difficult.\n\nIn an **asthma exacerbation (attack)**, **something in the environment** makes the airways **even narrower**, which can be **life-threatening**.","why":{"0":"Pus-filled alveoli are not how an asthma exacerbation is described.","1":"Tracheal rupture is not part of an asthma exacerbation.","3":"Upper airway collapse during sleep is obstructive sleep apnea.","4":"The airways narrow further during an attack; they do not dilate."},"one":"An asthma attack is an already-narrow airway becoming even narrower in response to a trigger, and it can be life-threatening."},"w12_asthma-5":{"q":"In the airway wall diagram, which layers make up the mucosa, and where is the smooth muscle?","o":["Mucosa = epithelial cells and lamina propria; smooth muscle is in the submucosa","Mucosa = smooth muscle and cartilage; epithelium is in the submucosa","Mucosa = lamina propria only; smooth muscle is in the adventitia","Mucosa = submucosal glands; smooth muscle is in the epithelium","Mucosa = epithelial cells only; smooth muscle is in the lumen"],"a":0,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 9","img":[{"u":"img/w12_asthma/p09.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 9","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"The **trachea** divides into the **right and left bronchi** and then into **bronchioles**, each with a central **lumen**.\n\nLayers of the airway wall:\n- **Mucosa**: **epithelial cells** and **lamina propria**\n- **Submucosa**: **smooth muscle**\n\nIn asthma, contraction of this smooth muscle and mucus secretion narrow the lumen.","why":{"1":"Smooth muscle is shown in the submucosa, and the epithelium is part of the mucosa.","2":"The mucosa includes epithelial cells as well as the lamina propria.","3":"Smooth muscle is not in the epithelium.","4":"Smooth muscle is in the wall (submucosa), not in the lumen."},"one":"The airway mucosa is epithelium plus lamina propria; the smooth muscle is in the submucosa."},"w12_asthma-6":{"q":"The molecular pathway leading to asthma is often initiated by environmental triggers and involves Th2 cells. Which conditions make up the atopic triad?","o":["Asthma, candidiasis, and caries","Asthma, sleep apnea, and GERD","Asthma, COPD, and emphysema","Asthma, diabetes, and hypertension","Asthma, atopic dermatitis, and allergic rhinitis"],"a":4,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 10","img":[{"u":"img/w12_asthma/p10.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 10","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"The **molecular pathway** leading to asthma is often initiated by **environmental triggers**.\n\nThe **Th2 cells** involved take part in three conditions together, the **atopic triad**:\n- **Asthma**\n- **Atopic dermatitis**\n- **Allergic rhinitis**","why":{"0":"Candidiasis and caries are oral side effects of asthma drugs, not the atopic triad.","1":"Sleep apnea and GERD are not the atopic triad.","2":"COPD and emphysema are not the atopic triad.","3":"Diabetes and hypertension are not the atopic triad."},"one":"The Th2-driven atopic triad is asthma, atopic dermatitis and allergic rhinitis."},"w12_asthma-7":{"q":"Why is asthma called an obstructive pulmonary disease?","o":["Smooth muscle spasm and increased mucus secretion narrow the airway, making it difficult to breathe.","The pleural space fills with fluid.","The diaphragm is paralyzed.","The alveoli are destroyed by infection.","The upper airway collapses during sleep."],"a":0,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 11","img":[{"u":"img/w12_asthma/p11.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 11","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"Two reasons the airway narrows in asthma:\n- **Smooth muscle spasm** → narrows the airway\n- **Increased mucus secretion** → narrows the airway\n\nThis makes it **difficult to breathe**, which is why asthma is an **obstructive pulmonary disease**.\n\nThere is also **increased vascular permeability** and **increased immune cells**, particularly **eosinophils**, which **damage the endothelium of the lungs**.","why":{"1":"Fluid in the pleural space is not the mechanism of asthma.","2":"Diaphragm paralysis is not the mechanism of asthma.","3":"Alveolar destruction is not why asthma is obstructive.","4":"Upper airway collapse during sleep is OSA."},"one":"Asthma is obstructive because smooth muscle spasm and mucus narrow the airway; eosinophils also damage the lung endothelium."},"w12_asthma-8":{"q":"Over years, initially reversible asthma can become irreversible. Which changes cause this airway remodeling?","o":["Loss of cilia only","Cartilage calcification of the trachea","Alveolar wall destruction and air trapping","Edema, scarring and fibrosis, leading to a thickened basement membrane","Hyperplasia of the thyroid gland"],"a":3,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 12","img":[{"u":"img/w12_asthma/p12.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 12","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"Asthma is **initially reversible**, but over **years** it can become **irreversible**.\n\nRepeated inflammation produces **edema, scarring and fibrosis**, resulting in a **thickened basement membrane**. The airway wall then stays permanently thickened and the lumen stays narrow.","why":{"0":"Loss of cilia alone does not explain it; the key is edema, scarring, fibrosis and a thickened basement membrane.","1":"Tracheal cartilage calcification is not listed.","2":"Alveolar wall destruction is not listed as asthma's irreversible change.","4":"The thyroid gland is unrelated."},"one":"Long-standing asthma can become irreversible through edema, scarring and fibrosis with a thickened basement membrane."},"w12_asthma-9":{"q":"The causes of asthma are unknown. Which statement about genetic and environmental factors is correct?","o":["Environmental factors play no role in asthma.","No genes have been identified.","Genetic factors are linked to childhood asthma (<12 years); environmental factors are linked to later-onset asthma.","The hygiene hypothesis says increased early exposure to bacteria causes asthma.","Genetic factors are linked to later-onset asthma only."],"a":2,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 13","img":[{"u":"img/w12_asthma/p13.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 13","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"The **causes of asthma are unknown**, but two factors matter:\n\n- **Genetic factors** → **childhood asthma (under 12 years)**: certain genes identified, family history\n- **Environmental factors** → **later-onset asthma**: the **hygiene hypothesis** – **reduced** early exposure to bacteria and viruses may alter the proportion of immune cells\n\nGenetic and environmental factors are important in both initiating and continuing the inflammation.","why":{"0":"Environmental factors are linked to later-onset asthma and help sustain inflammation.","1":"Certain genes have been identified.","3":"The hygiene hypothesis is about reduced, not increased, early exposure.","4":"Genetic factors are linked to childhood asthma."},"one":"Genetic factors go with childhood asthma (<12 years) and environmental factors with later onset; the hygiene hypothesis is about reduced early microbial exposure."},"w12_asthma-10":{"q":"Which sputum findings are seen in asthma?","o":["Acid-fast bacilli","Curschmann spirals (mucus plugs, casts from small bronchi) and Charcot-Leyden crystals (needle-shaped, from breakdown of eosinophils)","Rust-colored sputum with lobar consolidation","Sulfur granules and Gram-positive cocci","Asbestos bodies"],"a":1,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 14","img":[{"u":"img/w12_asthma/p14.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 14","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"Asthma symptoms: **chest tightness**, **dyspnea (difficulty breathing)**, **wheezing (high-pitched whistling)** and **coughing**.\n\nSputum findings:\n- **Curschmann spirals**: **mucus plugs**, **casts from small bronchi**. They are **dangerous** because they block air exchange and medication.\n- **Charcot-Leyden crystals**: **needle-shaped**, from the **breakdown of eosinophils**","why":{"0":"Acid-fast bacilli are not an asthma finding.","2":"Rust-colored sputum is not listed as an asthma finding.","3":"Sulfur granules and Gram-positive cocci are not listed sputum findings in asthma.","4":"Asbestos bodies are not an asthma finding."},"one":"Asthma sputum shows Curschmann spirals (mucus plugs) and Charcot-Leyden crystals (needle-shaped, from eosinophils)."},"w12_asthma-11":{"q":"Asthma is classified according to several measures. Which two measure the amount of obstruction?","o":["AHI and Epworth score","Frequency of night-time symptoms and medication use","Hematocrit and white cell count","Mallampati score and neck circumference","FEV1 (forced expiratory volume in 1 second) and PEFR (peak expiratory flow rate)"],"a":4,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 15","img":[{"u":"img/w12_asthma/p15.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 15","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"**Asthma is classified according to**:\n- **Frequency of symptoms**: night-time, early morning\n- **FEV1**: forced expiratory volume in 1 second\n- **PEFR**: peak expiratory flow rate\n- **Frequency of medication use**\n\nOf these, **FEV1 and PEFR measure the amount of obstruction**.\n\n**Types**: **intermittent → mild persistent → moderate persistent → severe persistent**","why":{"0":"AHI and Epworth score are sleep apnea measures.","1":"Symptom and medication frequency are classification criteria but do not directly measure obstruction.","2":"Blood counts are not asthma classification criteria.","3":"Mallampati score and neck circumference are OSA screening measures."},"one":"FEV1 and PEFR measure obstruction; types run intermittent → mild, moderate, severe persistent."},"w12_asthma-12":{"q":"In treating asthma, what do bronchodilators do, and which drugs are listed for very severe asthma?","o":["Increase eosinophils; leukotriene agonists","Constrict smooth muscle; antibiotics only","Thicken mucus; aspirin and NSAIDs","Relax smooth muscle to dilate the airway; intravenous corticosteroids, magnesium sulfate, and oxygen therapy","Block oxygen uptake; beta blockers"],"a":3,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 16, 17","img":[{"u":"img/w12_asthma/p16.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 16","w":1200,"h":675},{"u":"img/w12_asthma/p17.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 17","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"The goal of asthma **treatment** is to **manage symptoms and avoid attacks**.\n\n- **Avoid contact with triggers**: vacuuming, removing carpets/rugs, changing the environment (e.g. drying out a room)\n- **Medications**:\n  - **Bronchodilators**: short-acting beta-adrenoceptor agonists and anticholinergics; they **relax smooth muscle so the airway is dilated**\n  - **Severe**: daily corticosteroids, long-acting beta-adrenoceptor agonists, leukotriene antagonists\n  - **Very severe**: **intravenous corticosteroids, magnesium sulfate, oxygen therapy**","why":{"0":"Severe asthma uses leukotriene antagonists, not agonists.","1":"Bronchodilators relax smooth muscle, and antibiotics are not listed.","2":"Aspirin and NSAIDs are drugs to avoid in asthma.","4":"Beta blockers are listed as triggering medications."},"one":"Bronchodilators relax smooth muscle to dilate the airway; very severe asthma uses IV corticosteroids, magnesium sulfate and oxygen."},"w12_asthma-13":{"q":"What is status asthmaticus?","o":["Asthma that only occurs during exercise","Life-threatening respiratory failure from frequent acute exacerbations","Snoring during sleep","A normal FEV1 with no symptoms","Infrequent, mild symptoms with minimal functional limitation"],"a":1,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 19","img":[{"u":"img/w12_asthma/p19.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 19","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"The **clinical manifestations** of asthma form a spectrum:\n\n- **Infrequent and mild symptoms** → minimal functional limitations\n- **Frequent acute exacerbations** → significant impairment in functional capacity, up to **life-threatening respiratory failure**, also known as **status asthmaticus**","why":{"0":"Exercise-only symptoms are not the definition of status asthmaticus.","2":"Snoring relates to sleep apnea.","3":"A normal FEV1 without symptoms is not status asthmaticus.","4":"Infrequent, mild symptoms are the opposite end of the spectrum."},"one":"Status asthmaticus is life-threatening respiratory failure."},"w12_asthma-14":{"q":"In the ABCDE assessment of an asthma patient who is unstable, what should be done?","o":["Start elective dental treatment immediately","Send the patient home with advice","Stabilize airway, breathing, and circulation; obtain IV access; and provide continuous vital sign monitoring (HR and BP)","Give beta blockers","Lay the patient fully flat and leave the room"],"a":2,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 20, 21","img":[{"u":"img/w12_asthma/p20.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 20","w":1200,"h":675},{"u":"img/w12_asthma/p21.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 21","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"If the **ABCDE assessment** shows the patient is **unstable**:\n- **Stabilize airway, breathing and circulation**\n- **Obtain IV access**\n- **Continuous vital sign monitoring**: HR and BP\n\nWork-up then includes a **focused H&P**, **labs: ABG**, **spirometry: PEF** and **pulse oximetry**.\n\n- **History**: shortness of breath, cough, chest tightness\n- **Physical exam**: **tachypnea**, **use of accessory inspiratory muscles**, auscultation with **bilateral wheezing** and **decreased or absent breath sounds**","why":{"0":"Elective treatment is not done in an unstable state.","1":"An unstable patient needs immediate stabilization.","3":"Beta blockers are asthma-triggering drugs.","4":"The patient must not be left; continuous monitoring is needed."},"one":"For an unstable asthma patient: stabilize ABC, obtain IV access, monitor vital signs continuously."},"w12_asthma-15":{"q":"In the basic pathophysiology of asthma, what follows airway inflammation and leads to narrow breathing passages?","o":["Hypersecretion of mucus, airway muscle constriction, and swelling of bronchial membranes","Upper airway collapse during sleep","Alveolar collapse and surfactant loss","Increased lung compliance and air trapping only","Pleural effusion and rib fracture"],"a":0,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 18","img":[{"u":"img/w12_asthma/p18.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 18","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"**Basic pathophysiology of asthma** (a starred item) as a flowchart:\n\n1. **Trigger factor**\n2. **Airway inflammation**\n3. Three branches: **hypersecretion of mucus**, **airway muscle constriction**, **swelling of bronchial membranes**\n4. **Narrow breathing passages**\n5. **Wheezing, cough, shortness of breath, tightness in chest**\n\nNote: **genetic and environmental factors** are important in both the **initiation and continuation** of the inflammation.","why":{"1":"Upper airway collapse during sleep is the OSA mechanism.","2":"Alveolar collapse and surfactant loss are not in the asthma flowchart.","3":"The three branches are mucus hypersecretion, muscle constriction and membrane swelling.","4":"Pleural effusion and rib fracture are unrelated."},"one":"Asthma: trigger → airway inflammation → mucus hypersecretion, muscle constriction, membrane swelling → narrow airways → wheeze, cough, dyspnea, chest tightness."},"w12_asthma-16":{"q":"Asthma is a variable disease. Which is listed as complicating risk factors and disease processes?","o":["Smoking, exposure to smoke or irritants, comorbidities, and prior asthma exacerbations in the past year","Only genetic factors","Regular exercise with proper medication","High-protein diet","Only age over 65"],"a":0,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 22","img":[{"u":"img/w12_asthma/p22.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 22","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"**Asthma is a variable disease**:\n- **Triggered by environmental variables**\n- **Complicated by risk factors and disease processes**: **smoking**, **exposure to smoke or irritants**, **comorbidities**, **prior asthma exacerbations in the past year**\n- Can **decompensate or improve over time**","why":{"1":"Not only genetics; environment, comorbidities and prior exacerbations all play a part.","2":"Exercise with the right medications is encouraged as healthy.","3":"A high-protein diet appears as anxiety advice, not as a risk factor.","4":"Age is not listed among these risk factors."},"one":"Asthma is triggered by the environment, complicated by smoking, smoke, comorbidities and recent exacerbations, and can worsen or improve over time."},"w12_asthma-17":{"q":"Which medications are listed among the triggering substances for asthma?","o":["Montelukast and salmeterol","Magnesium sulfate and oxygen","Aspirin and beta blockers","Fluoride and chlorhexidine","Albuterol and fluticasone"],"a":2,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 23","img":[{"u":"img/w12_asthma/p23.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 23","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"**Triggering substances** fall into three groups:\n- **Air pollution**: cigarette smoke, car exhaust\n- **Allergens**: dust, pets, cockroaches, mold\n- **Medications**: **aspirin** and **beta blockers**\n\nThat is why aspirin-containing drugs and NSAIDs should be avoided in asthmatic patients.","why":{"0":"Montelukast and salmeterol are asthma controllers.","1":"Magnesium sulfate and oxygen are treatments for very severe asthma.","3":"Fluoride and chlorhexidine are not listed as triggering drugs.","4":"Albuterol and fluticasone are asthma treatments."},"one":"The asthma-triggering medications are aspirin and beta blockers."},"w12_asthma-18":{"q":"What does a \"trigger\" do in asthma, and which is a recommended way to deal with triggers?","o":["It relaxes smooth muscle; inhale it daily","It makes symptoms start or get worse; know your triggers and stay away, and always have medication","It only affects adults; ignore it in children","It cures asthma; seek triggers out to build tolerance","It only acts in summer; avoid ice cream"],"a":1,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 24, 25, 26, 27","img":[{"u":"img/w12_asthma/p24.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 24","w":1200,"h":675},{"u":"img/w12_asthma/p25.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 25","w":1200,"h":675},{"u":"img/w12_asthma/p26.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 26","w":1200,"h":675},{"u":"img/w12_asthma/p27.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 27","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"A **trigger** **makes symptoms start or get worse**.\n\nExamples: **cigarette smoke** (which can get caught in clothes and furniture), dust, pets, cockroaches, mold, perfume, cleaning products, **cold air, pollen, a cold**, pollution and grass. A cold **improves after it goes away**.\n\nDealing with triggers:\n- **Know your triggers and stay away**\n- **Always have medication**\n- **On heavy pollution days, stay indoors**, and avoid standing too close to cars or buses when engines are running\n- **Exercise or sports** are an important part of being healthy, and **with the right medications** an active life is possible","why":{"0":"Relaxing smooth muscle is what bronchodilators do.","2":"Triggers affect children too.","3":"Triggers worsen symptoms and should be avoided.","4":"Many triggers, such as cold air, are not limited to summer."},"one":"Triggers make symptoms start or worsen; know and avoid them, always carry medication, and stay indoors on heavy pollution days."},"w12_asthma-19":{"q":"How do asthma relievers differ from controllers?","o":["Relievers are used every day; controllers are only for emergencies.","Controllers work in minutes; relievers take weeks.","Relievers reduce mucus; controllers relax muscles.","Relievers (rescue inhalers) work in minutes and relax muscles; controllers reduce mucus and swelling, are used every day, and over time make the lungs healthier.","Both are antibiotics."],"a":3,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 29","img":[{"u":"img/w12_asthma/p29.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 29","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"Asthma **medications** come in two kinds:\n\n- **Relievers**: **help right away**. Also called **rescue inhalers**, they **work in minutes** and **relax muscles**. **Always have them with you.**\n- **Controllers**: **reduce mucus and swelling**, are **used every day**, and **over time make the lungs healthier**.","why":{"0":"The reverse: controllers are daily, relievers are used right away when needed.","1":"Relievers are the ones that work in minutes.","2":"The reverse: relievers relax muscles and controllers reduce mucus and swelling.","4":"Neither is an antibiotic."},"one":"Relievers are rescue inhalers that relax muscles within minutes; controllers are daily drugs that reduce mucus and swelling."},"w12_asthma-20":{"q":"What is the purpose of a spacer and of a nebulizer?","o":["A spacer measures FEV1; a nebulizer measures oxygen saturation.","Both are used only in adults.","A spacer holds the jaw forward; a nebulizer delivers CPAP.","A spacer is a rescue drug; a nebulizer is a controller drug.","A spacer helps children get medication deep into the lungs; a nebulizer turns liquid into a fine mist for young kids and babies."],"a":4,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 30","img":[{"u":"img/w12_asthma/p30.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 30","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"Inhaled-drug delivery aids:\n\n- **Spacer**: attached to the inhaler, it **helps children get medication deep into the lungs**.\n- **Nebulizer**: for **young kids and babies**, it **turns liquid into a fine mist**.","why":{"0":"Spacers and nebulizers are delivery aids, not measuring devices.","1":"The spacer is presented for children and the nebulizer for young kids and babies.","2":"Holding the jaw forward is a sleep apnea oral appliance, and CPAP is separate equipment.","3":"Both are devices, not drugs."},"one":"A spacer gets children's medication deep into the lungs; a nebulizer turns liquid into a fine mist for young kids and babies."},"w12_asthma-21":{"q":"The primary goal with a dental patient who has asthma is to prevent an attack during the procedure. Which is part of keeping the patient well controlled?","o":["Give aspirin for postoperative pain","Give high-flow O2 (15 L/min) to every patient","Keep the inhaler and EpiPen at home","Avoid NSAIDs, avoid narcotics and barbiturates, use a pulse oximeter, and give low-flow O2 (2 L/min) if oxygen saturation is <95%","Skip stress management"],"a":3,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 31","img":[{"u":"img/w12_asthma/p31.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 31","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"The **primary goal** with a dental patient is **to prevent an asthma attack during the dental procedure**. The patient must be **well controlled**:\n\n- **Stress management**\n- **Confirm proper medication**\n- **Have inhaler and EpiPen ready**\n- **Excellent isolation**\n- **Avoid NSAIDs**\n- **Avoid narcotics and barbiturates**\n- **Use a pulse oximeter**\n- **Low-flow O2 (2 L/min) if oxygen saturation is <95%**","why":{"0":"Aspirin is an asthma trigger and should be avoided.","1":"The rule is low-flow 2 L/min when saturation is below 95%.","2":"The inhaler and EpiPen should be ready in the office.","4":"Stress management is the first item on the list."},"one":"For asthma patients: manage stress, confirm meds, have inhaler and EpiPen ready, avoid NSAIDs, narcotics and barbiturates, use a pulse oximeter, O2 2 L/min if SpO2 <95%."},"w12_asthma-22":{"q":"Which is listed among the oral manifestations of asthma?","o":["Dry mouth due to inhalers, caries, and oral candidiasis","Macrodontia","Black hairy tongue only","Gingival hyperplasia due to phenytoin","Hypersalivation and sialorrhea"],"a":0,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 32","img":[{"u":"img/w12_asthma/p32.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 32","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"**Oral manifestations of asthma**:\n- **Dry mouth due to inhalers**\n- **Caries**\n- GERD\n- **Oral candidiasis**\n- Enamel defects\n- Periodontal disease\n- A higher rate of **malocclusion** (excess overjet, posterior crossbite, high palatal vault) associated with mouth breathing","why":{"1":"Macrodontia is not on the list.","2":"Black hairy tongue is not on the list.","3":"Phenytoin gingival overgrowth is not an asthma manifestation.","4":"The issue in asthma is dry mouth, not excess saliva."},"one":"Oral manifestations of asthma: inhaler dry mouth, caries, GERD, candidiasis, enamel defects, periodontal disease, malocclusion."},"w12_asthma-23":{"q":"Asthmatic mouth breathers have higher rates of malocclusion. Which features are listed?","o":["Diastema and microdontia","Increased overjet, overbite, posterior crossbite, and high palatal vault","Class III malocclusion and a low palatal vault","Anterior open bite only, with a flat palate","Ankylosis and impaction"],"a":1,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 33","img":[{"u":"img/w12_asthma/p33.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 33","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"Another risk: **mouth breathers** have **higher rates of malocclusion**:\n\n- **Increased overjet**\n- **Overbite**\n- **Posterior crossbite**\n- **High palatal vault**","why":{"0":"Diastema and microdontia are not listed.","2":"Class III is not listed, and the palate is high.","3":"Open bite and a flat palate are not listed; the palate is high.","4":"Ankylosis and impaction are not listed."},"one":"Asthmatic mouth breathers show more overjet, overbite, posterior crossbite and a high palatal vault."},"w12_asthma-24":{"q":"Anxiety can exacerbate asthma symptoms. What is the most important factor in overcoming dental anxiety?","o":["Giving the patient caffeine before the visit","Avoiding all conversation","Good dentist-patient communication","Eating sugary foods before the appointment","Long appointments with the mouth open"],"a":2,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 34, 35","img":[{"u":"img/w12_asthma/p34.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 34","w":1200,"h":675},{"u":"img/w12_asthma/p
