n which host was boxed and starred as an AIDS-defining illness?","o":["HIV-positive (AIDS) patients.","Healthy children with tinea capitis only.","Every immunocompetent adult with a positive skin test.","Patients whose only risk is walking barefoot.","Pregnant women in the first trimester only."],"a":0,"src":"Mycology 2026.pdf, slide 48","img":[{"u":"img/w11_mycology/p48.webp","cap":"Mycology 2026.pdf, slide 48","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"The **HIV +ve** item is boxed and starred as an **AIDS defining illness**. In immunocompromised AIDS patients, histoplasmosis disseminates easily and is itself an AIDS-defining opportunistic infection. That carries very different weight from a mild lung infection in an immunocompetent person.","why":{"1":"Tinea capitis is a dermatophyte infection and not an AIDS-defining illness.","2":"A positive skin test may indicate exposure, but what is boxed as AIDS-defining is histoplasmosis in HIV-positive patients.","3":"Walking barefoot is a risk discussed for some subcutaneous/cutaneous fungi, not the content of this box.","4":"The third trimester of pregnancy relates to the underline about increased vulvovaginal candidiasis, not this AIDS-defining box."},"one":"Histoplasmosis in HIV-positive patients is an AIDS-defining illness."},"w11_mycology-37":{"q":"Coccidioides immitis differs from a typical yeast form in tissue. What phrase was written next to endosporulating spherules?","o":["“Same as a cryptococcal capsule.”","“Instead of yeast.”","“Pilot-wheel buds.”","“Finger-like projections.”","“Only at 25°C in soil.”"],"a":1,"src":"Mycology 2026.pdf, slide 49","img":[{"u":"img/w11_mycology/p49.webp","cap":"Mycology 2026.pdf, slide 49","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"Next to the tissue form, **endosporulating spherules**, is written **instead of yeast**. The other dimorphic systemic fungi become yeasts in the body, but *Coccidioides* alone becomes spherules instead. Endospores mature inside the spherule, which then ruptures and spreads them.","why":{"0":"An encapsulated yeast is *Cryptococcus*; spherules are different.","2":"The pilot wheel is the multiple budding of *Paracoccidioides*.","3":"Finger-like projections belong to the tuberculate macroconidia of *Histoplasma*.","4":"Spherules are the tissue form inside the body (at body temperature); in soil at room temperature it is a mold (arthroconidia)."},"one":"In the body, Coccidioides forms endosporulating spherules instead of yeast."},"w11_mycology-38":{"q":"Which endemic region for coccidioidomycosis was marked with an oval and stars?","o":["The Ohio and Mississippi river valleys only.","The Amazon basin only.","The Southwestern United States.","East Africa only.","Northern Europe only."],"a":2,"src":"Mycology 2026.pdf, slide 51","img":[{"u":"img/w11_mycology/p51.webp","cap":"Mycology 2026.pdf, slide 51","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"The **Southwestern U.S.A.** is emphasized with an oval and stars. This dusty desert region is the classic endemic area for *Coccidioides*. Inhaling arthroconidia from the soil starts a lung infection (also known as Valley fever).","why":{"0":"The Ohio and Mississippi river valleys are the classic geography of *Histoplasma*.","1":"South America (Brazil, etc.) is the geography of *Paracoccidioides*.","3":"East Africa is not what this oval marks.","4":"Northern Europe is not an endemic area for this organism."},"one":"Coccidioidomycosis is endemic to the Southwestern United States."},"w11_mycology-39":{"q":"When coccidioidomycosis disseminates, which targets were underlined?","o":["Only the hair shaft and nail plate.","Only the stratum corneum.","Only reticuloendothelial tissues and the tongue.","Skin, bones, joints, and meninges.","Only the nasal septum and vocal cords."],"a":3,"src":"Mycology 2026.pdf, slide 51","img":[{"u":"img/w11_mycology/p51.webp","cap":"Mycology 2026.pdf, slide 51","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"In the dissemination section, **skin, bones, joints, and meninges** are underlined. An infection that starts in the lungs can spread through the blood to these sites; meningeal involvement in particular is severe.","why":{"0":"The hair shaft and nail plate are dermatophyte targets.","1":"Infection limited to the stratum corneum is closer to tinea versicolor.","2":"RE tissues and oral lesions are the starred items for disseminated *Histoplasma*.","4":"Nothing underlined limits it to the nasal septum and vocal cords."},"one":"Disseminated coccidioidomycosis involves the skin, bones, joints, and meninges."},"w11_mycology-40":{"q":"Candida albicans was boxed as the most important Candida species. Which growth forms were listed, and what note was written beside them?","o":["Only a capsule-bearing yeast; “AKA bacterium.”","Only septate hyphae in soil; “AKA dermatophyte.”","Only spherules; “AKA Coccidioides.”","Only arthroconidia; “AKA mold in the cold.”","It is a polymorphic fungus (yeast, hyphae, and pseudohyphae); hyphae were annotated “AKA mold.”"],"a":4,"src":"Mycology 2026.pdf, slide 55","img":[{"u":"img/w11_mycology/p55.webp","cap":"Mycology 2026.pdf, slide 55","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"***C. albicans*** is boxed as **most important**. It is **polymorphic**, able to form **yeast, hyphae, and pseudohyphae**, and next to hyphae is written **AKA mold**. Its ability to change form with conditions is important for virulence and mucosal invasion.","why":{"0":"An encapsulated yeast is *Cryptococcus*; *Candida* is not defined by a polysaccharide capsule.","1":"Dermatophytes are *Trichophyton* and the like; that is not what the *Candida* box says.","2":"Spherules are *Coccidioides*.","3":"Arthroconidia and temperature dimorphism are the framework for the systemic dimorphic fungi; *Candida* is a polymorphic yeast/hyphae/pseudohyphae organism."},"one":"Candida albicans is the most important species: a polymorphic fungus forming yeast, hyphae, and pseudohyphae."},"w11_mycology-41":{"q":"Candida was underlined as a commensal. Which site was oval-marked among its normal habitats?","o":["The mouth and throat.","Desert soil of the Southwestern United States.","Bird and bat droppings only.","Keratin of hair shafts only.","The meninges of healthy hosts."],"a":0,"src":"Mycology 2026.pdf, slide 56","img":[{"u":"img/w11_mycology/p56.webp","cap":"Mycology 2026.pdf, slide 56","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"*Candida* is underlined as a **commensal** of the GI tract and vaginal mucosa, and **mouth and throat** is marked with an oval. It lives in the mouth and pharynx of healthy people and causes endogenous infections such as thrush when host defenses falter.","why":{"1":"Southwestern desert soil is the endemic habitat of *Coccidioides*.","2":"Soil with bird and bat droppings is the habitat of *Histoplasma* (and bird droppings for *Cryptococcus*).","3":"Hair-shaft keratin is the target of dermatophytes.","4":"The meninges are not a normal habitat; meningeal involvement is a finding of disseminated infection such as *Cryptococcus*."},"one":"Candida is a commensal, and the mouth and throat are the oval-marked habitat."},"w11_mycology-42":{"q":"Oral thrush was boxed and starred. Which description and predisposing event were emphasized?","o":["Black necrotic plaques after trauma only.","White, cottage-cheese patches, often after broad-spectrum antibiotics.","Circular scalp plaques that fluoresce green.","A meningeal yeast seen with India ink.","Painful vesicles on an erythematous base."],"a":1,"src":"Mycology 2026.pdf, slide 57","img":[{"u":"img/w11_mycology/p57.webp","cap":"Mycology 2026.pdf, slide 57","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"**Oral thrush** is boxed and starred, characterized by **white, cottage-cheese patches**. In the same flow, it is linked to occurring **after broad-spectrum antibiotics**. When the normal bacterial flora is disrupted, commensal *Candida* overgrows.","why":{"0":"Black necrotic plaques are closer to invasive molds (e.g., *Mucor*), not the starred description of thrush.","2":"Fluorescent circular scalp plaques are a Wood's lamp finding in some tinea capitis.","3":"A meningeal yeast seen with India ink is *Cryptococcus*.","4":"Painful vesicles on an erythematous base are closer to viral lesions such as herpes simplex."},"one":"Oral thrush is white, cottage-cheese patches, often after broad-spectrum antibiotics."},"w11_mycology-43":{"q":"On the cutaneous candidiasis slide, which common presentation was hand-underlined?","o":["Tinea capitis of the scalp.","Cryptococcal meningitis.","Diaper rash.","Valley fever.","Onychomycosis caused only by Microsporum."],"a":2,"src":"Mycology 2026.pdf, slide 59","img":[{"u":"img/w11_mycology/p59.webp","cap":"Mycology 2026.pdf, slide 59","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"**Diaper rash** has a handwritten underline. *Candida* readily causes dermatitis in warm, moist skin folds, and the skin under a wet diaper is the classic site. Intertriginous lesions are covered in the same category of cutaneous candidiasis.","why":{"0":"Tinea capitis is a dermatophyte scalp infection (*Microsporum*, *Trichophyton*).","1":"Cryptococcal meningitis is a systemic mycosis.","3":"Valley fever is another name for coccidioidomycosis.","4":"*Microsporum* does not infect nails, and what is underlined here is diaper rash."},"one":"Diaper rash is underlined as a common presentation of cutaneous candidiasis."},"w11_mycology-44":{"q":"Vulvovaginal candidiasis was wavy-underlined as increasing in which period?","o":["The first 48 hours of life only.","The male climacteric only.","The first trimester exclusively, never later.","The third trimester of pregnancy.","Only after menopause, never in pregnancy."],"a":3,"src":"Mycology 2026.pdf, slide 60","img":[{"u":"img/w11_mycology/p60.webp","cap":"Mycology 2026.pdf, slide 60","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"**3rd trimester of pregnancy** is wavy-underlined; vulvovaginal candidiasis increases during this period. Hormonal and glucose changes make vaginal *Candida* prone to overgrowth. Itching and a cheesy discharge are the typical symptoms.","why":{"0":"It is not about the first days of life; the underline is on the third trimester of pregnancy.","1":"The underline is about vulvovaginal candidiasis in the third trimester of pregnancy.","2":"The underline is on the third trimester, not the first.","4":"It is underlined as increasing during pregnancy, especially the third trimester, not only after menopause."},"one":"Vulvovaginal candidiasis increases in the third trimester of pregnancy."},"w11_mycology-45":{"q":"Systemic candidiasis was underlined as a serious disease. Which organs were listed as involvement sites?","o":["Hair shafts and nail plates only.","The stratum corneum only.","Desert lymph nodes only.","Cartilage and intervertebral discs only.","The kidneys, eyes, and heart."],"a":4,"src":"Mycology 2026.pdf, slide 61","img":[{"u":"img/w11_mycology/p61.webp","cap":"Mycology 2026.pdf, slide 61","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"**Systemic candidiasis** and **serious** are underlined, and the **kidneys, eyes, and heart** are listed as involvement sites. When the mucosal commensal enters the bloodstream, it becomes an invasive infection of these organs, which matters especially with risk factors such as immunosuppression or catheters.","why":{"0":"The hair shaft and nail plate are dermatophyte targets.","1":"Infection limited to the stratum corneum is superficial, like tinea versicolor; systemic candidiasis involves internal organs.","2":"Desert lymph nodes are not on this list.","3":"Cartilage and intervertebral discs are not on this list."},"one":"Systemic candidiasis is serious and involves the kidneys, eyes, and heart."},"w11_mycology-46":{"q":"Which predisposing factor for candidiasis was boxed and starred?","o":["Broad-spectrum antibiotics.","Live-virus vaccination in childhood only.","Walking barefoot on river banks.","Exposure to Southwestern desert dust only.","House-dust exposure to Aspergillus fumigatus only."],"a":0,"src":"Mycology 2026.pdf, slide 62","img":[{"u":"img/w11_mycology/p62.webp","cap":"Mycology 2026.pdf, slide 62","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"In the list of predisposing factors, **broad-spectrum antibiotics** is the most emphasized, with a box and star. When the normal bacterial flora is disrupted, commensal *Candida* overgrows; this ties back to the earlier emphasis that thrush often follows antibiotics. There are other predisposing factors (steroids, immunosuppression, diabetes, catheters, etc.), but the boxed and starred item is broad-spectrum antibiotics.","why":{"1":"Live-virus vaccination is not the predisposing factor in this box.","2":"Walking barefoot and river banks relate to exposure to certain environmental fungi.","3":"Southwestern desert dust is exposure to *Coccidioides*.","4":"*Aspergillus fumigatus* and house dust belong to the opportunistic mold discussion elsewhere, not this *Candida* box."},"one":"The most emphasized predisposing factor for candidiasis is broad-spectrum antibiotics."},"w11_mycology-47":{"q":"How was candidiasis treatment marked for mild-to-moderate versus severe disease?","o":["Mild-to-moderate disease needs intravenous amphotericin B; severe disease needs only talc powder.","Mild-to-moderate: nystatin, clotrimazole, or miconazole topically; severe: fluconazole orally.","Both severities are treated only with potassium iodide.","Mild disease is never treated; severe disease is treated with griseofulvin cream alone.","Severe disease is treated with topical nystatin only; oral fluconazole is reserved for athlete’s foot."],"a":1,"src":"Mycology 2026.pdf, slide 63","img":[{"u":"img/w11_mycology/p63.webp","cap":"Mycology 2026.pdf, slide 63","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"Mild-to-moderate disease is marked for **nystatin, clotrimazole, or miconazole topically**, and severe disease for **fluconazole orally**. Topical agents are often enough for mild mucosal or skin disease, while severe infection requires a systemic azole.","why":{"0":"IV amphotericin B is a drug for certain severe systemic mycoses, not first-line treatment for mild candidiasis.","2":"Potassium iodide is not part of this candidiasis treatment scheme.","3":"Mild disease is also treated, with topical antifungals; the scheme is not griseofulvin cream alone.","4":"Reversed: topical nystatin and the like are for mild-to-moderate disease, and oral fluconazole is for severe disease."},"one":"Mild-to-moderate candidiasis: topical nystatin, clotrimazole, or miconazole; severe: oral fluconazole."},"w11_mycology-48":{"q":"Pneumocystis jirovecii lacks ergosterol. What therapeutic consequence was starred?","o":["It is uniquely susceptible to all azoles at low dose.","Allylamines are the drugs of choice.","It is resistant to amphotericin B and azoles.","Nystatin alone reliably cures pneumonia.","Griseofulvin is required because the organism is a dermatophyte."],"a":2,"src":"Mycology 2026.pdf, slide 64","img":[{"u":"img/w11_mycology/p64.webp","cap":"Mycology 2026.pdf, slide 64","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"**Lacks ergosterol** is underlined and starred, with the consequence emphasized: **resistant to amphotericin B and azoles**. That is because the target of these drugs is ergosterol (or its synthesis). Treatment uses a different class, such as trimethoprim–sulfamethoxazole.","why":{"0":"Lacking ergosterol doesn't make it susceptible to azoles; it makes it resistant.","1":"Allylamines also block ergosterol synthesis, so they are not the drug of choice for an organism without ergosterol.","3":"Nystatin is a polyene that acts on membrane ergosterol and is not a reliable stand-alone cure for this pneumonia.","4":"*Pneumocystis* is not a dermatophyte; it mainly causes pneumonia in AIDS patients."},"one":"Pneumocystis lacks ergosterol, so it is resistant to amphotericin B and azoles."},"w11_mycology-49":{"q":"Which diagnostic and host points were starred or underlined for Pneumocystis jirovecii?","o":["India-ink capsule in CSF of healthy children.","Tuberculate macroconidia in soil; mainly athletes.","Pilot-wheel yeast in oral mucosa; mainly neonates.","It is diagnosed with silver stains (cysts), occurs mainly in AIDS, and causes pneumonia.","Wood’s lamp fluorescence of hair; mainly tinea capitis."],"a":3,"src":"Mycology 2026.pdf, slide 64","img":[{"u":"img/w11_mycology/p64.webp","cap":"Mycology 2026.pdf, slide 64","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"Diagnosis by **silver stains** showing **cysts**, occurrence **mainly in AIDS**, and causing **pneumonia** are emphasized with stars and underlines. The classic picture is pneumonia in a severely immunocompromised AIDS patient, with cysts identified by silver stain in tissue or induced sputum.","why":{"0":"An India ink capsule is *Cryptococcus*.","1":"Tuberculate macroconidia are *Histoplasma*.","2":"The pilot wheel is *Paracoccidioides*.","4":"Wood's lamp fluorescence and tinea capitis belong to the dermatophytes."},"one":"Pneumocystis causes pneumonia mainly in AIDS and is diagnosed by silver stains showing cysts."},"w11_mycology-50":{"q":"Which Aspergillus species were boxed, and what did the arrowed products do?","o":["A. fumigatus and A. niger; they produce only penicillin.","A. nidulans only; it produces ergosterol for Pneumocystis.","A. terreus only; it causes tinea versicolor.","A. clavatus only; it is the sole cause of diaper rash.","A. flavus and A. parasiticus; they produce aflatoxins that are carcinogenic and contaminate crops."],"a":4,"src":"Mycology 2026.pdf, slide 66","img":[{"u":"img/w11_mycology/p66.webp","cap":"Mycology 2026.pdf, slide 66","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"***A. flavus*** and ***A. parasiticus*** are boxed together, with an arrow to the **aflatoxins** they produce. Aflatoxins are **carcinogenic** and **contaminate crops**. Unlike *A. fumigatus*, the classic cause of invasive pulmonary aspergillosis, these two species are highlighted for toxin production.","why":{"0":"Penicillin is associated with *Penicillium*; the boxed species are *A. flavus* and *A. parasiticus*, and their product is aflatoxin.","1":"*Pneumocystis* actually lacks ergosterol, and *A. nidulans* is not the species in this box.","2":"Tinea versicolor is caused by *Malassezia*.","3":"The common cause of diaper rash is *Candida*, and *A. clavatus* is not the species in this box."},"one":"A. flavus and A. parasiticus produce carcinogenic aflatoxins that contaminate crops."},"w12_blood-1":{"q":"Blood is classified as which type of tissue, and what is its liquid extracellular matrix called?","o":["Connective tissue; serum","Epithelial tissue; plasma","Epithelial tissue; lymph","Muscle tissue; interstitial fluid","Connective tissue; plasma"],"a":4,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 2","img":[{"u":"img/w12_blood/p02.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 2","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"Blood is a type of **connective tissue** whose extracellular matrix is a liquid, called **plasma**.\n\nBlood circulates under the pressure created by the heart, and an average adult has about 5 liters of it, containing the formed elements (erythrocytes, leukocytes and platelets) and the plasma.","why":{"0":"Connective tissue is right, but serum is the fluid left after clotting. The matrix of circulating blood is plasma.","1":"Plasma is right, but blood is connective tissue, not epithelial tissue.","2":"Blood is not epithelial tissue, and lymph is not its matrix.","3":"Blood is not muscle tissue, and interstitial fluid is the fluid between tissue cells."},"one":"Blood is a connective tissue with a liquid extracellular matrix called plasma."},"w12_blood-2":{"q":"After blood clots, the remaining fluid is called serum. Why does serum differ in composition from plasma?","o":["Plasma lacks water, while serum is mostly water.","Serum contains more red blood cells than plasma.","Platelets release various proteins during blood clotting.","Serum is collected only with an anticoagulant.","Serum is produced only in the bone marrow."],"a":2,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 2","img":[{"u":"img/w12_blood/p02.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 2","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"When blood leaves the vasculature, plasma proteins undergo a chain reaction that produces a **blood clot**. The fluid that remains after clotting is **serum**.\n\nBecause **platelets release various proteins during clotting**, serum differs in composition from plasma. For example, serum is higher in TGF-beta, VEGF and IL-8, and it lacks the fibrinogen used up in the clot.","why":{"0":"Plasma is mostly water (about 92% by weight); both are mainly water.","1":"Serum and plasma are both the cell-free fluid portion, so they are not distinguished by red cell content.","3":"Using an anticoagulant and then centrifuging gives plasma. Serum comes from clotted blood.","4":"Serum is not made in the bone marrow; it is separated from clotted blood."},"one":"Serum is the fluid left after clotting, and it differs from plasma because platelets release proteins during clotting."},"w12_blood-3":{"q":"When anticoagulated blood is centrifuged, what is the hematocrit?","o":["The percentage of leukocytes among all formed elements","The percentage of total blood volume made up of red blood cells, about 45%","The percentage of total blood volume made up of plasma, about 55%","The thin whitish layer of leukocytes and platelets, about 1%","The concentration of hemoglobin in each red blood cell"],"a":1,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 3","img":[{"u":"img/w12_blood/p03.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 3","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"When anticoagulated blood is centrifuged, it separates into layers by density:\n\n- Bottom: **erythrocytes**, about **45%** of total volume\n- Middle: the thin whitish **buffy coat** of leukocytes and platelets, about 1%\n- Top: the yellowish, clear **plasma**, about 55%\n\nThe **percentage of total blood volume made up of RBCs** is the **hematocrit**.","why":{"0":"It is the red cell fraction of total blood volume, not a leukocyte fraction.","2":"About 55% is plasma, which is not the definition of hematocrit.","3":"The thin whitish layer of leukocytes and platelets is the buffy coat.","4":"Hematocrit is a volume fraction of red cells, not a hemoglobin concentration."},"one":"Hematocrit is the percentage of total blood volume made up of red blood cells, about 45%."},"w12_blood-4":{"q":"In centrifuged anticoagulated blood, the thin whitish buffy coat contains which components, and what fraction of blood volume does it make up?","o":["Leukocytes and platelets; about 1%","Reticulocytes only; about 5%","Erythrocytes; about 45%","Plasma proteins; about 55%","Fibrin and serum; about 10%"],"a":0,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 3","img":[{"u":"img/w12_blood/p03.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 3","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"The middle layer of centrifuged blood, the **buffy coat**, is a thin whitish layer made of **leukocytes and platelets**, accounting for **about 1%** of total blood volume.\n\nThe erythrocytes below make up about 45% and the plasma above about 55%. Leukocytes run about 4,500–11,000/mm3 and platelets about 150,000–400,000/mm3.","why":{"1":"The buffy coat is leukocytes and platelets, not reticulocytes.","2":"Erythrocytes form the bottom layer, about 45%.","3":"About 55% is the top plasma layer; plasma proteins are dissolved in it.","4":"The blood was anticoagulated, so fibrin and serum do not form a layer."},"one":"The buffy coat is a thin whitish layer of leukocytes and platelets, about 1% of blood volume."},"w12_blood-5":{"q":"In the composition of plasma, which protein makes up the largest share of the plasma proteins (about 58%)?","o":["Hemoglobin","Globulins","Fibrinogen","Albumin","Regulatory proteins"],"a":3,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 4","img":[{"u":"img/w12_blood/p04.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 4","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"By weight, plasma is **92% water**, **7% proteins** and 1% other solutes.\n\nAmong the plasma proteins, **albumin is 58%**, globulins 37%, fibrinogen 4% and regulatory proteins 1%. The other solutes are electrolytes, nutrients, respiratory gases and waste products.","why":{"0":"Hemoglobin is inside red cells, not a plasma protein.","1":"Globulins are about 37%, second place.","2":"Fibrinogen is only about 4%.","4":"Regulatory proteins are about 1%."},"one":"About 58% of plasma protein is albumin."},"w12_blood-6":{"q":"How is CO2 transported in the blood?","o":["Only bound to albumin","Only inside leukocytes","Only dissolved as CO2 gas in the plasma","As CO2 gas, as the bicarbonate ion HCO3-, or bound to hemoglobin","Only as carboxyhemoglobin"],"a":3,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 5, 6","img":[{"u":"img/w12_blood/p05.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 5","w":1200,"h":675},{"u":"img/w12_blood/p06.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 6","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"One key function of blood is gas transport. O2 is carried by hemoglobin in RBCs.\n\nCO2 travels in three forms: **as CO2 gas**, as the **bicarbonate ion HCO3-**, or **bound to hemoglobin**. CO2 from the tissues enters the red cell, where **carbonic anhydrase** converts it via H2CO3 to HCO3- and H+; at the alveolus the reaction runs in reverse and CO2 leaves.","why":{"0":"Albumin maintains osmotic pressure and is not listed as a CO2 carrier.","1":"Leukocytes fight infection; CO2 is carried by plasma and red cells.","2":"Dissolved CO2 gas is only one form; bicarbonate and hemoglobin-bound CO2 are the others.","4":"Carboxyhemoglobin is hemoglobin bound to carbon monoxide (CO), not a CO2 transport form."},"one":"CO2 is carried as CO2 gas, as HCO3-, or bound to hemoglobin."},"w12_blood-7":{"q":"How do leukocytes defend the body against infection?","o":["They remain in the bloodstream and release antibodies only into plasma.","They are active only while circulating and become inactive in tissues.","They form clots that seal off infected tissue.","They transport O2 to infected tissues using hemoglobin.","They are carried by the blood to infection sites, leave the bloodstream, and invade the infected tissues."],"a":4,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 5","img":[{"u":"img/w12_blood/p05.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 5","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"**Leukocytes** are one of the body's main mechanisms for fighting infection. They are **carried by the blood to sites of infection, where they leave the bloodstream and invade the infected tissues**.\n\nSo leukocytes generally **become active after leaving the bloodstream**; the blood is simply their route to where they are needed.","why":{"0":"Leukocytes do not stay in the bloodstream; they leave it to act in the tissues.","1":"The reverse is true: leukocytes generally become active after leaving the bloodstream.","2":"Clotting involves platelets and plasma coagulation proteins.","3":"O2 transport is done by hemoglobin in red cells."},"one":"Leukocytes ride the blood to infection sites, then leave the vessels to work in the tissues."},"w12_blood-8":{"q":"Which plasma protein is made in the liver and maintains the osmotic pressure of the blood?","o":["Fibronectin","Albumin","γ-globulins","Complement proteins","Transferrin"],"a":1,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 7","img":[{"u":"img/w12_blood/p07.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 7","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"Plasma is an aqueous solution at pH 7.4 containing plasma proteins, nutrients, respiratory gases, nitrogenous wastes, hormones and electrolytes.\n\nAmong the major plasma proteins, **albumin** is **made in the liver and maintains the osmotic pressure of the blood**. Albumin holds water inside the vessels, so when it is low, fluid leaks into tissues and edema develops more easily.","why":{"0":"Fibronectin is an example of the alpha- and beta-globulins, not the osmotic-pressure protein.","2":"Gamma-globulins are immunoglobulins secreted by plasma cells.","3":"Complement proteins are involved in inflammation and destruction of pathogens.","4":"Transferrin is a transport factor among the alpha- and beta-globulins."},"one":"Albumin is made in the liver and maintains the osmotic pressure of the blood."},"w12_blood-9":{"q":"Which plasma protein fraction consists of immunoglobulins secreted by plasma cells?","o":["γ-globulins","Albumin","β-globulins","α-globulins","Fibrinogen"],"a":0,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 7","img":[{"u":"img/w12_blood/p07.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 7","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"Among the plasma proteins, the **gamma-globulins** are **immunoglobulins secreted by plasma cells**, that is, antibodies.\n\nThe **alpha- and beta-globulins**, in contrast, are made by the liver and other sites and include transport factors such as transferrin, fibronectin, prothrombin and other coagulation factors, and lipoproteins.","why":{"1":"Albumin is made in the liver and maintains osmotic pressure.","2":"Beta-globulins are also made by the liver and others, e.g. transferrin and lipoproteins.","3":"Alpha-globulins are liver-made transport and coagulation factors and similar proteins.","4":"Fibrinogen is made in the liver and polymerizes into fibrin during clotting."},"one":"Gamma-globulins are immunoglobulins secreted by plasma cells."},"w12_blood-10":{"q":"Fibrinogen is made in the liver. What does it do during clotting?","o":["It carries iron as a transport factor.","It maintains the osmotic pressure of blood.","It polymerizes to form the insoluble protein fibrin.","It destroys pathogens as part of complement.","It is secreted by plasma cells as an antibody."],"a":2,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 7","img":[{"u":"img/w12_blood/p07.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 7","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"**Fibrinogen** is a plasma protein **made in the liver** that **polymerizes during clotting to form the insoluble protein fibrin**. This fibrin mesh is the scaffold of the blood clot.\n\nThat is why serum, the fluid left after clotting, has essentially no fibrinogen.","why":{"0":"Transport factors such as transferrin are alpha- and beta-globulins.","1":"Maintaining osmotic pressure is albumin's job.","3":"Destroying pathogens and mediating inflammation is the role of complement proteins.","4":"Antibodies secreted by plasma cells are the gamma-globulins."},"one":"Fibrinogen is made in the liver and polymerizes into fibrin during clotting."},"w12_blood-11":{"q":"Comparing serum and plasma, which statement is correct?","o":["Serum is obtained by centrifuging blood with an anticoagulant.","Serum contains fibrinogen, whereas plasma does not.","Plasma is mainly used for blood typing and culture-medium supplementation.","Serum is used for blood transfusions instead of plasma.","Plasma contains fibrinogen, whereas serum is obtained after the blood has clotted."],"a":4,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 9","img":[{"u":"img/w12_blood/p09.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 9","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"Serum versus plasma:\n\n- **Serum**: the liquid that remains **after the blood has clotted**, obtained by centrifuging clotted blood. Density 1.024 g/ml; higher in TGF-beta, VEGF and IL-8. Uses: blood typing, diagnostic testing, supplementing culture medium, testing for antibodies.\n- **Plasma**: the liquid that remains **when clotting is prevented**, obtained by centrifuging whole blood with an anticoagulant. Density 1.025 g/ml, and it contains **fibrinogen**. Uses: blood transfusions, diagnostic testing.","why":{"0":"Centrifuging with an anticoagulant yields plasma.","1":"The reverse: fibrinogen is consumed in clotting, so it is in plasma but not serum.","2":"Blood typing and culture-medium supplementation are uses of serum.","3":"Plasma is what is used for blood transfusions."},"one":"Plasma comes from anticoagulated blood and contains fibrinogen; serum comes from clotted blood."},"w12_blood-12":{"q":"Peripheral blood is best studied using a blood smear. Which stains are added after the smear dries?","o":["Giemsa or Wright","Periodic acid–Schiff","Gram stain","Hematoxylin and eosin","Silver stain"],"a":0,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 10","img":[{"u":"img/w12_blood/p10.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 10","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"**Peripheral blood** (blood taken from veins) is best studied with a **blood smear**.\n\nPlace a drop of blood in the center of a microscope slide, spread it thinly with another slide, let it dry, add a **Giemsa or Wright stain**, then coverslip and examine at high magnification.","why":{"1":"PAS is not the stain named for blood smears.","2":"Gram stain is for bacteria, not for viewing blood cells.","3":"H&E is common for tissue sections, but the stains named for blood smears are Giemsa and Wright.","4":"Silver stain is not the stain named for blood smears."},"one":"After the smear dries, it is stained with Giemsa or Wright stain."},"w12_blood-13":{"q":"Which feature describes mature erythrocytes?","o":["Cells about 2–4 µm in diameter derived from megakaryocytes","Flexible biconcave discs about 7.5 µm in diameter that lack nuclei and organelles","Cells with a lifespan of about 10 days","Spherical cells with a large indented nucleus","Nucleated cells with abundant mitochondria"],"a":1,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 11","img":[{"u":"img/w12_blood/p11.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 11","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"**Erythrocytes (RBCs)** are **terminally differentiated**, **lack nuclei and organelles**, and are filled with hemoglobin.\n\nThey are **flexible biconcave discs**, **7.5 µm** in diameter, 2.6 µm thick at the rim and 0.75 µm at the center. This shape gives a **large surface-to-volume ratio that facilitates gas exchange**. Their average lifespan is **120 days**.","why":{"0":"The 2–4 µm megakaryocyte fragments are platelets.","2":"A lifespan of about 10 days is platelets; RBCs live about 120 days.","3":"A large indented (C-shaped) nucleus describes monocytes.","4":"Mature RBCs have no nucleus or organelles."},"one":"RBCs are anucleate, organelle-free biconcave discs about 7.5 µm across."},"w12_blood-14":{"q":"Which form of hemoglobin binding is irreversible and decreases the blood's capacity to carry O2?","o":["Bicarbonate-bound hemoglobin","Deoxyhemoglobin","Carbaminohemoglobin","Carboxyhemoglobin","Oxyhemoglobin"],"a":3,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 11","img":[{"u":"img/w12_blood/p11.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 11","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"The forms of hemoglobin binding:\n\n- **Oxyhemoglobin**: bound to O2\n- **Carbaminohemoglobin**: bound to CO2\n\nBoth are **reversible**, depending on O2 and CO2 concentrations in the blood and surrounding tissues.\n\n- **Carboxyhemoglobin**: bound to **CO (carbon monoxide)**. This binding is **irreversible** and **decreases the blood's capacity to carry O2**.","why":{"0":"Bicarbonate travels mainly in plasma and is not described as an irreversible hemoglobin complex.","1":"Deoxyhemoglobin is hemoglobin that has released O2; it is not an irreversible complex.","2":"Carbaminohemoglobin is reversible CO2 binding.","4":"Oxyhemoglobin is reversible O2 binding."},"one":"Carboxyhemoglobin is irreversible CO binding that lowers the blood's O2-carrying capacity."},"w12_blood-15":{"q":"What is the average lifespan of red blood cells?","o":["A few days","About 10 days","About 120 days","Many years","1–2 weeks"],"a":2,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 11, 21","img":[{"u":"img/w12_blood/p11.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 11","w":1200,"h":675},{"u":"img/w12_blood/p21.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 21","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"**The average lifespan of RBCs is 120 days.** Lacking a nucleus, they cannot make new proteins or repair themselves, so they must be replaced.\n\nFor comparison: **platelets about 10 days**, **neutrophils 1–4 days**, eosinophils 1–2 weeks, and lymphocytes hours to many years.","why":{"0":"A few days is the lifespan of granulocytes such as neutrophils.","1":"About 10 days is the platelet lifespan.","3":"Living for years describes some lymphocytes.","4":"1–2 weeks is the eosinophil lifespan."},"one":"RBCs live about 120 days on average."},"w12_blood-16":{"q":"Which statement correctly describes granulocytes?","o":["They have polymorphic nuclei, are terminally differentiated, live a few days, and die by apoptosis.","They have well-developed Golgi and rER with many mitochondria.","Their azurophilic granules are secretory vesicles containing hemoglobin.","They lack specific granules and have spherical nuclei.","They are the precursors of macrophages."],"a":0,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 12, 13","img":[{"u":"img/w12_blood/p12.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 12","w":1200,"h":675},{"u":"img/w12_blood/p13.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 13","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"Leukocytes are divided by whether their cytoplasm has **specific granules** into **granulocytes** and **agranulocytes**.\n\nGranulocyte features:\n- **Azurophilic granules**: **lysosomes** that stain with azure dyes\n- **Specific granules**: stain with neutral, basic or acidic stains\n- **Polymorphic nuclei** with two or more lobes joined by narrow bands\n- **Terminally differentiated**, lifespan of **a few days**, die by **apoptosis**\n- Poorly developed Golgi and rER, few mitochondria","why":{"1":"Granulocytes have poorly developed Golgi and rER and few mitochondria.","2":"Azurophilic granules are lysosomes and have nothing to do with hemoglobin.","3":"Lacking specific granules defines agranulocytes, and a spherical nucleus fits lymphocytes.","4":"Macrophage precursors are monocytes, which are agranulocytes."},"one":"Granulocytes have polymorphic nuclei, are terminally differentiated, live a few days and die by apoptosis."},"w12_blood-17":{"q":"Which leukocyte is the most abundant in blood (54–62%) and is typically the first immune cell to arrive at a site of infection?","o":["Eosinophil","Basophil","Neutrophil","Monocyte","Lymphocyte"],"a":2,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 14","img":[{"u":"img/w12_blood/p14.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 14","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"**Neutrophils (polymorphonuclear leukocytes)** are the **most abundant leukocyte**, **54–62%** of circulating leukocytes.\n\n- Nucleus with **2–5 lobes**\n- Role: **phagocytose bacteria and small particles**\n- Typically the **first immune cells to arrive at a site of infection**","why":{"0":"Eosinophils are 1–3% of leukocytes and mainly fight parasites.","1":"Basophils are under 1%, the fewest.","3":"Monocytes are the largest leukocytes and make up 3–7%.","4":"Lymphocytes are the most abundant agranulocyte but not the most abundant leukocyte overall."},"one":"Neutrophils are the most abundant leukocyte (54–62%) and the first to arrive at infection."},"w12_blood-18":{"q":"In females, what is the small appendage seen on one lobe of the neutrophil nucleus?","o":["A nucleolus","A Charcot-Leyden crystal","A specific granule","An azurophilic granule","The Barr body, the inactive X chromosome"],"a":4,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 14","img":[{"u":"img/w12_blood/p14.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 14","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"Neutrophil nuclei have 2–5 lobes. **In females, the inactive X chromosome** appears as a **small appendage** on one lobe, called the **Barr body**.\n\nBecause it is part of the nucleus, it should not be confused with cytoplasmic granules.","why":{"0":"The nucleolus is inside the nucleus, not an appendage on a lobe.","1":"Charcot-Leyden crystals come from the breakdown of eosinophils; they are not part of the neutrophil nucleus.","2":"Specific granules are cytoplasmic, not a nuclear appendage.","3":"Azurophilic granules are cytoplasmic lysosomes."},"one":"The small appendage on a female neutrophil's nucleus is the Barr body (inactive X chromosome)."},"w12_blood-19":{"q":"Which substances are contained in neutrophil azurophilic granules for destroying bacteria?","o":["PDGF and platelet factor 4","Major basic protein and peroxidase","Heparin and histamine","Myeloperoxidase, lysozyme and defensins","ADP, ATP and serotonin"],"a":3,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 15","img":[{"u":"img/w12_blood/p15.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 15","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"Neutrophils have two kinds of granules.\n\n- **Azurophilic granules** contain **myeloperoxidase, lysozyme and defensins** for **destroying bacteria**.\n- **Specific granules** stain **pale pink** and contain ECM-degrading enzymes, bactericidal proteins and new membrane components.","why":{"0":"PDGF and platelet factor 4 are in platelet alpha granules.","1":"Major basic protein and peroxidase are in eosinophil specific granules.","2":"Heparin and histamine are in basophil granules.","4":"ADP, ATP and serotonin are in platelet delta granules."},"one":"Neutrophil azurophilic granules contain myeloperoxidase, lysozyme and defensins."},"w12_blood-20":{"q":"Which leukocyte makes up 1–3% of blood leukocytes, has a bilobed nucleus, and has large acidophilic granules containing major basic protein?","o":["Neutrophil","Eosinophil","Lymphocyte","Basophil","Monocyte"],"a":1,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 16","img":[{"u":"img/w12_blood/p16.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 16","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"**Eosinophils** make up **1–3%** of blood leukocytes and have a **bilobed nucleus**.\n\nThey have abundant **large acidophilic (red or pink) specific granules** containing **major basic proteins** and **peroxidase**.","why":{"0":"Neutrophils are 54–62%, have 2–5 lobes, and their specific granules are pale pink.","2":"Lymphocytes are agranulocytes with a spherical condensed nucleus.","3":"Basophils are under 1% and their granules stain purple with basic dyes.","4":"Monocytes are agranulocytes with a C-shaped nucleus."},"one":"Eosinophils: 1–3%, bilobed nucleus, large acidophilic granules with major basic protein."},"w12_blood-21":{"q":"Which is a function of eosinophils?","o":["Releasing heparin to prevent clotting in vessels","Producing antibodies as plasma cells","Pinching off proplatelets in the bone marrow","Destroying parasitic worms and removing antigen-antibody complexes from interstitial fluid","Transporting O2 to the tissues"],"a":3,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 16","img":[{"u":"img/w12_blood/p16.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 16","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"The three functions of **eosinophils**:\n\n1. **Destroy parasitic worms (helminths)**\n2. **Modulate inflammatory responses**\n3. **Remove antigen-antibody complexes from interstitial fluid**\n\nThe major basic proteins and peroxidase in their granules are used against parasites.","why":{"0":"Heparin is in basophil granules.","1":"Antibodies are produced by plasma cells derived from B lymphocytes.","2":"Proplatelets are pinched off by megakaryocytes.","4":"O2 transport is the job of red cells."},"one":"Eosinophils destroy parasites, modulate inflammation and remove antigen-antibody complexes."},"w12_blood-22":{"q":"Basophils make up less than 1% of leukocytes. Which describes them?","o":["They are the largest leukocytes with a C-shaped nucleus.","Their pale pink granules contain defensins.","They are the first cells to arrive at an infection site.","They are agranulocytes that mature in the thymus.","Their purple granules often hide the bilobed nucleus; they contain heparin and histamine and have surface receptors for IgE."],"a":4,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 17, 18","img":[{"u":"img/w12_blood/p17.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 17","w":1200,"h":675},{"u":"img/w12_blood/p18.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 18","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"**Basophils** are **under 1%** of leukocytes, the rarest. The nucleus is **bilobed**, but the specific granules stain **purple** with basic dyes, so in smears **the granules hide the nucleus**.\n\nGranule contents: **heparin** and sulfated GAGs, **histamine** and other inflammatory mediators, platelet activating factor, eosinophil chemotactic factor, and phospholipase A, which leads to leukotriene production.\n\nThey **supplement the function of mast cells**, have **surface receptors for IgE**, and **cause allergy symptoms**.","why":{"0":"The largest leukocyte with a C-shaped nucleus is the monocyte.","1":"Pale pink specific granules describe neutrophils, and defensins are in neutrophil azurophilic granules.","2":"The first cell to arrive at infection is the neutrophil.","3":"T lymphocytes mature in the thymus; basophils are granulocytes."},"one":"Basophils have purple granules that hide the nucleus, contain heparin and histamine, and bear IgE receptors."},"w12_blood-23":{"q":"Which statement about lymphocytes is correct?","o":["They contain specific granules that stain purple.","Helper T cells are CD8+ and cytotoxic T cells are CD4+.","They are the most abundant agranulocyte and the smallest leukocyte, with a spherical condensed nucleus.","They are the largest circulating leukocytes.","They all die within a few days by apoptosis."],"a":2,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 19","img":[{"u":"img/w12_blood/p19.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 19","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"**Lymphocytes** are the **most abundant agranulocyte** in blood and the **smallest leukocyte**, with a **spherical condensed nucleus** and sparse cytoplasm.\n\nTypes:\n- **B lymphocytes**\n- **T lymphocytes**: helper = **CD4+**, cytotoxic = **CD8+**\n- **Natural killer (NK) cells**\n\nTheir lifespan ranges from **several days to many years**.","why":{"0":"Lymphocytes are agranulocytes without specific granules; purple granules are basophils.","1":"The reverse: helper T cells are CD4+ and cytotoxic T cells are CD8+.","3":"The largest leukocyte is the monocyte.","4":"Lymphocyte lifespans range from days to many years."},"one":"Lymphocytes are the most abundant agranulocyte and smallest leukocyte; CD4+ = helper, CD8+ = cytotoxic."},"w12_blood-24":{"q":"Which statement about monocytes is correct?","o":["They are the smallest leukocytes.","They are the largest circulating leukocytes, with an indented or C-shaped nucleus, and are thought to be precursors of macrophages and other MPS cells.","They are fragments of megakaryocytes.","They are terminally differentiated and live only a few days.","They have bilobed nuclei and red granules."],"a":1,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 20","img":[{"u":"img/w12_blood/p20.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 20","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"**Monocytes (mononuclear leukocytes)** are the **largest circulating leukocytes**. They have a **large indented or C-shaped nucleus**, basophilic cytoplasm and azurophilic granules.\n\nThey are thought to be precursors of **macrophages**, **microglia**, **osteoclasts** (in some situations) and other cells of the **mononuclear phagocytic system (MPS)**; these derivative cells typically have **antigen-presenting** function.","why":{"0":"The smallest leukocyte is the lymphocyte.","2":"Megakaryocyte fragments are platelets.","3":"Terminal differentiation with a lifespan of a few days describes granulocytes; monocytes go on to mature into macrophages.","4":"A bilobed nucleus with red granules describes eosinophils."},"one":"Monocytes are the largest leukocytes, have a C-shaped nucleus, and give rise to macrophages and other MPS cells."},"w12_blood-25":{"q":"In the leukocyte summary table, which cell type has a differential count of about 25–33% with a life span of hours to many years?","o":["Lymphocytes","Basophils","Eosinophils","Monocytes","Neutrophils"],"a":0,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 21","img":[{"u":"img/w12_blood/p21.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 21","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"The leukocyte summary table:\n\n- **Neutrophils**: 3–5 lobes, faint/light pink granules, 57–67%, 1–4 days, kill and phagocytose bacteria\n- **Eosinophils**: bilobed, red/dark pink granules, 1–3%, 1–2 weeks, kill helminths, modulate local inflammation\n- **Basophils**: bilobed or S-shaped, dark blue/purple granules, 0–0.75%, several months, modulate inflammation, release histamine in allergy\n- **Lymphocytes**: rather spherical nucleus, no granules, **25–33%**, **hours to many years**, effector and regulatory cells for adaptive immunity\n- **Monocytes**: indented or C-shaped nucleus, 3–7%, hours to years, precursors of macrophages and other mononuclear phagocytes","why":{"1":"Basophils are 0–0.75% with a lifespan of several months.","2":"Eosinophils are 1–3% with a lifespan of 1–2 weeks.","3":"Monocytes are 3–7%.","4":"Neutrophils are 57–67% with a lifespan of 1–4 days."},"one":"Lymphocytes make up about 25–33% of the differential count and live hours to many years."},"w12_blood-26":{"q":"Which describes platelets (thrombocytes)?","o":["Non-nucleated fragments of megakaryocytes, 2–4 µm in diameter, 150,000–400,000 per µl, living about 10 days","Nucleated cells about 7.5 µm in diameter","Agranulocytes that mature in the thymus","Granulocytes with a bilobed nucleus","Cells that live about 120 days"],"a":0,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 22, 23","img":[{"u":"img/w12_blood/p22.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 22","w":1200,"h":675},{"u":"img/w12_blood/p23.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 23","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"**Platelets (thrombocytes)** are **small non-nucleated, membrane-bound fragments of megakaryocytes**, the giant polyploid bone marrow cells.\n\n- **2–4 µm** in diameter\n- **150,000 to 400,000 per µl** of blood\n- Lifespan of **about 10 days**\n- Role: **promote blood clotting** and help repair minor tears or leaks in vessel walls","why":{"1":"7.5 µm describes red cells, which are also anucleate.","2":"T lymphocytes are the cells that mature in the thymus.","3":"A bilobed nucleus describes eosinophils and basophils.","4":"120 days is the red cell lifespan."},"one":"Platelets are anucleate megakaryocyte fragments, 2–4 µm, 150,000–400,000/µl, living about 10 days."},"w12_blood-27":{"q":"In platelet structure, what is the granulomere?","o":["The pale peripheral zone","A marginal bundle of microtubules that maintains shape","A canalicular system connected to plasmalemma invaginations","An ER-derived tubular system that stores calcium","The darker staining central zone containing granules"],"a":4,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 24","img":[{"u":"img/w12_blood/p24.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 24","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"Morphologically, platelets have two parts:\n\n- **Hyalomere**: the **pale peripheral zone**\n- **Granulomere**: the **darker staining central zone containing granules**\n\nOther structures:\n- **Marginal bundle** of microtubules and microfilaments maintains shape\n- **Canalicular system** connected to plasmalemma invaginations facilitates uptake of materials\n- **Tubular system** derived from ER **stores calcium ions**","why":{"0":"The pale peripheral zone is the hyalomere.","1":"The marginal bundle maintains shape; it is not the granulomere.","2":"The canalicular system facilitates uptake of materials.","3":"The ER-derived tubular system stores calcium."},"one":"The granulomere is the dark central granule zone; the hyalomere is the pale periphery."},"w12_blood-28":{"q":"Platelet delta (δ) granules contain which substances?","o":["Myeloperoxidase and lysozyme","ADP, ATP and serotonin","Major basic protein and peroxidase","PDGF and platelet factor 4","Heparin and histamine"],"a":1,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 24","img":[{"u":"img/w12_blood/p24.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 24","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"The platelet granulomere has two kinds of granules:\n\n- **Delta granules**: **ADP, ATP and serotonin**\n- **Alpha granules**: **PDGF**, **platelet factor 4**, etc.\n\nA handy grouping: delta = small molecules, alpha = protein growth factors.","why":{"0":"Myeloperoxidase and lysozyme are in neutrophil azurophilic granules.","2":"Major basic protein and peroxidase are in eosinophil granules.","3":"PDGF and platelet factor 4 are in alpha granules.","4":"Heparin and histamine are in basophil granules."},"one":"Delta granules hold ADP, ATP and serotonin; alpha granules hold PDGF and platelet factor 4."},"w12_blood-29":{"q":"Where does hemopoiesis occur during the second trimester?","o":["Yolk sac","Lymph nodes only","Liver and spleen","Bone marrow only","Thymus only"],"a":2,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 25","img":[{"u":"img/w12_blood/p25.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 25","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"Blood cells are relatively short-lived and must be replaced constantly; this differentiation and development is **hemopoiesis (hematopoiesis)**.\n\nSites over development:\n1. **Early embryo**: the **yolk sac**\n2. **Second trimester**: the **liver and spleen**\n3. **Third trimester**: transitions to the **bone marrow**, where it continues for life","why":{"0":"The yolk sac is the site in the early embryo.","1":"Lymph nodes are not listed as the second-trimester site.","3":"The shift to bone marrow happens in the third trimester.","4":"The thymus is where T cells mature, not the second-trimester site."},"one":"Hemopoiesis moves from yolk sac, to liver and spleen (2nd trimester), to bone marrow (3rd trimester onward)."},"w12_blood-30":{"q":"Granulopoiesis is the development of which cells?","o":["Monocytes","Platelets","Lymphocytes","Neutrophils, eosinophils and basophils","Erythrocytes"],"a":3,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 26","img":[{"u":"img/w12_blood/p26.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 26","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"Each blood cell type follows its own lineage:\n\n- **Erythropoiesis**: erythrocytes\n- **Granulopoiesis**: **neutrophils, eosinophils and basophils**\n- **Monocytopoiesis**: monocytes\n- **Thrombocytopoiesis**: platelets\n- **Lymphopoiesis**: lymphocytes","why":{"0":"Development of monocytes is monocytopoiesis.","1":"Development of platelets is thrombocytopoiesis.","2":"Development of lymphocytes is lymphopoiesis.","4":"Development of erythrocytes is erythropoiesis."},"one":"Granulopoiesis is the development of neutrophils, eosinophils and basophils."},"w12_blood-31":{"q":"The pluripotent hemopoietic stem cell produces which two cell lines?","o":["Erythroid and thrombocytic","Granulocytic and monocytic","B-cell and T-cell","Lymphoid and myeloid","Endothelial and mesenchymal"],"a":3,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 27","img":[{"u":"img/w12_blood/p27.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 27","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"All blood cells ultimately arise from a **common stem cell** precursor, a **pluripotent** cell that can give rise to many cell types.\n\nThe **hemopoietic stem cell** divides frequently to produce more stem cells and also **two cell lines**:\n- **Lymphoid** cells, which eventually become **lymphocytes**\n- **Myeloid** cells, which eventually become **all other blood cell types**","why":{"0":"Erythroid and thrombocytic lines are both subdivisions of the myeloid line.","1":"Granulocytic and monocytic lines are the CFU-GM lineage within the myeloid line.","2":"B and T cells both come from the lymphoid line.","4":"Endothelial and mesenchymal lines are not the two hemopoietic stem cell lines."},"one":"The hemopoietic stem cell gives rise to lymphoid (lymphocytes) and myeloid (all other blood cells) lines."},"w12_blood-32":{"q":"Hemopoietic progenitor cells are called colony-forming units (CFUs). Why?","o":["They are found only in the thymus.","They are bacterial colonies in the bone marrow.","They are fully differentiated cells that form colonies in blood.","They form colonies of many different cell types in culture.","When cultured, each cell produces a colony of a single cell type."],"a":4,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 28","img":[{"u":"img/w12_blood/p28.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 28","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"**Progenitor cells** are still pluripotent but **committed** to one of several lineages; they are more differentiated than stem cells.\n\nAmong hemopoietic cells they are called **colony-forming units (CFUs)** because **when cultured, each cell produces a colony of a single cell type**.","why":{"0":"These progenitor populations are in the bone marrow.","1":"CFUs are hemopoietic progenitors, not bacterial colonies.","2":"Progenitors are more differentiated than stem cells but not fully differentiated.","3":"Each CFU produces a colony of a single cell type, not many types."},"one":"CFUs are hemopoietic progenitors that each form a single-cell-type colony in culture."},"w12_blood-33":{"q":"Which progenitor population gives rise to the granulocyte-monocyte lineage?","o":["CFU-Meg","CFU-GM","CFU-E","CFU-L","Proerythroblast"],"a":1,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 28","img":[{"u":"img/w12_blood/p28.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 28","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"The four major **progenitor** populations in bone marrow are named by lineage:\n\n- **CFU-E** (erythroid): red cell lineage\n- **CFU-Meg** (megakaryocyte): thrombocyte lineage\n- **CFU-GM** (granulocyte-monocyte): **granulocytes and monocytes**\n- **CFU-L** (lymphoid): lymphoid lineage","why":{"0":"CFU-Meg is the megakaryocyte/platelet lineage.","2":"CFU-E is the erythroid lineage.","3":"CFU-L is the lymphoid lineage.","4":"The proerythroblast is the first morphologic stage of the red cell lineage."},"one":"The four progenitors are CFU-E, CFU-Meg, CFU-GM and CFU-L; the granulocyte-monocyte one is CFU-GM."},"w12_blood-34":{"q":"What are colony-stimulating factors (CSFs)?","o":["Anticoagulants used to prepare plasma","Granule proteins that destroy bacteria","Hemopoietic growth factors that promote growth and further differentiation of precursor cells","Plasma proteins that maintain osmotic pressure","Enzymes that convert CO2 to bicarbonate"],"a":2,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 29","img":[{"u":"img/w12_blood/p29.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 29","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"Each progenitor population produces **precursor cells (blasts)**, which differentiate further and mature into specific cell types. Each stage of a precursor's development can be identified by its **morphology**.\n\n**Colony-stimulating factors (CSFs)** are **hemopoietic growth factors that promote the growth and further differentiation of the precursor cells**.","why":{"0":"Anticoagulants prevent clotting and have nothing to do with CSFs.","1":"Bacteria-killing granule proteins are things like neutrophil myeloperoxidase.","3":"Maintaining osmotic pressure is albumin's role.","4":"The enzyme converting CO2 to bicarbonate is carbonic anhydrase."},"one":"CSFs are hemopoietic growth factors that drive precursor cell growth and differentiation."},"w12_blood-35":{"q":"During erythropoiesis, which change occurs, and what does erythropoietin stimulate?","o":["Cell and nuclear volumes decrease, chromatin density increases; erythropoietin stimulates globin production","Chromatin becomes less dense; erythropoietin stimulates platelet release","Cell volume increases; erythropoietin stimulates DNA replication","Polyribosomes increase; erythropoietin stimulates nucleus formation","Mitochondria multiply; erythropoietin stimulates granule formation"],"a":0,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 30","img":[{"u":"img/w12_blood/p30.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 30","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"Changes during **erythropoiesis**:\n- **Cell and nuclear volumes gradually decrease**\n- **Chromatin density increases**\n- **Polyribosomes decrease**; mitochondria and other organelles gradually disappear\n\n**Erythropoietin stimulates the production of globin**, the protein found in hemoglobin.","why":{"1":"Chromatin density increases, and platelet release is done by megakaryocytes.","2":"Cell volume decreases, not increases.","3":"Polyribosomes decrease, and the cell eventually ejects its nucleus.","4":"Mitochondria gradually disappear, and red cells develop no specific granules."},"one":"In erythropoiesis cells and nuclei shrink and chromatin condenses; erythropoietin stimulates globin production."},"w12_blood-36":{"q":"At which stage of erythropoiesis does the cell become acidophilic and eject its nucleus?","o":["Polychromatophilic erythroblast","Basophilic erythroblast","Orthochromatophilic erythroblast (normoblast)","Proerythroblast","Reticulocyte"],"a":2,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 31","img":[{"u":"img/w12_blood/p31.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 31","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"Stages of the erythroid lineage:\n\n1. **Proerythroblast**: large cell, loosely packed chromatin, obvious nucleoli, basophilic cytoplasm\n2. **Basophilic erythroblast**: more basophilic cytoplasm, more condensed nucleus, no visible nucleolus\n3. **Polychromatophilic erythroblast**: as polyribosomes decrease and hemoglobin increases, basophilic areas mix with acidophilic areas; the cell shrinks\n4. **Orthochromatophilic erythroblast (normoblast)**: **the cell becomes acidophilic and ejects its nucleus**\n5. **Reticulocyte**: residual polyribosomes give a reticular look with certain stains; enters the blood and matures in a few days","why":{"0":"The polychromatophilic erythroblast is where basophilia and acidophilia mix.","1":"The basophilic erythroblast has more basophilic cytoplasm and a condensing nucleus.","3":"The proerythroblast is the first stage with obvious nucleoli and still has its nucleus.","4":"The reticulocyte comes after the nucleus has already been ejected."},"one":"The nucleus is ejected at the orthochromatophilic erythroblast (normoblast) stage."},"w12_blood-37":{"q":"Reticulocytes make up about what percentage of circulating red blood cells, and why do they look reticular with certain stains?","o":["About 1%, because of a Barr body","About 45%, because they contain hemoglobin","About 10%, because they still have a nucleus","About 25%, because of specific granules","About 1%, because of the continued presence of polyribosomes"],"a":4,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 31","img":[{"u":"img/w12_blood/p31.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 31","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"**Reticulocytes** come after the nucleus has been ejected. **Because of the continued presence of polyribosomes**, certain stains give their cytoplasm a **reticular** appearance.\n\nThey enter the bloodstream, become mature erythrocytes **in a few days**, and make up **about 1% of circulating red blood cells**.","why":{"0":"1% is right, but the Barr body is an appendage of the female neutrophil nucleus.","1":"45% is the hematocrit, and the reticular look is not due to hemoglobin.","2":"Reticulocytes have already ejected their nucleus.","3":"The erythroid lineage has no specific granules."},"one":"Reticulocytes are about 1% of circulating RBCs and look reticular because of residual polyribosomes."},"w12_blood-38":{"q":"In granulopoiesis, at which stage do specific granules first appear?","o":["Myelocyte","Myeloblast","Metamyelocyte","Band cell","Promyelocyte"],"a":0,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 32, 33","img":[{"u":"img/w12_blood/p32.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 32","w":1200,"h":675},{"u":"img/w12_blood/p33.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 33","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"**Granulopoiesis** is characterized by **azurophilic granules developing first** in all three cell types, followed by the **specific granules** unique to each granulocyte.\n\nStages:\n1. **Myeloblast**: finely dispersed chromatin, faint nucleoli\n2. **Promyelocyte**: basophilic cytoplasm and **azurophilic granules**\n3. **Myelocyte**: **specific granules appear**\n4. **Metamyelocyte**: specific granules fill most of the cytoplasm\n5. **Band cell**: elongated, curved nucleus before it subdivides into lobes (most obvious in neutrophils)","why":{"1":"The myeloblast is the first stage, with dispersed chromatin and no granules yet.","2":"In the metamyelocyte, the already-formed specific granules fill most of the cytoplasm.","3":"The band cell is the stage just before the nucleus divides into lobes.","4":"The promyelocyte gains azurophilic granules; specific granules have not appeared yet."},"one":"Azurophilic granules appear at the promyelocyte and specific granules at the myelocyte stage."},"w12_blood-39":{"q":"In monocytopoiesis, which statement is correct?","o":["Monocytes lack azurophilic granules and RER.","The monoblast is virtually identical morphologically to the myeloblast.","Monocytes eject their nucleus before entering the blood.","The promonocyte is a small acidophilic cell with no nucleolus.","Monocytes mature in the thymus into T cells."],"a":1,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 34","img":[{"u":"img/w12_blood/p34.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 34","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"Stages of **monocytopoiesis**:\n\n1. **Monoblast**: **virtually identical morphologically to the myeloblast**\n2. **Promonocyte**: large basophilic cell with a slightly indented nucleus, lacy chromatin and a visible nucleolus\n3. **Monocyte**: azurophilic granules, extensive RER and Golgi; **matures in tissues into macrophages**","why":{"0":"Monocytes have azurophilic granules and extensive RER and Golgi.","2":"Ejecting the nucleus happens in the red cell lineage; monocytes keep their nucleus.","3":"The promonocyte is large and basophilic with a visible nucleolus.","4":"Monocytes mature into macrophages in tissues; T cells are lymphoid."},"one":"The monoblast looks almost identical to the myeloblast, and monocytes mature into macrophages in tissues."},"w12_blood-40":{"q":"Where do T lymphocytes mature?","o":["They mature entirely in the bone marrow.","They mature in the spleen from monocytes.","They mature in the yolk sac.","They come from bone marrow but must go to the thymus to mature.","They mature in the liver during adult life."],"a":3,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 35","img":[{"u":"img/w12_blood/p35.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 35","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"**Lymphopoiesis**: **all lymphocytes come from the bone marrow, but T lymphocytes must go to the thymus to mature.**\n\nAs they mature, **their nuclei become smaller and nucleoli less visible**, and the cells shrink. The **lymphoblast** undergoes several mitotic divisions, gradually decreasing in size, to give mature T cells, B cells (and NK cells).","why":{"0":"They do come from bone marrow, but T cells must mature in the thymus.","1":"Lymphocytes do not come from monocytes; the lymphoid line is separate from the myeloid line.","2":"The yolk sac is the early embryonic site of hemopoiesis.","4":"Adult hemopoiesis is in bone marrow, and T cell maturation is in the thymus."},"one":"All lymphocytes come from bone marrow, but T cells mature in the thymus."},"w12_blood-41":{"q":"In thrombopoiesis, how are platelets released?","o":["Proplatelet extensions of megakaryocytes pinch off to release platelets into the sinusoids of bone marrow.","Platelets form by mitotic division of mature platelets in blood.","Megakaryoblasts eject their nuclei to become platelets.","Platelets bud from the surface of reticulocytes.","Monocytes fragment in the spleen to form platelets."],"a":0,"src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 36, 37","img":[{"u":"img/w12_blood/p36.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 36","w":1200,"h":675},{"u":"img/w12_blood/p37.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 37","w":1200,"h":675}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12,"exp":"**Thrombopoiesis**: megakaryocytes develop from precursors called **megakaryoblasts**, very large cells that develop **polyploid nuclei**.\n\nExtensions of the megakaryocyte called **proplatelets pinch off** to release platelets into the **sinusoids of the bone marrow**, which is why platelets are anucleate cell fragments.","why":{"1":"Platelets have no nucleus and do not divide.","2":"Platelets are cytoplasmic fragments of megakaryocytes, not cells that ejected a nucleus.","3":"Reticulocytes are red cell precursors and do not make platelets.","4":"Monocytes mature into macrophages and do not make platelets."},"one":"Megakaryocyte proplatelets pinch off to release platelets into the bone marrow sinusoids."},"w12_sleep_apnea-1":{"q":"In which stage of sleep does the brain begin to produce sleep spindles, with body temperature dropping and heart rate slowing?","o":["NREM stage 3","Wakefulness","NREM stage 1","REM sleep","NREM stage 2"],"a":4,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 4","img":[{"u":"img/w12_sleep_apnea/p04.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 4","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"The four stages of sleep:\n\n- **NREM stage 1**: transition between wakefulness and sleep, about 5–10 minutes\n- **NREM stage 2**: **body temperature drops and heart rate slows**, and the brain **begins to produce sleep spindles**; about 20 minutes\n- **NREM stage 3**: muscles relax, blood pressure and breathing rate drop, **deepest sleep**\n- **REM sleep**: brain more active, body relaxed and immobilized, dreams, rapid eye movements\n\nSleep spindles in stage 2 may be important to learning, as this may be where memories are processed from short-term to long-term memory.","why":{"0":"Stage 3 is the deepest sleep, with relaxed muscles and lower blood pressure and breathing rate.","1":"Sleep spindles are a feature of sleep, specifically NREM stage 2.","2":"Stage 1 is the brief transition (5–10 minutes) between wakefulness and sleep.","3":"REM sleep is marked by dreams and rapid eye movements, not the onset of sleep spindles."},"one":"Sleep spindles appear in NREM stage 2 and may be important for learning and memory."},"w12_sleep_apnea-2":{"q":"Which stage of sleep is described as the deepest sleep, with relaxed muscles and dropping blood pressure and breathing rate?","o":["The transition period","NREM stage 2","NREM stage 1","NREM stage 3","REM sleep"],"a":3,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 4, 5","img":[{"u":"img/w12_sleep_apnea/p04.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 4","w":1200,"h":675},{"u":"img/w12_sleep_apnea/p05.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 5","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**NREM stage 3** is the **deepest sleep**: **muscles relax and blood pressure and breathing rate drop**. It is also described as when the body works to heal tissues and grow new cells.\n\n**REM sleep**, by contrast, is the dreaming and learning phase linked with learning and memory. During REM the brain sorts important from unimportant information and files **long-term memory**; if REM is shortchanged, mental focus and acuity may decrease and people may feel cranky.","why":{"0":"The transition period is stage 1, the lightest stage.","1":"Stage 2 is when body temperature and heart rate drop and sleep spindles begin.","2":"Stage 1 is the transition between wakefulness and sleep.","4":"REM is the more active, dreaming stage, not the one described as deepest."},"one":"The deepest sleep is NREM stage 3; REM is the dreaming, memory-filing stage."},"w12_sleep_apnea-3":{"q":"How is sleep apnea defined?","o":["Snoring louder than talking, with no change in oxygen","Breathing cessation or airflow reduction lasting ≥10 s, occurring >5 times per hour of sleep, associated with cortical arousals and/or oxygen desaturation","Any awakening during the night for more than 5 minutes","Airflow reduction lasting ≥2 s, occurring >30 times per hour","Breathing cessation lasting ≥60 s, occurring once per night"],"a":1,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 6","img":[{"u":"img/w12_sleep_apnea/p06.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 6","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"**Sleep apnea** is defined as:\n\n- **Breathing cessation (apnea)** or **airflow reduction (hypopnea)**\n- lasting **at least 10 seconds**\n- occurring **more than 5 times per hour of sleep**\n- associated with **cortical sleep arousals** (to restore breathing) and/or **oxygen desaturation**\n\nRemember the numbers: 10 seconds, more than 5 per hour.","why":{"0":"Snoring is only a symptom; the definition requires cessation or reduction of breathing with arousal or desaturation.","2":"Simply waking up is not the definition of sleep apnea.","3":"The duration threshold is at least 10 seconds, not 2.","4":"The duration threshold is at least 10 seconds and the frequency more than 5 per hour."},"one":"Sleep apnea is apnea or hypopnea of at least 10 seconds, more than 5 times per hour, with arousal or desaturation."},"w12_sleep_apnea-4":{"q":"In the definitions of sleep-related breathing disorders, what is a hypopnea?","o":["Reduction of airflow with resultant oxygen desaturation of ≥4%","The average number of apnea and hypopnea events per hour","An AHI of 30 or more","Cessation of airflow for at least 10 seconds","Respiratory events without inspiratory effort"],"a":0,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 7","img":[{"u":"img/w12_sleep_apnea/p07.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 7","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"Definitions of sleep-related breathing disorders:\n\n- **Apnea**: **cessation of airflow for at least 10 seconds**\n- **Hypopnea**: **reduction of airflow with resultant oxygen desaturation of at least 4%**\n- **Apnea-hypopnea index (AHI)**: average number of apnea and hypopnea events per hour of sleep\n- **Obstructive sleep apnea (OSA)**: AHI of 15 or more, or 5 or more with associated symptoms (daytime sleepiness, impaired cognition, mood disorders, insomnia, hypertension, heart disease, history of stroke)\n- **Central sleep apnea (CSA)**: AHI of 5 or more, or 50% or more of respiratory events occurring without any inspiratory effort","why":{"1":"The average number of events per hour is the AHI.","2":"An AHI of 30 or more is the severe threshold.","3":"Cessation of airflow for at least 10 seconds defines apnea.","4":"Events without inspiratory effort characterize central sleep apnea."},"one":"A hypopnea is reduced airflow with resultant oxygen desaturation of at least 4%."},"w12_sleep_apnea-5":{"q":"What distinguishes predominantly obstructive sleep apnea from central sleep apnea?","o":["The patient's body mass index","The duration of each apnea","The presence of inspiratory (respiratory) effort during apneas and hypopneas","The loudness of snoring alone","The total sleep time"],"a":2,"src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 7, 37","img":[{"u":"img/w12_sleep_apnea/p07.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 7","w":1200,"h":675},{"u":"img/w12_sleep_apnea/p37.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 37","w":1200,"h":675}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12,"exp":"The key note under the definitions: **the presence of inspiratory effort during apneas and hypopneas** distinguishes predominantly obstructive sleep apnea from central sleep apnea.\n\n- **OSA**: the airway is blocked, but **the effort to breathe continues**.\n- **CSA**: the brain
