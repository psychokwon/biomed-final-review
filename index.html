 - Upper Limb.pdf, slide 75","w":1200,"h":900},{"u":"img/w10_riedel/p76.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 76","w":1200,"h":900},{"u":"img/w10_riedel/p77.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 77","w":1200,"h":900},{"u":"img/w10_riedel/p78.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 78","w":1200,"h":900},{"u":"img/w10_riedel/p79.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 79","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"Pyogenic flexor tenosynovitis is a bacterial infection of the flexor tendon sheath. The sheath runs **from the distal palmar crease to the fingertip**, and the most common organism is ***S. aureus***.\n\nThe key to diagnosis is the four **Kanavel signs**: **flexed posture**, **fusiform swelling of the digit**, **severe pain on passive extension of the digit**, and **tenderness along the flexor sheath**. Early presentation can be managed with IV antibiotics and observation; late presentation requires surgical decompression, and early motion is encouraged. If symptoms persist, repeat surgical drainage is considered.\n\nSevere soft-tissue infections (such as necrotizing fasciitis) may require wide debridement followed by meshed skin graft coverage.","why":{"0":"Night pain relieved by shaking the hand fits the history of carpal tunnel syndrome.","1":"Pain on Finkelstein's test suggests De Quervain disease.","3":"Thenar atrophy and a simian hand are findings of advanced median nerve compression.","4":"A mass that transilluminates is characteristic of a ganglion."},"one":"Kanavel signs: flexed posture, fusiform swelling, severe pain on passive extension, tenderness along the flexor sheath."},"w10_riedel-29":{"q":"The most common soft-tissue tumor of the hand is a benign mucin-filled cyst (ganglion) that accounts for 50–70% of hand masses and is most often seen in:","o":["Elderly men after a deep infection","Children with open growth plates","Laborers immediately after a crush injury","Women in the second to fourth decades of life","Patients with late carpal tunnel atrophy"],"a":3,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 80, 81, 82, 83, 84, 85","img":[{"u":"img/w10_riedel/p80.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 80","w":1200,"h":900},{"u":"img/w10_riedel/p81.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 81","w":1200,"h":900},{"u":"img/w10_riedel/p82.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 82","w":1200,"h":900},{"u":"img/w10_riedel/p83.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 83","w":1200,"h":900},{"u":"img/w10_riedel/p84.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 84","w":1200,"h":900},{"u":"img/w10_riedel/p85.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 85","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"A **ganglion** is a **benign mucin-filled cyst** associated with joints, tendons, or tendon sheaths. It is **the most common soft-tissue tumor of the hand**, accounting for **50–70%** of hand masses. It is common in **women in their 20s to 40s** and can cause pain and weakness.\n\nIt enlarges with activity and shrinks with rest; X-rays are usually nonspecific, and the diagnosis is usually made clinically. **The dorsal and volar wrist and the flexor sheath** account for **about 90%** of lesions. A ganglion on a finger transilluminates when a light is shone through it, indicating mucinous contents. A dorsal wrist mass is the typical picture at the most common site.","why":{"0":"A ganglion is not a disease of elderly men after infection; it is common in women in their 20s to 40s.","1":"Open growth plates are just a finding on an adolescent arteriogram, not the typical ganglion population.","2":"It is not a tumor directly related to acute crush injury.","4":"The epidemiology of ganglia differs from that of carpal tunnel atrophy."},"one":"A ganglion is the most common soft-tissue tumor of the hand (50–70%), typical in women aged 20–40; dorsal/volar wrist and flexor sheath = 90%."},"w10_riedel-30":{"q":"When a symptomatic wrist ganglion is excised, which statement about treatment is correct?","o":["Steroid injection is preferred first-line therapy","Capsular closure is required to prevent recurrence","Aspiration is contraindicated in every case","Recurrence after excision is about 80–90%","Recurrence after excision of the base is about 10–15%"],"a":4,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 83, 86, 87","img":[{"u":"img/w10_riedel/p83.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 83","w":1200,"h":900},{"u":"img/w10_riedel/p86.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 86","w":1200,"h":900},{"u":"img/w10_riedel/p87.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 87","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"Nonoperative treatment of a ganglion includes digital pressure, **aspiration and fenestration**, and reassurance that it is benign. However, **steroid injection is not recommended** because of **skin changes**.\n\nThe indication for surgery is a **persistent symptomatic mass**. The **base of the ganglion must be excised**, and **capsular closure is not required**. The recurrence rate is about **10–15%**, and stiffness can be a problem. A transilluminating finger lesion or a dorsal wrist mass helps make the clinical diagnosis.","why":{"0":"Steroid injection is not recommended because of skin changes.","1":"Capsular closure is stated to be unnecessary.","2":"Aspiration and fenestration are one form of nonoperative treatment and are not contraindicated across the board.","3":"Recurrence after excision is about 10–15%, not 80–90%."},"one":"Ganglion: aspiration is an option but avoid steroids; surgery excises the base, and recurrence is about 10–15%."},"w11_resp_histo-1":{"q":"The principal purpose of the respiratory system is to:","o":["Filter lymph and store oxygen inside alveolar macrophages","Generate voice in the larynx and also drain the paranasal sinus system","Exchange O2 and CO2 between air and blood, and then with the tissues","Pump systemic arterial blood throughout the bronchial tree","Produce all of the body's surfactant in the nasal vestibule"],"a":2,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 2","img":[{"u":"img/w11_resp_histo/p02.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 2","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"The fundamental purpose of the respiratory system is to exchange **oxygen (O2)** and **carbon dioxide (CO2)** between air and blood, and ultimately to supply the body's tissues with oxygen and remove carbon dioxide.\n\nThe **lungs** are where gas exchange takes place; the rest of the respiratory system consists of **airways** that carry air into and out of the lungs.\n\nSo the core purpose is gas exchange and oxygen delivery/CO2 removal at the tissue level; functions like producing voice or filtering lymph are not that purpose itself.","why":{"0":"Alveolar macrophages (dust cells) phagocytose particulate pollutants, but they do not store oxygen or filter lymph.","1":"The larynx is involved in phonation and sinus mucus is swept into the nasal cavity by cilia, but neither is the core purpose of the respiratory system.","3":"Bronchial arteries deliver nutrient blood to the bronchial walls, but the purpose of the respiratory system is not to pump systemic blood.","4":"Surfactant is secreted mainly by type II alveolar cells and club cells; it is not made for the whole body in the nasal vestibule."},"one":"The respiratory system exists to exchange O2/CO2 between air, blood, and tissues, and the lungs are where that happens."},"w11_resp_histo-2":{"q":"Which set of structures constitutes the conducting portion of the respiratory system?","o":["Airways from the nasal cavities through the terminal bronchioles","Airways from respiratory bronchioles through the alveoli","Alveolar ducts, alveolar sacs, and the visceral pleura only","Terminal bronchioles plus respiratory bronchioles and alveolar ducts","Nasal cavities and alveoli, excluding the trachea and bronchi"],"a":0,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 3","img":[{"u":"img/w11_resp_histo/p03.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 3","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"The respiratory system is divided into a **conducting portion** and a **respiratory portion**.\n\nThe conducting portion is the passageway that delivers air to the gas-exchange regions of the lung: the **nasal cavities**, **nasopharynx**, **larynx**, **trachea**, **bronchi**, **bronchioles**, and **terminal bronchioles**.\n\nThe respiratory portion is where gas exchange actually occurs: **respiratory bronchioles**, **alveolar ducts**, **alveolar sacs**, and **alveoli**.\n\nThe terminal bronchiole is the last part of the conducting portion; the respiratory portion begins with the respiratory bronchiole, whose wall has alveoli opening into it.","why":{"1":"These make up the respiratory portion, not the conducting portion.","2":"Alveolar ducts and sacs are respiratory portion, and the visceral pleura is the serous membrane covering the lung surface, not a conducting airway.","3":"Terminal bronchioles are conducting, but respiratory bronchioles and alveolar ducts belong to the respiratory portion.","4":"The nasal cavities are conducting and the alveoli respiratory; leaving out the trachea and bronchi does not describe the conducting portion fully."},"one":"The conducting portion runs from the nasal cavities to the terminal bronchioles; from the respiratory bronchioles on is the respiratory portion."},"w11_resp_histo-3":{"q":"The ventilation system that moves air in and out of the lungs consists of the:","o":["Pulmonary arteries, bronchial arteries, and the pulmonary veins","Visceral pleura, parietal pleura, and the pleural cavity only","Nasal conchae, the larynx, and the trachealis muscle alone","Alveolar macrophages, club cells, and type II pneumocytes","Thoracic cage, intercostals, diaphragm, and elastic lung tissue"],"a":4,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 3","img":[{"u":"img/w11_resp_histo/p03.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 3","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"The **ventilation system** is the mechanical apparatus that moves air into and out of the lungs.\n\nIt consists of the **thoracic cage**, the **intercostal muscles**, the **diaphragm**, and the **elastic components** of the lung tissue.\n\nWhen the diaphragm contracts, thoracic volume increases and negative pressure draws air in; when it relaxes, volume decreases and positive pressure pushes air out. The elastic fibers of the airways stretch during inspiration and provide **elastic recoil** during expiration.\n\nBlood vessels, pleura, and epithelial cells are important for circulation, lubrication, and secretion, respectively, but they are not listed as components of the ventilation system.","why":{"0":"These are the lung's circulations (pulmonary and bronchial), not the ventilation system that changes thoracic volume.","1":"The pleura is a serous membrane that provides lubrication, but the components of the ventilation system are the thoracic cage, intercostals, diaphragm, and elastic tissue.","2":"The conchae, larynx, and trachealis are parts of the airway but are not the ventilation system itself.","3":"These cells are involved in phagocytosis and surfactant secretion; they are not the ventilation apparatus that changes thoracic volume."},"one":"Ventilation is carried out by the thoracic cage, intercostals, diaphragm, and the elastic components of the lungs."},"w11_resp_histo-4":{"q":"The nasal vestibule, into which the nares open, is lined by:","o":["Olfactory epithelium with bipolar neurons plus Bowman's glands","Skin with sweat glands, sebaceous glands, and coarse vibrissae","Thin respiratory epithelium attached directly to periosteum","Simple cuboidal epithelium rich in club (Clara) cells","Mesothelium that secretes a lubricating serous fluid"],"a":1,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 4","img":[{"u":"img/w11_resp_histo/p04.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 4","w":1200,"h":675},{"u":"img/w11_resp_histo/p05.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 5","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"The left and right **nasal cavities** are separated by the **nasal septum**, and the **nares (nostrils)** open into the **vestibule**.\n\nThe vestibule is lined by **skin**, with **sweat glands**, **sebaceous glands**, and **vibrissae (coarse hairs)**. Moving from the vestibule into the nasal cavity proper, the epithelium changes from **stratified squamous keratinized epithelium** to **pseudostratified ciliated columnar epithelium**.\n\nThe nasal septum is bony posteriorly and cartilaginous anteriorly, and the **nasal conchae (turbinates)** are three bony shelves projecting from the **lateral wall** of each cavity.","why":{"0":"The olfactory epithelium is in the roof of the nasal cavity, not the lining of the vestibule.","2":"Thin respiratory epithelium attached directly to periosteum (mucoperiosteum) is characteristic of the paranasal sinuses.","3":"Simple cuboidal epithelium with club cells is the transition seen in bronchioles, not the vestibule.","4":"Mesothelium is the lining of serous membranes such as the pleura."},"one":"The nasal vestibule is skin with sweat glands, sebaceous glands, and vibrissae; it transitions to respiratory epithelium in the nasal cavity proper."},"w11_resp_histo-5":{"q":"The three nasal conchae (formerly called turbinates) protrude from the:","o":["Cribriform plate of the ethmoid in the nasal roof","Medial wall formed solely by the vomer","Floor formed by the palatine process of the maxilla bone","Lateral wall of each nasal cavity, as three bony shelves","Posterior openings (choanae) into the nasopharynx"],"a":3,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 4, 5","img":[{"u":"img/w11_resp_histo/p04.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 4","w":1200,"h":675},{"u":"img/w11_resp_histo/p05.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 5","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"The **medial wall** of each nasal cavity is formed by the **nasal septum**, which is **bony posteriorly** and **cartilaginous anteriorly**. In the figure, the septum is formed by the **vomer**, the **perpendicular plate of the ethmoid**, the **septal cartilage**, and the **nasal crest** of the maxilla/palatine.\n\nBy contrast, the **nasal conchae** are three bony shelves projecting from the **lateral wall** of each cavity, formerly called **turbinates**. The superior, middle, and inferior conchae are visible, with the **nasal vestibule** in front.\n\nThe conchae increase the mucosal surface area and help warm, humidify, and filter the inspired air.","why":{"0":"The cribriform plate is the roof structure through which olfactory axons pass to the olfactory bulb; it is not where the conchae arise.","1":"The vomer is a bony component of the septum forming the medial wall; the conchae come from the lateral wall.","2":"The palatine side is the floor of the nasal cavity, not the wall from which the conchae arise.","4":"The choanae are the posterior openings connecting the nasal cavity to the nasopharynx, not a wall from which the conchae project."},"one":"The nasal conchae project from the lateral wall of each nasal cavity; the septum forms the medial wall."},"w11_resp_histo-6":{"q":"Brush cells in respiratory epithelium are best described as:","o":["Chemosensory cells with blunt microvilli that synapse on afferent endings","Mucus-secreting cells that form most of the epithelial surface","Mitotically active progenitor cells replacing the other epithelial cell types","DNES cells that store dense-core granules near the basal surface","Ciliated cells whose beating clears mucus toward the pharynx"],"a":0,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 6","img":[{"u":"img/w11_resp_histo/p06.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 6","w":1200,"h":675},{"u":"img/w11_resp_histo/p07.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 7","w":1200,"h":675},{"u":"img/w11_resp_histo/p08.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 8","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"**Respiratory epithelium**, which lines most of the nasal cavity and the other airways, is **pseudostratified ciliated columnar epithelium**.\n\nIts cell types: **goblet cells** secrete mucus. **Brush cells** are **chemosensory cells** with **sparse, blunt microvilli** that synapse with **afferent nerve endings**. **Small granule cells** contain dense-core granules and belong to the **diffuse neuroendocrine system (DNES)**. **Basal cells** are mitotically active progenitors that give rise to the other epithelial cells.\n\nDon't confuse brush cells with goblet, basal, small granule, or ciliated cells.","why":{"1":"The mucus-secreting cells are goblet cells.","2":"The progenitor cells are basal cells.","3":"Dense-core granules and DNES membership characterize small granule cells.","4":"Motile cilia for clearing mucus characterize ciliated columnar cells."},"one":"Brush cells are chemosensory cells with blunt microvilli that synapse with afferent nerve endings."},"w11_resp_histo-7":{"q":"Small granule cells of respiratory epithelium are characterized by:","o":["Sparse blunt microvilli and synapses onto afferent nerve endings","Abundant apical mucus granules released into the airway lumen","Dense-core granules and membership in the DNES","Numerous motile cilia that sweep mucus toward the nasopharynx","Production of odorant-binding proteins for the olfactory cilia"],"a":2,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 6","img":[{"u":"img/w11_resp_histo/p06.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 6","w":1200,"h":675},{"u":"img/w11_resp_histo/p08.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 8","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"**Small granule cells** of respiratory epithelium contain **dense-core granules** and are part of the **diffuse neuroendocrine system (DNES)**.\n\nThey are endocrine/neuroendocrine cells containing local hormones and amines and are understood to participate in local regulation of the airway.\n\nDistinguish them from the chemosensory synapses of brush cells, the mucus of goblet cells, the motile cilia of ciliated cells, and the odorant-binding proteins of olfactory supporting cells.","why":{"0":"This describes brush cells.","1":"Apical mucus granules characterize goblet cells.","3":"Motile cilia characterize the ciliated columnar cells of respiratory epithelium.","4":"Odorant-binding proteins are made by the supporting cells of the olfactory epithelium."},"one":"Small granule cells are respiratory epithelial cells with dense-core granules that belong to the DNES."},"w11_resp_histo-8":{"q":"Capillary loops in the respiratory lamina propria, located near the mucosal surface, primarily:","o":["Exchange O2 and CO2 across the alveolar blood-air barrier","Drain lymph from the subpleural lymphatic plexus to hilar nodes","Supply blood to the vocalis muscle of the vocal folds","Carry odorants through the cribriform plate to the olfactory bulb","Warm the inspired air as it flows over the mucosa"],"a":4,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 6","img":[{"u":"img/w11_resp_histo/p06.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 6","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"The **lamina propria** of the respiratory mucosa contains a complex vascular network, and the **capillary loops** near the surface serve to **warm the inspired air**.\n\nThe lamina propria also contains **mucoserous glands** that supplement the secretions of the epithelial goblet cells.\n\nGas exchange occurs at the alveolar blood-air barrier, and lymph drainage occurs through the peribronchial and pleural lymphatics of the lung; neither is the function of the surface capillaries in the nasal lamina propria.","why":{"0":"Gas exchange across the blood-air barrier occurs in the alveoli and their surrounding capillaries.","1":"The subpleural lymphatic plexus is a drainage route on the lung surface, not a function of nasal lamina propria capillaries.","2":"Blood supply to the vocalis muscle is a laryngeal supply, not the function of the surface capillary loops of the respiratory mucosa.","3":"Olfactory axons pass through the cribriform plate to the olfactory bulb; capillaries do not carry odorants."},"one":"Capillary loops near the surface of the respiratory lamina propria warm the inspired air."},"w11_resp_histo-9":{"q":"Olfactory neurons in the roof of the nasal cavity are:","o":["Unipolar neurons whose axons remain confined to the nasal mucosa","Bipolar neurons with non-motile cilia; axons cross the cribriform plate","Multipolar neurons that synapse on goblet cells in the epithelium","Pseudounipolar neurons whose cell bodies lie in the trigeminal ganglion","Bipolar neurons with motile cilia that sweep mucus to the choanae"],"a":1,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 9","img":[{"u":"img/w11_resp_histo/p09.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 9","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"The **olfactory epithelium** lies in the **roof** of the nasal cavity and is responsible for smell.\n\n**Olfactory neurons** are **bipolar neurons**. Their luminal end is swollen, and numerous **non-motile cilia** extend from it, increasing the surface area for detecting odorant molecules. Their axons gather into small bundles in the lamina propria, pass through the openings of the **cribriform plate of the ethmoid**, and synapse with other neurons in the **olfactory bulb**.\n\nThese cilia are different from the motile cilia of respiratory epithelium that sweep mucus along.","why":{"0":"Olfactory neurons are not unipolar, and their axons cross the cribriform plate to reach the olfactory bulb.","2":"Olfactory neurons are not multipolar and do not synapse on goblet cells.","3":"Pseudounipolar neurons with cell bodies in the trigeminal ganglion carry general somatic sensation; this is not a description of olfactory neurons.","4":"Olfactory cilia are non-motile and serve to enlarge the odor-detecting surface, not to clear mucus."},"one":"Olfactory neurons are bipolar cells with non-motile cilia whose axons pass through the cribriform plate to the olfactory bulb."},"w11_resp_histo-10":{"q":"Supporting cells of the olfactory epithelium produce:","o":["Pulmonary surfactant that lowers surface tension in alveolar sacs","Dense-core granules of the diffuse neuroendocrine system","Mucus that motile cilia then sweep into the paranasal sinuses","Odorant-binding proteins that deliver odorants to olfactory cilia","Antimicrobial peptides and xenobiotic-detoxifying SER enzymes"],"a":3,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 10","img":[{"u":"img/w11_resp_histo/p10.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 10","w":1200,"h":675},{"u":"img/w11_resp_histo/p12.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 12","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"**Supporting cells** of the olfactory epithelium are columnar with broad apices bearing **microvilli**. They are joined to neighboring olfactory neurons by **junctional complexes** and, much like glial cells, provide mechanical and metabolic support to the olfactory cells.\n\nOne key function is producing **odorant-binding proteins**, which capture odorant molecules from the air and deliver them to the receptors on the cilia of the olfactory neurons.\n\nThe **basal cells** of the olfactory epithelium are round or cone-shaped cells on the basement membrane and are stem cells that replace the other two cell types.","why":{"0":"Pulmonary surfactant is secreted by type II alveolar cells (and bronchiolar club cells).","1":"Dense-core granules and the DNES characterize small granule cells of respiratory epithelium.","2":"Sinus mucus is swept toward small openings by the cilia of thin respiratory epithelium; this is not the main function of olfactory supporting cells.","4":"Detoxifying xenobiotics with SER enzymes and secreting antimicrobial peptides are functions of club cells."},"one":"Olfactory supporting cells make odorant-binding proteins that deliver odorants to the olfactory cilia."},"w11_resp_histo-11":{"q":"Olfactory (Bowman's) glands in the olfactory lamina propria secrete:","o":["Mucus identical to goblet-cell mucus of respiratory epithelium","Surfactant phospholipids packaged in lamellar bodies","A serous fluid whose only role is to warm inspired air","A watery secretion that lubricates the vocal ligaments","A proteinaceous fluid that traps and dissolves odorants"],"a":4,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 11","img":[{"u":"img/w11_resp_histo/p11.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 11","w":1200,"h":675},{"u":"img/w11_resp_histo/p12.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 12","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"The **olfactory lamina propria** contains the **olfactory (Bowman's) glands**.\n\nThese glands secrete a **proteinaceous fluid** onto the mucosal surface that **traps and dissolves** odorants so the olfactory neurons can detect them.\n\nUnder the light microscope, large gland profiles are seen in the lamina propria beneath the olfactory epithelium. This secretion is different from goblet-cell mucus of the respiratory mucosa and from surfactant in alveolar lamellar bodies.","why":{"0":"Bowman's gland secretion is a proteinaceous fluid that dissolves odorants; it is not described as identical to goblet-cell mucus.","1":"Surfactant phospholipids in lamellar bodies are characteristic of type II alveolar cells.","2":"Warming inspired air is the role of the capillary loops of the respiratory lamina propria, not the described function of Bowman's glands.","3":"Lubricating the vocal ligaments is not a function of Bowman's glands, and the lamina propria of the vocal folds has no glands."},"one":"Bowman's glands secrete a proteinaceous fluid onto the olfactory mucosa that traps and dissolves odorants."},"w11_resp_histo-12":{"q":"The mucosa of the paranasal sinuses is called mucoperiosteum because:","o":["A thick submucosa with mixed salivary glands separates it from bone","The lamina propria attaches directly to periosteum, without a submucosa","The lining is keratinized stratified squamous epithelium, like skin","C-shaped hyaline cartilage rings support the walls of each sinus","Olfactory neurons and Bowman's glands that are embedded in the periosteum"],"a":1,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 13","img":[{"u":"img/w11_resp_histo/p13.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 13","w":1200,"h":675},{"u":"img/w11_resp_histo/p14.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 14","w":1200,"h":675},{"u":"img/w11_resp_histo/p15.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 15","w":1200,"h":675},{"u":"img/w11_resp_histo/p16.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 16","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"The **paranasal sinuses** are paired cavities within the **frontal**, **maxillary**, **ethmoid**, and **sphenoid** bones. They are lined by thin respiratory epithelium.\n\nBecause the lamina propria attaches **directly to the periosteum, without a submucosa**, this mucosa is called **mucoperiosteum**.\n\nThe sinuses communicate with the nasal cavity through small openings, and **cilia sweep mucus toward these openings**. On dissection specimens and coronal CT, the large maxillary sinus above the maxilla and the central nasal cavity and ethmoid air cells are clearly visible.","why":{"0":"In the sinuses there is no submucosa; the lamina propria attaches directly to the periosteum.","2":"The sinus lining is thin respiratory epithelium, not keratinized stratified squamous epithelium.","3":"C-shaped hyaline cartilage rings are a feature of the trachea, not a support of the sinuses.","4":"Olfactory neurons and Bowman's glands are in the olfactory mucosa of the nasal roof, not part of the sinus periosteum."},"one":"Sinus mucosa is mucoperiosteum (lamina propria directly on periosteum), and its cilia sweep mucus to the openings into the nasal cavity."},"w11_resp_histo-13":{"q":"The nasopharynx communicates with the tympanic cavities (middle ear) via the:","o":["Pharyngotympanic (auditory) tubes","Choanae (posterior nasal apertures)","Vestibular folds of the larynx","Cricothyroid ligament of the larynx","Vestibule of the nasal cavity"],"a":0,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 17","img":[{"u":"img/w11_resp_histo/p17.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 17","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"The **nasopharynx** communicates with the nasal cavity through the **choanae**, with the **tympanic cavities (middle ear)** through the **pharyngotympanic (auditory) tubes**, and with the **oropharynx**.\n\nThe nasopharynx is lined by respiratory epithelium and is the location of the **pharyngeal tonsil** and the **tubal tonsils**. The figure marks the pharyngeal opening of the auditory tube and the pharyngeal tonsil.\n\nThe choanae connect to the nasal cavity, and the vestibular folds and cricothyroid ligament are laryngeal structures, so none of them is the passage to the middle ear.","why":{"1":"The choanae connect the nasopharynx to the nasal cavity, not to the tympanic cavity.","2":"The vestibular folds are folds of the larynx and do not connect to the middle ear.","3":"The cricothyroid ligament connects the thyroid and cricoid cartilages in the larynx.","4":"The vestibule is the front part of the nasal cavity into which the nostrils open."},"one":"The nasopharynx communicates with the middle ear via the auditory tubes and with the nasal cavity via the choanae."},"w11_resp_histo-14":{"q":"Which laryngeal cartilages are elastic, rather than hyaline?","o":["Thyroid, cricoid, and arytenoid","Thyroid, cuneiform, and cricoid","Arytenoid, corniculate, and the cricoid","Cuneiform, corniculate, and epiglottic","Thyroid, arytenoid, and epiglottic"],"a":3,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 18","img":[{"u":"img/w11_resp_histo/p18.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 18","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"The larynx connects the pharynx and trachea and is reinforced by several cartilages.\n\nThe **hyaline cartilages** are the **thyroid**, **cricoid**, and **arytenoid**. The **elastic cartilages** are the **cuneiform**, **corniculate**, and **epiglottic**.\n\nThe epiglottis is covered by **oral epithelium** on its anterior (lingual) surface and **respiratory epithelium** on its posterior (laryngeal) surface, and its lamina propria has mixed mucous and serous glands. Memorizing thyroid/cricoid/arytenoid as elastic is a common mistake, so learn the two groups as a pair.","why":{"0":"The thyroid, cricoid, and arytenoid cartilages are hyaline.","1":"The thyroid and cricoid are hyaline; only the cuneiform is elastic.","2":"The arytenoid and cricoid are hyaline; only the corniculate is elastic.","4":"The thyroid and arytenoid are hyaline; only the epiglottis is elastic."},"one":"Elastic laryngeal cartilages: cuneiform, corniculate, epiglottic; hyaline: thyroid, cricoid, arytenoid."},"w11_resp_histo-15":{"q":"Compared with the vestibular folds, the vocal folds are covered by:","o":["Respiratory epithelium, with seromucous glands throughout the lamina propria","Olfactory epithelium, with Bowman's glands in the lamina propria","Stratified squamous epithelium, no glands, plus a vocal ligament and vocalis","Transitional epithelium and plates of hyaline cartilage","Simple squamous mesothelium continuous with the pleura"],"a":2,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 18, 19","img":[{"u":"img/w11_resp_histo/p18.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 18","w":1200,"h":675},{"u":"img/w11_resp_histo/p19.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 19","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"Two pairs of folds attach to the lateral walls of the larynx.\n\nThe **vestibular folds** are covered by **respiratory epithelium**, and their lamina propria contains **seromucous glands** (labeled as ventricular folds and mucous glands in the tissue section).\n\nThe **vocal folds** are covered by **stratified squamous epithelium**. Their lamina propria has **no glands**; instead it contains the **vocal ligament**, a dense bundle of elastic connective tissue, and the **vocalis muscle**. Vibration of the vocal ligament produces the voice.\n\nStratified squamous epithelium is suited to withstand vibration and friction, and the absence of glands keeps mucus from interfering with vibration.","why":{"0":"Respiratory epithelium and seromucous glands are features of the vestibular folds.","1":"Olfactory epithelium and Bowman's glands are features of the olfactory mucosa in the nasal roof.","3":"The laryngeal folds are not covered by transitional epithelium, and the vocal folds do not contain plates of hyaline cartilage.","4":"Simple squamous mesothelium lines the pleura and is not the epithelium of the vocal folds."},"one":"Vocal folds: stratified squamous epithelium, vocal ligament, vocalis, no glands; vestibular folds: respiratory epithelium with glands."},"w11_resp_histo-16":{"q":"Posteriorly, the C-shaped hyaline cartilage rings of the trachea are replaced by:","o":["A plate of elastic cartilage like that of the epiglottis","Striated vocalis muscle within a vocal ligament","A complete ring of compact bone","Trachealis muscle (smooth muscle)","A dense fibrous vocal ligament"],"a":3,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 20","img":[{"u":"img/w11_resp_histo/p20.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 20","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"The adult **trachea** is about **10–12 cm** long and is lined by respiratory mucosa, with seromucous glands in the lamina propria.\n\nAbout **12 C-shaped hyaline cartilage rings** in the submucosa provide rigidity so the trachea does not collapse. The open posterior ends of the rings are bridged by the **trachealis muscle (smooth muscle)**. The outermost layer is the **adventitia**.\n\nIn a cross section you can see the cartilage interrupted posteriorly and the gap filled by soft muscle tissue. The esophagus lies directly behind the trachea, and having smooth muscle instead of cartilage posteriorly allows a little expansion during swallowing.","why":{"0":"Elastic cartilage plates are a feature of the epiglottis and similar structures; the posterior gap of the tracheal rings is filled by smooth muscle.","1":"The vocalis is a striated muscle in the vocal folds, not the posterior wall of the trachea.","2":"The trachea is supported by C-shaped hyaline cartilage, not rings of bone.","4":"The vocal ligament is a bundle of elastic connective tissue in the lamina propria of the vocal folds."},"one":"Posteriorly, the C-shaped hyaline cartilage rings of the trachea are bridged by the trachealis (smooth muscle)."},"w11_resp_histo-17":{"q":"How many lobar (secondary) and segmental (tertiary) bronchi supply the right and left lungs?","o":["3 lobar and 10 segmental on the right; 2 lobar and 8 segmental on the left","2 lobar and 8 segmental on the right; 3 lobar and 10 segmental on the left","3 lobar and 8 segmental bronchi on each side","2 lobar and 10 segmental bronchi on each side","3 lobar and 10 segmental bronchi for each lung"],"a":0,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 21, 22","img":[{"u":"img/w11_resp_histo/p21.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 21","w":1200,"h":675},{"u":"img/w11_resp_histo/p22.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 22","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"The trachea divides into the right and left **primary bronchi**, one to each lung. The primary bronchi divide into **secondary (lobar) bronchi**: **3 on the right** and **2 on the left** (the right lung has 3 lobes, the left 2).\n\nEach lobar bronchus gives rise to **tertiary (segmental) bronchi**: **10 on the right** and **8 on the left**. In the figure, segments on the left combine (B1+2, B7+8), giving 8. The right upper lobe bronchus is also called the **eparterial bronchus**.\n\nThe lung unit supplied by a segmental artery and bronchus is surrounded by connective tissue septa, so it can be removed surgically without significantly damaging the surrounding healthy tissue.","why":{"1":"Right and left are reversed: lobar bronchi are 3 right, 2 left, and segmental bronchi are 10 right, 8 left.","2":"The number of lobar bronchi differs between sides (3 vs. 2), and segmental bronchi are not 8 on both sides.","3":"There are not 2 lobar bronchi on each side, nor 10 segmental bronchi on each side.","4":"Each lung does not have 3 lobes and 10 segments; the left has 2 lobes and 8 segments."},"one":"Lobar bronchi: right 3, left 2; segmental bronchi: right 10, left 8."},"w11_resp_histo-18":{"q":"As bronchi decrease in diameter, which wall change occurs?","o":["Cartilage, glands, and goblet cells increase, while smooth muscle decreases","Epithelial cell height increases, while elastic tissue disappears from the wall","Cartilage, glands, goblet cells, and cell height fall; muscle and elastin rise","Smooth muscle and elastic tissue vanish as soon as bronchi are formed","The epithelium changes abruptly into the mesothelium of the pleura"],"a":2,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 23","img":[{"u":"img/w11_resp_histo/p23.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 23","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"As bronchi get smaller, the components of their wall change in a systematic way.\n\nWhat **decreases**: the **amount of cartilage**, the **number of glands**, the **number of goblet cells**, and the **height of the epithelial cells**. Conversely, the **relative amount of smooth muscle** and **elastic tissue** **increases**.\n\nThis trend continues so that in bronchioles (< 1 mm) mucosal glands and cartilage are absent, and the epithelium shortens from pseudostratified ciliated columnar to simple columnar to simple cuboidal. The relative increase in smooth muscle and elastic fibers is important for controlling small-airway diameter and for elastic recoil during expiration.","why":{"0":"Cartilage, glands, and goblet cells decrease as diameter decreases, while relative smooth muscle increases.","1":"Epithelial cell height decreases, and elastic tissue does not disappear; it increases relatively.","3":"As diameter decreases, relative smooth muscle and elastic tissue actually increase.","4":"The bronchial epithelium only transitions from respiratory epithelium to a lower epithelium; it does not become pleural mesothelium."},"one":"As bronchi narrow, cartilage, glands, goblet cells, and epithelial height decrease, while relative smooth muscle and elastic tissue increase."},"w11_resp_histo-19":{"q":"Club (Clara) cells of bronchioles perform all of the following functions EXCEPT:","o":["Secreting surfactant onto the bronchiolar surface","Detoxifying inhaled xenobiotic compounds using enzymes in the SER","Secreting antimicrobial peptides and cytokines","Serving as a stem-cell subpopulation that undergoes mitosis","Forming C-shaped hyaline cartilage plates in the bronchiolar wall"],"a":4,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 24","img":[{"u":"img/w11_resp_histo/p24.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 24","w":1200,"h":675},{"u":"img/w11_resp_histo/p27.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 27","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"**Bronchioles** are the terminal branches of the bronchi, less than **1 mm** in diameter, and **lack mucosal glands and cartilage**. The epithelium transitions from pseudostratified ciliated columnar to simple columnar to simple cuboidal.\n\n**Club (Clara) cells** are exocrine bronchiolar cells that **secrete surfactant**, **detoxify inhaled xenobiotics** with enzymes of the smooth ER (SER), **secrete antimicrobial peptides and cytokines**, and act as a **stem-cell subpopulation** that produces new cells. Bronchioles also contain brush cells and DNES small granule cells.\n\nThe absence of cartilage is a defining feature of bronchioles, so the statement that club cells form C-shaped cartilage plates is false. In tissue sections, club cells appear as cells bulging into the lumen (labeled C).","why":{"0":"Club cells do secrete surfactant; this is one of their functions.","1":"The SER enzymes of club cells detoxify inhaled xenobiotics.","2":"Club cells secrete antimicrobial peptides and cytokines.","3":"Some club cells are stem cells that divide by mitosis to produce new cells."},"one":"Bronchioles lack cartilage and mucosal glands; club cells handle surfactant, detoxification, antimicrobial defense, and stem-cell functions."},"w11_resp_histo-20":{"q":"The histologic feature that distinguishes a respiratory bronchiole from a terminal bronchiole is the presence of:","o":["A complete loss of the surrounding muscle layer","Alveoli that open directly into its wall","C-shaped hyaline cartilage rings in the wall","A lining made entirely of type I pneumocytes","Mucosal glands in the lamina propria"],"a":1,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 25, 26","img":[{"u":"img/w11_resp_histo/p25.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 25","w":1200,"h":675},{"u":"img/w11_resp_histo/p26.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 26","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"**Terminal bronchioles** are the **smallest bronchioles without gas exchange**. **Respiratory bronchioles** have **alveoli opening into their walls** and form the transition between the conducting and respiratory portions.\n\n**Alveolar ducts** have walls made entirely of alveoli, and **alveolar sacs** are at the ends of alveolar ducts and consist of alveoli.\n\nIn a microscopic comparison, the terminal bronchiole shows a continuous simple columnar epithelium and a muscle layer, while the respiratory bronchiole shows alveoli opening directly into its wall. A muscle layer is still present in respiratory bronchioles.","why":{"0":"Respiratory bronchioles still have a muscle layer; complete loss of muscle is not the distinguishing feature.","2":"Bronchioles (both terminal and respiratory) have no cartilage; C-shaped rings are a feature of the trachea.","3":"The epithelium of a respiratory bronchiole is still bronchiolar; parts of the wall open into alveoli, but it is not entirely type I cells.","4":"Bronchioles have no mucosal glands; glands are a feature of more proximal airways."},"one":"Alveoli opening into the wall distinguish a respiratory bronchiole from a terminal bronchiole."},"w11_resp_histo-21":{"q":"Interalveolar septa that separate adjacent alveoli are formed of:","o":["Hyaline cartilage plates together with seromucous glands","Fibroblasts and a sparse ECM of reticular and elastic fibers","Dense irregular collagen together with skeletal muscle bundles","A complete smooth-muscle coat and club cells","Stratified squamous epithelium and a vocal ligament"],"a":1,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 28","img":[{"u":"img/w11_resp_histo/p28.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 28","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"**Alveoli** are small air sacs about **200 µm** in diameter that bulge from respiratory bronchioles, alveolar ducts, and alveolar sacs, giving the lung its spongy structure. An adult lung has about **200 million** alveoli with a surface area of about **75 m²**.\n\nAlveoli are surrounded by capillary networks for gas exchange. The **interalveolar septa** separating adjacent alveoli consist of **fibroblasts** and a **sparse extracellular matrix** of reticular and elastic fibers. Small **alveolar pores** allow air to pass between neighboring alveoli.\n\nCartilage, glands, skeletal muscle, and vocal ligaments are not components of the alveolar septa.","why":{"0":"Hyaline cartilage and seromucous glands characterize the walls of the trachea and large bronchi, not alveolar septa.","2":"Alveolar septa are not made of dense collagen and skeletal muscle.","3":"The septa contain a few cells and elastic/reticular fibers, not a complete smooth muscle coat and club cells.","4":"Stratified squamous epithelium and a vocal ligament are features of the vocal folds."},"one":"Interalveolar septa are a sparse matrix of fibroblasts with reticular and elastic fibers; alveolar pores connect neighboring alveoli."},"w11_resp_histo-22":{"q":"Type I alveolar cells (type I pneumocytes) are best described as:","o":["Cuboidal cells whose cytoplasm is filled with lamellar bodies of surfactant","Phagocytes confined to the connective tissue of the interalveolar septa","Ciliated columnar cells that form the lining of respiratory bronchioles","Very thin simple squamous cells (to 25 nm) that also pinocytose particles","Stem cells that rest on a basal lamina different from that of type II cells"],"a":3,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 29","img":[{"u":"img/w11_resp_histo/p29.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 29","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"The alveolar wall is made mostly of **type I pneumocytes (type I alveolar cells)**. These are extremely thin **simple squamous cells**: their organelles cluster around the nucleus, and the rest of the cytoplasm thins to as little as **25 nm**. This thinness promotes gas diffusion.\n\n**Pinocytosis** by type I cells also helps remove some surfactant and small particulate contaminants.\n\nType II cells are cuboidal, contain lamellar bodies, and share the same basal lamina and origin. Alveolar macrophages are the main phagocytes.","why":{"0":"Cuboidal cells with lamellar bodies are type II alveolar cells.","1":"Phagocytosis is mainly the job of alveolar macrophages (dust cells), which are found both inside the alveoli and in the septa.","2":"Ciliated columnar cells characterize the respiratory epithelium of more proximal airways.","4":"Type I and type II cells rest on the same basal lamina and share an origin, and type I cells are not described as stem cells."},"one":"Type I alveolar cells are simple squamous cells as thin as 25 nm that also remove some surfactant and particles by pinocytosis."},"w11_resp_histo-23":{"q":"Type II alveolar cells (type II pneumocytes):","o":["Are cuboidal, bulge into the air space, share type I origin, and have lamellar bodies","Are thin simple squamous cells that form most of the alveolar blood-air barrier itself","Are macrophages known as dust cells and occur only inside the alveolar lumen","Line the visceral pleura as a layer of simple squamous mesothelium","Form the fused basal lamina that belongs only to capillary endothelial cells"],"a":0,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 30, 31","img":[{"u":"img/w11_resp_histo/p30.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 30","w":1200,"h":675},{"u":"img/w11_resp_histo/p31.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 31","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"**Type II alveolar cells (type II pneumocytes)** are more **cuboidal** and **bulge** into the alveolar air space. They sit on the **same basal lamina** as type I cells and **share their origin**.\n\nTheir cytoplasm contains **lamellar bodies**, whose lipids, phospholipids, and proteins make up **pulmonary surfactant**. Surfactant **lowers surface tension** in the alveolar sacs and helps prevent collapse. The synthetic pathway includes phosphatidylcholine synthesis and maturation of lamellar bodies via the Golgi.\n\n**Alveolar macrophages (dust cells)** are separate phagocytes found both in the alveoli and in the interalveolar septa.","why":{"1":"The thin simple squamous cells that form most of the barrier are type I alveolar cells.","2":"Dust cells are alveolar macrophages, found both in the alveoli and the septa; they are not type II cells.","3":"The lining of the visceral pleura is mesothelium, not type II alveolar cells.","4":"The fused basal lamina is formed by the merged basal laminae of type I cells and endothelial cells; it is not a structure unique to type II cells."},"one":"Type II cells are cuboidal, make surfactant in lamellar bodies, and share a basal lamina and origin with type I cells."},"w11_resp_histo-24":{"q":"From alveolar air to capillary blood, the blood-air barrier includes which of the following layers?","o":["Type II cell cytoplasm, a thick unfused basal lamina, and a club-cell sheet","Alveolar macrophage cytoplasm, elastic fibers, and a surrounding pericyte layer","Ciliated epithelium, a submucosal gland, and a coat of arteriolar smooth muscle","Type I cell membranes alone, without any endothelial contribution","Type I alveolar cell, fused basal laminae, and endothelium (plus surfactant)"],"a":4,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 32","img":[{"u":"img/w11_resp_histo/p32.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 32","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"For O2 and CO2 to be exchanged in the alveoli, both gases must cross the **blood-air barrier**, which consists of:\n\n① the membrane and cytoplasm of the **type I alveolar cell**, ② the **fused basal lamina** of the type I cell and the endothelial cell, and ③ the membrane and cytoplasm of the **endothelial cell**. The **surfactant layer** on the alveolar surface can be added to this.\n\nOn electron microscopy, between the alveolus (A) and the capillary (C) you can see the type I cell (I), the fused basal lamina (B), and the endothelial cell (E). Type II cells, macrophages, ciliated epithelium, and glands are not layers of this thin diffusion barrier.","why":{"0":"The epithelial component of the barrier is the type I cell, and the basal lamina is fused, not a thick unfused layer.","1":"Macrophages, elastic fibers, and pericytes are not listed among the three layers of the blood-air barrier.","2":"Ciliated epithelium, submucosal glands, and arteriolar smooth muscle are structures of proximal airway walls.","3":"The barrier must include the membrane and cytoplasm of the endothelial cell."},"one":"Blood-air barrier = type I alveolar cell, fused basal laminae, and endothelium, plus the surfactant layer."},"w11_resp_histo-25":{"q":"Most of the blood supplied by the bronchial arteries leaves the lungs by way of the:","o":["Bronchial veins that drain the entire lung parenchyma","Azygos vein exclusively, without any pulmonary venous return","Pulmonary veins returning blood toward the left atrium","Thoracic duct carrying lymph to the venous angle","Superior vena cava directly from the alveolar capillary bed"],"a":2,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 33","img":[{"u":"img/w11_resp_histo/p33.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 33","w":1200,"h":675},{"u":"img/w11_resp_histo/p34.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 34","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"In the **bronchial circulation**, the bronchial arteries are small branches of the aorta that follow the bronchial tree and supply nutrient blood to the walls of the bronchi and bronchioles and to the lung connective tissue. They anastomose with pulmonary vessels where the conducting portion transitions into the respiratory portion.\n\nThe key point is that **bronchial veins drain only the connective tissue of the hilar region**; **most** of the blood brought in by the bronchial arteries leaves the lungs through the **pulmonary veins**.\n\nSo pulmonary venous blood returning to the left atrium contains a small amount of bronchial arterial (systemic) blood.","why":{"0":"Bronchial veins drain only the hilar connective tissue, not the entire lung parenchyma.","1":"The azygos vein is part of the thoracic venous system (posterior intercostal veins and others) and is not described as the main outlet for bronchial arterial blood.","3":"The thoracic duct is a lymphatic channel, not an outlet for bronchial arterial blood.","4":"Blood from alveolar capillaries enters the left atrium via the pulmonary veins; it does not go directly to the superior vena cava."},"one":"Most bronchial arterial blood leaves via the pulmonary veins; bronchial veins drain only hilar connective tissue."},"w11_resp_histo-26":{"q":"Which statement about the pulmonary circulation is correct?","o":["Pulmonary venules travel in the same connective-tissue sheath as the bronchioles","Pulmonary arteries arise as tiny direct branches of the thoracic aorta","Capillary networks first appear around the walls of terminal bronchioles","Bronchial arteries never accompany the branches of the bronchial tree","Arterial branching follows the bronchi; pulmonary venules travel separately"],"a":4,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 33","img":[{"u":"img/w11_resp_histo/p33.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 33","w":1200,"h":675},{"u":"img/w11_resp_histo/p34.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 34","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"In the **pulmonary circulation**, the branches of the pulmonary arteries **follow the same branching pattern as the bronchi**. At the level of the **alveolar ducts**, the pulmonary arterioles give rise to dense capillary networks surrounding the alveoli. In contrast, **pulmonary venules run separately from the arterioles and bronchioles**.\n\nThe figure also shows the pulmonary arteries following the bronchial tree while the pulmonary veins converge separately on the left atrium. The vessels that arise from the aorta and nourish the bronchial walls are the bronchial arteries.","why":{"0":"Pulmonary venules run separately from the arterioles and bronchioles.","1":"The small branches arising from the aorta are bronchial arteries; the pulmonary arteries come from the pulmonary trunk.","2":"The dense capillary networks surround the alveoli at the level of the alveolar ducts; they are not said to first appear at the terminal bronchioles.","3":"Bronchial arteries do follow the branches of the bronchial tree and supply the bronchial walls."},"one":"Pulmonary arteries branch along with the bronchi; pulmonary venules travel separately."},"w11_resp_histo-27":{"q":"Lymphatic drainage of the lungs is organized as:","o":["A single set of lymphatic vessels that begins in the alveolar air space itself","Drainage only along the pulmonary veins into the thoracic duct","A bronchial-tree path to hilar nodes and a second path along visceral pleura","Direct emptying into the pleural cavity, without any nodal stations","Lymphatics that begin in the nasal mucosa and skip the pulmonary hilum"],"a":2,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 35, 36","img":[{"u":"img/w11_resp_histo/p35.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 35","w":1200,"h":675},{"u":"img/w11_resp_histo/p36.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 36","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"Lymphatic drainage of the lung is organized into **two sets**. One set **begins in the connective tissue of the bronchioles** and follows the bronchial tree back to the lymph nodes at the **hilum**. The other set **drains the surface regions** of the lung and follows the **visceral pleura**.\n\nThe figure labels the subpleural lymphatic plexus, interlobular lymphatics, intrapulmonary (pulmonary) nodes, **bronchopulmonary (hilar) nodes**, inferior and superior **tracheobronchial nodes (including the carinal nodes)**, **paratracheal nodes**, inferior deep cervical (scalene) nodes, and the thoracic duct. Drainage follows the bronchi, arteries, and veins.","why":{"0":"Lymphatics begin in the connective tissue of the bronchioles and elsewhere, not in the alveolar air space, and there is more than one set.","1":"Drainage has two paths: along the bronchial tree to the hilar nodes and along the visceral pleura.","3":"Lymph passes through nodal stations such as the hilar nodes; it does not empty directly into the pleural cavity.","4":"Lung lymph begins within the lung and converges on the hilum; it does not start in the nasal mucosa and skip the hilum."},"one":"Lung lymph drains along the bronchial tree to the hilar nodes and along the visceral pleura."},"w11_resp_histo-28":{"q":"Innervation that controls the diameter of pulmonary airways and blood vessels is provided by:","o":["Somatic motor fibers that arise from the intercostal nerves","Sympathetic and parasympathetic fibers that follow the bronchial tree","Special visceral afferent fibers that originate in the olfactory bulb","Parasympathetic fibers of the phrenic nerve acting alone","Sympathetic fibers that terminate only in the vocalis muscle"],"a":1,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 35, 36","img":[{"u":"img/w11_resp_histo/p35.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 35","w":1200,"h":675},{"u":"img/w11_resp_histo/p36.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 36","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"In the innervation of the lung, **sympathetic and parasympathetic** fibers supply smooth muscle and glands and control the **diameter of the airways and blood vessels**. **General visceral afferent fibers** carry pain sensation. These nerves follow the bronchial tree and **leave at the hilum**.\n\nThe figure labels the vagus nerve (X), the anterior and posterior pulmonary plexuses, the sympathetic trunk, and the 6th thoracic sympathetic ganglion. The intercostal nerves relate to the chest wall, the phrenic nerve to the diaphragm, and olfactory afferents to smell; none is the main pathway controlling airway diameter.","why":{"0":"Somatic motor fibers of the intercostal nerves supply the intercostal muscles, not autonomic control of airway smooth muscle.","2":"Special visceral afferent fibers of the olfactory bulb are the olfactory pathway and do not control airway diameter.","3":"The phrenic nerve mainly supplies the diaphragm; the parasympathetic source for the pulmonary plexus is the vagus nerve.","4":"The vocalis is a skeletal muscle of the larynx, not the target of the autonomic nerves that control airway and vessel diameter."},"one":"Airway and vessel diameter in the lung is controlled by sympathetic and parasympathetic fibers that follow the bronchial tree through the hilum."},"w11_resp_histo-29":{"q":"Pleurisy is best defined as:","o":["Excess serous fluid in the pleural space from oversecretion by pleural cells","Fusion of the visceral and parietal pleura only at the lung apex","Keratinization of the pleural mesothelium after chronic irritation","Inflammation of the pleura, a very painful condition","Alveolar collapse caused by a deficiency of pulmonary surfactant"],"a":3,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 37, 38, 39","img":[{"u":"img/w11_resp_histo/p37.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 37","w":1200,"h":675},{"u":"img/w11_resp_histo/p38.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 38","w":1200,"h":675},{"u":"img/w11_resp_histo/p39.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 39","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"The **pleura** is **mesothelium (simple squamous epithelium)** covering the inner wall of the thoracic cavity (**parietal pleura**) and the outer surface of the lung (**visceral pleura**). The two layers are **continuous at the hilum**, and the space between them is the **pleural cavity**.\n\nThe pleura is a **serous membrane** that secretes lubricating serous fluid so the two layers can glide. **Inflammation of the pleura** is a very painful condition called **pleurisy**. If pleural cells oversecrete fluid in a disease state, the result is a **pleural effusion**.\n\nSo distinguish inflammation (pleurisy) from excess fluid (effusion).\n\nThe parietal pleura is subdivided by location into **costal**, **diaphragmatic**, and **mediastinal pleura**, among others; reflecting the costal pleura reveals these regions along with the lines of reflection.","why":{"0":"Excess serous fluid is a pleural effusion, not the definition of pleurisy.","1":"The two layers are simply continuous at the hilum; adhesion at the apex is not the definition of pleurisy.","2":"Keratinization of the pleural mesothelium is not given as the definition of pleurisy.","4":"Alveolar collapse from surfactant deficiency is associated with neonatal respiratory distress and is not pleurisy."},"one":"Pleurisy is a very painful inflammation of the pleura; excess fluid is a pleural effusion."},"w11_resp_histo-30":{"q":"During quiet breathing, expiration occurs primarily because of:","o":["Passive recoil of the lungs and rib cage","Contraction of the sternocleidomastoid and scalene muscles","Contraction of the external intercostal muscles","Active descent of the domes of the diaphragm","Contraction of the interchondral part of the internal intercostals"],"a":0,"src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 40, 41","img":[{"u":"img/w11_resp_histo/p40.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 40","w":1200,"h":675},{"u":"img/w11_resp_histo/p41.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 41","w":1200,"h":675}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11,"exp":"The **prime muscle of respiration is the diaphragm**. When it contracts it descends, increasing thoracic volume and creating negative pressure that draws air in; when it relaxes, thoracic volume decreases and positive pressure pushes air out.\n\n**Expiration during quiet breathing** occurs by **passive recoil of the lungs and rib cage**. The prime muscles of inspiration are the diaphragm, the external intercostals, and the interchondral part of the internal intercostals.\n\nThe accessory muscles of forced inspiration are the **sternocleidomastoid** and the **scalenes**. Forced expiration recruits the internal intercostals (except the interchondral part) and the rectus abdominis, external and internal obliques, and transversus abdominis.","why":{"1":"The sternocleidomastoid and scalenes are accessory muscles of forced inspiration.","2":"The external intercostals elevate the ribs, increasing the transverse diameter of the chest during inspiration.","3":"Descent of the diaphragmatic domes increases the vertical diameter during inspiration.","4":"The interchondral part of the internal intercostals elevates the ribs and is a prime muscle of inspiration."},"one":"Quiet expiration is passive recoil of the lungs and rib cage; the diaphragm is the prime muscle of inspiration."},"w11_thorax-1":{"q":"A distinctive feature of thoracic vertebrae, compared with typical cervical or lumbar vertebrae, is the presence of:","o":["A bifid spinous process and transverse foramina","Articular facets for ribs","Massive kidney-shaped bodies without costal facets","A dens (odontoid process) on the vertebral body","Absence of a vertebral foramen"],"a":1,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 3","img":[{"u":"img/w11_thorax/p02.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 2","w":1200,"h":900},{"u":"img/w11_thorax/p03.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 3","w":1200,"h":900},{"u":"img/w11_thorax/p04.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 4","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"The skeleton of the thoracic cage includes **12 thoracic vertebrae (T1–T12)**. The key feature that distinguishes thoracic vertebrae from cervical and lumbar vertebrae is the presence of **articular facets for ribs**.\n\nFor thoracic vertebrae, the transverse processes, spinous processes, and rib facets are emphasized. The spinous processes are often long and point downward, and the transverse processes also have facets that articulate with the rib tubercles. A labeled specimen shows the body, pedicle, lamina, spinous process, vertebral foramen, and the inferior and superior vertebral notches; the **superior vertebral notch forms the lower margin of the intervertebral foramen**.","why":{"0":"A bifid spinous process and transverse foramina are features of a typical cervical vertebra.","2":"Large, kidney-shaped bodies without costal facets fit lumbar vertebrae.","3":"The dens is a feature of the axis (C2).","4":"Thoracic vertebrae also have a vertebral foramen through which the spinal cord passes."},"one":"Thoracic vertebrae (T1–T12) are distinguished by articular facets for the ribs."},"w11_thorax-2":{"q":"A typical rib articulates with the vertebral column at which sites?","o":["Only the vertebral body of the same-numbered thoracic vertebra itself","The xiphoid process together with the manubrium of the sternum","A single transverse process of a lumbar vertebra","Two thoracic vertebrae (head) and a transverse process (tubercle)","The spinous processes of two adjacent thoracic vertebrae"],"a":3,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 5, 6","img":[{"u":"img/w11_thorax/p05.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 5","w":1200,"h":900},{"u":"img/w11_thorax/p06.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 6","w":1200,"h":900},{"u":"img/w11_thorax/p09.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 9","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"A typical rib articulates with **two thoracic vertebrae**. The **head** articulates with the demifacets (superior and inferior facets) on the bodies of two adjacent thoracic vertebrae, and the articular facet of the **tubercle** forms the **costotransverse joint** with the transverse process.\n\nIn the lateral and slightly oblique figures, two arrows at the head and one at the transverse process point to these three articular points. A typical rib is labeled with the head (with superior and inferior facets for the vertebral bodies), neck, facet for the transverse process, angle, and costal groove.","why":{"0":"The head of a typical rib articulates not only with the same-numbered vertebra but with the bodies of two adjacent vertebrae.","1":"The xiphoid process and manubrium are parts of the sternum, not the vertebral articulations of a rib.","2":"A typical rib articulates with the transverse process of a thoracic vertebra, not a lumbar vertebra.","4":"Ribs do not articulate with spinous processes."},"one":"The head of a typical rib articulates with two thoracic vertebrae, and the tubercle with a transverse process."},"w11_thorax-3":{"q":"Ribs 8–10 are classified as:","o":["False ribs","True ribs","Floating ribs","Cervical ribs","Atypical first ribs"],"a":0,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 7","img":[{"u":"img/w11_thorax/p07.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 7","w":1200,"h":900},{"u":"img/w11_thorax/p11.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 11","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"There are **12 pairs** of ribs. **Ribs 1–7** are **true ribs**, attaching to the sternum by their own costal cartilages. **Ribs 8–10** are **false ribs**: their cartilages join the costal cartilage above, so they connect to the sternum indirectly. **Ribs 11 and 12** are **floating ribs** and have no anterior connection to the sternum.\n\nIn the figure, the costal cartilages link the true and false ribs toward the sternum, and ribs 11 and 12 are indicated without an anterior connection. The first and second ribs are separately called **atypical ribs**.","why":{"1":"The true ribs are ribs 1–7.","2":"The floating ribs are ribs 11 and 12.","3":"A cervical rib is an anomaly found in about 0.2% of people, not the normal classification of ribs 8–10.","4":"The atypical first (and second) ribs refer to rib 1 (and rib 2)."},"one":"Ribs 1–7 are true ribs, 8–10 false ribs, and 11–12 floating ribs."},"w11_thorax-4":{"q":"The manubriosternal joint is classified as a:","o":["Synovial plane joint","Synchondrosis","Syndesmosis","Gomphosis","Symphysis"],"a":4,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 8","img":[{"u":"img/w11_thorax/p08.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 8","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"The joints of the anterior thoracic cage are of different types. In the figure, **symphysis** labels the joint between the manubrium and the body, that is, the **manubriosternal joint (sternal angle)**.\n\n**Synchondroses** are labeled at the first rib–sternum junction and the xiphoid–body (xiphisternal) junction. The lower sternocostal junctions are labeled as **synovial joints**.\n\nSo the sternal angle is a symphysis, not a synovial joint or a primary synchondrosis.","why":{"0":"In the figure, synovial joints label the lower sternocostal junctions; the manubriosternal joint is a symphysis.","1":"Synchondroses correspond to the first sternocostal junction and the xiphisternal junction.","2":"Syndesmosis is not the classification of the manubriosternal joint.","3":"A gomphosis is the joint type between a tooth and the alveolar bone."},"one":"The manubriosternal joint is a symphysis; the first sternocostal and xiphisternal joints are synchondroses."},"w11_thorax-5":{"q":"On a typical rib, the costal groove is located along the:","o":["Superior border of the neck","Articular facet of the tubercle","Inferior aspect of the shaft","Head, between the two articular facets","Sternal end of the costal cartilage"],"a":2,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 9","img":[{"u":"img/w11_thorax/p09.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 9","w":1200,"h":900},{"u":"img/w11_thorax/p25.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 25","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"A typical rib has a **head** with **superior and inferior facets** for the vertebral bodies, a **neck**, an **articular facet on the tubercle** for the transverse process, an **angle**, and a **costal groove**.\n\nThe costal groove lies along the **inferior aspect of the shaft (its inner lower border)**, and the **intercostal vein, artery, and nerve (VAN)** run in it. That is why a needle for thoracentesis is passed just over the upper border of a rib, avoiding the neurovascular bundle in the groove.","why":{"0":"There is no costal groove on the upper border of the neck; the groove is on the lower aspect of the shaft.","1":"The facet of the tubercle is where the rib articulates with the transverse process.","3":"The two facets on the head articulate with the adjacent vertebral bodies.","4":"The sternal end of the costal cartilage is not where the costal groove is."},"one":"The costal groove lies on the inferior aspect of the rib shaft, and the VAN runs in it."},"w11_thorax-6":{"q":"A cervical rib is an anatomic anomaly present in about:","o":["20% of all people","2% of people","10% of people","50% of people","0.2% of people"],"a":4,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 10","img":[{"u":"img/w11_thorax/p10.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 10","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"A **cervical rib** is an extra rib arising from a cervical vertebra (usually C7); it is an anomaly present in about **0.2%** of people.\n\nIn the figure, the arrow points to the trunks of the brachial plexus passing over an extra rib arising near the seventh cervical vertebra. Although rare, it matters as an anatomic variant because, when present, it can compress nerves and vessels at the superior thoracic outlet.\n\n20%, 10%, 2%, and 50% are not the frequencies given for this anomaly.","why":{"0":"20% is far higher than the stated frequency; this anomaly occurs in about 0.2%.","1":"2% is also larger than the stated 0.2%.","2":"10% is not the stated frequency.","3":"50%, half of all people, is not the frequency of this anomaly."},"one":"A cervical rib is an anomaly in about 0.2% of people and can lie next to the brachial plexus."},"w11_thorax-7":{"q":"The three parts of the sternum are the:","o":["Manubrium, body, and xiphoid","Manubrium, sternal angle, and costal margin","Body, sternal angle, and clavicle","Xiphoid, costal cartilage, and pedicle","Manubrium, lamina, and spinous process"],"a":0,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 12","img":[{"u":"img/w11_thorax/p11.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 11","w":1200,"h":900},{"u":"img/w11_thorax/p12.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 12","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"The **sternum** has three parts: the **manubrium**, the **body**, and the **xiphoid**.\n\nThe manubrium is superior (connected to the clavicles and first ribs), the body is in the middle, and the xiphoid is the lower tip. Between the manubrium and body is the sternal angle, which, as noted earlier, is a symphysis.\n\nIn the same skeletal unit, the first and second ribs are presented separately as **atypical ribs**. The sternal angle, costal margin, clavicle, and vertebral structures are not the three parts of the sternum.","why":{"1":"The sternal angle and costal margin are landmarks and boundaries, not the three parts of the sternum itself.","2":"The sternal angle and the clavicle are not the three parts of the sternum.","3":"Costal cartilage and the vertebral pedicle are not parts of the sternum.","4":"The lamina and spinous process are parts of a vertebra."},"one":"The sternum consists of three parts: manubrium, body, and xiphoid."},"w11_thorax-8":{"q":"The muscles of the thoracic wall consist of which three layers of intercostal muscles?","o":["External oblique, internal oblique, and transversus abdominis","Scalenes, sternocleidomastoid, and transversus thoracis","External, internal, and innermost intercostals","External intercostals, diaphragm, and rectus abdominis","Subcostals, vocalis, and trachealis"],"a":2,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 13","img":[{"u":"img/w11_thorax/p13.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 13","w":1200,"h":900},{"u":"img/w11_thorax/p14.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 14","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"The muscles of the thoracic wall consist of three layers of **intercostal muscles**: from outside in, the **external intercostals**, the **internal intercostals**, and the **innermost intercostals**.\n\nA transverse section shows each layer, along with the internal intercostal membrane deep to the external intercostals, the external intercostal membrane anteriorly, and the **transversus thoracis**, which belongs to the innermost layer. The intercostal neurovascular bundle runs between the internal and innermost layers.\n\nThe three abdominal muscle layers are the corresponding layers of the abdominal wall, and the diaphragm and neck accessory muscles are not the three intercostal layers.","why":{"0":"These are the three layers of the abdominal wall, not the three intercostal layers of the thoracic wall.","1":"The scalenes and sternocleidomastoid are accessory inspiratory muscles, and the transversus thoracis is just part of the innermost layer.","3":"The diaphragm and rectus abdominis are important respiratory muscles but not the three intercostal layers.","4":"The subcostals are part of the innermost layer, but the vocalis and trachealis are not intercostal layers."},"one":"The thoracic wall has three
