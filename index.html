,"week":11,"exp":"The most heavily marked note for *Klebsiella* pneumonia is **dark-red bloody sputum, the so-called \"currant jelly\" sputum = classic question**.\n\nIt often causes pneumonia with abscesses, ranked **1° liver, 2° lungs**. The large polysaccharide capsule is its main virulence factor; it occurs mostly in patients with underlying disease, alcoholism, or impaired lung function, and it can also cause UTIs. It is a typical pneumonia.","why":{"0":"Rusty sputum is a pneumococcal finding, and the top site of *Klebsiella* abscesses is the liver, not bone.","2":"Whooping cough is *B. pertussis*.","3":"A dry cough is emphasized for intracellular organisms (e.g., *Legionella*), and the kidney is not the top abscess site.","4":"Bull neck is a diphtheria finding, and no abscess ranking of spleen and brain is given."},"one":"The classic Klebsiella finding is currant jelly sputum, with abscesses 1° in the liver and 2° in the lungs."},"w11_resp_inf-18":{"q":"Mycobacterium avium and Mycobacterium intracellulare are identified as which group?","o":["The two organisms used to manufacture the BCG vaccine.","Obligate human parasites that never exist in the environment.","Nontuberculous (atypical) mycobacteria.","The only mycobacteria that grow on Lowenstein-Jensen medium.","The causative agents of tuberculoid and lepromatous leprosy."],"a":2,"src":"6b. Respiratory Infections (handwritten).pdf, slide 51","img":[{"u":"img/w11_resp_inf/p51.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 51","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Among the mycobacteria, ***M. tuberculosis* and *M. leprae*** are starred as the causes of the two most important diseases. Separately, ***M. avium*** and ***M. intracellulare*** are linked by underline and arrow to **nontuberculous mycobacteria**, i.e., atypical mycobacteria.\n\nTogether they are called the *Mycobacterium avium* complex (MAC); they are widespread in the environment and cause opportunistic infections in AIDS.","why":{"0":"The BCG vaccine is made from *M. bovis*, not *M. avium* or *M. intracellulare*.","1":"These organisms are actually opportunists widely distributed in the environment (air, soil, water).","3":"Lowenstein-Jensen (or Middlebrook) medium is the starred medium for culturing *M. tuberculosis*; it is not that only these two grow on it.","4":"Leprosy has a single cause, *M. leprae*."},"one":"M. avium and M. intracellulare are nontuberculous (atypical) mycobacteria (MAC)."},"w11_resp_inf-19":{"q":"Mycobacterium tuberculosis is boxed and starred as having which morphologic and physiologic properties?","o":["A gram-positive diplococcus that is a facultative anaerobe.","A wall-less organism that requires cholesterol for growth.","A gram-negative intracellular pathogen found in bird feces.","A slender, slightly bent rod that is an obligate aerobe (needs O2).","A motile aquatic bacillus that lives inside amoebae."],"a":3,"src":"6b. Respiratory Infections (handwritten).pdf, slide 53","img":[{"u":"img/w11_resp_inf/p53.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 53","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"*M. tuberculosis* is **slender, rod-shaped, and slightly bent**, and it is an **obligate aerobe (needs O₂)**. These two features are boxed and starred. It is nonmotile, does not form spores, and grows in clumps and serpentine cords.\n\nIts lipid-rich cell wall resists Gram staining, and once stained it is not easily decolorized by acid solvents, so it is an **acid-fast bacillus (Ziehl-Neelsen)**. Its need for oxygen ties in with why it favors the oxygen-rich upper lobes of the lung.","why":{"0":"Gram-positive diplococcus and facultative anaerobe describe *S. pneumoniae*.","1":"The wall-less organism that requires cholesterol is *Mycoplasma*.","2":"The gram-negative intracellular pathogen from bird feces is *C. psittaci*.","4":"The motile aquatic bacillus living inside amoebae is *Legionella*."},"one":"M. tuberculosis is a slender, slightly bent rod and an obligate aerobe that needs oxygen."},"w11_resp_inf-20":{"q":"Which sequence matches the acid-fast stain figure, and how do the organisms appear afterward?","o":["Heat-fix first, then methylene blue, acid alcohol, and carbolfuchsin; both appear blue.","Methylene blue for 30 s, then heat-fix, then carbolfuchsin; both remain colorless.","Acid alcohol first, then carbolfuchsin, heat-fix, and crystal violet; both appear purple.","Gram’s iodine, alcohol decolorization, then safranin; acid-fast organisms appear pink.","Carbolfuchsin for 30 s, heat-fix with flame, acid-alcohol for 15–20 s, then methylene blue for 30 s; acid-fast organisms stay red and non-acid-fast organisms stain blue."],"a":4,"src":"6b. Respiratory Infections (handwritten).pdf, slide 55","img":[{"u":"img/w11_resp_inf/p55.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 55","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"The sequence in the acid-fast stain figure is:\n\n1. Apply the primary stain, **carbolfuchsin (spelled \"carbolfuschin\" on the slide), for 30 s**.\n2. **Heat-fix the cells on the slide with a flame.**\n3. **Decolorize with acid alcohol for 15–20 s.**\n4. Apply the counterstain, **methylene blue, for 30 s**, then rinse off excess stain.\n\nAcid-fast organisms retain carbolfuchsin and stay **red/pink**; non-acid-fast organisms are decolorized and then stain **blue** with methylene blue. Because of the lipid-rich cell wall, once stained the organisms are not easily decolorized by acid solvents.","why":{"0":"The order doesn't match the figure, and acid-fast organisms stay red, not blue.","1":"Methylene blue is not the primary stain, and the organisms don't both remain colorless.","2":"Acid alcohol is not the first step, and crystal violet is not a reagent in this figure.","3":"This is the Gram stain sequence (iodine, alcohol, safranin), not the acid-fast stain."},"one":"Acid-fast stain: carbolfuchsin → heat-fix → acid-alcohol decolorization → methylene blue; acid-fast organisms are red, non-acid-fast are blue."},"w11_resp_inf-21":{"q":"Cord factor, boxed with the instruction “know both terms,” is which molecule?","o":["Trehalose dimycolate","Polyribophosphate (PRP) capsule","Sulfatides that induce delayed-type hypersensitivity","Mycolic acid–arabinogalactan only, formerly called Wax D","Pneumolysin released into the alveolar space"],"a":0,"src":"6b. Respiratory Infections (handwritten).pdf, slide 56","img":[{"u":"img/w11_resp_inf/p56.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 56","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"In the table of *M. tuberculosis* virulence factors, **cord factor** is boxed, with its other name, **trehalose dimycolate**, right beside it and the note **\"know both terms.\"**\n\nCord factor inhibits mitochondrial respiration, inhibits neutrophil migration, and makes the bacteria grow as serpentine cords in liquid medium. Separately boxed factors include the cell wall skeleton (MAPc, formerly called Wax D) and sulfolipids (sulfatides, which inhibit phagosome-lysosome fusion).","why":{"1":"The PRP capsule is the major virulence factor of Hib.","2":"Sulfatides (sulfolipids) are a separately boxed factor that inhibits phagosome-lysosome fusion; the factor that induces delayed-type hypersensitivity is the cell wall skeleton (MAPc/Wax D).","3":"The cell wall skeleton (MAPc, formerly Wax D) is a separately boxed factor, not another name for cord factor.","4":"Pneumolysin is the hemolysin of *S. pneumoniae*."},"one":"Cord factor is also called trehalose dimycolate, and you need to know both terms."},"w11_resp_inf-22":{"q":"M. tuberculosis is starred as growing on which media, and which clinical form is underlined as the most severe?","o":["Chocolate agar only; pulmonary TB is the most severe form.","Lowenstein-Jensen or Middlebrook media; miliary TB is the most severe.","Mouse footpad or armadillo only; lepromatous leprosy is most severe.","Ordinary nutrient broth; extrapulmonary TB is always most severe.","Thayer-Martin agar; latent infection is the most severe form."],"a":1,"src":"6b. Respiratory Infections (handwritten).pdf, slide 59","img":[{"u":"img/w11_resp_inf/p59.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 59","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"The clinical forms of TB are underlined: **pulmonary TB (most cases)**, **extrapulmonary TB (a minority)**, and **miliary TB (most severe)**. Miliary TB is widespread dissemination through the bloodstream, producing small lesions in many organs at once. Advanced pulmonary TB involves hemoptysis (spitting blood).\n\nUnder laboratory identification, **grows on Lowenstein-Jensen or Middlebrook media** is starred. Production of niacin also distinguishes it from other mycobacteria.","why":{"0":"Chocolate agar is a medium for organisms like Hib, and the most severe form is miliary TB, not pulmonary TB.","2":"Mouse footpads and armadillos are how *M. leprae* is grown; lepromatous leprosy is the severe form of leprosy.","3":"Ordinary nutrient broth is not the starred medium, and extrapulmonary TB is a minority of cases, not the most severe form.","4":"Thayer-Martin is a medium for gonococci and similar organisms, and latent infection is not the most severe clinical form."},"one":"M. tuberculosis grows on Lowenstein-Jensen or Middlebrook media, and the most severe clinical form is miliary TB."},"w11_resp_inf-23":{"q":"A positive tuberculin (PPD) skin test means which of the following?","o":["The patient definitely has active, contagious tuberculosis now.","Acid-fast bacilli have already been proven in the sputum.","Past cured infection, vaccination, or latent infection — not necessarily active disease.","The patient has certainly never encountered any mycobacteria.","Miliary tuberculosis with bloodstream dissemination is present."],"a":2,"src":"6b. Respiratory Infections (handwritten).pdf, slide 60","img":[{"u":"img/w11_resp_inf/p60.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 60","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"A positive PPD **does not mean active disease.** A handwritten note completes the sentence: a positive result can mean **a past cured infection, vaccination, or latent infection**.\n\nThe point that induration comes from memory cells or type 1 helper T cells is noted as \"not on the quiz,\" so for the exam what matters is the meaning of a positive result and the cutoffs that follow.","why":{"0":"A positive result does not mean active disease; it may reflect a past cured infection, vaccination, or latent infection.","1":"A positive PPD alone does not mean bacteria have been demonstrated in sputum; it does not confirm active disease.","3":"A positive result means the person may have encountered the organism or been vaccinated; it does not mean \"never encountered.\"","4":"Miliary TB is the most severe clinical form and is not diagnosed by a positive PPD alone."},"one":"A positive PPD does not mean active disease; it can reflect a past cured infection, vaccination, or latent infection."},"w11_resp_inf-24":{"q":"For PPD (Mantoux) interpretation, the boxed and circled induration cutoffs are which of the following?","o":["≥2 mm in every person, regardless of risk factors.","≥20 mm in high-risk persons and ≥25 mm in low-risk persons.","≥15 mm in high-risk persons and ≥5 mm in low-risk persons.","≥5 mm in high-risk persons, ≥10 mm in moderate-risk persons, and ≥15 mm in low-risk persons.","Any visible erythema, even without palpable induration, is a positive test."],"a":3,"src":"6b. Respiratory Infections (handwritten).pdf, slides 60, 61","img":[{"u":"img/w11_resp_inf/p60.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 60","w":1200,"h":900},{"u":"img/w11_resp_inf/p61.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 61","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"On the moderate/increased-risk slide, **induration ≥10 mm** is circled. Beside it, the handwritten cutoffs **≥5 mm = high risk** and **≥15 mm = low risk** are boxed.\n\nThe CDC Mantoux poster uses the same three cutoffs. **≥5 mm**: HIV, recent contacts of infectious TB, fibrotic changes on chest X-ray, organ transplant, immunosuppression (e.g., prednisone ≥15 mg/day or TNF-α inhibitors). **≥10 mm**: people from countries with high TB prevalence, residents of congregate settings, children under 5, and others. **≥15 mm**: people with no known risk factors.\n\nThe test is read at 48–72 hours, and you measure **induration, not erythema**, in millimeters.","why":{"0":"2 mm is not a positive cutoff; 5, 10, or 15 mm are used depending on risk.","1":"20 mm and 25 mm are not the cutoffs used here.","2":"The high-risk and low-risk numbers are reversed: high risk is 5 mm, low risk is 15 mm.","4":"Erythema alone is not a positive test; you palpate and measure induration."},"one":"PPD positive cutoffs: ≥5 mm high risk, ≥10 mm moderate risk, ≥15 mm low risk; measure induration, not erythema."},"w11_resp_inf-25":{"q":"The BCG vaccine, circled and starred, is which of the following?","o":["A killed M. tuberculosis filtrate used routinely only in the United States.","A toxoid identical to the D component of the DTaP vaccine.","A live vaccine prepared from Mycobacterium avium-intracellulare.","An RNA vaccine directed against cord factor (trehalose dimycolate).","A live, attenuated M. bovis vaccine and one of the most widely used vaccines in the world."],"a":4,"src":"6b. Respiratory Infections (handwritten).pdf, slides 66, 81","img":[{"u":"img/w11_resp_inf/p66.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 66","w":1200,"h":900},{"u":"img/w11_resp_inf/p81.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 81","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"TB prevention is the **BCG (Bacillus Calmette-Guérin) vaccine** (circled and starred). It is made from **live, attenuated *M. bovis*** and is **one of the most widely used vaccines in the world**. It is not used routinely in the U.S. because TB is rare there, and it can cause **false-positive tuberculin skin tests** on screening.\n\n*M. bovis* is the bovine tuberculosis organism, and the fact that BCG is made from it is marked separately.","why":{"0":"BCG is a live, attenuated *M. bovis* vaccine, not a killed filtrate, and it is actually NOT used routinely in the U.S.","1":"The D in DTaP is diphtheria toxoid, not BCG.","2":"MAC (*M. avium-intracellulare*) is not the source of BCG; the source is *M. bovis*.","3":"BCG is not an RNA vaccine against cord factor."},"one":"BCG is a live, attenuated M. bovis vaccine and one of the most widely used vaccines in the world."},"w11_resp_inf-26":{"q":"Compared with leprosy, the incubation period of tuberculosis is which of the following?","o":["Shorter: 2–12 weeks for TB versus 1–20 years for leprosy.","Identical: both infections always incubate for 5–14 days.","Longer: 1–20 years for TB versus 2–12 weeks for leprosy.","Shorter: 48–72 hours for TB versus 2–5 days for leprosy.","Longer: the 1–2 years of MDT is the incubation period of TB."],"a":0,"src":"6b. Respiratory Infections (handwritten).pdf, slides 68, 79","img":[{"u":"img/w11_resp_inf/p68.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 68","w":1200,"h":900},{"u":"img/w11_resp_inf/p79.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 79","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"The TB incubation period of **2–12 weeks** is circled with the note **shorter than leprosy**. The leprosy (*M. leprae*) incubation period of **1–20 years** is circled with the note **longer vs. tuberculosis**.\n\nThe notes on the two slides form a pair. 5–14 days is psittacosis, 48–72 hours is when the PPD is read, and 1–2 years is the duration of leprosy multidrug therapy.","why":{"1":"5–14 days is the incubation period of psittacosis (*C. psittaci*); TB and leprosy have different incubation periods.","2":"The numbers are reversed: leprosy is the long one (1–20 years), TB the short one (2–12 weeks).","3":"48–72 hours is when the PPD is read, and 2–5 days is the incubation period of diphtheria.","4":"1–2 years is the duration of leprosy multidrug therapy (MDT), not the incubation period of TB."},"one":"The TB incubation period (2–12 weeks) is shorter than that of leprosy (1–20 years)."},"w11_resp_inf-27":{"q":"Mycobacterium leprae is starred as temperature-sensitive and therefore prefers which sites?","o":["Deep, warm viscera such as the liver and the spleen.","Cooler body parts, especially the skin and the nerves.","Only alveolar macrophages at core body temperature.","The highly oxygenated lung apices exclusively.","Aquatic amoebae and shower-mist droplets."],"a":1,"src":"6b. Respiratory Infections (handwritten).pdf, slide 71","img":[{"u":"img/w11_resp_inf/p71.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 71","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"*M. leprae* is **temperature-sensitive**, so it invades **cooler body parts: SKIN, NERVES** (circled and starred). The nose, outer ears, testes, and superficial nerve endings are given as examples. It progresses slowly and chronically and causes **peripheral neuritis**.\n\nTransmission is through **prolonged close contact over many months** with an untreated patient, mainly by **inhalation**, and **children** are more susceptible than adults.","why":{"0":"Warm, deep viscera (liver, spleen) are not described as preferred sites for the temperature-sensitive leprosy bacillus.","2":"Alveolar macrophages are the cells *M. tuberculosis* infects first; the main targets of *M. leprae* are skin and nerves.","3":"The oxygen-rich lung apices are linked to the obligate aerobe *M. tuberculosis*.","4":"Amoebae and shower mist describe the ecology and transmission of *Legionella*."},"one":"M. leprae is temperature-sensitive and invades cooler body parts, especially the skin and nerves."},"w11_resp_inf-28":{"q":"Leprosy multidrug therapy (the starred drugs), given for 1–2 years (longer than TB because nerves may be damaged), consists of which agents?","o":["RIPE only: rifampin, isoniazid, pyrazinamide, and ethambutol.","Penicillin plus erythromycin given for 10 days.","Dapsone, rifampin, and clofazimine.","Doxycycline or azithromycin alone for 5 days.","Isoniazid monotherapy continued for 2 months."],"a":2,"src":"6b. Respiratory Infections (handwritten).pdf, slide 77","img":[{"u":"img/w11_resp_inf/p77.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 77","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Leprosy multidrug therapy (MDT) is boxed as **1–2 years**, with the note that it is **longer than TB because nerves may be damaged**. The three starred and underlined drugs are **dapsone, rifampin, and clofazimine**.\n\nTreatment can eliminate the bacteria but cannot reverse damage that has already occurred. The key to prevention is **early detection** to prevent irreversible physical and nerve damage.","why":{"0":"RIPE (rifampin, isoniazid, pyrazinamide, ethambutol) is TB treatment.","1":"Penicillin or erythromycin is used to treat diphtheria and eliminate carriage.","3":"Doxycycline and azithromycin are used for psittacosis and others; they are not leprosy MDT.","4":"Isoniazid alone for 2 months is not leprosy MDT."},"one":"Leprosy MDT is dapsone, rifampin, and clofazimine, given for 1–2 years (longer than TB because of nerve damage)."},"w11_resp_inf-29":{"q":"Dr. McLean boxed the species jump of Mycobacterium bovis as which pair of routes?","o":["Cattle to animals by ingestion; cattle to humans by skin contact.","Cattle to animals by fomites; cattle to humans by arthropod bite.","Cattle to animals by water mist; cattle to humans by PPD injection.","Cattle to animals by inhalation; cattle to humans by ingestion (raw infected cow’s milk).","Cattle to both animals and humans only by prolonged nerve contact."],"a":3,"src":"6b. Respiratory Infections (handwritten).pdf, slide 81","img":[{"u":"img/w11_resp_inf/p81.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 81","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"*M. bovis* causes tuberculosis in cattle and can cross species to cause disease in humans. The boxed note separates the routes: **cattle → animals: inhalation / cattle → humans: ingestion**.\n\nSpread to humans is mainly by **drinking raw infected cow's milk**; lesions form in lymph nodes and can spread to bones and joints. It can also spread by inhalation. The BCG vaccine is made from this organism.","why":{"0":"The main cattle-to-animal route is inhalation, not ingestion, and cattle-to-human is ingestion, not skin contact.","1":"Fomites and arthropod bites are not the routes written in this box.","2":"Water mist is *Legionella*, and PPD injection is a skin test, not a route of infection.","4":"Prolonged contact relates to leprosy transmission, not the boxed routes for *M. bovis*."},"one":"M. bovis spreads from cattle to animals by inhalation and from cattle to humans by ingesting raw infected milk."},"w11_resp_inf-30":{"q":"Atypical mycobacteria such as MAC (M. avium complex) are marked as having which set of properties?","o":["They are strictly human pathogens that never exist in the environment.","They are readily transmitted from person to person by respiratory droplets.","They are uniformly susceptible to standard RIPE anti-TB drugs.","They are the source organisms from which the BCG vaccine is made.","They are widespread environmental opportunists, especially in AIDS, that are not readily transmitted and are highly resistant to anti-TB drugs."],"a":4,"src":"6b. Respiratory Infections (handwritten).pdf, slide 82","img":[{"u":"img/w11_resp_inf/p82.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 82","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"For atypical mycobacteria, especially ***M. avium-intracellulare* (MAC)**, the following are circled or underlined:\n\n· **Widespread in the environment** (air, soil, water, etc.).\n· They are **opportunists**.\n· They cause a TB-like disease associated with **AIDS**.\n· They are **not readily transmitted** from person to person.\n· They are **highly resistant to anti-TB drugs**.","why":{"0":"These organisms are widespread in the environment; they are not strictly human pathogens.","1":"It is underlined that they are not readily transmitted from person to person.","2":"It is underlined that they are highly resistant to anti-TB drugs; they don't all respond to standard RIPE.","3":"BCG is made from *M. bovis*, not MAC."},"one":"MAC are widespread environmental opportunists that cause disease in AIDS, are not readily transmitted, and are highly resistant to anti-TB drugs."},"w11_resp_inf-31":{"q":"A brace on the diphtheria infection-site list grouped pharynx, tonsils, and larynx as what, and what was written next to skin?","o":["Upper respiratory tract, and also skin.","Lower respiratory tract only, never the skin.","The meninges only, and never the throat.","The alveoli only, with no cutaneous form.","The gastrointestinal tract, and also the liver."],"a":0,"src":"6b. Respiratory Infections (handwritten).pdf, slide 6","img":[{"u":"img/w11_resp_inf/p06.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 6","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Pharynx, tonsils, and larynx are bracketed as the **upper resp. tract**, and **Skin** is underlined with **AND skin** written beside it. Diphtheria mainly involves the upper airway mucosa of the throat, but it can also infect the skin.","why":{"1":"Not just the lower tract: the bracket is the upper respiratory tract, and skin is marked with AND.","2":"The meninges are not what this bracket groups; pharynx, tonsils, and larynx are grouped as the upper respiratory tract.","3":"Not just the alveoli, and the \"AND skin\" note shows there is a cutaneous form.","4":"The GI tract and liver are not part of this infection-site note."},"one":"Diphtheria infects the upper respiratory tract (pharynx, tonsils, larynx) and the skin."},"w11_resp_inf-32":{"q":"Besides the boxed oral pseudomembrane, which other diphtheria presentation was marked “Q’s”?","o":["A bull-neck only, with no skin involvement.","A cutaneous skin ulcer.","A currant-jelly sputum cavity.","A wrist-drop deformity of the hand.","A nonproductive cough due to an intracellular organism."],"a":1,"src":"6b. Respiratory Infections (handwritten).pdf, slide 10","img":[{"u":"img/w11_resp_inf/p10.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 10","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"On the left, the oral pseudomembrane is boxed as \"diphtheria of the oral cavity,\" and above the **skin ulcer** on the right, **Q's** is written large like a star. The ulcer of cutaneous diphtheria is emphasized as a finding that may appear on the exam.","why":{"0":"Bull neck is the finding of cervical lymphadenitis; the photo marked \"Q's\" is the skin ulcer.","2":"Currant jelly sputum is the classic finding of *Klebsiella* pneumonia.","3":"Wrist drop is a clinical photo of leprosy.","4":"A nonproductive cough from an intracellular organism is the note for *Legionella*."},"one":"Diphtheria can appear as a skin ulcer as well as an oral pseudomembrane."},"w11_resp_inf-33":{"q":"Which vaccine was starred or underlined for prevention of diphtheria and of pertussis?","o":["BCG (live attenuated M. bovis) only.","The pneumococcal conjugate capsule vaccine only.","The DTaP (Diphtheria-Pertussis-Tetanus) vaccine; boosters are needed because immunity wanes.","A toxoid directed against pneumolysin only.","No vaccine exists for either disease."],"a":2,"src":"6b. Respiratory Infections (handwritten).pdf, slide 11, 30","img":[{"u":"img/w11_resp_inf/p11.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 11","w":1200,"h":900},{"u":"img/w11_resp_inf/p30.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 30","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Under diphtheria prevention, **DTaP** is starred with **Prevents Diphtheria** written above it. Under pertussis prevention, **DTaP** is also underlined. The diphtheria section notes that **boosters** are needed because immunity wanes over time.","why":{"0":"BCG is the vaccine for tuberculosis; the vaccine marked for diphtheria and pertussis is DTaP.","1":"The pneumococcal conjugate vaccine targets the pneumococcal capsule.","3":"Pneumolysin is the pneumococcal hemolysin; it is not the marked vaccine for these two diseases.","4":"DTaP is marked as preventing both diseases."},"one":"DTaP prevents diphtheria and pertussis, and boosters are needed because immunity wanes."},"w11_resp_inf-34":{"q":"What sites were handwritten under the Haemophilus influenzae title?","o":["The gastrointestinal tract only.","Skin, hair, and nails only.","The meninges only, never the airways.","The upper and lower respiratory tract.","Desert soil and bird droppings only."],"a":3,"src":"6b. Respiratory Infections (handwritten).pdf, slide 13","img":[{"u":"img/w11_resp_inf/p13.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 13","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Under the title, **upper + lower resp. tract** is handwritten. This organism can involve both the upper and lower respiratory tract. In the same lecture, meningitis, otitis media, sinusitis, and pneumonia appear in the disease list.","why":{"0":"Not the GI tract alone; what is written is the upper and lower respiratory tract.","1":"Skin, hair, and nails are the targets of dermatophytes.","2":"It does cause meningitis, but what is written here is the upper and lower respiratory tract.","4":"Desert soil and bird droppings are habitats of other respiratory pathogens."},"one":"Haemophilus influenzae involves both the upper and lower respiratory tract."},"w11_resp_inf-35":{"q":"For H. influenzae, which host and which two diseases were underlined, starred, or boxed?","o":["Elderly smokers only; only urinary tract infection.","Neonates only; only bull-neck diphtheria.","Healthy adults only; only tinea pedis.","Adolescents only; only Legionnaires’ disease.","Children under 5 years are most susceptible; meningitis in that group is starred, and pneumonia is boxed and starred."],"a":4,"src":"6b. Respiratory Infections (handwritten).pdf, slide 14","img":[{"u":"img/w11_resp_inf/p14.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 14","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"**Children under 5 years** is underlined as the most susceptible group. Below it, **meningitis (children under 5 years)** is starred, and **pneumonia** is boxed and starred. Otitis media and sinusitis are also on the list, but meningitis and pneumonia are the starred and boxed ones. On the same page, *H. ducreyi* is noted as causing chancroid with painful genital ulcers.","why":{"0":"The emphasized host is children under 5, and the starred/boxed diseases are meningitis and pneumonia.","1":"Bull-neck diphtheria is a finding of *Corynebacterium*.","2":"Tinea pedis belongs to the dermatophytes.","3":"Legionnaires' disease is *Legionella*."},"one":"H. influenzae mainly affects children under 5, with meningitis and pneumonia especially emphasized."},"w11_resp_inf-36":{"q":"Which Haemophilus influenzae mechanism was underlined in the summary table?","o":["It produces IgA protease that degrades secretory IgA.","It inactivates elongation factor 2.","It forms a currant-jelly polysaccharide plug in bile.","It lacks a cell wall and therefore ignores penicillin.","It lives only inside amoebae in cooling towers."],"a":0,"src":"6b. Respiratory Infections (handwritten).pdf, slide 16","img":[{"u":"img/w11_resp_inf/p16.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 16","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"The phrase **IgA protease degrades secretory IgA** is underlined in red. Breaking down secretory IgA makes colonization of the upper airway easier, after which the organism can spread to the blood, meninges, and other sites.","why":{"1":"Inactivating EF2 is the mechanism of diphtheria toxin.","2":"Currant jelly sputum is a *Klebsiella* finding.","3":"The organism without a cell wall is *Mycoplasma*.","4":"Living inside amoebae is a feature of *Legionella*."},"one":"H. influenzae produces an IgA protease that degrades secretory IgA."},"w11_resp_inf-37":{"q":"Besides being a leading cause of community-acquired pneumonia and adult bacterial meningitis, where was S. pneumoniae underlined as being found?","o":["Only in desert rodent burrows.","In the nasopharynx of many healthy individuals.","Only inside amoebae in spa water.","Only on Lowenstein-Jensen medium as mold-like colonies.","Only in raw cow’s milk."],"a":1,"src":"6b. Respiratory Infections (handwritten).pdf, slide 19","img":[{"u":"img/w11_resp_inf/p19.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 19","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"The **nasopharynx** of **healthy** people is underlined. *S. pneumoniae* is an obligate human parasite that colonizes the nasopharynx of many healthy people and can go on to cause pneumonia, meningitis, otitis media, and more. Its role as the most common cause of community-acquired pneumonia and adult bacterial meningitis is starred separately.","why":{"0":"Desert burrows are not part of this organism's habitat.","2":"Amoebae and spa water describe *Legionella*.","3":"Lowenstein-Jensen is the medium for *M. tuberculosis*.","4":"Raw milk is the human transmission route for *M. bovis*."},"one":"S. pneumoniae is found in the nasopharynx of many healthy individuals."},"w11_resp_inf-38":{"q":"After the starred capsule and pneumolysin, which exudate and spread findings were underlined for pneumococcal pathogenesis?","o":["A dry cough only, with no cellular exudate, confined to keratin.","Caseous necrosis limited to the adrenal glands.","Alveoli exude fluid, RBCs, and WBCs, leading to a productive cough, and the organism disseminates to lymphatics and blood.","A nonproductive cough because the organism is strictly extracellular in water.","Endosporulating spherules replace the alveolar exudate."],"a":2,"src":"6b. Respiratory Infections (handwritten).pdf, slide 20","img":[{"u":"img/w11_resp_inf/p20.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 20","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"The capsule and pneumolysin (hemolysin) are starred. Below them, the phrase that **alveoli exude fluid, RBCs, and WBCs, producing a productive cough** is underlined, along with spread to **lymphatics and blood**. This exudate is the basis of the rusty, blood-tinged sputum.","why":{"0":"A productive cough and cellular exudate are underlined, not a dry cough or keratin.","1":"Caseous necrosis belongs to tuberculous lesions.","3":"A nonproductive cough is the finding noted for *Legionella* \"because it's intracellular.\"","4":"Spherules are *Coccidioides*."},"one":"Pneumococcus makes the alveoli exude fluid, RBCs, and WBCs (productive cough) and spreads to lymphatics and blood."},"w11_resp_inf-39":{"q":"Which Bordetella points were underlined or annotated as the lecture’s focus?","o":["Only B. parapertussis is encapsulated, and it is the sole focus.","Virulent strains are nonencapsulated yeasts that cause tinea.","The genus never produces toxins and never causes cough.","Virulent strains are encapsulated, and B. pertussis (whooping cough) is the focus species.","B. pertussis infects only the urinary tract of elderly men."],"a":3,"src":"6b. Respiratory Infections (handwritten).pdf, slide 25, 26","img":[{"u":"img/w11_resp_inf/p25.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 25","w":1200,"h":900},{"u":"img/w11_resp_inf/p26.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 26","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"**Virulent strains - encapsulated** is underlined, and **whooping cough (pertussis)** and ***B. pertussis*** are underlined. In the list of important species, **(focus)** is written next to ***B. pertussis***, making clear that this species is the focus of the lecture.","why":{"0":"The species marked as the focus is *B. pertussis*, and the capsule is underlined as present in virulent strains.","1":"*Bordetella* is an encapsulated gram-negative coccobacillus, not a yeast, and does not cause tinea.","2":"It is underlined that it produces toxins and causes whooping cough.","4":"The sites of infection are respiratory (nasopharynx and ciliated cells of the trachea and bronchi)."},"one":"Virulent Bordetella strains are encapsulated, and the focus species is B. pertussis."},"w11_resp_inf-40":{"q":"Which modes of transmission were underlined for Bordetella pertussis?","o":["Sexual contact only.","Ingestion of raw milk only.","The bite of an infected armadillo only.","Airborne spores from desert dust only.","Respiratory droplets by coughing, or direct contact."],"a":4,"src":"6b. Respiratory Infections (handwritten).pdf, slide 27","img":[{"u":"img/w11_resp_inf/p27.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 27","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"**Respiratory droplets by coughing** and **direct contact** are underlined. The sites of infection listed are the nasopharynx and the ciliated cells of the trachea and bronchi.","why":{"0":"Sexual contact is not the underlined route.","1":"Raw milk is the human transmission route for *M. bovis*.","2":"The armadillo is a natural host used to grow *M. leprae*, not a route of pertussis transmission.","3":"Desert dust is closer to exposure to *Coccidioides*."},"one":"Pertussis spreads by respiratory droplets from coughing or by direct contact."},"w11_resp_inf-41":{"q":"After a common-cold-like start, which pertussis symptom was underlined?","o":["A prolonged characteristic cough.","Currant-jelly sputum from the first day.","Painless genital ulcers.","Bull-neck swelling of the cervical nodes.","A painless scalp plaque that fluoresces green."],"a":0,"src":"6b. Respiratory Infections (handwritten).pdf, slide 28","img":[{"u":"img/w11_resp_inf/p28.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 28","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"It is underlined that after a start resembling the common cold, a **prolonged characteristic cough** follows. This is the clinical core of pertussis and leads into the explanation of the \"whoop.\"","why":{"1":"Currant jelly sputum is the classic *Klebsiella* finding.","2":"Genital ulcers point to *H. ducreyi* (chancroid), whose ulcers are painful.","3":"Bull neck is a diphtheria finding.","4":"A fluorescent scalp plaque relates to some tinea capitis."},"one":"Pertussis starts like a cold and then develops a prolonged characteristic cough."},"w11_resp_inf-42":{"q":"The contamination list for Legionella (cooling towers, spas, showers, and similar sites) was braced with which handwritten note, and how was the fine mist annotated?","o":["Only sterile distilled water in sealed vials; mist was labeled “not infectious.”","Anywhere with water or spraying; the fine mist was annotated as shower mist.","Only desert dust; the mist was labeled “pollen only.”","Only raw milk; the mist was labeled “caseous droplets.”","Only keratin of hair shafts; the mist was labeled “arthroconidia.”"],"a":1,"src":"6b. Respiratory Infections (handwritten).pdf, slide 33","img":[{"u":"img/w11_resp_inf/p33.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 33","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Cooling towers, evaporative condensers, water heaters, water purifiers, spas, showers, and similar sites are bracketed with the note **anywhere with water/spraying happens**. The sentence that it spreads by **water in fine mist** is starred and boxed, annotated below as **shower mist**.","why":{"0":"It is not limited to sterile distilled water; it can be in any sprayed water.","2":"Desert dust and pollen are not what this bracket says.","3":"Raw milk and caseous material belong to other organisms.","4":"Keratin and arthroconidia belong to the fungi."},"one":"Legionella can be anywhere water is sprayed and spreads by fine mist such as shower mist."},"w11_resp_inf-43":{"q":"In Legionella pathogenesis, what was written under alveolar macrophages, and which step was underlined after uptake?","o":["Macrophages instantly kill the organism; it never enters a phagosome.","The organism lives only on keratin and never meets macrophages.","Macrophages don’t kill it; the organism inhibits lysosome-phagosome fusion and grows in the phagosome.","Macrophages convert it into a toxigenic phage that inactivates EF2.","The organism is killed by pasteurization inside the phagosome only."],"a":2,"src":"6b. Respiratory Infections (handwritten).pdf, slide 34","img":[{"u":"img/w11_resp_inf/p34.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 34","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"**Alveolar macrophages** is underlined, with **doesn't kill it** written below. Next, **inhibits lysosome-phagosome fusion** is underlined, and the organism grows inside the phagosome. Proteases and other products causing tissue damage are also underlined.","why":{"0":"Macrophages don't kill it instantly; the note says they don't kill it.","1":"Inhaled organisms are engulfed by alveolar macrophages.","3":"Inactivating EF2 is diphtheria toxin.","4":"Pasteurization came up as a killing condition in the *M. tuberculosis* cell wall discussion, not *Legionella* inside the phagosome."},"one":"Alveolar macrophages can't kill Legionella; it inhibits lysosome-phagosome fusion and grows in the phagosome."},"w11_resp_inf-44":{"q":"Which clinical grouping and cough annotation were written on the Legionnaires’ disease list?","o":["Currant-jelly sputum only, because the organism is extracellular.","A whooping inspiratory sound only, with no systemic symptoms.","Bull-neck and a gray pharyngeal membrane only.","Myalgia, headache, fever, and diarrhea were braced as flu-like symptoms, and the cough is generally nonproductive because of the organism’s intracellular nature.","Cottage-cheese oral patches after antibiotics only."],"a":3,"src":"6b. Respiratory Infections (handwritten).pdf, slide 35","img":[{"u":"img/w11_resp_inf/p35.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 35","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Myalgia, headache, fever, and diarrhea are bracketed as **flu-like symptoms**. **Generally nonproductive cough** is underlined, with **due to intracellular nature** written below.","why":{"0":"Currant jelly sputum is *Klebsiella*, and the *Legionella* cough is noted as nonproductive.","1":"The whooping sound is a finding of pertussis.","2":"Bull neck and a pharyngeal membrane are diphtheria.","4":"Cottage-cheese patches are *Candida* thrush."},"one":"Legionnaires' disease features flu-like systemic symptoms and a cough that is nonproductive because the organism is intracellular."},"w11_resp_inf-45":{"q":"What kind of antibiotics were annotated as needed for Legionella, with which examples listed?","o":["Topical nystatin only, because the organism is a fungus.","Inhaled ribavirin only, because it is a virus.","Penicillin alone, because the wall is pure peptidoglycan.","Isoniazid monotherapy for 5 days only.","Antibiotics that can penetrate the cell, such as levofloxacin and azithromycin."],"a":4,"src":"6b. Respiratory Infections (handwritten).pdf, slide 36","img":[{"u":"img/w11_resp_inf/p36.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 36","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Under \"antibiotics that effectively penetrate human cells\" is an arrowed note: **that can penetrate the cell**. **Levofloxacin** and **azithromycin** are listed as examples. Because the organism lives inside macrophages, the drug must reach effective intracellular concentrations.","why":{"0":"*Legionella* is a bacterium, not a fungus.","1":"*Legionella* is a bacterium, not a virus.","2":"Penicillin alone is not the drug in this note; cell penetration is the key.","3":"Isoniazid is a tuberculosis drug."},"one":"Legionella requires antibiotics that penetrate cells, such as levofloxacin and azithromycin."},"w11_resp_inf-46":{"q":"Which two environmental measures were underlined for Legionella prevention?","o":["Hyper-chlorinate water, and heat water to greater than 70°C.","Pasteurize sputum specimens only, and avoid all sunlight.","Vaccinate cattle, and boil only bottled juice.","Apply topical steroids to cooling towers.","Quarantine infected birds and avoid raw eggs only."],"a":0,"src":"6b. Respiratory Infections (handwritten).pdf, slide 37","img":[{"u":"img/w11_resp_inf/p37.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 37","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Two lines are underlined: **hyper-chlorinate water** and **heat water to > 70 °C**, to disinfect the water source. Reducing the organisms in sprayed water is the key to prevention.","why":{"1":"Pasteurization and sunlight relate to the survival conditions of the mycobacterial cell wall.","2":"Vaccinating cattle is not part of this prevention underline.","3":"Topical steroids came up as a mistaken treatment that masks tinea.","4":"Quarantining infected birds is prevention for psittacosis (*C. psittaci*)."},"one":"Legionella prevention is hyper-chlorinating water and heating it above 70 °C."},"w11_resp_inf-47":{"q":"Which transmission source and clinical picture were marked for Chlamydia psittaci?","o":["Person-to-person droplets only; typical lobar pneumonia with rusty sputum.","Inhalation of dust containing dried bird feces; atypical pneumonia that resembles influenza.","Raw cow’s milk only; miliary lesions in every host.","Armadillo bite only; leonine facies from the first day.","Cooling-tower mist only; whooping cough in infants."],"a":1,"src":"6b. Respiratory Infections (handwritten).pdf, slide 40","img":[{"u":"img/w11_resp_inf/p40.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 40","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"**Dried bird feces** is boxed, and **dust containing** is underlined as well. Clinically, **atypical pneumonia that resembles influenza** is underlined. The 5–14 day incubation period is starred separately.","why":{"0":"Typical lobar pneumonia with rusty sputum is closer to pneumococcus; psittacosis is an atypical pneumonia.","2":"Raw milk and miliary lesions belong to the mycobacteria.","3":"Armadillos and leonine facies belong to leprosy.","4":"Cooling-tower mist and whooping cough are *Legionella* and *Bordetella*."},"one":"Psittacosis is acquired by inhaling dust with dried bird feces and causes an atypical, influenza-like pneumonia."},"w11_resp_inf-48":{"q":"Which Mycoplasma pneumoniae mechanism and disease name were underlined?","o":["Formation of a gray pharyngeal pseudomembrane; “bull neck.”","Inactivation of EF2; “Lockjaw.”","Secretion of exotoxin with destruction of cilia and ciliated cells; atypical “walking pneumonia,” in which the patient remains ambulatory.","Production of cord factor only; “miliary TB.”","IgA protease only; “chancroid.”"],"a":2,"src":"6b. Respiratory Infections (handwritten).pdf, slide 45","img":[{"u":"img/w11_resp_inf/p45.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 45","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"**Exotoxin** and **destroys cilia and ciliated cells** are underlined. The disease name, atypical pneumonia, also called **walking pneumonia**, is underlined, meaning patients can keep walking around while sick.","why":{"0":"A pseudomembrane and bull neck are diphtheria.","1":"Inactivating EF2 is also diphtheria toxin.","3":"Cord factor and miliary TB belong to *M. tuberculosis*.","4":"IgA protease and chancroid belong to *Haemophilus*."},"one":"Mycoplasma destroys cilia with an exotoxin and causes walking pneumonia, in which patients stay ambulatory."},"w11_resp_inf-49":{"q":"Klebsiella was handwritten as which kind of pneumonia, and which transmission and mechanism phrases were underlined?","o":["Atypical only; spread only by bird feces; no biofilm.","Walking pneumonia only; spread only by cooling-tower mist; no capsule.","Whooping cough only; spread only by fomites in spas; no adhesion.","Typical pneumonia; primarily direct person-to-person contact (not typically airborne), and it produces a thick biofilm.","Fungal pneumonia only; spread only by arthroconidia; no human cases."],"a":3,"src":"6b. Respiratory Infections (handwritten).pdf, slide 46, 48","img":[{"u":"img/w11_resp_inf/p46.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 46","w":1200,"h":900},{"u":"img/w11_resp_inf/p48.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 48","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Under the title, **Typical pneumonia** is handwritten. In the summary table, **primarily by direct person-to-person contact** and **thick biofilm** are underlined. It is noted as not typically spread through the air.","why":{"0":"It is labeled a typical pneumonia, and bird feces is the route for psittacosis.","1":"Walking pneumonia is *Mycoplasma*; *Klebsiella* is a typical pneumonia.","2":"Whooping cough is *Bordetella*.","4":"*Klebsiella* is a gram-negative bacterium causing typical pneumonia."},"one":"Klebsiella causes typical pneumonia, spreads mainly by direct contact, and produces a thick biofilm."},"w11_resp_inf-50":{"q":"Besides the classic currant-jelly sputum, which host, capsule, and extra-site points were underlined for Klebsiella pneumoniae?","o":["It lacks a capsule and infects only healthy athletes’ hair shafts.","It has a thin teichoic-acid wall and infects only the meninges of neonates.","It is a wall-less organism that requires cholesterol and never causes UTI.","It is acid-fast and grows only in the armadillo footpad.","It has a large polysaccharide capsule, causes disease mainly in patients with underlying disease or alcoholism, and can cause UTI in patients with urinary catheters."],"a":4,"src":"6b. Respiratory Infections (handwritten).pdf, slide 47","img":[{"u":"img/w11_resp_inf/p47.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 47","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"**Large polysaccharide capsule** is underlined. It is underlined that it mainly causes disease in patients with **underlying disease or alcoholism**, and is a common cause of pneumonia in people with alcoholism, diabetes, or impaired lung function. **UTI** is also underlined further down, emphasizing urinary tract infection in patients with urinary catheters. Currant jelly sputum and the abscess ranking are marked separately as the \"classic question.\"","why":{"0":"It is underlined as having a large polysaccharide capsule; hair-shaft infection belongs to dermatophytes.","1":"Infection of neonatal meninges is not what is underlined here.","2":"The wall-less organism is *Mycoplasma*; *Klebsiella* also causes UTIs.","3":"Acid-fast staining and armadillos belong to the mycobacteria."},"one":"Klebsiella has a large polysaccharide capsule, strikes patients with underlying disease or alcoholism, and causes catheter-associated UTIs."},"w11_resp_inf-51":{"q":"Which mycobacterial cell-wall properties were underlined regarding composition, survival, and killing?","o":["The wall is about 60% lipid including mycolic acid, is waxy and resists many disinfectants, remains viable for weeks in sputum or bedding, and is killed by heat, pasteurization, and sunlight.","The wall is pure peptidoglycan only and is instantly killed by drying.","The wall lacks lipid and is stained easily with ordinary Gram reagents.","The wall is chitin, so only azoles can damage it.","The wall is cholesterol-rich and therefore requires Sabouraud agar only."],"a":0,"src":"6b. Respiratory Infections (handwritten).pdf, slide 54","img":[{"u":"img/w11_resp_inf/p54.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 54","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"The following are all underlined: **60% lipid** (including mycolic acid), a **waxy cell surface**, being **impervious** to many chemical disinfectants, bacteriostatic agents, and drying, remaining **viable for weeks** in sputum, bedding, and so on, and being killed by **heat, pasteurization, and sunlight**. The lipid-rich wall underlies both acid-fast staining and environmental survival.","why":{"1":"The wall is not pure peptidoglycan, and it is underlined that it survives for weeks rather than dying instantly when dried.","2":"Because it is lipid-rich, Gram reagents don't penetrate well.","3":"Chitin and azoles belong to the fungi.","4":"A cholesterol requirement and Sabouraud agar are closer to fungi/*Mycoplasma*."},"one":"The mycobacterial cell wall is lipid-rich and waxy, resists disinfectants, and is killed by heat, pasteurization, and sunlight."},"w11_resp_inf-52":{"q":"Sulfatides (sulfolipids), which were boxed with the other mycobacterial virulence factors, have which underlined or listed function?","o":["They inactivate elongation factor 2 in the pharynx.","They inhibit phagosome-lysosome fusion, allowing the organism to survive intracellularly.","They form a gray pseudomembrane on the tonsils.","They are the same molecule as the Hib PRP capsule.","They are the dye used in the Ziehl-Neelsen stain."],"a":1,"src":"6b. Respiratory Infections (handwritten).pdf, slide 56","img":[{"u":"img/w11_resp_inf/p56.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 56","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"**Sulfatides (sulfolipids)** are boxed; their function is to **inhibit phagosome-lysosome fusion**, letting the organism **survive inside the cell**. Cord factor (trehalose dimycolate) and the cell wall skeleton (formerly called Wax D) are boxed in the same table.","why":{"0":"Inactivating EF2 is diphtheria toxin.","2":"A gray pseudomembrane is diphtheria.","3":"The PRP capsule is the major virulence factor of Hib.","4":"Sulfatides are a bacterial virulence factor, not a staining reagent."},"one":"Sulfatides block phagosome-lysosome fusion so M. tuberculosis can survive inside cells."},"w11_resp_inf-53":{"q":"The boxed cell-wall skeleton of M. tuberculosis, formerly called Wax D, was listed as doing what?","o":["Inhibiting neutrophil migration only.","Lysing red cells to produce rusty sputum.","Inducing a delayed-type hypersensitivity reaction.","Binding factor H to block the membrane-attack complex.","Serving as the antigen in the Quellung reaction."],"a":2,"src":"6b. Respiratory Infections (handwritten).pdf, slide 56","img":[{"u":"img/w11_resp_inf/p56.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 56","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"The **cell wall skeleton (mycolic acid–arabinogalactan–peptidoglycan complex, MAPc)**, formerly called **Wax D**, is boxed. Its function is to **induce a delayed-type hypersensitivity reaction**. It is one row of the \"know both terms\" table, along with cord factor and sulfatides.","why":{"0":"Inhibiting neutrophil migration is underlined as a function of cord factor.","1":"Rusty sputum is a finding of pneumococcal exudate.","3":"Binding factor H is not what this box says.","4":"The Quellung reaction is a test for capsular polysaccharide, used for pneumococcus, Hib, and others."},"one":"The cell wall skeleton (formerly Wax D) induces a delayed-type hypersensitivity reaction."},"w11_resp_inf-54":{"q":"Besides being trehalose dimycolate and making serpentine cords, which two functions of cord factor were underlined?","o":["Degrading secretory IgA and inactivating EF2.","Forming a polysaccharide capsule and a thick biofilm.","Inducing only immediate anaphylaxis and complement lysis.","Inhibiting mitochondrial respiration and inhibiting neutrophil migration.","Binding cholesterol and forming endosporulating spherules."],"a":3,"src":"6b. Respiratory Infections (handwritten).pdf, slide 56","img":[{"u":"img/w11_resp_inf/p56.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 56","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"In the cord factor box, inhibition of **mitochondrial respiration** and of **neutrophil** migration are underlined. Making the bacteria form serpentine cords in liquid medium is a function on the same line. The molecular name, trehalose dimycolate, is noted separately with \"know both terms.\"","why":{"0":"IgA degradation is *Haemophilus*, and EF2 is diphtheria.","1":"A large polysaccharide capsule and biofilm are underlined for *Klebsiella*.","2":"Immediate anaphylaxis is not the underlined function; what the cell wall skeleton induces is delayed-type hypersensitivity.","4":"Spherules are *Coccidioides*."},"one":"Cord factor inhibits mitochondrial respiration and neutrophil migration."},"w11_resp_inf-55":{"q":"On the laboratory-identification table, which epidemiologic and clinical underlines describe pulmonary versus advanced versus miliary TB?","o":["Pulmonary TB is rare; advanced disease is painless hematuria only; miliary TB stays in one lobe.","Extrapulmonary TB is the majority; advanced disease is only otitis; miliary TB never enters blood.","Only latent infection produces cough; advanced disease is bull neck; miliary TB is a skin ulcer.","Only children under 2 are affected; advanced disease is whooping; miliary TB is walking pneumonia.","Pulmonary TB is the majority of cases, advanced cases may spit blood, and miliary TB reflects widespread bloodstream dissemination."],"a":4,"src":"6b. Respiratory Infections (handwritten).pdf, slide 59","img":[{"u":"img/w11_resp_inf/p59.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 59","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"It is underlined that **pulmonary TB is the majority of cases**, that **advanced cases may spit blood**, and that miliary TB is **widespread bloodstream dissemination** producing tiny lesions in many organs at once. The same table notes that miliary TB is the most severe form.","why":{"0":"Pulmonary TB is underlined as the majority, not as rare.","1":"Extrapulmonary TB is underlined as the minority, and miliary TB is bloodstream dissemination.","2":"Bull neck and skin ulcers are diphtheria findings.","3":"Children under 2 and whooping belong to *Bordetella*."},"one":"Pulmonary TB is the majority of cases, advanced cases may spit blood, and miliary TB is widespread bloodstream dissemination."},"w11_resp_inf-56":{"q":"On the PPD schematic, what was written as the source of the hardening in a positive reaction?","o":["Memory cells, T-helper 1 cells, and cytokines.","Immediate neutrophil-only pus, without lymphocytes.","A diphtheria pseudomembrane at the injection site.","Erythema alone, which should be measured instead of induration.","Cord-factor crystals deposited in the epidermis only."],"a":0,"src":"6b. Respiratory Infections (handwritten).pdf, slide 60","img":[{"u":"img/w11_resp_inf/p60.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 60","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"An arrow points to the hardened swelling of a positive reaction with the note that it comes from **memory cells, T-helper 1 cells, and cytokines**. In other words, induration is a cell-mediated, delayed-type hypersensitivity response. A positive result does not mean active disease, and the cutoffs (high risk ≥5 mm, moderate ≥10 mm, low risk ≥15 mm) are boxed and circled separately.","why":{"1":"The note on induration is memory T cells, Th1 cells, and cytokines, not neutrophil-only pus.","2":"There is no note about a diphtheria pseudomembrane at the injection site.","3":"You measure induration, not erythema.","4":"There is no note about cord-factor crystals depositing in the epidermis."},"one":"PPD induration is a reaction driven by memory cells, Th1 cells, and cytokines."},"w11_resp_inf-57":{"q":"On the chest radiograph shown for a PPD-positive patient, what did the handwritten label identify in the active-TB film?","o":["A completely normal lung with no air-space change.","Fluid pockets (a cavity) in the patient’s right upper lobe.","Bilateral bull-neck soft-tissue swelling only.","A renal stone, unrelated to the chest.","Only a foreign body in the stomach."],"a":1,"src":"6b. Respiratory Infections (handwritten).pdf, slide 62","img":[{"u":"img/w11_resp_inf/p62.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 62","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"The right upper lobe lesion indicated by the arrow on the active TB film is labeled **fluid pockets**. The caption says it points to a cavity in the patient's right upper lobe, and the title below reads **chest X-rays for PPD-positive persons**. The normal film is described as showing no growths or fluid/air pockets.","why":{"0":"The film on the left is the normal one; the handwriting is on the cavity in the active TB film.","2":"Bull neck is a neck finding of diphtheria, not a marking on this chest film.","3":"A kidney stone is not labeled on this film.","4":"A foreign body in the stomach is not labeled on this film."},"one":"The active TB film of a PPD-positive patient shows an upper-lobe cavity (fluid pockets)."},"w11_resp_inf-58":{"q":"The often-used TB regimen, circled as RIPE, is which schedule?","o":["Dapsone plus clofazimine only, for 5 days.","A single dose of BCG given after the chest film.","Rifampin, isoniazid, pyrazinamide, and ethambutol for the first 2 months, then rifampin plus isoniazid for the remaining 4 or 7 months (6- or 9-month courses).","Streptomycin monotherapy indefinitely.","No drugs are used if the PPD is positive, regardless of the chest film."],"a":2,"src":"6b. Respiratory Infections (handwritten).pdf, slide 65","img":[{"u":"img/w11_resp_inf/p65.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 65","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"**Often used regimen (6 or 9 months)** is underlined, and **RIPE** (rifampin, isoniazid, pyrazinamide, ethambutol) is circled. All four drugs are used for the **first 2 months**, then only rifampin and isoniazid for the **remaining 4 or 7 months**. Many patients with drug-susceptible pulmonary TB can be treated with the 6-month regimen.","why":{"0":"Dapsone and clofazimine are leprosy MDT drugs.","1":"BCG is a preventive vaccine, not the RIPE treatment schedule.","3":"Indefinite streptomycin monotherapy is not the circled regimen.","4":"Active TB requires multidrug treatment; withholding drugs based on PPD alone is not part of this regimen."},"one":"RIPE is four drugs for the first 2 months, then rifampin plus isoniazid for 4 or 7 more months."},"w11_resp_inf-59":{"q":"Which culture points were underlined for Mycobacterium leprae?","o":["It grows overnight on ordinary blood agar in every clinical lab.","It is the fastest-growing mycobacterium on Middlebrook medium alone.","It forms pigmented colonies in 24 hours on MacConkey agar.","It does not grow on artificial media, but can be grown in the mouse footpad and in the armadillo, its natural hosts.","It is identified only by a positive Quellung reaction."],"a":3,"src":"6b. Respiratory Infections (handwritten).pdf, slide 70","img":[{"u":"img/w11_resp_inf/p70.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 70","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"**No growth on artificial media** is underlined. It is also hard to grow in lab animals, with the exceptions of the **mouse footpad** and the **armadillo**, which are underlined as natural hosts.","why":{"0":"It does not grow overnight on ordinary blood agar; it is underlined that it does not grow on artificial media.","1":"Middlebrook and Lowenstein-Jensen are the starred media for *M. tuberculosis*.","2":"MacConkey agar is a selective medium for enteric bacteria.","4":"The Quellung reaction is a capsule test, not part of the underlined culture points for *M. leprae*."},"one":"M. leprae doesn't grow on artificial media but can be grown in the mouse footpad and the armadillo."},"w11_resp_inf-60":{"q":"Besides preferring cooler body parts because it is temperature-sensitive, which transmission and host points were underlined for leprosy?","o":["A single casual handshake is sufficient; adults are far more susceptible than children.","Spread occurs only by raw milk; only the elderly are at risk.","Spread occurs only by cooling-tower mist; only pregnant women are at risk.","No human-to-human spread occurs; only soil exposure matters.","Prolonged close contact with untreated leprosy over many months is needed, primarily by inhalation, and children are more susceptible than adults."],"a":4,"src":"6b. Respiratory Infections (handwritten).pdf, slide 71","img":[{"u":"img/w11_resp_inf/p71.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 71","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"It is underlined that transmission requires **close contact** **over many months**, mainly by **inhalation**. **Children** are underlined as more susceptible than adults, and the phrase about slow, chronic progression to **peripheral neuritis** is underlined too. Its preference for cooler body parts (skin, nerves) is starred separately.","why":{"0":"Not a casual handshake: months of close contact are needed, and children are underlined as more susceptible.","1":"Raw milk is the route for *M. bovis*.","2":"Cooling-tower mist is *Legionella*.","3":"Human-to-human spread does occur; prolonged close contact is required."},"one":"Leprosy spreads through months of close contact, mainly by inhalation, and children are more susceptible."},"w11_resp_inf-61":{"q":"Which points about leprosy nodules, immunity, and death were handwritten or underlined?","o":["Nodules are full of bacteria and immune cells; secondary infections occur because the immune system is compromised; leprosy is rarely the cause of death, and fatality is due to secondary infections such as tuberculosis.","Nodules are sterile keratin plugs; death is usually from acute diphtheria toxin.","The immune system is stronger than normal; death is inevitable in the first week.","Nodules contain only uric acid crystals; death is from bull-neck airway obstruction.","There is never bone resorption, and leprosy itself is the usual cause of death."],"a":0,"src":"6b. Respiratory Infections (handwritten).pdf, slide 72","img":[{"u":"img/w11_resp_inf/p72.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 72","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"**Nodules** is underlined, with **full of bacteria, immune cells, etc.** written beside it. Next to **secondary infections** is written **immune system is compromised**. Below, it is underlined that **leprosy itself is rarely the cause of death; death is due to secondary infections (e.g., tuberculosis)**. Bone resorption is also underlined.","why":{"1":"The nodules are noted as full of bacteria and immune cells, and diphtheria toxin has nothing to do with leprosy deaths.","2":"The immune system is noted as compromised, and leprosy does not inevitably kill in the first week.","3":"Uric acid crystals and bull neck are not part of these notes.","4":"Bone resorption is underlined, and leprosy itself is noted as a rare cause of death."},"one":"Leprosy nodules are full of bacteria and immune cells, and death is usually from secondary infections."},"w11_resp_inf-62":{"q":"Which two leprosy deformities were underlined in the clinical photographs?","o":["Bull neck and a pharyngeal pseudomembrane.","Wrist-drop and claw hand.","Rusty sputum and currant-jelly cavities.","Cottage-cheese patches and diaper rash.","Keratin scalp plaques that fluoresce green."],"a":1,"src":"6b. Respiratory Infections (handwritten).pdf, slide 73, 74","img":[{"u":"img/w11_resp_inf/p73.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 73","w":1200,"h":900},{"u":"img/w11_resp_inf/p74.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 74","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Along with loss of sensation in the thumb, **wrist-drop** is underlined, and in another photo, **\"claw\" hand** is underlined. These are the classic hand deformities from peripheral nerve damage.","why":{"0":"Bull neck and a pseudomembrane are diphtheria.","2":"Rusty sputum is pneumococcus, and currant jelly sputum is *Klebsiella*.","3":"Cottage-cheese patches and diaper rash are *Candida*.","4":"Fluorescent scalp plaques are some tinea capitis."},"one":"Wrist-drop and claw hand are the underlined hand deformities of leprosy."},"w11_resp_inf-63":{"q":"How were the two types of leprosy annotated, and what oval statement was emphasized?","o":["Lepromatous disease is always 1° and mild; everyone who is infected develops disease.","Tuberculoid disease is always 2° and severe; infection always progresses.","Tuberculoid leprosy occurs 1° (mild) and lepromatous leprosy occurs 2° (severe); the great majority of infected people do not develop disease.","Both types are acute 48-hour illnesses that always reverse spontaneously.","Only tuberculoid disease is contagious; lepromatous disease never infects others."],"a":2,"src":"6b. Respiratory Infections (handwritten).pdf, slide 76","img":[{"u":"img/w11_resp_inf/p76.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 76","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Above tuberculoid is written **occurs 1° (mild)**, and above lepromatous, **occurs 2° (severe)**. A large oval below emphasizes that the **great majority of infected DO NOT develop disease**. The lepromatous form is more infectious, and immunity is more impaired.","why":{"0":"Reversed: the mild primary form is tuberculoid, and the oval emphasizes that most infected people do not develop disease.","1":"The severe secondary form is lepromatous, and not everyone infected progresses.","3":"Leprosy is chronic, not an acute 48-hour illness, and treatment cannot reverse damage.","4":"The lepromatous form is noted as having higher infectivity; the tuberculoid form has low infectivity."},"one":"Tuberculoid leprosy is the mild primary form, lepromatous the severe secondary form, and most infected people never develop disease."},"w11_resp_inf-64":{"q":"Which limitation of modern leprosy treatment was wavy-underlined, and which prevention goal was underlined?","o":["Treatment never cures anyone, so prevention is unnecessary.","Treatment reverses all nerve damage within 48 hours.","Treatment is only topical nystatin, which fully rebuilds bone.","Treatment is highly effective and cures patients but does not reverse damage; early detection is needed to prevent irreversible physical and neurological damage.","The only prevention is cooling-tower chlorination."],"a":3,"src":"6b. Respiratory Infections (handwritten).pdf, slide 78, 79","img":[{"u":"img/w11_resp_inf/p78.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 78","w":1200,"h":900},{"u":"img/w11_resp_inf/p79.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 79","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"The phrase \"current treatment is highly effective and cures patients but **does not reverse damage**\" is wavy-underlined. In the prevention column of the summary table, the sentence about **early detection to prevent irreversible physical and neurological damage** is underlined. Because drugs cannot undo deformities that have already formed, finding and treating cases early is the key.","why":{"0":"Treatment is described as effective and curative; it just doesn't reverse damage.","1":"Nothing says damage is reversed in 48 hours; on the contrary, it says damage is not reversed.","2":"Nystatin is a topical drug for *Candida*, not leprosy treatment.","4":"Cooling-tower chlorination is *Legionella* prevention."},"one":"Leprosy treatment cures but cannot reverse damage, so early detection is essential."},"w11_resp_inf-65":{"q":"In the mycobacteria introduction, which two diseases were starred as the most alarming, and which pair was underlined as atypical / nontuberculous examples?","o":["Diphtheria and pertussis; the examples were S. pneumoniae and K. pneumoniae.","Psittacosis and walking pneumonia; the examples were C. psittaci and M. pneumoniae.","Legionnaires’ disease and chancroid; the examples were L. pneumophila and H. ducreyi.","Histoplasmosis and cryptococcosis; the examples were H. capsulatum and C. neoformans.","Tuberculosis and leprosy; the atypical examples were M. avium and M. intracellulare."],"a":4,"src":"6b. Respiratory Infections (handwritten).pdf, slide 51","img":[{"u":"img/w11_resp_inf/p51.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 51","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"**Tuberculosis (*M. tuberculosis*)** and **leprosy (*M. leprae*)** are starred and bracketed as the two most serious diseases. As examples of other species, ***M. avium* and *M. intracellulare*** are underlined along with *M. bovis*, and linked to **atypical/nontuberculous mycobacteria**.","why":{"0":"Diphtheria and pertussis are not the starred diseases in this introduction.","1":"Psittacosis and walking pneumonia are *Chlamydia* and *Mycoplasma*.","2":"Legionnaires' disease and chancroid are *Legionella* and *Haemophilus*.","3":"*Histoplasma* and *Cryptococcus* are systemic fungi."},"one":"The most serious mycobacterial diseases are tuberculosis and leprosy; atypical examples are M. avium and M. intracellulare."},"w11_pulm_phys-1":{"q":"What accounts for the difference between minute ventilation of alveoli and just ventilation?","o":["Breathing rate.","Anatomic dead space.","Tidal volume.","The FRC.","Forced vital capacity."],"a":1,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q1) / 8b. Pulmonary Physiology 2026.pdf, slide 10","img":[{"u":"img/w11_pulm_phys/p10.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 10","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Key formulas**\n\n· Minute ventilation (VE) = tidal volume × breathing rate\n\n· Alveolar minute ventilation (VA) = (tidal volume − dead space) × breathing rate\n\nPut the two formulas side by side and there is exactly one difference: **dead space**. With each breath, part of the inspired air just sits in the conducting airways (nose, trachea, bronchi) and then goes back out. That air never reaches the alveoli, so it does not take part in gas exchange; this is the anatomic dead space. For example, with a tidal volume of 500 mL, dead space of 150 mL, and 12 breaths/min, VE = 6,000 mL/min but VA = 350 × 12 = 4,200 mL/min. The entire 1,800 mL difference is due to dead space.","why":{"0":"Breathing rate multiplies both formulas equally, so it does not create the difference.","2":"Tidal volume is also in both formulas; what creates the difference is the dead space subtracted from it.","3":"FRC is the volume left in the lungs after a quiet exhalation and is not part of the ventilation formulas.","4":"Forced vital capacity is the volume forcefully exhaled after a maximal inspiration; it is a pulmonary function measure, unrelated to the difference in minute ventilation."},"one":"The difference between minute ventilation and alveolar minute ventilation is the anatomic dead space."},"w11_pulm_phys-2":{"q":"If CO2 production remains constant and alveolar ventilation is increased three-fold, the alveolar PCO2 after reaching a steady state will be what percentage of its former value?","o":["25","33","50","100","300"],"a":1,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q2) / 8b. Pulmonary Physiology 2026.pdf, slide 11","img":[{"u":"img/w11_pulm_phys/p11.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 11","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Key point**\n\nWhen CO₂ production (VCO₂) is constant, alveolar PCO₂ (PACO₂) is **inversely proportional** to alveolar ventilation (VA): PACO₂ = k × VCO₂/VA.\n\nIf VA triples, PACO₂ falls to 1/3, about **33%**. From a normal 40 mmHg it drops to about 13 mmHg. Put simply, the body makes the same amount of CO₂, but three times as much air is washing it out, so the CO₂ in the alveoli is diluted to a third.","why":{"0":"25% is what you would get with a four-fold increase.","2":"50% is what you would get with a two-fold increase.","3":"100% would mean ventilation has no effect on PCO₂, which contradicts the inverse relationship.","4":"300% treats the relationship as direct; more ventilation actually lowers PCO₂."},"one":"With constant CO₂ production, alveolar PCO₂ is inversely proportional to alveolar ventilation, so tripling ventilation brings PCO₂ to about 33%."},"w11_pulm_phys-3":{"q":"Which of the following is most likely to change during a heavy physical workout in a normal healthy individual?","o":["Anatomic dead space increases.","Alveolar ventilation increases.","Total lung volume decreases.","Tidal volume decreases.","Alveolar dead space ventilation increases."],"a":1,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q3) / 8b. Pulmonary Physiology 2026.pdf, slides 10, 75","img":[{"u":"img/w11_pulm_phys/p10.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 10","w":1200,"h":900},{"u":"img/w11_pulm_phys/p75.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 75","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Why this is correct**\n\nDuring exercise, muscles use much more O₂ and produce much more CO₂. The body adjusts tidal volume and breathing rate to keep arterial PO₂ and PCO₂ in the normal range. Both tidal volume and rate rise, so VA = (tidal volume − dead space) × rate **increases** substantially.","why":{"0":"Anatomic dead space is the structural volume of the airways and does not meaningfully increase with exercise.","2":"Total lung capacity is the maximal volume of the lungs and does not decrease during a workout.","3":"Tidal volume actually increases during exercise.","4":"Alveolar dead space (alveoli that are ventilated but not perfused) does not increase in a healthy person during exercise. If anything it decreases, because the higher cardiac output spreads blood flow more evenly up to the lung apices. Increased alveolar dead space is a disease situation such as pulmonary embolism."},"one":"During heavy exercise, tidal volume and breathing rate rise, so alveolar ventilation increases."},"w11_pulm_phys-4":{"q":"What accounts for the difference in PO2 between dry ambient air and air in the conducting airways?","o":["The diluting effect of CO2.","Water vapor in the ambient air.","Water vapor in the conducting airways.","Turbulence in the larger airways.","Resistance in the small airways."],"a":2,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q4) / 8b. Pulmonary Physiology 2026.pdf, slide 12","img":[{"u":"img/w11_pulm_phys/p12.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 12","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Key formula**\n\nPIO₂ = (Patm − PH₂O) × 0.21 = (760 − 47) × 0.21 ≈ **150 mmHg** (sea level)\n\nThe PO₂ of dry ambient air is 760 × 0.21 ≈ 160 mmHg. As air passes through the nose and airways, it is warmed to body temperature (37 °C) and **fully saturated with water vapor**. At 37 °C water vapor pressure is always 47 mmHg. The total pressure (760) stays the same, but water vapor takes up 47 mmHg of it, leaving 713 mmHg for the other gases (O₂, N₂). That is why the O₂ partial pressure drops to about 150 mmHg (Dalton's law).","why":{"0":"CO₂ dilution happens in the alveoli. It is the step from 150 to about 100 mmHg in the alveolar gas equation PAO₂ = PIO₂ − PaCO₂/R, not the conducting-airway step.","1":"The question says \"dry\" ambient air, so there is no water vapor in it.","3":"Turbulence affects airflow, not partial pressure.","4":"Resistance affects airflow, not partial pressure."},"one":"The PO₂ difference between dry ambient air and conducting-airway
