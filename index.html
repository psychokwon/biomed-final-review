"exp":"**Why this is correct**\n\nBlood flow = pressure difference (ΔP) / resistance (R), and resistance is proportional to vessel length and viscosity and **inversely proportional to the fourth power of the radius**. If the diameter is halved, resistance rises 2⁴ = 16-fold and flow falls to 1/16. Because even a tiny change in diameter changes flow enormously, arteriolar diameter (smooth muscle contraction and relaxation) is the dominant control on flow. That is why arterioles are called \"resistance vessels.\"","why":{"0":"The pressure difference between the right and left ventricles is not the driving pressure across an arteriole and is unrelated to its flow.","1":"Contractility affects total cardiac output, but how flow is distributed to an individual arteriole is determined by that arteriole's diameter.","2":"Venous return affects total cardiac output, but how flow is distributed to an individual arteriole is determined by that arteriole's diameter.","3":"Viscosity also affects resistance, but only to the first power, far less than the fourth power of the radius, and it barely changes under normal conditions."},"one":"The biggest influence on arteriolar blood flow is arteriolar diameter, since resistance varies inversely with the fourth power of the radius."},"w11_cv_phys-25":{"q":"Isovolumic contraction occurs between which points on the loop?","o":["1 and 2","4 and 1","2 and 3","3 and 4"],"a":0,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q25) / 9b. Cardiovascular Physiology 2026.pdf, slides 53, 54","img":[{"u":"img/w11_cv_phys/p53.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 53","w":1200,"h":900},{"u":"img/w11_cv_phys/p54.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 54","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Reading the pressure-volume loop**\n\nThe loop runs counterclockwise (follow the arrows).\n\n· **Point 1** (about 140 mL, low pressure): end-diastole (EDV). **Mitral valve closes.**\n\n· **1 → 2**: volume stays at 140 mL while pressure rises steeply → **isovolumetric contraction**\n\n· **Point 2** (about 80 mmHg): **aortic valve opens**\n\n· **2 → 3**: volume falls from 140 to 70 mL as pressure passes its peak → **ejection**\n\n· **Point 3**: end-systole (ESV). **Aortic valve closes.**\n\n· **3 → 4**: volume stays at 70 mL while pressure drops steeply → **isovolumetric relaxation**\n\n· **Point 4**: **mitral valve opens**\n\n· **4 → 1**: volume increases at low pressure → **filling**\n\nStroke volume = EDV − ESV = 140 − 70 ≈ 70 mL.\n\n**Why this is correct**\n\nIsovolumetric contraction is the segment where pressure rises with no change in volume: the **vertical line on the right going up (1 → 2)**.","why":{"1":"4 → 1 is filling.","2":"2 → 3 is ejection.","3":"3 → 4 is the vertical line going down: isovolumetric **relaxation**."},"one":"On the pressure-volume loop, isovolumetric contraction occurs between points 1 and 2 (pressure rises with no volume change).","fig":{"u":"img/w11_cv_phys/fig_pvloop.webp","cap":"Left ventricular pressure-volume loop (9a Study Q25–27)"}},"w11_cv_phys-26":{"q":"Which of the following normally occurs between points 2 and 3?","o":["Developed afterload","Energy transfer to the wall of the aorta.","A decrease in left ventricular volume.","Ejection of blood into the aorta.","Each of the above."],"a":4,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q26) / 9b. Cardiovascular Physiology 2026.pdf, slides 53, 54","img":[{"u":"img/w11_cv_phys/p53.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 53","w":1200,"h":900},{"u":"img/w11_cv_phys/p54.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 54","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\n2 → 3 is the **ejection phase**, when the aortic valve is open. All four events happen during this segment:\n\n· A: The ventricle pushes blood out against aortic pressure, its **afterload**.\n\n· B: Ejected blood stretches the elastic aortic wall, storing energy that keeps blood moving during diastole.\n\n· C: As blood leaves, left ventricular volume **decreases** from 140 to 70 mL (the loop moves left).\n\n· D: Blood is **ejected** into the aorta.\n\nSo the answer is **E (each of the above)**.","why":{"0":"Between points 2 and 3 is ejection, so the ventricle does push against aortic pressure (afterload). But that isn't the only event; A–D all occur, so the answer is E.","1":"Ejected blood does stretch the elastic aortic wall and store energy. But that isn't the only event; A–D all occur, so the answer is E.","2":"Left ventricular volume does decrease as blood leaves (the loop moves left). But that isn't the only event; A–D all occur, so the answer is E.","3":"Blood is ejected into the aorta. But that isn't the only event; A–D all occur, so the answer is E."},"one":"Between points 2 and 3 (ejection), afterload is developed, energy is transferred to the aortic wall, LV volume falls, and blood is ejected into the aorta.","fig":{"u":"img/w11_cv_phys/fig_pvloop.webp","cap":"Left ventricular pressure-volume loop (9a Study Q25–27)"}},"w11_cv_phys-27":{"q":"The aortic valve normally closes at which point on the loop?","o":["1","2","3","4"],"a":2,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q27) / 9b. Cardiovascular Physiology 2026.pdf, slides 53, 54","img":[{"u":"img/w11_cv_phys/p53.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 53","w":1200,"h":900},{"u":"img/w11_cv_phys/p54.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 54","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nAt **point 3**, where ejection (2 → 3) ends, ventricular pressure falls below aortic pressure and the aortic valve closes (S2). Isovolumetric relaxation (3 → 4) then begins. The volume at point 3 is the end-systolic volume (ESV).","why":{"0":"Point 1 is where the mitral valve **closes** (S1, start of isovolumetric contraction).","1":"Point 2 is where the aortic valve **opens**.","3":"Point 4 is where the mitral valve **opens** (start of filling). Memory aid: the four corners of the loop are the four valve events (1 mitral closes → 2 aortic opens → 3 aortic closes → 4 mitral opens)."},"one":"The aortic valve closes at point 3, where ejection ends.","fig":{"u":"img/w11_cv_phys/fig_pvloop.webp","cap":"Left ventricular pressure-volume loop (9a Study Q25–27)"}},"w11_cv_phys-28":{"q":"What is the effect of increased filling time on ventricular function?","o":["A decrease in cardiac output.","A decrease in end-diastolic volume.","A decrease in end-systolic volume.","An increase in end-diastolic volume.","An increase in end-systolic volume."],"a":3,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q28) / 9b. Cardiovascular Physiology 2026.pdf, slide 57","img":[{"u":"img/w11_cv_phys/p57.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 57","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nIncreases in filling pressure, **filling time**, and ventricular compliance increase EDV. If the ventricle has more time to receive blood, it naturally fills more; a slower heart rate is the classic example. And by the Frank-Starling law, a larger EDV increases stroke volume.","why":{"0":"A larger EDV increases stroke volume, so increased filling time by itself does not decrease cardiac output.","1":"EDV increases, not decreases.","2":"ESV is determined jointly by preload, afterload, heart rate, and contractility; the direct, characteristic effect of filling time is an increase in EDV.","4":"ESV is determined jointly by preload, afterload, heart rate, and contractility; the direct, characteristic effect of filling time is an increase in EDV."},"one":"Increased filling time increases end-diastolic volume (EDV)."},"w11_cv_phys-29":{"q":"A patient with long-standing coronary artery disease also has advanced CHF. What physical findings are most likely to be present in this patient?","o":["Exercise intolerance.","Swelling of the ankles.","A shift in the location of the apical beat toward the left on the chest.","An enlarged heart.","Each of the above"],"a":4,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q29) / 9b. Cardiovascular Physiology 2026.pdf, slide 79","img":[{"u":"img/w11_cv_phys/p79.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 79","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\n· A, exercise intolerance: a damaged heart cannot raise cardiac output enough during exercise, because its cardiac function curve is shifted down.\n\n· B, ankle swelling: in right heart failure, venous pressure rises and systemic capillary filtration increases, causing **edema**, which collects in the ankles because of gravity.\n\n· C and D, enlarged heart and displaced apical beat: in chronic heart failure, blood volume rises and the ventricles stretch, so **the heart enlarges**. The enlarged left ventricle displaces the apical beat (the point of strongest impulse) down and to the left of its normal position (left 5th intercostal space, midclavicular line).\n\nAll four can be seen in advanced CHF, so the answer is **E**.","why":{"0":"Exercise intolerance occurs because a damaged heart cannot raise cardiac output enough during exercise. But in advanced CHF all of A–D can be present, so the answer is E.","1":"In right heart failure, raised venous pressure increases systemic capillary filtration, so ankle edema is common. But all of A–D can be present, so the answer is E.","2":"The enlarged left ventricle displaces the apical beat down and to the left. But all of A–D can be present, so the answer is E.","3":"In chronic heart failure, blood volume rises and the ventricles stretch, enlarging the heart. But all of A–D can be present, so the answer is E."},"one":"Advanced congestive heart failure can show exercise intolerance, ankle edema, a leftward-displaced apical beat, and an enlarged heart."},"w11_cv_phys-30":{"q":"Stroke volume of the heart is defined as","o":["cardiac output plus end-systolic volume.","cardiac output minus end-diastolic volume.","end-diastolic volume minus end-systolic volume.","end-systolic volume minus end-diastolic volume.","heart rate times mean arterial pressure."],"a":2,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q30) / 9b. Cardiovascular Physiology 2026.pdf, slide 52","img":[{"u":"img/w11_cv_phys/p52.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 52","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nStroke volume is **the difference between end-diastolic volume (EDV) and end-systolic volume (ESV)**. Subtract the volume left after contraction (ESV) from the volume when the ventricle is full (EDV), and you get the amount ejected per beat. Using the pressure-volume loop example: 140 − 70 = 70 mL. Related formulas:\n\n· Cardiac output (CO) = heart rate × stroke volume (about 5 L/min)\n\n· Ejection fraction = stroke volume / EDV","why":{"0":"Cardiac output (L/min) and volumes (mL) have different units, so they cannot be added or subtracted.","1":"Cardiac output (L/min) and volumes (mL) have different units, so they cannot be added or subtracted.","3":"The order is reversed, giving a negative number.","4":"This is a meaningless combination, designed to be confused with mean arterial pressure ≈ cardiac output × total peripheral resistance."},"one":"Stroke volume is end-diastolic volume minus end-systolic volume."},"w11_cv_phys-31":{"q":"The initial effect of a significant loss of blood prior to any compensatory action.","o":["Point a (left graph)","Point b (left graph)","Point c (left graph)","Point d (right graph)","Point e (right graph)"],"a":0,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q31) / 9b. Cardiovascular Physiology 2026.pdf, slides 60, 76, 77","img":[{"u":"img/w11_cv_phys/p60.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 60","w":1200,"h":900},{"u":"img/w11_cv_phys/p76.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 76","w":1200,"h":900},{"u":"img/w11_cv_phys/p77.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 77","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**How to read the graphs**\n\n· **Cardiac function curve**: rises from the lower left and then flattens. It shows the Frank-Starling relationship: cardiac output increases as right atrial pressure (PRA, preload) rises. Increased contractility shifts the curve **up** (counterclockwise); myocardial damage shifts it **down** (clockwise).\n· **Vascular function curve**: a line sloping down from upper left to lower right. Venous return falls as right atrial pressure rises. The point where it meets the x-axis (venous return = 0) is the **mean systemic filling pressure**, set by blood volume and vascular compliance. Decreased blood volume shifts the line **in parallel to the left**; increased volume shifts it **to the right**.\n· The **intersection** of the two curves gives the actual cardiac output (= venous return) and right atrial pressure.\n\n**Points in the figure**\n**Left graph**\n· **N**: normal cardiac curve × normal vascular curve (PRA about 1.5 mmHg, cardiac output about 5.4 L/min)\n· **a**: normal cardiac curve × leftmost dashed vascular curve (about 0.5 mmHg, about 4 L/min)\n· **b**: raised gray cardiac curve × second dashed vascular curve from the left (about 0.2 mmHg, about 5.4 L/min)\n· **c**: raised gray cardiac curve × right-shifted dashed vascular curve (about 1 mmHg, about 7.3 L/min)\n**Right graph**\n· **N**: normal intersection (about 1.5 mmHg, about 5.4 L/min)\n· **d**: lowest cardiac curve × normal vascular curve (about 3.7 mmHg, about 3.2 L/min)\n· **e**: middle dashed cardiac curve × right-shifted dashed vascular curve (about 3.5 mmHg, about 4.7 L/min)\n\n**Interpretation**\n\nHemorrhage reduces blood volume, which lowers the mean systemic filling pressure, so the vascular function curve shifts **in parallel to the left**. Because no compensation (sympathetic activation) has occurred yet, the heart itself is unchanged and stays on the **normal cardiac function curve**. The intersection of the normal cardiac curve with the far-left-shifted vascular curve is **a**. Here right atrial pressure falls (about 1.5 → 0.5 mmHg) and cardiac output falls too (about 5.4 → 4 L/min). In other words: venous return drops → preload drops → cardiac output decreases.","why":{"1":"Point b is the compensatory response to hemorrhage: the cardiac curve moves up and the vascular curve shifts back slightly to the right of a, so cardiac output recovers to nearly normal.","2":"Point c is the effect of strenuous exercise: the cardiac curve shifts up and the vascular curve shifts right, giving the highest cardiac output.","3":"Point d is the effect of myocardial infarction before compensation: on the right graph, the cardiac curve shifts down while the vascular curve stays normal.","4":"Point e is fluid-retention compensation for congestive heart failure: the intersection on the right graph with a right-shifted vascular curve."},"one":"The initial effect of hemorrhage before compensation is point a, where the vascular function curve has shifted left.","fig":{"u":"img/w11_cv_phys/fig_curves.webp","cap":"Cardiac & vascular function curves (9a Q31–35; red labels a–e, N added for reference)"}},"w11_cv_phys-32":{"q":"Compensatory response to blood loss.","o":["Point a (left graph)","Point b (left graph)","Point c (left graph)","Point d (right graph)","Point e (right graph)"],"a":1,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q32) / 9b. Cardiovascular Physiology 2026.pdf, slides 60, 76, 77","img":[{"u":"img/w11_cv_phys/p60.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 60","w":1200,"h":900},{"u":"img/w11_cv_phys/p76.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 76","w":1200,"h":900},{"u":"img/w11_cv_phys/p77.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 77","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**How to read the graphs**\n\n· **Cardiac function curve**: rises from the lower left and then flattens. It shows the Frank-Starling relationship: cardiac output increases as right atrial pressure (PRA, preload) rises. Increased contractility shifts the curve **up** (counterclockwise); myocardial damage shifts it **down** (clockwise).\n· **Vascular function curve**: a line sloping down from upper left to lower right. Venous return falls as right atrial pressure rises. The point where it meets the x-axis (venous return = 0) is the **mean systemic filling pressure**, set by blood volume and vascular compliance. Decreased blood volume shifts the line **in parallel to the left**; increased volume shifts it **to the right**.\n· The **intersection** of the two curves gives the actual cardiac output (= venous return) and right atrial pressure.\n\n**Points in the figure**\n**Left graph**\n· **N**: normal cardiac curve × normal vascular curve (PRA about 1.5 mmHg, cardiac output about 5.4 L/min)\n· **a**: normal cardiac curve × leftmost dashed vascular curve (about 0.5 mmHg, about 4 L/min)\n· **b**: raised gray cardiac curve × second dashed vascular curve from the left (about 0.2 mmHg, about 5.4 L/min)\n· **c**: raised gray cardiac curve × right-shifted dashed vascular curve (about 1 mmHg, about 7.3 L/min)\n**Right graph**\n· **N**: normal intersection (about 1.5 mmHg, about 5.4 L/min)\n· **d**: lowest cardiac curve × normal vascular curve (about 3.7 mmHg, about 3.2 L/min)\n· **e**: middle dashed cardiac curve × right-shifted dashed vascular curve (about 3.5 mmHg, about 4.7 L/min)\n\n**Interpretation**\n\nWith blood loss of more than about 10%, baroreceptor firing falls, so **sympathetic activity increases** and parasympathetic activity decreases. Two things follow:\n\n① Cardiac contractility and heart rate rise, shifting the cardiac function curve **up** (gray curve).\n\n② Venoconstriction mobilizes stored blood and increases venous return. Mean systemic filling pressure partly recovers, and the vascular curve moves **slightly back to the right** of the curve through a (the second dashed line from the left).\n\nThe intersection of these two curves is **b**. Right atrial pressure is still low (about 0.2 mmHg), but cardiac output has recovered to near normal (about 5.4 L/min). This is the compensatory response bringing cardiac output back up.","why":{"0":"Point a is the initial effect of hemorrhage before compensation: the cardiac curve is normal and only the vascular curve has shifted far left, so cardiac output is reduced.","2":"Point c is the effect of strenuous exercise, the intersection with the highest cardiac output in the figure.","3":"Point d is the effect of myocardial infarction before compensation (right graph, cardiac curve shifted down).","4":"Point e is fluid-retention compensation for CHF (right graph, vascular curve shifted right)."},"one":"The compensatory response to hemorrhage is point b, where the cardiac curve has moved up and the vascular curve has partly recovered.","fig":{"u":"img/w11_cv_phys/fig_curves.webp","cap":"Cardiac & vascular function curves (9a Q31–35; red labels a–e, N added for reference)"}},"w11_cv_phys-33":{"q":"Effect of strenuous exercise.","o":["Point a (left graph)","Point b (left graph)","Point c (left graph)","Point d (right graph)","Point e (right graph)"],"a":2,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q33) / 9b. Cardiovascular Physiology 2026.pdf, slides 60, 73, 75","img":[{"u":"img/w11_cv_phys/p60.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 60","w":1200,"h":900},{"u":"img/w11_cv_phys/p73.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 73","w":1200,"h":900},{"u":"img/w11_cv_phys/p75.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 75","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**How to read the graphs**\n\n· **Cardiac function curve**: rises from the lower left and then flattens. It shows the Frank-Starling relationship: cardiac output increases as right atrial pressure (PRA, preload) rises. Increased contractility shifts the curve **up** (counterclockwise); myocardial damage shifts it **down** (clockwise).\n· **Vascular function curve**: a line sloping down from upper left to lower right. Venous return falls as right atrial pressure rises. The point where it meets the x-axis (venous return = 0) is the **mean systemic filling pressure**, set by blood volume and vascular compliance. Decreased blood volume shifts the line **in parallel to the left**; increased volume shifts it **to the right**.\n· The **intersection** of the two curves gives the actual cardiac output (= venous return) and right atrial pressure.\n\n**Points in the figure**\n**Left graph**\n· **N**: normal cardiac curve × normal vascular curve (PRA about 1.5 mmHg, cardiac output about 5.4 L/min)\n· **a**: normal cardiac curve × leftmost dashed vascular curve (about 0.5 mmHg, about 4 L/min)\n· **b**: raised gray cardiac curve × second dashed vascular curve from the left (about 0.2 mmHg, about 5.4 L/min)\n· **c**: raised gray cardiac curve × right-shifted dashed vascular curve (about 1 mmHg, about 7.3 L/min)\n**Right graph**\n· **N**: normal intersection (about 1.5 mmHg, about 5.4 L/min)\n· **d**: lowest cardiac curve × normal vascular curve (about 3.7 mmHg, about 3.2 L/min)\n· **e**: middle dashed cardiac curve × right-shifted dashed vascular curve (about 3.5 mmHg, about 4.7 L/min)\n\n**Interpretation**\n\nDuring exercise cardiac output rises substantially and the cardiac function curve **shifts up (counterclockwise)**, because sympathetic activity increases contractility and heart rate. At the same time, contracting muscles squeeze the veins (the muscle pump) and venoconstriction mobilizes blood, increasing venous return, so the vascular curve shifts **to the right**. At **c**, the intersection of the raised gray cardiac curve with the right-shifted dashed vascular curve, cardiac output is highest (about 7.3 L/min). It is the point with the maximum cardiac output of the five, so it corresponds to exercise.","why":{"0":"Point a is the initial effect of hemorrhage before compensation, with reduced cardiac output, not the maximal output of exercise.","1":"Point b is where cardiac output has recovered to near normal as compensation for hemorrhage, not maximal output from exercise.","3":"Point d is where cardiac output has fallen from myocardial infarction before compensation.","4":"Point e is fluid-retention compensation for CHF, with below-normal cardiac output and high right atrial pressure."},"one":"Strenuous exercise is point c, where the cardiac curve has shifted up and the vascular curve right, giving the highest cardiac output.","fig":{"u":"img/w11_cv_phys/fig_curves.webp","cap":"Cardiac & vascular function curves (9a Q31–35; red labels a–e, N added for reference)"}},"w11_cv_phys-34":{"q":"Effect of myocardial infarction before any compensatory response.","o":["Point a (left graph)","Point b (left graph)","Point c (left graph)","Point d (right graph)","Point e (right graph)"],"a":3,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q34) / 9b. Cardiovascular Physiology 2026.pdf, slides 60, 79","img":[{"u":"img/w11_cv_phys/p60.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 60","w":1200,"h":900},{"u":"img/w11_cv_phys/p79.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 79","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**How to read the graphs**\n\n· **Cardiac function curve**: rises from the lower left and then flattens. It shows the Frank-Starling relationship: cardiac output increases as right atrial pressure (PRA, preload) rises. Increased contractility shifts the curve **up** (counterclockwise); myocardial damage shifts it **down** (clockwise).\n· **Vascular function curve**: a line sloping down from upper left to lower right. Venous return falls as right atrial pressure rises. The point where it meets the x-axis (venous return = 0) is the **mean systemic filling pressure**, set by blood volume and vascular compliance. Decreased blood volume shifts the line **in parallel to the left**; increased volume shifts it **to the right**.\n· The **intersection** of the two curves gives the actual cardiac output (= venous return) and right atrial pressure.\n\n**Points in the figure**\n**Left graph**\n· **N**: normal cardiac curve × normal vascular curve (PRA about 1.5 mmHg, cardiac output about 5.4 L/min)\n· **a**: normal cardiac curve × leftmost dashed vascular curve (about 0.5 mmHg, about 4 L/min)\n· **b**: raised gray cardiac curve × second dashed vascular curve from the left (about 0.2 mmHg, about 5.4 L/min)\n· **c**: raised gray cardiac curve × right-shifted dashed vascular curve (about 1 mmHg, about 7.3 L/min)\n**Right graph**\n· **N**: normal intersection (about 1.5 mmHg, about 5.4 L/min)\n· **d**: lowest cardiac curve × normal vascular curve (about 3.7 mmHg, about 3.2 L/min)\n· **e**: middle dashed cardiac curve × right-shifted dashed vascular curve (about 3.5 mmHg, about 4.7 L/min)\n\n**Interpretation**\n\nWhen the myocardium is damaged, cardiac performance declines and the cardiac function curve **shifts down (clockwise)**. Before any compensation, blood volume and the vessels are unchanged, so the vascular function curve stays **normal**. The intersection of the lowest cardiac curve with the normal vascular curve is **d**. Here cardiac output falls (about 5.4 → 3.2 L/min) and right atrial pressure rises (about 1.5 → 3.7 mmHg), because the heart can't pump out all the blood it receives and blood backs up in front of it (congestion).","why":{"0":"Point a is the initial effect of hemorrhage: the vascular curve shifts left while the heart is still normal. Myocardial infarction shifts the cardiac curve down.","1":"Point b is sympathetic compensation for hemorrhage, not the initial effect of myocardial damage.","2":"Point c is strenuous exercise, the point with the highest cardiac output.","4":"Point e is after fluid-retention compensation following myocardial damage, not the intersection before compensation."},"one":"Myocardial infarction before compensation is point d, where the cardiac curve has shifted down and the vascular curve is normal.","fig":{"u":"img/w11_cv_phys/fig_curves.webp","cap":"Cardiac & vascular function curves (9a Q31–35; red labels a–e, N added for reference)"}},"w11_cv_phys-35":{"q":"Increased fluid retention as a compensatory response to CHF.","o":["Point a (left graph)","Point b (left graph)","Point c (left graph)","Point d (right graph)","Point e (right graph)"],"a":4,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q35) / 9b. Cardiovascular Physiology 2026.pdf, slides 60, 79","img":[{"u":"img/w11_cv_phys/p60.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 60","w":1200,"h":900},{"u":"img/w11_cv_phys/p79.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 79","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**How to read the graphs**\n\n· **Cardiac function curve**: rises from the lower left and then flattens. It shows the Frank-Starling relationship: cardiac output increases as right atrial pressure (PRA, preload) rises. Increased contractility shifts the curve **up** (counterclockwise); myocardial damage shifts it **down** (clockwise).\n· **Vascular function curve**: a line sloping down from upper left to lower right. Venous return falls as right atrial pressure rises. The point where it meets the x-axis (venous return = 0) is the **mean systemic filling pressure**, set by blood volume and vascular compliance. Decreased blood volume shifts the line **in parallel to the left**; increased volume shifts it **to the right**.\n· The **intersection** of the two curves gives the actual cardiac output (= venous return) and right atrial pressure.\n\n**Points in the figure**\n**Left graph**\n· **N**: normal cardiac curve × normal vascular curve (PRA about 1.5 mmHg, cardiac output about 5.4 L/min)\n· **a**: normal cardiac curve × leftmost dashed vascular curve (about 0.5 mmHg, about 4 L/min)\n· **b**: raised gray cardiac curve × second dashed vascular curve from the left (about 0.2 mmHg, about 5.4 L/min)\n· **c**: raised gray cardiac curve × right-shifted dashed vascular curve (about 1 mmHg, about 7.3 L/min)\n**Right graph**\n· **N**: normal intersection (about 1.5 mmHg, about 5.4 L/min)\n· **d**: lowest cardiac curve × normal vascular curve (about 3.7 mmHg, about 3.2 L/min)\n· **e**: middle dashed cardiac curve × right-shifted dashed vascular curve (about 3.5 mmHg, about 4.7 L/min)\n\n**Interpretation**\n\nIn chronic congestive heart failure, where cardiac output cannot return to normal, the kidneys retain water and Na⁺ through RAAS and other mechanisms, so **blood volume increases**. Higher blood volume raises the mean systemic filling pressure and shifts the vascular curve **to the right**. At the same time, sympathetic compensation raises the cardiac curve **slightly above** the curve through d (the middle dashed curve). The intersection of these two curves is **e**. Cardiac output has recovered compared with d (about 4.7 L/min) but remains below normal, and right atrial pressure stays high (about 3.5 mmHg). The high venous pressure increases capillary filtration and causes edema.\n\nNote: the middle dashed cardiac curve on the right graph is interpreted here as a heart partly recovered by sympathetic compensation; the figure doesn't label it, so that part relies on interpretation. The rightward shift of the vascular curve from fluid retention, however, is what defines point e.","why":{"0":"Point a is the initial effect of hemorrhage (reduced blood volume, vascular curve shifted left), not fluid-retention compensation with increased blood volume.","1":"Point b is acute sympathetic compensation for hemorrhage, not the fluid retention of chronic CHF.","2":"Point c is the effect of strenuous exercise, the point of maximal cardiac output.","3":"Point d is the effect of myocardial infarction before compensation, the intersection before fluid retention shifts the vascular curve right."},"one":"Fluid-retention compensation for CHF is point e, where the vascular curve has shifted right.","fig":{"u":"img/w11_cv_phys/fig_curves.webp","cap":"Cardiac & vascular function curves (9a Q31–35; red labels a–e, N added for reference)"}},"w11_mycology-1":{"q":"In the lecture overview, what meaning was written above the term saprophytic?","o":["Feed on dead matter.","Feed on living host tissue only.","Produce chlorophyll like plants.","Lack a membrane-enclosed nucleus.","Cannot cause poisoning, only infection."],"a":0,"src":"Mycology 2026.pdf, slide 2","img":[{"u":"img/w11_mycology/p02.webp","cap":"Mycology 2026.pdf, slide 2","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"Fungi are eukaryotes that are either saprophytic or parasitic. Above \"saprophytic\" the handwritten note reads **feed on dead matter**. In nature, most fungi play exactly this role as decomposers.","why":{"1":"The note says they feed on dead matter. Feeding only on living host tissue is closer to \"parasitic,\" not saprophytic.","2":"Unlike plants, fungi have no chlorophyll or chloroplasts.","3":"Fungi are eukaryotes with a membrane-enclosed nucleus; organisms without one are bacteria.","4":"In the same overview, it is underlined that fungi can cause both poisoning and infection."},"one":"Saprophytic means feeding on dead matter."},"w11_mycology-2":{"q":"Why can fungi not be treated with antibiotics that target peptidoglycan, as annotated next to chitin?","o":["Fungal membranes contain cholesterol instead of ergosterol.","The fungal cell wall is composed largely of chitin.","Fungi lack a membrane-enclosed nucleus.","Fungi are prokaryotes like bacteria.","Fungi have chloroplasts, so cell-wall drugs cannot enter."],"a":1,"src":"Mycology 2026.pdf, slide 3","img":[{"u":"img/w11_mycology/p03.webp","cap":"Mycology 2026.pdf, slide 3","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"The fungal cell wall is composed largely of **chitin**. These words are circled together, with the note **can't use antibiotics that target peptidoglycan** beside them. So fungi are not affected by antibiotics that block peptidoglycan synthesis.","why":{"0":"The sterol in fungal membranes is ergosterol, not mammalian cholesterol, and this is about the membrane, not the cell wall.","2":"Fungi are eukaryotes with a membrane-enclosed nucleus and organelles.","3":"Fungi are eukaryotes; the prokaryotes are bacteria.","4":"Fungi have no chlorophyll or chloroplasts. The reason these drugs don't work is that the cell wall is chitin, not peptidoglycan."},"one":"The fungal cell wall is chitin, so antibiotics that target peptidoglycan don't work."},"w11_mycology-3":{"q":"The lecture circled ergosterol and noted that antifungals target this component. What happens if ergosterol biosynthesis is disrupted?","o":["The fungus switches from yeast to mold.","Peptidoglycan synthesis is inhibited.","The result is fungal cell death.","The fungal cell wall is replaced by cellulose.","Mammalian cholesterol synthesis is also required for fungal survival."],"a":2,"src":"Mycology 2026.pdf, slide 3","img":[{"u":"img/w11_mycology/p03.webp","cap":"Mycology 2026.pdf, slide 3","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"Fungal membranes contain **ergosterol** in place of the cholesterol found in mammalian membranes. Ergosterol is circled in large, with the note that **antifungals target this component**. Because ergosterol is an essential part of the fungal cell membrane, disrupting its biosynthesis results in **cell death**.","why":{"0":"Switching between yeast and mold is about dimorphism, not a result of blocking ergosterol biosynthesis.","1":"Peptidoglycan is a bacterial cell wall component; the fungal cell wall is chitin.","3":"The main component of the fungal cell wall is chitin, not cellulose, and ergosterol is a membrane component.","4":"Mammalian membranes use cholesterol and fungi use ergosterol; fungal survival does not depend on mammalian cholesterol synthesis."},"one":"Disrupting ergosterol biosynthesis kills fungal cells, which makes it a target for antifungals."},"w11_mycology-4":{"q":"Which three basic forms of fungal growth were underlined and starred?","o":["Virus, bacterium, and protozoan.","Septate, nonseptate, and spore.","Saprophyte, parasite, and allergen.","Filamentous mold, unicellular yeast, and dimorphic.","Conidium, sporangium, and spherule."],"a":3,"src":"Mycology 2026.pdf, slide 4","img":[{"u":"img/w11_mycology/p04.webp","cap":"Mycology 2026.pdf, slide 4","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"The three basic forms are **multicellular, filamentous mold**, **unicellular, non-filamentous yeast**, and **dimorphic** (alternating between filamentous and unicellular). The mold and yeast phrases are wavy-underlined and starred, and dimorphic is also starred and underlined. These three forms are the framework for classifying the pathogens that follow.","why":{"0":"Viruses, bacteria, and protozoa are not fungal growth forms; fungi are eukaryotes distinct from all of them.","1":"Septate and nonseptate describe mold hyphae in more detail; they are not the three starred basic forms.","2":"Saprophyte and parasite are modes of nutrition, and allergen is a property of spores.","4":"Conidia, sporangia, and spherules are spore or tissue forms, not the three starred basic growth forms."},"one":"The three starred basic forms are mold, yeast, and dimorphic."},"w11_mycology-5":{"q":"Which relationship was circled and underlined for filamentous mold?","o":["A single unconnected spheroid cell is called a mycelium.","Yeasts grow only by forming septate hyphae.","Spores are the same thing as a mycelium.","Dimorphic fungi cannot form hyphae at any temperature.","Threads are hyphae; the branched mass of those threads is a mycelium."],"a":4,"src":"Mycology 2026.pdf, slide 5","img":[{"u":"img/w11_mycology/p05.webp","cap":"Mycology 2026.pdf, slide 5","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"**Many branches** is wavy-underlined, **threads = hyphae** is circled, and the mass of them is underlined as the **mycelium**. Each hypha is a thread, and the whole tangled mass of endlessly branching threads is the mycelium. The mycelium grows by branching and tip extension.","why":{"0":"A single unconnected spheroid cell is the definition of a yeast; a mycelium is a mass of threads.","1":"Yeasts are generally unicellular and reproduce by budding; they don't grow only by forming septate hyphae.","2":"Spores are a means of reproduction and dispersal; the mycelium is the mass of hyphae.","3":"Dimorphic fungi switch between a hyphal (mold) form and a yeast form depending on the environment."},"one":"Threads are hyphae, and the branched mass of those threads is the mycelium."},"w11_mycology-6":{"q":"What did the lecture emphasize about septate hyphae?","o":["Septate hyphae are perforated so that the cytoplasm of the hyphae is continuous.","Septate means the hyphae have no crosswalls at all.","Nonseptate hyphae are partitioned into segments by pores.","Only yeasts form septate hyphae.","Septate walls completely isolate each cell so cytoplasm cannot mix."],"a":0,"src":"Mycology 2026.pdf, slide 5","img":[{"u":"img/w11_mycology/p05.webp","cap":"Mycology 2026.pdf, slide 5","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"**Septate** and **nonseptate** are underlined. Septate hyphae are divided into segments by crosswalls, but those septa are **perforated**, so the **cytoplasm is continuous**. Nonseptate hyphae run on without crosswalls.","why":{"1":"Having no crosswalls is nonseptate; septate hyphae are divided by crosswalls.","2":"Being divided by perforated crosswalls describes septate hyphae; nonseptate hyphae have no crosswalls.","3":"Septate and nonseptate are forms of mold hyphae; yeasts are single cells.","4":"The septa have pores, so the cytoplasm is continuous; the cells are not completely isolated."},"one":"Septate hyphae have perforations, so their cytoplasm is continuous."},"w11_mycology-7":{"q":"A brace in the dimorphic lecture grouped the definition, the conditions that change morphology, and which clinical point?","o":["They cause only superficial skin discoloration.","They are mainly fungi that cause systemic mycoses (lungs).","They are never found at 37°C.","They reproduce only by sexual meiosis.","They lack ergosterol in their membranes."],"a":1,"src":"Mycology 2026.pdf, slide 8","img":[{"u":"img/w11_mycology/p08.webp","cap":"Mycology 2026.pdf, slide 8","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"**Dimorphic** is underlined, and a brace groups the definition (yeast in one environment, mold in another), the conditions that change morphology, **temperature and CO₂**, and the statement that they are **mainly fungi that cause systemic mycoses**. Next to systemic mycoses, **lungs** is written. Examples given are *Blastomyces dermatitidis* and *Histoplasma capsulatum*.","why":{"0":"Superficial discoloration describes superficial infections like tinea versicolor, not the key point about dimorphic systemic fungi.","2":"At body temperature (37 °C, inside the body) they are usually in the yeast form; it is not that they never appear at 37 °C.","3":"The essence of dimorphism is switching form with the environment, not reproducing only sexually.","4":"Fungal membranes contain ergosterol; this is unrelated to the definition of dimorphism."},"one":"Dimorphic fungi change form with temperature and CO₂ and mainly cause systemic mycoses of the lungs."},"w11_mycology-8":{"q":"On the dimorphic comparison chart, what labels were written above in vitro (25°C) and in vivo (37°C)?","o":["In vitro = in body (yeast); in vivo = environment (mold).","Both temperatures produce only spherules.","In vitro (25°C) = environment (mold); in vivo (37°C) = in body (yeast or spherule).","In vitro is always 37°C in the laboratory.","Dimorphic fungi cannot grow at 25°C."],"a":2,"src":"Mycology 2026.pdf, slide 9","img":[{"u":"img/w11_mycology/p09.webp","cap":"Mycology 2026.pdf, slide 9","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"Above **in vitro (25 °C)** on the left is written **environment**, and above **in vivo (37 °C)** on the right, **in body**. In the chart, 25 °C is the mold form, and 37 °C in the body is usually yeast. *Coccidioides*, however, becomes a **spherule** rather than a yeast in the body.","why":{"0":"The direction is reversed: 25 °C in vitro (environment) is mold; 37 °C in the body is yeast (or spherule).","1":"Only *Coccidioides* forms spherules; *Blastomyces*, *Histoplasma*, and others are yeasts in the body.","3":"In the chart, in vitro is 25 °C; 37 °C is in vivo.","4":"They grow as mold at 25 °C in the outside environment."},"one":"At 25 °C in the environment they are mold; at 37 °C in the body they are yeast (spherule for Coccidioides)."},"w11_mycology-9":{"q":"Which pairing was starred and circled for asexual versus sexual spores?","o":["Asexual spores are formed by meiosis; sexual spores by mitosis.","Both asexual and sexual spores are formed only by budding.","Sexual spores cannot be used for identification.","Asexual spores (e.g., conidia) are formed by mitosis; sexual spores are formed by meiosis.","Asexual sporulation occurs only inside the human body at 37°C."],"a":3,"src":"Mycology 2026.pdf, slide 11, 14","img":[{"u":"img/w11_mycology/p11.webp","cap":"Mycology 2026.pdf, slide 11","w":1200,"h":900},{"u":"img/w11_mycology/p14.webp","cap":"Mycology 2026.pdf, slide 14","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"At the upper left of the asexual sporulation description, **Sexual = meiosis** is written with a star, and the phrase **asexual spores (e.g., conidia) are formed by mitosis** is circled and starred. In the sexual spore description, **formed by meiosis** is again circled and starred, making the contrast clear: asexual = mitosis, sexual = meiosis.","why":{"0":"The direction is reversed: asexual is mitosis, sexual is meiosis.","1":"Budding is how yeasts reproduce (blastoconidia); it is not the only way all spores are formed.","2":"Spores, especially the shape and surface markings of sexual spores, can be the main or even the only means of identifying a species.","4":"Asexual spores are formed on specialized hyphae (conidiophores, etc.) and can spread through the air; they don't form only inside the body."},"one":"Asexual spores are formed by mitosis; sexual spores are formed by meiosis."},"w11_mycology-10":{"q":"How were asexual spores grouped in the handwritten labels on the sporulation diagram?","o":["All five types are produced only inside a sac.","Sexual spores were placed in the same five boxes.","Only Candida can form any of these spores.","Enclosed spores are always formed by meiosis.","Externally produced: conidiospores, blastoconidia, and arthroconidia; enclosed: chlamydospores and sporangiospores."],"a":4,"src":"Mycology 2026.pdf, slide 12","img":[{"u":"img/w11_mycology/p12.webp","cap":"Mycology 2026.pdf, slide 12","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"Asexual spores are labeled in two groups: **externally produced** and **enclosed**. The external group is **conidiospores/conidia** (e.g., *Aspergillus*), **blastoconidia** (buds that break off a mother cell, *C. albicans*), and **arthroconidia** (septate hyphae fragmenting into single cells). The enclosed group is **chlamydospores** and **sporangiospores** (formed inside a sporangium).","why":{"0":"Only sporangiospores form inside a sac (sporangium); conidiospores, blastoconidia, and arthroconidia are produced externally.","1":"This diagram classifies asexual spores.","2":"*Aspergillus* and others form conidiospores, and *Candida* forms blastoconidia and chlamydospores; it is not only *Candida*.","3":"All five types are asexual spores formed by mitosis; meiosis produces sexual spores."},"one":"Asexual spores are grouped into externally produced (conidiospores, blastoconidia, arthroconidia) and enclosed (chlamydospores, sporangiospores)."},"w11_mycology-11":{"q":"Which culture medium was wavy-underlined as the standard medium for fungal culture?","o":["Sabouraud dextrose agar.","MacConkey agar.","Thayer–Martin agar.","Löwenstein–Jensen medium.","Tellurite (Tinsdale) agar."],"a":0,"src":"Mycology 2026.pdf, slide 15","img":[{"u":"img/w11_mycology/p15.webp","cap":"Mycology 2026.pdf, slide 15","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"Fungi can use almost any organic material as a carbon source, so their nutritional needs are simple. **Sabouraud dextrose agar** is wavy-underlined and emphasized as the **standard medium** for fungal culture. Incubation usually takes 1–4 weeks at 25–30 °C.","why":{"1":"MacConkey agar is a selective medium for gram-negative bacteria, especially enteric bacteria.","2":"Thayer–Martin agar is a selective medium for *Neisseria* (gonococci and meningococci).","3":"Löwenstein–Jensen is a culture medium for mycobacteria.","4":"Tellurite (Tinsdale) agar is used to identify *Corynebacterium diphtheriae*."},"one":"The standard medium for fungal culture is Sabouraud dextrose agar."},"w11_mycology-12":{"q":"On the classification of fungal diseases, which category was struck through so that the lecture would not cover it?","o":["Cutaneous mycoses.","Subcutaneous mycoses.","Systemic mycoses.","Opportunistic mycoses.","Superficial (tinea versicolor) infections."],"a":1,"src":"Mycology 2026.pdf, slide 17","img":[{"u":"img/w11_mycology/p17.webp","cap":"Mycology 2026.pdf, slide 17","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"In the classification of fungal diseases, the **Subcutaneous** heading is struck through, while **cutaneous** and **systemic** are left in place. So this lecture focuses on cutaneous and systemic mycoses (followed by opportunistic infections) and does not cover subcutaneous mycoses.","why":{"0":"Cutaneous mycoses are left in, not struck through; tinea (dermatophytes) belongs here.","2":"Systemic mycoses are also left in; *Histoplasma*, *Blastomyces*, *Coccidioides*, *Cryptococcus*, and others follow.","3":"Opportunistic infections are covered later with *Candida*, *Pneumocystis*, and *Aspergillus*; they were not struck through.","4":"Tinea versicolor is covered separately as a superficial infection; the heading struck through is subcutaneous mycoses."},"one":"Subcutaneous mycoses are struck through; cutaneous and systemic mycoses are covered."},"w11_mycology-13":{"q":"Matching the handwritten site lists and the note “hair is micro thin,” which dermatophyte infects skin and hair but not nails?","o":["Trichophyton.","Epidermophyton.","Microsporum.","Malassezia furfur.","Cryptococcus neoformans."],"a":2,"src":"Mycology 2026.pdf, slide 19","img":[{"u":"img/w11_mycology/p19.webp","cap":"Mycology 2026.pdf, slide 19","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"The three genera are bracketed and starred. The handwritten sites are **Trichophyton: skin, hair, nails**; **Microsporum: skin, hair**; and **Epidermophyton: skin, nails**. Next to *Microsporum* is written **\"hair is micro thin\"**, a memory hook linking the \"micro\" genus to thin hair. So the genus that spares the nails is *Microsporum*.","why":{"0":"*Trichophyton* infects all three sites: skin, hair, and nails.","1":"*Epidermophyton* infects skin and nails but not hair.","3":"*Malassezia* is not a dermatophyte; it causes tinea versicolor, which involves only the stratum corneum.","4":"*Cryptococcus* is not a dermatophyte; it is a systemic (opportunistic) fungus."},"one":"Microsporum infects skin and hair only, not nails."},"w11_mycology-14":{"q":"What two features of dermatophyte infection were wavy-underlined under tinea / ringworm?","o":["Only nails are involved, and lesions are always square.","Lesions fluoresce red, and only the dermis is infected.","Hair is never involved, and lesions are painless vesicles.","Skin lesions form, and they have a circular shape.","Only zoophilic species cause circular lesions."],"a":3,"src":"Mycology 2026.pdf, slide 20","img":[{"u":"img/w11_mycology/p20.webp","cap":"Mycology 2026.pdf, slide 20","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"**Skin lesions** and **circular shape** are wavy-underlined. Tinea is a cutaneous mycosis that can involve skin, hair, and nails, and because its characteristic skin lesions are circular, it is also called ringworm. The causative organisms are keratin-eating molds called dermatophytes.","why":{"0":"Tinea is not limited to nails, and the lesions are circular; nothing describes them as square.","1":"Some species fluoresce under a Wood's lamp, but what is underlined here is the circular skin lesion. The key site of infection is the keratinized layer, not \"only the dermis.\"","2":"Hair can be involved (especially by *Trichophyton* and *Microsporum*); circular skin lesions are the key feature.","4":"Circular lesions are the general skin finding of tinea, not a feature unique to zoophilic species."},"one":"Tinea produces circular skin lesions."},"w11_mycology-15":{"q":"Which common-name pairings were starred and lined to the tinea terms?","o":["Tinea corporis is athlete’s foot; tinea pedis is jock itch.","Tinea capitis is onychomycosis; tinea unguium is scalp ringworm.","Tinea cruris is ringworm of the body; tinea corporis is jock itch.","Tinea versicolor is athlete’s foot.","Tinea pedis is athlete’s foot, tinea corporis is ringworm, tinea capitis is scalp ringworm, tinea cruris is jock itch, and tinea unguium is onychomycosis."],"a":4,"src":"Mycology 2026.pdf, slide 21","img":[{"u":"img/w11_mycology/p21.webp","cap":"Mycology 2026.pdf, slide 21","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"Stars and connecting lines pair the tinea terms with their common names: **tinea pedis = athlete's foot**, **tinea corporis = ringworm** (of the body), **tinea capitis = scalp ringworm**, **tinea cruris = jock itch**, and **tinea unguium = onychomycosis**. Tinea versicolor is not part of these pairings.","why":{"0":"Reversed: athlete's foot is tinea pedis, and jock itch is tinea cruris.","1":"Tinea capitis is scalp ringworm, and tinea unguium is onychomycosis; they are swapped.","2":"Tinea cruris is jock itch, and tinea corporis is ringworm of the body.","3":"Tinea versicolor is a superficial infection caused by *Malassezia*, not athlete's foot (tinea pedis)."},"one":"Pedis = athlete's foot, corporis = ringworm, capitis = scalp ringworm, cruris = jock itch, unguium = onychomycosis."},"w11_mycology-16":{"q":"What contrast was starred between anthropophilic dermatophytes and geophilic or zoophilic species?","o":["Anthropophilic species typically cause little inflammation; geophilic and zoophilic species cause inflammatory reactions.","Anthropophilic species always fluoresce; geophilic species never do.","Only geophilic species infect humans.","Zoophilic species cause no inflammation in humans.","Anthropophilic species infect only nails, never skin."],"a":0,"src":"Mycology 2026.pdf, slide 22","img":[{"u":"img/w11_mycology/p22.webp","cap":"Mycology 2026.pdf, slide 22","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"**Anthropophilic** species, spread from person to person, are emphasized with a star and line as causing **little inflammation**. By contrast, **geophilic** and **zoophilic** species are paired as causing **inflammatory** reactions. The host range of the source organism determines how intense the inflammation is.","why":{"1":"Fluorescence is a Wood's lamp finding in some species, not the content of this starred contrast.","2":"Anthropophilic species are the main source of person-to-person infection; geophilic species are not the only ones that infect humans.","3":"Zoophilic species actually tend to cause inflammation in humans; it is anthropophilic species that cause little.","4":"Anthropophilic species can involve skin, hair, and nails; they are not limited to nails."},"one":"Anthropophilic dermatophytes cause little inflammation; geophilic and zoophilic species cause inflammatory reactions."},"w11_mycology-17":{"q":"Which dermatophyte was arrowed as infecting skin, hair, and nails, and as the main cause of tinea pedis?","o":["Microsporum.","Trichophyton.","Epidermophyton.","Malassezia.","Sporothrix."],"a":1,"src":"Mycology 2026.pdf, slide 24","img":[{"u":"img/w11_mycology/p24.webp","cap":"Mycology 2026.pdf, slide 24","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"In the laboratory diagnosis section, an arrow points to ***Trichophyton*** with **skin, hair, nails** written beside it. In the same flow, **tinea pedis is mainly *Trichophyton*** is linked. Diagnosis relies on microscopy to see hyphae and conidia, with culture and Wood's lamp as aids.","why":{"0":"*Microsporum* infects skin and hair but not nails, and it is not the main cause of tinea pedis.","2":"*Epidermophyton* infects skin and nails but not hair; the arrow for the main cause of tinea pedis points to *Trichophyton*.","3":"*Malassezia* causes tinea versicolor, not typical dermatophyte tinea.","4":"*Sporothrix* causes a subcutaneous mycosis (sporotrichosis), and the subcutaneous category was struck out of this lecture."},"one":"Trichophyton infects skin, hair, and nails and is the main cause of tinea pedis."},"w11_mycology-18":{"q":"What did the starred arrow identify as a cause of tinea incognito?","o":["Failure to use any topical agent.","Oral griseofulvin given for every scalp infection.","Inappropriate use of topical steroids.","Wood’s lamp examination itself.","Application of allylamines to the nails only."],"a":2,"src":"Mycology 2026.pdf, slide 25","img":[{"u":"img/w11_mycology/p25.webp","cap":"Mycology 2026.pdf, slide 25","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"In the treatment section, **inappropriate use of topical steroids** is marked with an arrow and star, leading to **tinea incognito**. Steroids mask the typical appearance of tinea and make diagnosis difficult. Skin infections are usually treated with topical antifungals.","why":{"0":"Not using a topical agent is not what defines tinea incognito; the cause is misuse of steroids.","1":"Oral griseofulvin is a systemic drug used where indicated (e.g., the scalp); it is not a cause of tinea incognito.","3":"A Wood's lamp is a diagnostic tool; it doesn't mask the appearance of lesions.","4":"Allylamines are antifungals that block ergosterol synthesis; they don't cause tinea incognito."},"one":"Inappropriate use of topical steroids causes tinea incognito."},"w11_mycology-19":{"q":"Allylamines (e.g., terbinafine) and azoles share which mechanism, as shown by the arrows on the treatment slide?","o":["They inhibit fungal DNA gyrase.","They bind ergosterol already present and punch holes in the membrane.","They inhibit chitin synthesis in the cell wall.","They inhibit ergosterol synthesis.","They are converted into 5-fluorouracil inside fungal cells."],"a":3,"src":"Mycology 2026.pdf, slide 26","img":[{"u":"img/w11_mycology/p26.webp","cap":"Mycology 2026.pdf, slide 26","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"Arrows from both the allylamines (terbinafine, etc.) and the azoles point to **inhibit ergosterol synthesis**. Because ergosterol is an essential fungal membrane component, blocking its synthesis kills the fungus or stops its growth. In the same section, clotrimazole and miconazole are marked as the most common antifungals.","why":{"0":"DNA gyrase is the bacterial target of quinolone antibacterials, not the mechanism of these antifungals.","1":"Binding existing ergosterol and punching holes in the membrane is closer to the mechanism of amphotericin B; allylamines and azoles block synthesis.","2":"Chitin synthesis inhibition is not what these arrows show; the target is ergosterol synthesis.","4":"The drug converted to 5-fluorouracil is flucytosine."},"one":"Allylamines and azoles both inhibit ergosterol synthesis."},"w11_mycology-20":{"q":"Which pair was labeled “MOST COMMON anti-fungal meds”?","o":["Amphotericin B and nystatin.","Griseofulvin and terbinafine only.","Potassium iodide and flucytosine.","Fluconazole and itraconazole only.","Clotrimazole and miconazole."],"a":4,"src":"Mycology 2026.pdf, slide 26","img":[{"u":"img/w11_mycology/p26.webp","cap":"Mycology 2026.pdf, slide 26","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"Next to **clotrimazole** and **miconazole** under the azoles, **MOST COMMON anti-fungal meds** is written in large letters. Both are azoles that inhibit ergosterol synthesis and are commonly used as topical treatment for fungal skin infections.","why":{"0":"Amphotericin B is the classic drug for severe systemic mycoses, and nystatin is used topically on mucosa and skin for *Candida*; the pair labeled \"most common\" is clotrimazole and miconazole.","1":"Griseofulvin is used systemically (e.g., for the scalp) and terbinafine is an allylamine, but the label is attached to clotrimazole and miconazole.","2":"These drugs are not the pair labeled \"most common.\"","3":"Fluconazole and itraconazole are also azoles, but the handwritten \"MOST COMMON\" label is on clotrimazole and miconazole."},"one":"Clotrimazole and miconazole are labeled the most common antifungal meds."},"w11_mycology-21":{"q":"Tinea versicolor was braced and starred as which kind of infection, caused by which organism?","o":["A superficial infection of the stratum corneum caused by Malassezia furfur.","A deep dermal abscess caused by Trichophyton.","A systemic mold infection of the lungs caused by Aspergillus.","A nail-only infection caused by Epidermophyton.","A meningeal yeast infection caused by Cryptococcus."],"a":0,"src":"Mycology 2026.pdf, slide 27","img":[{"u":"img/w11_mycology/p27.webp","cap":"Mycology 2026.pdf, slide 27","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"Tinea versicolor is braced and starred as a **superficial infection of the stratum corneum**. The causative organism is ***Malassezia furfur***. Because it involves only the keratin layer, it is shallower than typical dermatophyte tinea and produces hypopigmented or hyperpigmented patches.","why":{"1":"Tinea versicolor is a shallow infection of the stratum corneum, not a deep abscess; *Trichophyton* is a typical tinea organism.","2":"*Aspergillus* belongs to opportunistic systemic/pulmonary mold infections, not tinea versicolor.","3":"A nail-only infection is tinea unguium; tinea versicolor is superficial skin discoloration.","4":"Cryptococcal meningitis is a systemic (opportunistic) mycosis, not tinea versicolor."},"one":"Tinea versicolor is a superficial infection of the stratum corneum caused by Malassezia."},"w11_mycology-22":{"q":"Which two fungi were enclosed in a handwritten oval as commensal fungi?","o":["Histoplasma and Blastomyces.","Malassezia and Candida.","Cryptococcus and Coccidioides.","Trichophyton and Microsporum.","Aspergillus flavus and Aspergillus parasiticus."],"a":1,"src":"Mycology 2026.pdf, slide 29","img":[{"u":"img/w11_mycology/p29.webp","cap":"Mycology 2026.pdf, slide 29","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"Next to the treatment and prognosis of tinea versicolor, an oval encloses the note **Malassezia and Candida are commensal fungi**. Both normally live on human skin or mucosa and can cause disease when conditions change. Tinea versicolor is treated with selenium sulfide or azole creams, among others.","why":{"0":"*Histoplasma* and *Blastomyces* are dimorphic systemic fungi from the environment (soil, etc.), not the commensals in this oval.","2":"*Cryptococcus* and *Coccidioides* are also systemic fungi inhaled from the environment.","3":"*Trichophyton* and *Microsporum* are dermatophytes, not the subject of this commensal note.","4":"These two *Aspergillus* species are boxed separately as aflatoxin producers, not in the commensal oval."},"one":"Malassezia and Candida are commensal fungi."},"w11_mycology-23":{"q":"In the systemic mycoses overview, what clinical feature was marked as true of all of these fungi?","o":["All are geographically restricted to the Southwestern United States.","All are dimorphic, including Cryptococcus.","All can cause mucocutaneous lesions.","None can involve the lungs.","All are highly contagious from person to person in their systemic form."],"a":2,"src":"Mycology 2026.pdf, slide 32","img":[{"u":"img/w11_mycology/p32.webp","cap":"Mycology 2026.pdf, slide 32","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"In the overview, the statement **all can cause mucocutaneous lesions** is marked. Systemic fungi usually start in the lungs and can spread to skin and mucosa. The same overview adds handwritten notes that they are dimorphic except *Cryptococcus*, that the systemic form is not contagious, and that the cutaneous form can be.","why":{"0":"*Coccidioides* is the one endemic to the Southwestern U.S.; this geography doesn't apply to all systemic fungi.","1":"The starred note says \"Dimorphic except Cryptococcus\"; *Cryptococcus* is not dimorphic.","3":"Systemic fungi usually begin with inhalation into the lungs; it's not that they can't involve the lungs.","4":"The systemic form is noted as not contagious from person to person; it is the cutaneous form that is contagious."},"one":"All the systemic fungi can cause mucocutaneous lesions."},"w11_mycology-24":{"q":"Which two annotations were starred or handwritten on the systemic mycoses overview?","o":["All of these fungi are monomorphic yeasts; none is contagious.","Only Cryptococcus is dimorphic; systemic disease is highly contagious.","Cutaneous disease is never contagious; all species are dimorphic.","They are dimorphic except Cryptococcus, and cutaneous disease is contagious.","Systemic disease is contagious, but cutaneous disease is not."],"a":3,"src":"Mycology 2026.pdf, slide 32","img":[{"u":"img/w11_mycology/p32.webp","cap":"Mycology 2026.pdf, slide 32","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"**Dimorphic except Cryptococcus** is starred: *Blastomyces*, *Paracoccidioides*, *Histoplasma*, and *Coccidioides* are dimorphic, and only *Cryptococcus* is not. Lower down, **Cutaneous = contagious** is handwritten, contrasting with the printed statement that the systemic form is not contagious.","why":{"0":"They are dimorphic except for *Cryptococcus*; they are not all monomorphic yeasts, and the cutaneous form can be contagious.","1":"Reversed: only *Cryptococcus* is NOT dimorphic, and the systemic form is not contagious.","2":"Cutaneous disease is noted as contagious, and not all species are dimorphic (*Cryptococcus* is the exception).","4":"Reversed: the systemic form is not contagious; the cutaneous form is."},"one":"They are dimorphic except Cryptococcus, and cutaneous disease is contagious."},"w11_mycology-25":{"q":"Which laboratory features of Cryptococcus neoformans were wavy-underlined?","o":["Dimorphic mold in tissue; acid-fast staining of hyphae.","Intracellular tuberculate macroconidia on silver stain only.","Germ-tube formation and chlamydospores in serum.","Broad-based budding and a figure-8 appearance.","Encapsulated budding yeast with a polysaccharide capsule, demonstrated by India ink, and not dimorphic."],"a":4,"src":"Mycology 2026.pdf, slide 33","img":[{"u":"img/w11_mycology/p33.webp","cap":"Mycology 2026.pdf, slide 33","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"**Encapsulated budding yeast**, **polysaccharide capsule**, and **India ink** are wavy-underlined, and **not dimorphic** is also emphasized. Against an India ink background, the capsule shows up as a clear halo, an important diagnostic finding.","why":{"0":"*Cryptococcus* is not dimorphic and appears as an encapsulated yeast in tissue; acid-fast staining belongs to mycobacteria.","1":"Tuberculate macroconidia and intracellular parasitism are features of *Histoplasma*.","2":"Germ tubes and chlamydospores are closer to the lab findings of *Candida albicans*.","3":"Broad-based budding and a figure-8 appearance are features of *Blastomyces*."},"one":"Cryptococcus is a non-dimorphic encapsulated budding yeast whose polysaccharide capsule is shown with India ink."},"w11_mycology-26":{"q":"On the Cryptococcus pathogenesis pathway, what did the handwritten arrows URT and LRT stand for?","o":["Upper respiratory tract, then lower respiratory tract, then blood.","Urethra, then lower urinary tract, then bladder.","Upper GI tract, then lymph ring, then thoracic duct.","Unencapsulated resting trophozoite, then latent round trophozoite.","Upper skin region, then lower skin region, then nail."],"a":0,"src":"Mycology 2026.pdf, slide 34","img":[{"u":"img/w11_mycology/p34.webp","cap":"Mycology 2026.pdf, slide 34","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"Above the pathway diagram is written **upper/lower respiratory tract**, with arrows drawn **URT → LRT → Blood**. Yeasts in soil and bird droppings are inhaled, spread from the upper to the lower respiratory tract, and then into the blood. The capsule lets the organism evade phagocytosis and disseminate.","why":{"1":"URT/LRT refer to the respiratory tract, not the urinary tract.","2":"This pathway is inhalation followed by bloodstream spread, not the GI tract or thoracic duct.","3":"Trophozoite stages are protozoan terminology (e.g., amebae), not the URT/LRT of the *Cryptococcus* pathway.","4":"A skin-and-nail route belongs to the dermatophytes."},"one":"URT is the upper respiratory tract and LRT the lower respiratory tract; after inhalation, the organism spreads to the blood."},"w11_mycology-27":{"q":"Which central-nervous-system points were highlighted or underlined for Cryptococcus neoformans?","o":["It is strictly dermatotropic and never reaches the meninges.","It is neurotropic, causes meningitis, and encapsulated yeast cells are found in brain tissue.","It forms endosporulating spherules in the cerebral cortex.","It produces aflatoxins that necrose the basal ganglia.","It remains confined to the scalp as tinea capitis."],"a":1,"src":"Mycology 2026.pdf, slide 35, 36","img":[{"u":"img/w11_mycology/p35.webp","cap":"Mycology 2026.pdf, slide 35","w":1200,"h":900},{"u":"img/w11_mycology/p36.webp","cap":"Mycology 2026.pdf, slide 36","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"**Neurotropic** is highlighted in yellow, and **meningitis** is underlined. In the pathology section, the phrase about encapsulated yeast cells **in brain tissue** has a handwritten wavy underline. *Cryptococcus* starts in the lungs and has a particular tendency to spread to the central nervous system.","why":{"0":"It is neurotropic, not dermatotropic; meningitis is its key clinical picture.","2":"Endosporulating spherules are the tissue form of *Coccidioides*.","3":"Aflatoxins are toxins made by *Aspergillus flavus* and *A. parasiticus*.","4":"Tinea capitis is a dermatophyte scalp infection, not CNS involvement by *Cryptococcus*."},"one":"Cryptococcus is neurotropic, causes meningitis, and encapsulated yeasts are seen in brain tissue."},"w11_mycology-28":{"q":"For Blastomyces dermatitidis, which temperature–form relationship and budding pattern were emphasized?","o":["Room temperature = yeast; body temperature = mold; no budding.","It is not dimorphic and grows only as a mold in tissue.","It is dimorphic: room temperature (RT) = mold, body temperature = yeast, with single budding.","Body temperature produces spherules filled with endospores.","Both temperatures produce only arthroconidia."],"a":2,"src":"Mycology 2026.pdf, slide 39","img":[{"u":"img/w11_mycology/p39.webp","cap":"Mycology 2026.pdf, slide 39","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"**Dimorphic** is underlined, with **room temperature (RT) = mold** and **body temp = yeast** written beside it. **Single budding** of the yeast form is emphasized, which distinguishes it from the multiple budding (pilot wheel) of *Paracoccidioides*.","why":{"0":"Reversed: room temperature is mold, body temperature is yeast.","1":"*Blastomyces* is dimorphic and is a yeast in tissue (at body temperature).","3":"Spherules with endospores are *Coccidioides*.","4":"Arthroconidia are a type of asexual spore, not the body-temperature form of *Blastomyces*."},"one":"Blastomyces is dimorphic: mold at room temperature, single-budding yeast at body temperature."},"w11_mycology-29":{"q":"For blastomycosis, which sites were oval-marked as the initial infection and the most common secondary site?","o":["Bone is initial; meninges are the most common secondary site.","Mucous membranes of mouth and nose are initial; lung is secondary.","Gastrointestinal tract is initial; liver is the most common secondary site.","Pulmonary is initial; cutaneous is the most common secondary site.","Genitourinary tract is initial; scalp is the most common secondary site."],"a":3,"src":"Mycology 2026.pdf, slide 40","img":[{"u":"img/w11_mycology/p40.webp","cap":"Mycology 2026.pdf, slide 40","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"An oval groups **Pulmonary = initial** and **Cutaneous = most common secondary**. Infection starts in the lungs by inhalation, and when it spreads through the blood, the skin is the most common secondary site.","why":{"0":"Spread to bone and meninges is closer to the underlined items for disseminated *Coccidioides*; the oval for *Blastomyces* is lung → skin.","1":"Mouth and nose mucosa as the most common secondary site is *Paracoccidioides*, and its initial site is also the lung.","2":"A GI-tract start is not typical of this organism.","4":"The genitourinary tract and scalp are not what this oval says."},"one":"In blastomycosis, the lung is the initial site and the skin is the most common secondary site."},"w11_mycology-30":{"q":"Paracoccidioides brasiliensis yeast was circled for which distinctive appearance, and what handwritten name was given to it?","o":["Single narrow-neck budding; “bowling pin.”","Tuberculate macroconidia; “finger spores.”","Endosporulating spherules; “cyst balls.”","Encapsulated yeast; “India-ink halo.”","Multiple-budding yeast; “pilot-wheel.”"],"a":4,"src":"Mycology 2026.pdf, slide 42","img":[{"u":"img/w11_mycology/p42.webp","cap":"Mycology 2026.pdf, slide 42","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"**Multiple-budding** is circled, with **pilot-wheel** handwritten beside it. Multiple buds attached around a mother cell like a ship's steering wheel are the characteristic tissue form of this organism, a dimorphic fungus endemic to South America.","why":{"0":"Single budding is closer to *Blastomyces* (broad-based); *Paracoccidioides* buds multiply.","1":"Tuberculate macroconidia and \"finger-like projections on the spore\" are the notes for *Histoplasma*.","2":"Endosporulating spherules are *Coccidioides*.","3":"The capsule and India ink are *Cryptococcus*."},"one":"Paracoccidioides is a multiple-budding yeast with a pilot-wheel appearance."},"w11_mycology-31":{"q":"For paracoccidioidomycosis, which sites were oval-marked and starred as the initial infection and the most common secondary site?","o":["Pulmonary is initial; mucous membranes of the mouth and nose are the most common secondary site.","Cutaneous skin is initial; bone is the most common secondary site.","Meninges are initial; lung is the most common secondary site.","Nails are initial; scalp is the most common secondary site.","Gastrointestinal tract is initial; kidney is the most common secondary site."],"a":0,"src":"Mycology 2026.pdf, slide 43","img":[{"u":"img/w11_mycology/p43.webp","cap":"Mycology 2026.pdf, slide 43","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"An oval and star group **Pulmonary = initial** and **mucous membranes of mouth and nose = most common secondary**. Starting in the lungs and then spreading readily to the oral and nasal mucosa is the clinical hallmark of this disease, in contrast to blastomycosis, whose most common secondary site is the skin.","why":{"1":"Skin as the most common secondary site is blastomycosis.","2":"The meninges are not the initial site; the lung is. Meningeal spread is underlined for *Coccidioides*, among others.","3":"Nails and scalp belong to the dermatophytes.","4":"A GI start with kidney as secondary is not what this oval says."},"one":"In paracoccidioidomycosis, the lung is the initial site and the mouth and nose mucosa are the most common secondary site."},"w11_mycology-32":{"q":"Histoplasma capsulatum was circled and annotated as infecting which cells?","o":["Erythrocytes only, as an extracellular pathogen.","Phagocytes; it is intracellular.","Squamous epithelial cells of the epidermis only.","Neurons after crossing the blood–brain barrier first.","Keratinocytes of hair shafts only."],"a":1,"src":"Mycology 2026.pdf, slide 31, 46","img":[{"u":"img/w11_mycology/p31.webp","cap":"Mycology 2026.pdf, slide 31","w":1200,"h":900},{"u":"img/w11_mycology/p46.webp","cap":"Mycology 2026.pdf, slide 46","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"**Intracellular** is circled and starred, with **infects phagocytes** written beside it. *Histoplasma* is dimorphic and lives inside phagocytes such as macrophages in the body. This is the key feature that sets it apart from the other systemic fungi.","why":{"0":"Living inside red blood cells describes protozoa such as malaria; *Histoplasma* lives in phagocytes.","2":"Infecting only epidermal squamous cells is closer to superficial/cutaneous fungi.","3":"The neurotropic organism that readily invades the brain is *Cryptococcus*; the starred point for *Histoplasma* is intracellular parasitism of phagocytes.","4":"Hair-shaft keratin is closer to the dermatophytes."},"one":"Histoplasma is an intracellular pathogen that infects phagocytes."},"w11_mycology-33":{"q":"What handwritten description was given for the tuberculate macroconidia of Histoplasma?","o":["Broad-based single buds that look like a figure 8.","A polysaccharide halo seen with India ink.","Finger-like projections on the spore.","A wheel of multiple buds around a mother cell.","Spherules packed with endospores instead of yeast."],"a":2,"src":"Mycology 2026.pdf, slide 46","img":[{"u":"img/w11_mycology/p46.webp","cap":"Mycology 2026.pdf, slide 46","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"Next to tuberculate macroconidia is written **finger-like projections on spore**. These large conidia with knobby projections, seen in culture, are an important morphologic clue to *Histoplasma*. In tissue it appears as small yeasts inside phagocytes.","why":{"0":"Broad-based budding and a figure-8 appearance are *Blastomyces*.","1":"A polysaccharide halo with India ink is *Cryptococcus*.","3":"A wheel of multiple buds (pilot wheel) is *Paracoccidioides*.","4":"Spherules instead of yeast are *Coccidioides*."},"one":"The tuberculate macroconidia of Histoplasma have finger-like projections on the spore."},"w11_mycology-34":{"q":"Histoplasma habitat was annotated how, next to soil with bird and bat droppings?","o":["The droppings sterilize the soil so the fungus cannot grow.","Only river-bank sand, never droppings, supports growth.","The fungus lives only in human keratin, not in soil.","Droppings “feed the bacteria” (the fungus in that soil).","Growth occurs only in desert rodent burrows of the Southwest."],"a":3,"src":"Mycology 2026.pdf, slide 47","img":[{"u":"img/w11_mycology/p47.webp","cap":"Mycology 2026.pdf, slide 47","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"Next to the habitat, **soil with bird and bat droppings**, is written **feed the bacteria**. The note means the droppings nourish the *Histoplasma* growing in that soil (\"bacteria\" is a loose handwritten term; the actual pathogen is a fungus). Infection occurs by inhaling microconidia from such soil.","why":{"0":"The droppings don't sterilize the soil; they help the fungus grow in it.","1":"River-bank sand is not the typical description; the key is soil mixed with droppings.","2":"Feeding on human keratin describes the dermatophytes; *Histoplasma* comes from environmental soil.","4":"The Southwestern desert is the endemic home of *Coccidioides*."},"one":"Soil with bird and bat droppings nourishes Histoplasma."},"w11_mycology-35":{"q":"When the immune system is good, pulmonary histoplasmosis is typically what, and which two disseminated findings were oval-starred?","o":["Rapidly fatal ARDS in every host; only nail pits are starred.","Always an AIDS-defining illness, even in healthy hosts; only tinea.","A chronic meningitis from the start; only spherules in tissue.","A purely cutaneous contagion; only athlete’s foot.","A benign, self-limited, flu-like illness; involvement of reticuloendothelial tissues and oral lesions."],"a":4,"src":"Mycology 2026.pdf, slide 47","img":[{"u":"img/w11_mycology/p47.webp","cap":"Mycology 2026.pdf, slide 47","w":1200,"h":900}],"ch":"w11_mycology","chn":"Mycology","week":11,"exp":"The handwritten note links **if immune system is good** to a pulmonary infection that is **benign, self-limited, and flu-like**. With dissemination, **RE (reticuloendothelial) tissues** and **oral lesions** are emphasized with an oval and stars. People with weakened immunity are at high risk of dissemination.","why":{"0":"The typical course in a healthy host is a mild flu-like illness, not fatal ARDS in everyone.","1":"Histoplasmosis in HIV-positive patients is what is boxed and starred as AIDS-defining; the typical lung infection in a healthy host is mild.","2":"Chronic meningitis and spherules point to *Cryptococcus* and *Coccidioides*.","3":"Cutaneous contagion and athlete's foot belong to the dermatophytes."},"one":"With good immunity, histoplasmosis passes like a mild flu; when disseminated, RE tissues and oral lesions are key."},"w11_mycology-36":{"q":"Histoplasmosis i
