<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biomed Final Review</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2330;--mu:#667;--bd:#d8dce6;--ac:#2f6fed;--ok:#1f9d55;--bad:#d64545;--sel:#e7efff}
.dark{--bg:#12151c;--card:#1c212b;--tx:#e6e9ef;--mu:#9aa3b2;--bd:#323a48;--ac:#6b9bff;--ok:#3ccf7e;--bad:#ff6b6b;--sel:#24324d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{font-size:1.05rem;margin:0}main{max-width:880px;margin:auto;padding:16px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px}.opt.sel{background:var(--sel);border-color:var(--ac)}
.opt.ok{border-color:var(--ok);box-shadow:inset 4px 0 var(--ok)}.opt.bad{border-color:var(--bad);box-shadow:inset 4px 0 var(--bad)}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.nav button{width:38px;padding:6px 0}
.nav .ans{background:var(--sel)}.nav .cur{outline:2px solid var(--ac)}.nav .r{border-color:var(--ok);color:var(--ok)}.nav .w{border-color:var(--bad);color:var(--bad)}
.exp{border-left:4px solid var(--ac);padding:10px 12px;margin-top:12px;background:var(--bg);border-radius:6px}
.exp h4{margin:12px 0 4px;font-size:.92rem;color:var(--ac)}.exp h4:first-child{margin-top:0}.exp p{margin:4px 0}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--bd);border-radius:20px;padding:1px 8px;margin-right:6px;color:var(--mu)}
.badge{display:inline-block;font-size:.72rem;font-weight:600;background:var(--ac);color:#fff;border-radius:20px;padding:2px 8px;margin-right:6px}
.badge.pend{background:transparent;color:var(--mu);border:1px solid var(--bd)}
.week-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}.week-h h2{font-size:1.08rem;margin:0}.week-h .mu{font-size:.88rem}
.prof{color:var(--mu);font-size:.88rem;margin:2px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mu{color:var(--mu);font-size:.9rem}.ok{color:var(--ok)}.bad{color:var(--bad)}
.hint{font-size:.85rem;color:var(--mu);margin-top:4px}
.slide{margin:10px 0 14px}.slide img{width:100%;height:auto;border:1px solid var(--bd);border-radius:8px;cursor:zoom-in;display:block;background:#fff}.slide figcaption{font-size:.85rem;margin-top:4px;word-break:break-word}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;cursor:zoom-out}#zoom img{max-width:100%;max-height:calc(100% - 40px);object-fit:contain;background:#fff}#zoom .zc{color:#eee;font-size:.85rem;margin-top:8px;text-align:center}
</style></head><body>

p_apnea-18","w12_sleep_apnea-19","w12_sleep_apnea-20","w12_sleep_apnea-21","w12_sleep_apnea-22","w12_sleep_apnea-23","w12_sleep_apnea-24","w12_sleep_apnea-25","w12_sleep_apnea-26","w12_sleep_apnea-27","w12_sleep_apnea-28","w12_sleep_apnea-29","w12_sleep_apnea-30","w12_sleep_apnea-31","w12_sleep_apnea-32","w12_sleep_apnea-33","w12_sleep_apnea-34","w12_sleep_apnea-35","w12_sleep_apnea-36"],"status":"ready"},{"key":"w12_asthma","week":12,"weekName":"Week 12","name":"Asthma and Dental Health","prof":"Bertha C. Escobar-Poni, MD","file":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf","nq":34,"ids":["w12_asthma-1","w12_asthma-2","w12_asthma-3","w12_asthma-4","w12_asthma-5","w12_asthma-6","w12_asthma-7","w12_asthma-8","w12_asthma-9","w12_asthma-10","w12_asthma-11","w12_asthma-12","w12_asthma-13","w12_asthma-14","w12_asthma-15","w12_asthma-16","w12_asthma-17","w12_asthma-18","w12_asthma-19","w12_asthma-20","w12_asthma-21","w12_asthma-22","w12_asthma-23","w12_asthma-24","w12_asthma-25","w12_asthma-26","w12_asthma-27","w12_asthma-28","w12_asthma-29","w12_asthma-30","w12_asthma-31","w12_asthma-32","w12_asthma-33","w12_asthma-34"],"status":"ready"},{"key":"w12_cv_dev","week":12,"weekName":"Week 12","name":"Development of the Cardiovascular System","prof":"John C. Banks, PhD","file":"Cardiovascular System.pdf","nq":37,"ids":["w12_cv_dev-1","w12_cv_dev-2","w12_cv_dev-3","w12_cv_dev-4","w12_cv_dev-5","w12_cv_dev-6","w12_cv_dev-7","w12_cv_dev-8","w12_cv_dev-9","w12_cv_dev-10","w12_cv_dev-11","w12_cv_dev-12","w12_cv_dev-13","w12_cv_dev-14","w12_cv_dev-15","w12_cv_dev-16","w12_cv_dev-17","w12_cv_dev-18","w12_cv_dev-19","w12_cv_dev-20","w12_cv_dev-21","w12_cv_dev-22","w12_cv_dev-23","w12_cv_dev-24","w12_cv_dev-25","w12_cv_dev-26","w12_cv_dev-27","w12_cv_dev-28","w12_cv_dev-29","w12_cv_dev-30","w12_cv_dev-31","w12_cv_dev-32","w12_cv_dev-33","w12_cv_dev-34","w12_cv_dev-35","w12_cv_dev-36","w12_cv_dev-37"],"status":"ready"}],"q":{"w10_arm-1":{"q":"The superior lateral brachial cutaneous nerve, which supplies the upper lateral skin of the arm, is a branch of which nerve?","o":["Axillary nerve","Radial nerve","Medial cord of the brachial plexus","Musculocutaneous nerve","Ulnar nerve"],"a":0,"src":"Arm and Forearm.pdf, slide 4","img":[{"u":"img/w10_arm/p04.webp","cap":"Arm and Forearm.pdf, slide 4","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"Cutaneous sensation of the arm (brachium) is divided into four territories.\n\nThe **superior lateral brachial cutaneous nerve** is a branch of the **axillary nerve** and supplies the skin of the upper lateral arm, including the area over the deltoid.\n\nThe lower lateral arm is supplied by the inferior lateral brachial cutaneous nerve and the posterior arm by the posterior brachial cutaneous nerve; both are branches of the **radial nerve**. The medial arm is supplied by the medial brachial cutaneous nerve, which comes directly off the **medial cord** of the brachial plexus.\n\nBecause the axillary nerve is also the motor nerve to the deltoid and teres minor, a shoulder dislocation or surgical-neck fracture can produce loss of sensation over the upper lateral arm along with weakness of those muscles.","why":{"1":"The radial nerve gives off the inferior lateral and posterior brachial cutaneous nerves, but it is not the origin of the superior lateral one.","2":"The branch that comes directly off the medial cord is the medial brachial cutaneous nerve, which supplies the medial skin of the arm.","3":"The musculocutaneous nerve supplies the three anterior flexors and then ends as the lateral antebrachial cutaneous nerve; it does not supply the upper lateral arm.","4":"The ulnar nerve gives no cutaneous branches in the arm and has nothing to do with the upper lateral arm."},"one":"Upper lateral arm skin = axillary nerve; lower lateral and posterior = radial nerve; medial = medial cord."},"w10_arm-2":{"q":"The cephalic vein originates on the lateral dorsum of the hand, ascends in the deltopectoral groove, and typically terminates in the:","o":["Brachial vein","Axillary vein","Basilic vein","Subclavian vein","Internal jugular vein"],"a":1,"src":"Arm and Forearm.pdf, slide 5, 6","img":[{"u":"img/w10_arm/p05.webp","cap":"Arm and Forearm.pdf, slide 5","w":1200,"h":900},{"u":"img/w10_arm/p06.webp","cap":"Arm and Forearm.pdf, slide 6","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"Remember the superficial veins by splitting them into a lateral and a medial channel.\n\nThe **cephalic vein** begins in the lateral part of the dorsal venous network of the hand, ascends along the lateral forearm and arm, dives deep in the **deltopectoral groove**, and drains into the **axillary vein**. On dissection specimens the cephalic vein is clearly visible in this groove.\n\nThe **basilic vein**, by contrast, begins on the medial dorsum of the hand, ascends along the lower medial arm, and usually joins the brachial veins (venae comitantes) to form the axillary vein. The two are connected at the elbow by the median cubital vein.","why":{"0":"The brachial veins are deep veins that the basilic vein joins; they are not where the cephalic vein ends.","2":"The basilic vein is the medial superficial vein; it only communicates with the cephalic vein at the elbow and is not its termination.","3":"The subclavian vein is the proximal continuation of the axillary vein, not the vessel the cephalic vein opens into directly.","4":"The internal jugular vein is a deep vein of the neck and has nothing to do with the superficial venous drainage of the upper limb."},"one":"The cephalic vein runs in the deltopectoral groove and drains into the axillary vein."},"w10_arm-3":{"q":"When the usual pattern of superficial veins is present, the preferred site for venipuncture in the cubital fossa is the:","o":["Cephalic vein in the arm","Basilic vein in the arm","Median cubital vein","Deep brachial veins","Axillary vein"],"a":2,"src":"Arm and Forearm.pdf, slide 5, 6","img":[{"u":"img/w10_arm/p05.webp","cap":"Arm and Forearm.pdf, slide 5","w":1200,"h":900},{"u":"img/w10_arm/p06.webp","cap":"Arm and Forearm.pdf, slide 6","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"In the cubital fossa the veins are large and close to the skin, which makes it the standard site for **drawing blood, transfusions, and IV injections**.\n\nWith the most common superficial venous pattern, the vein of choice is the **median cubital vein**, which links the lateral cephalic vein to the medial basilic vein. It is prominent and easy to access, and on dissection specimens it can be seen crossing the front of the elbow.\n\nThe bicipital aponeurosis, which forms part of the roof, gives some protection to the brachial artery and median nerve lying beneath it, so a superficial puncture is relatively safe. Because anatomic variation exists, always confirm the actual course of the vein by inspection and palpation.","why":{"0":"The cephalic vein can be used, but with the usual pattern the first-choice site is the median cubital vein at the elbow.","1":"The basilic vein lies medially, closer to the brachial artery and median nerve, so it is not the first-choice site.","3":"The deep brachial veins are deep veins accompanying the artery; they are not targets for a percutaneous stick.","4":"The axillary vein lies in the axilla and is not used for routine blood draws."},"one":"The first-choice vein for venipuncture at the elbow is the median cubital vein."},"w10_arm-4":{"q":"On a lateral dissection of the shoulder and arm, the cephalic vein is seen traveling within which interval?","o":["Quadrangular space","Triangular interval","Radial groove of the humerus","Deltopectoral groove","Cubital tunnel"],"a":3,"src":"Arm and Forearm.pdf, slide 6","img":[{"u":"img/w10_arm/p06.webp","cap":"Arm and Forearm.pdf, slide 6","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"On a lateral dissection of the shoulder and arm, the **cephalic vein** lies clearly between the deltoid and the pectoralis major, that is, in the **deltopectoral groove**. The widened upper end of this groove is sometimes called the deltopectoral triangle.\n\nThe same view also shows the superior lateral and posterior brachial cutaneous nerves, the lateral head of the triceps, the brachialis, the biceps brachii, the radial nerve, and the median cubital vein at the elbow.\n\nIf you remember the path \"deltopectoral groove → axillary vein\" together with where it sits on the specimen, you can use this vein as a landmark for central line placement or for anterior approaches to the shoulder.","why":{"0":"The quadrangular space is a deep space that transmits the axillary nerve and posterior circumflex humeral artery; it is not the path of the cephalic vein.","1":"The triangular interval opens posteriorly and transmits the radial nerve and deep brachial artery.","2":"The radial groove is a bony groove on the back of the humerus that carries the radial nerve and deep brachial artery.","4":"The cubital tunnel is the passage for the ulnar nerve behind the medial epicondyle and has nothing to do with a lateral superficial vein."},"one":"On the specimen, the cephalic vein runs in the groove between the deltoid and pectoralis major."},"w10_arm-5":{"q":"Which landmark of the distal humerus articulates with the head of the radius at the humeroradial joint?","o":["Trochlea","Olecranon fossa","Coronoid fossa","Medial epicondyle","Capitulum"],"a":4,"src":"Arm and Forearm.pdf, slide 7","img":[{"u":"img/w10_arm/p07.webp","cap":"Arm and Forearm.pdf, slide 7","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"The condyle of the distal humerus is divided into medial and lateral parts with different partners.\n\nThe **capitulum** is the **lateral** articular part; it meets the head of the radius to form the **humeroradial joint**. Just above it is the radial fossa, which receives the radial head during flexion.\n\nThe **trochlea** on the medial side articulates with the trochlear notch of the ulna to form the humeroulnar joint. Above it anteriorly is the coronoid fossa, and posteriorly is the triangular olecranon fossa. Behind the medial epicondyle is the ulnar groove, through which the ulnar nerve passes.","why":{"0":"The trochlea is the medial articular part and articulates with the trochlear notch of the ulna.","1":"The olecranon fossa is the posterior depression that receives the olecranon during extension.","2":"The coronoid fossa lies above the trochlea and receives the coronoid process of the ulna during flexion.","3":"The medial epicondyle is the origin of the superficial anterior forearm flexors; it does not articulate with the radial head."},"one":"Capitulum (lateral) ↔ radial head; trochlea (medial) ↔ trochlear notch of the ulna."},"w10_arm-6":{"q":"Fractures of the humeral shaft and distal humerus are frequently associated with injury to which nerve?","o":["Radial nerve","Median nerve","Ulnar nerve","Axillary nerve","Musculocutaneous nerve"],"a":0,"src":"Arm and Forearm.pdf, slide 8","img":[{"u":"img/w10_arm/p08.webp","cap":"Arm and Forearm.pdf, slide 8","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"The nerve at risk in a humeral fracture depends on where the fracture is.\n\n**Fractures of the shaft and distal humerus** are frequently associated with injury to the **radial nerve**. The radial nerve runs in the **radial groove** on the back of the humerus together with the deep brachial artery, so it is vulnerable to shaft fractures or compression in this region. Injury can cause wrist drop and altered sensation on the dorsum of the hand.\n\nProximal humeral fractures are common in older patients after a fall on an outstretched hand or a direct blow to the shoulder, and they are classified as extra-articular, intra-articular, or comminuted. Extra- and intra-articular fractures carry a risk of **avascular necrosis** because they can injure the anterior and posterior circumflex humeral arteries that supply the humeral head.","why":{"1":"The median nerve descends medially and gives no branches in the arm; it is not the typical nerve injured with a shaft fracture.","2":"The ulnar nerve is at risk in the ulnar groove behind the medial epicondyle, but the classic nerve for shaft and distal fractures is the radial nerve.","3":"The axillary nerve is at risk with proximal fractures around the surgical neck.","4":"The musculocutaneous nerve pierces the coracobrachialis and travels in the anterior compartment; it is not the typical nerve injured with a shaft fracture."},"one":"Humeral shaft/distal fractures → radial nerve; surgical neck → axillary nerve; proximal articular fractures → risk of avascular necrosis."},"w10_arm-7":{"q":"Extra-articular and intra-articular fractures of the proximal humerus may lead to osteonecrosis of the humeral head by injuring the:","o":["Deep brachial and radial collateral arteries","Anterior and posterior circumflex humeral arteries","Thoracoacromial and lateral thoracic arteries","Superior and inferior ulnar collateral arteries","Radial and ulnar recurrent arteries"],"a":1,"src":"Arm and Forearm.pdf, slide 8","img":[{"u":"img/w10_arm/p08.webp","cap":"Arm and Forearm.pdf, slide 8","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"Proximal humeral fractures are very common in older patients and result from a fall on an outstretched hand or a direct blow to the shoulder. On an anterior view they are divided into three types: **extra-articular**, **intra-articular**, and **comminuted**.\n\nExtra-articular and intra-articular fractures are frequently accompanied by injury to the **anterior circumflex humeral artery** and the **posterior circumflex humeral artery**, which supply the humeral head. If these vessels are torn, blood flow to the head is lost and **post-traumatic avascular necrosis** can develop.\n\nThe surgical neck, below the tubercles, is a common fracture site; the anatomical neck lies at the margin of the head. In intra-articular fractures the fracture line runs toward the anatomical neck and involves the joint surface.","why":{"0":"The deep brachial artery accompanies the radial nerve along the humeral shaft; it is not the main nutrient supply of the humeral head.","2":"The thoracoacromial and lateral thoracic arteries are chest-wall branches of the axillary artery and are not central to humeral head blood supply.","3":"The superior and inferior ulnar collateral arteries are brachial artery branches that form the collateral circulation around the elbow.","4":"The radial and ulnar recurrent arteries ascend from the forearm to form the anastomotic network around the elbow."},"one":"Extra- and intra-articular proximal humeral fractures can injure the anterior and posterior circumflex humeral arteries and cause necrosis of the head."},"w10_arm-8":{"q":"The medial and lateral intermuscular septa of the arm connect brachial fascia to the humerus and thereby divide the arm into:","o":["Superficial and deep fascial planes only","Medial and lateral neurovascular compartments","Anterior (flexor) and posterior (extensor) compartments","Proximal and distal muscular compartments","Cutaneous and subfascial compartments"],"a":2,"src":"Arm and Forearm.pdf, slide 9","img":[{"u":"img/w10_arm/p09.webp","cap":"Arm and Forearm.pdf, slide 9","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"The **brachial fascia** is the deep fascial \"sleeve\" that wraps the arm muscles. It is continuous with the axillary and pectoral fascia and attaches below to the epicondyles and the olecranon.\n\nThe **medial and lateral intermuscular septa**, which run from this fascia to the humerus, divide the arm into an **anterior (flexor) compartment** and a **posterior (extensor) compartment**.\n\nThe anterior compartment contains the three flexors and the musculocutaneous nerve; the posterior compartment contains the triceps (and anconeus) and the radial nerve. These septa are also the anatomic boundaries that matter in compartment syndrome and in surgical exposure.","why":{"0":"The brachial fascia itself is the sleeve around the muscles, but it is the intermuscular septa that separate the anterior and posterior compartments.","1":"The neurovascular bundle does run medially, but the primary role of the intermuscular septa is to separate the anterior and posterior compartments.","3":"Proximal and distal are just longitudinal regions, not compartments created by the intermuscular septa.","4":"The septa do not separate cutaneous territories from subfascial spaces."},"one":"The medial and lateral intermuscular septa divide the arm into anterior (flexor) and posterior (extensor) compartments."},"w10_arm-9":{"q":"Which anterior compartment muscle of the arm is penetrated by the musculocutaneous nerve?","o":["Biceps brachii","Brachialis","Brachioradialis","Coracobrachialis","Anconeus"],"a":3,"src":"Arm and Forearm.pdf, slide 10, 15","img":[{"u":"img/w10_arm/p10.webp","cap":"Arm and Forearm.pdf, slide 10","w":1200,"h":900},{"u":"img/w10_arm/p15.webp","cap":"Arm and Forearm.pdf, slide 15","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"All three flexors of the anterior arm compartment are supplied by the **musculocutaneous nerve**.\n\nAfter leaving the lateral cord, this nerve **pierces** the **coracobrachialis** and then descends between the biceps brachii and the brachialis. Finding where it pierces the coracobrachialis is the key landmark for identifying the musculocutaneous nerve in the operating field and on dissection specimens.\n\nThe biceps brachii, with its long and short heads, inserts on the radial tuberosity; the brachialis, the main flexor of the forearm, inserts on the ulnar tuberosity. The coracobrachialis mainly flexes and adducts the arm.","why":{"0":"The musculocutaneous nerve passes along the deep surface of the biceps, between it and the brachialis, but the muscle it pierces is the coracobrachialis.","1":"The nerve runs over the surface of the brachialis and gives it motor branches but does not pierce it.","2":"The brachioradialis is a superficial muscle of the posterior forearm compartment and is supplied by the radial nerve.","4":"The anconeus is a small extensor of the posterior compartment (or posterior forearm) and is supplied by the radial nerve."},"one":"The musculocutaneous nerve pierces the coracobrachialis and descends between the biceps and brachialis."},"w10_arm-10":{"q":"The primary flexor of the forearm, which inserts on the ulnar tuberosity, is the:","o":["Biceps brachii","Coracobrachialis","Brachioradialis","Pronator teres","Brachialis"],"a":4,"src":"Arm and Forearm.pdf, slide 10","img":[{"u":"img/w10_arm/p10.webp","cap":"Arm and Forearm.pdf, slide 10","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"It is important to distinguish the prime mover of forearm flexion.\n\nThe **brachialis** is the **primary flexor of the forearm**, and it inserts on the **tuberosity of the ulna**. It also forms part of the floor of the cubital fossa.\n\nThe biceps brachii inserts on the radial tuberosity and contributes powerfully to **supination** as well as flexion, but the prime mover of pure flexion is the brachialis. The coracobrachialis mainly flexes the arm (at the shoulder), and the brachioradialis, although it belongs to the posterior compartment, assists elbow flexion.","why":{"0":"The biceps brachii inserts on the radial tuberosity and is a powerful supinator as well as a flexor.","1":"The coracobrachialis runs from the coracoid process to the humerus and flexes and adducts the arm; it is not the prime mover of forearm flexion.","2":"The brachioradialis is a posterior compartment muscle that helps flex the elbow, but it is not the primary flexor and does not insert on the ulnar tuberosity.","3":"The pronator teres is a superficial anterior forearm muscle that pronates and assists flexion; it is not the primary flexor."},"one":"The prime mover of forearm flexion is the brachialis, which inserts on the ulnar tuberosity."},"w10_arm-11":{"q":"After innervating the three anterior brachial flexors, the musculocutaneous nerve terminates as the:","o":["Lateral antebrachial cutaneous nerve","Posterior antebrachial cutaneous nerve","Medial antebrachial cutaneous nerve","Superficial branch of the radial nerve","Palmar cutaneous branch of the median nerve"],"a":0,"src":"Arm and Forearm.pdf, slide 11, 34","img":[{"u":"img/w10_arm/p11.webp","cap":"Arm and Forearm.pdf, slide 11","w":1200,"h":900},{"u":"img/w10_arm/p34.webp","cap":"Arm and Forearm.pdf, slide 34","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"The musculocutaneous nerve is the **only motor nerve** of the anterior arm compartment and supplies just three muscles: coracobrachialis, biceps brachii, and brachialis.\n\nIt then emerges on the lateral forearm and ends as the **lateral antebrachial cutaneous nerve**. This terminal branch can be identified on a lateral view of the right forearm.\n\nTo summarize forearm skin: the lateral side is supplied by this terminal branch of the musculocutaneous nerve, the medial side by the medial antebrachial cutaneous nerve from the **medial cord** of the brachial plexus, and the posterior side by the posterior antebrachial cutaneous nerve of the **radial nerve**.","why":{"1":"The posterior antebrachial cutaneous nerve is a branch of the radial nerve and supplies the skin of the posterior forearm.","2":"The medial antebrachial cutaneous nerve arises from the medial cord; it is not the terminal branch of the musculocutaneous nerve.","3":"The superficial branch of the radial nerve runs deep to the brachioradialis and supplies sensation to the lateral dorsum of the hand.","4":"The palmar cutaneous branch of the median nerve arises proximal to the carpal tunnel and supplies the lateral palm."},"one":"The musculocutaneous nerve supplies only the three anterior arm muscles and then ends as the lateral antebrachial cutaneous nerve."},"w10_arm-12":{"q":"The single dominant extensor of the posterior arm compartment, composed of long, lateral, and medial heads, is innervated by the:","o":["Axillary nerve","Radial nerve","Median nerve","Ulnar nerve","Musculocutaneous nerve"],"a":1,"src":"Arm and Forearm.pdf, slide 12","img":[{"u":"img/w10_arm/p12.webp","cap":"Arm and Forearm.pdf, slide 12","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"Summarize the arm muscles as \"three flexors in front, one main extensor behind.\"\n\nThe main extensor of the posterior compartment is the **triceps brachii**, with long, lateral, and medial heads. It is supplied by the **radial nerve** and mainly extends the forearm. Some authors consider the **anconeus** part of the triceps or group it with the posterior forearm muscles.\n\nThe radial nerve enters the arm behind the brachial artery, runs with the deep brachial artery in the radial groove, and exits into the forearm between the brachialis and the brachioradialis.","why":{"0":"The axillary nerve supplies the deltoid and teres minor, not the triceps.","2":"The median nerve gives no branches in the arm and does not supply the posterior extensors.","3":"The ulnar nerve also gives no branches in the arm and does not supply the triceps.","4":"The musculocutaneous nerve supplies only the three anterior compartment flexors."},"one":"The main extensor of the posterior arm (triceps) is supplied by the radial nerve."},"w10_arm-13":{"q":"The brachial artery, a continuation of the axillary artery, begins at the lower border of which muscle?","o":["Pectoralis minor","Latissimus dorsi","Teres major","Teres minor","Subscapularis"],"a":2,"src":"Arm and Forearm.pdf, slide 13","img":[{"u":"img/w10_arm/p13.webp","cap":"Arm and Forearm.pdf, slide 13","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"You need to know exactly where the arteries of the upper limb change names.\n\nThe **brachial artery** is the continuation of the axillary artery and begins at the **lower border of the teres major**. It then descends into the cubital fossa and ends at the level of the **neck of the radius** by dividing into the radial and ulnar arteries.\n\nIts main branches are the deep brachial artery, the superior ulnar collateral artery, and the inferior ulnar collateral artery. The brachial veins are usually a pair of venae comitantes that join the basilic vein to form the axillary vein.","why":{"0":"The pectoralis minor is the landmark that divides the axillary artery into its first, second, and third parts, not the boundary where the brachial artery begins.","1":"The latissimus dorsi is a muscle of the posterior axillary wall and is not the standard boundary for the name change.","3":"The teres minor is a lateral rotator of the shoulder and has nothing to do with the origin of the brachial artery.","4":"The subscapularis lies in front of the axilla but is not the boundary where the brachial artery begins."},"one":"The brachial artery begins at the lower border of the teres major and divides at the level of the radial neck."},"w10_arm-14":{"q":"The brachial artery typically ends by bifurcating into the radial and ulnar arteries at the level of the:","o":["Surgical neck of the humerus","Medial epicondyle of the humerus","Olecranon fossa","Neck of the radius","Ulnar tuberosity alone"],"a":3,"src":"Arm and Forearm.pdf, slide 13, 32","img":[{"u":"img/w10_arm/p13.webp","cap":"Arm and Forearm.pdf, slide 13","w":1200,"h":900},{"u":"img/w10_arm/p32.webp","cap":"Arm and Forearm.pdf, slide 32","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"The brachial artery ends within the cubital fossa at the level of the **neck of the radius**, where it divides into the **radial artery** and the **ulnar artery**.\n\nPair the start (lower border of teres major) with the end (radial neck), and you can trace the whole artery in a single line. The radial artery runs along the lateral forearm and ends as the deep palmar arch; the ulnar artery runs medially, gives off the common interosseous artery, and ends as the superficial palmar arch.","why":{"0":"The surgical neck is the part of the proximal humerus associated with the axillary artery and axillary nerve.","1":"The medial epicondyle is the landmark where the ulnar nerve passes posteriorly, not the level of brachial artery bifurcation.","2":"The olecranon fossa is a bony depression on the back of the humerus and is not used as a reference for arterial branching.","4":"The ulnar tuberosity is the insertion of the brachialis, not the standard level of the bifurcation."},"one":"The brachial artery divides into the radial and ulnar arteries at the level of the radial neck in the cubital fossa."},"w10_arm-15":{"q":"Which statement best describes the median and ulnar nerves as they descend through the arm?","o":["Both give motor branches to brachialis","Only the median nerve has motor branches in the arm","Only the ulnar nerve has motor branches in the arm","Both travel with the deep brachial artery","Neither nerve gives branches in the arm"],"a":4,"src":"Arm and Forearm.pdf, slide 14, 15","img":[{"u":"img/w10_arm/p14.webp","cap":"Arm and Forearm.pdf, slide 14","w":1200,"h":900},{"u":"img/w10_arm/p15.webp","cap":"Arm and Forearm.pdf, slide 15","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"Of the five terminal branches of the brachial plexus, four enter the arm: musculocutaneous, radial, median, and ulnar.\n\nThe **median** and **ulnar nerves** give **no branches in the arm**. Both descend side by side medial to the brachial vessels, and their motor and cutaneous branches begin at or below the elbow.\n\nBy contrast, the musculocutaneous nerve pierces the coracobrachialis and supplies the anterior compartment muscles, and the radial nerve passes behind the brachial artery, runs with the deep brachial artery in the radial groove, and gives branches to the triceps and others. A medial arm specimen shows the median and ulnar nerves running down medial to the vessels without giving off branches.","why":{"0":"The motor nerve to the brachialis is the musculocutaneous nerve; the median and ulnar nerves have no branches in the arm.","1":"The median nerve gives no motor branches in the arm.","2":"The ulnar nerve likewise gives no branches in the arm.","3":"The nerve that runs with the deep brachial artery in the radial groove is the radial nerve."},"one":"The median and ulnar nerves have no branches in the arm."},"w10_arm-16":{"q":"From lateral to medial, the contents of the cubital fossa are the:","o":["Biceps tendon, brachial artery, and median nerve","Median nerve, brachial artery, and biceps tendon","Brachial artery, biceps tendon, and median nerve","Radial nerve, brachial artery, and ulnar nerve","Biceps tendon, median nerve, and brachial artery"],"a":0,"src":"Arm and Forearm.pdf, slide 16","img":[{"u":"img/w10_arm/p16.webp","cap":"Arm and Forearm.pdf, slide 16","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"The cubital fossa is a triangular depression on the front of the elbow between the two forearm bones. Its contents, from **lateral to medial**, are the **biceps brachii tendon – brachial artery – median nerve**, remembered as **TAN** (Tendon, Artery, Nerve).\n\nBoundaries: the base is an imaginary horizontal line joining the two epicondyles; the lateral border is the brachioradialis; the medial border is the pronator teres; the roof is the bicipital aponeurosis and the median cubital vein; and the floor is the brachialis and supinator.\n\nThe ulnar nerve passes behind the medial epicondyle and is not a content of the fossa.","why":{"1":"This order is completely reversed: the tendon is lateral and the median nerve is medial.","2":"The artery is not the most lateral structure; the most lateral is the biceps tendon.","3":"The ulnar nerve lies behind the medial epicondyle, and although the radial nerve may skirt the lateral edge of the fossa, the standard contents are the three TAN structures.","4":"The medial–lateral relationship of the median nerve and brachial artery is reversed."},"one":"Cubital fossa contents (lateral → medial): Tendon–Artery–Nerve (TAN)."},"w10_arm-17":{"q":"The lateral boundary of the cubital fossa is formed by which muscle?","o":["Pronator teres","Brachioradialis","Brachialis","Biceps brachii","Flexor carpi radialis"],"a":1,"src":"Arm and Forearm.pdf, slide 16","img":[{"u":"img/w10_arm/p16.webp","cap":"Arm and Forearm.pdf, slide 16","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"Learn the boundaries of the cubital fossa together with its contents.\n\nThe **lateral border** is the **brachioradialis**, and the **medial border** is the **pronator teres**. The base is the imaginary line joining the epicondyles, the roof is the bicipital aponeurosis and median cubital vein, and the floor is the brachialis and supinator.\n\nThe brachioradialis belongs to the superficial posterior compartment yet acts to flex the elbow, and the radial nerve enters the forearm between the brachialis and brachioradialis. The median nerve passes between the two heads of the pronator teres.","why":{"0":"The pronator teres forms the medial border of the cubital fossa.","2":"The brachialis is one of the muscles forming the floor of the fossa.","3":"The biceps tendon is a content of the fossa, not its lateral wall.","4":"The flexor carpi radialis is a superficial anterior forearm muscle, not the lateral border of the fossa."},"one":"Cubital fossa: lateral = brachioradialis, medial = pronator teres, floor = brachialis and supinator."},"w10_arm-18":{"q":"The proximal radioulnar joint is stabilized by which structure that cuffs the head of the radius?","o":["Ulnar collateral ligament","Radial collateral ligament","Anular ligament","Interosseous membrane alone","Bicipital aponeurosis"],"a":2,"src":"Arm and Forearm.pdf, slide 17, 20","img":[{"u":"img/w10_arm/p17.webp","cap":"Arm and Forearm.pdf, slide 17","w":1200,"h":900},{"u":"img/w10_arm/p20.webp","cap":"Arm and Forearm.pdf, slide 20","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"The elbow complex is a compound hinge joint with three articulations inside one capsule.\n\nAt the **proximal radioulnar joint**, the radial head sits in the radial notch of the ulna, and the **anular ligament** **cuffs** the radial head like a ring so it does not slip out while rotating during pronation and supination. On a lateral elbow specimen you can see the anular ligament together with the radial collateral ligament.\n\nThe humeroulnar joint (trochlea and trochlear notch) is reinforced medially by the **ulnar collateral ligament (UCL)**. The humeroradial joint (capitulum and radial head) is reinforced laterally by the **radial collateral ligament (RCL)**.","why":{"0":"The ulnar collateral ligament reinforces the humeroulnar joint on the medial side of the elbow.","1":"The radial collateral ligament reinforces the humeroradial joint laterally, but the structure that encircles the radial head is the anular ligament.","3":"The interosseous membrane joins the radial and ulnar shafts and transmits force, but it does not encircle the radial head.","4":"The bicipital aponeurosis forms the roof of the cubital fossa and is not a stabilizer of the proximal radioulnar joint."},"one":"The anular ligament encircles the radial head and stabilizes the proximal radioulnar joint."},"w10_arm-19":{"q":"Reconstruction of a torn elbow ulnar collateral ligament (the “Tommy John” procedure) most commonly uses an autologous graft of the:","o":["Flexor carpi radialis tendon","Extensor indicis tendon","Palmaris brevis muscle","Palmaris longus tendon","Flexor carpi ulnaris tendon"],"a":3,"src":"Arm and Forearm.pdf, slide 18, 19","img":[{"u":"img/w10_arm/p18.webp","cap":"Arm and Forearm.pdf, slide 18","w":1200,"h":900},{"u":"img/w10_arm/p19.webp","cap":"Arm and Forearm.pdf, slide 19","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"The ulnar collateral ligament (UCL) reinforces the **medial** side of the elbow. Tears and stretch injuries are increasingly common with throwing motions such as baseball pitching, football passing, javelin, and water polo.\n\nReconstruction, commonly called the **Tommy John procedure**, uses an **autologous tendon** harvested from the opposite forearm or the leg. The typical donor tendon is the **palmaris longus** or the plantaris. A 10–15 cm graft is passed through drill holes in the medial epicondyle and the lateral side of the ulnar coronoid process to recreate the ligament.\n\nThe palmaris longus is absent in about 13% of people, so its presence is checked before surgery.","why":{"0":"The flexor carpi radialis tendon is not the standard Tommy John donor tendon.","1":"The extensor indicis is a deep posterior forearm muscle and is not the typical donor for this procedure.","2":"The palmaris brevis is a thin intrinsic hand muscle over the hypothenar eminence and is not used as a graft.","4":"The flexor carpi ulnaris is the muscle whose two heads transmit the ulnar nerve; it is not the standard donor tendon."},"one":"The classic donor for elbow UCL reconstruction (Tommy John) is the palmaris longus (or plantaris) tendon."},"w10_arm-20":{"q":"The humeroradial joint, between the capitulum and the radial head, is strengthened on its lateral side by the:","o":["Ulnar collateral ligament","Anular ligament alone","Quadrate ligament","Interosseous membrane","Radial collateral ligament"],"a":4,"src":"Arm and Forearm.pdf, slide 17, 20","img":[{"u":"img/w10_arm/p17.webp","cap":"Arm and Forearm.pdf, slide 17","w":1200,"h":900},{"u":"img/w10_arm/p20.webp","cap":"Arm and Forearm.pdf, slide 20","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"Distinguish the ligament that reinforces the lateral elbow from the medial UCL.\n\nThe **humeroradial joint** is the articulation between the capitulum and the radial head, and it is reinforced on its **lateral** side by the **radial collateral ligament (RCL)**. In the same lateral view you also see the **anular ligament**, which wraps the radial head like a ring. The anular ligament stabilizes the proximal radioulnar joint, while the RCL is the lateral reinforcing ligament of the humeroradial joint.\n\nMedially, the ulnar collateral ligament (UCL) reinforces the humeroulnar joint, and its rupture is what Tommy John reconstruction repairs.","why":{"0":"The ulnar collateral ligament reinforces the humeroulnar joint on the medial elbow.","1":"The anular ligament encircles the radial head and stabilizes the proximal radioulnar joint, but the lateral reinforcing ligament of the humeroradial joint is the RCL.","2":"The quadrate ligament is a small ligament around the proximal radioulnar joint and is not presented as the main lateral reinforcement of the humeroradial joint.","3":"The interosseous membrane is the sheet that connects the shafts of the two forearm bones."},"one":"The humeroradial joint is reinforced laterally by the radial collateral ligament; the ring around the radial head is the anular ligament."},"w10_arm-21":{"q":"Compared with the ulna, the radius of the forearm is:","o":["The shorter, lateral bone","The longer, medial bone","The shorter, medial bone","The longer, lateral bone","Equal in length and medial in position"],"a":0,"src":"Arm and Forearm.pdf, slide 22","img":[{"u":"img/w10_arm/p22.webp","cap":"Arm and Forearm.pdf, slide 22","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"The forearm (antebrachium) consists of two bones, the **radius** and the **ulna**.\n\nThe **radius is the shorter, lateral bone**. Proximally it has a head with a fovea, a neck, and the radial tuberosity; its shaft has an interosseous border; distally it has the styloid process, the ulnar notch, and the dorsal (Lister's) tubercle.\n\nThe **ulna is the longer, medial bone**. Proximally it has the olecranon, trochlear notch, coronoid process, ulnar tuberosity, radial notch, and the supinator crest and fossa; distally it has a head and a styloid process. At the wrist the radius forms the main articular surface, so force coming from the hand enters the radius and is then passed to the ulna through the interosseous membrane.","why":{"1":"The longer, medial bone is the ulna.","2":"The radius is shorter but lateral; the medial bone is the ulna.","3":"The radius is lateral, but it is not longer than the ulna.","4":"The two bones are not the same length, and the medial one is the ulna."},"one":"Radius = shorter and lateral; ulna = longer and medial."},"w10_arm-22":{"q":"A principal function of the interosseous membrane of the forearm is that it:","o":["Allows independent rotation of the humerus","Transmits forces from the radius to the ulna","Transmits forces from the ulna to the radius","Separates the flexor and extensor retinacula","Forms the floor of the cubital fossa"],"a":1,"src":"Arm and Forearm.pdf, slide 23","img":[{"u":"img/w10_arm/p23.webp","cap":"Arm and Forearm.pdf, slide 23","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"The **interosseous membrane** is a fibrous sheet connecting the interosseous borders of the radius and ulna.\n\nIts functions are to provide **strength and stability** between the two bones, to serve as an attachment site for muscles, and especially to **transmit force from the radius to the ulna** as it comes up from the hand. Because the wrist articular surface is mainly the radius, without this transfer the radius alone would carry an excessive load.\n\nThe membrane has two openings: a **proximal gap** for the posterior interosseous vessels and a **distal aperture** for the terminal part of the anterior interosseous vessels. Together with the medial and lateral intermuscular septa of the forearm, it also helps separate the anterior and posterior compartments.","why":{"0":"Rotation of the humerus is a movement of the shoulder joint, not a function of the interosseous membrane.","2":"The main direction of force transfer is radius → ulna; stating it the other way around is incorrect.","3":"The flexor and extensor retinacula are thickened fascia at the wrist; the interosseous membrane does not separate them.","4":"The floor of the cubital fossa is the brachialis and supinator."},"one":"The interosseous membrane transmits force from the radius to the ulna and provides stability and muscle attachment."},"w10_arm-23":{"q":"The tendon of flexor carpi radialis is a useful surface guide to which artery in the distal forearm?","o":["Ulnar artery","Anterior interosseous artery","Radial artery","Common interosseous artery","Deep brachial artery"],"a":2,"src":"Arm and Forearm.pdf, slide 24","img":[{"u":"img/w10_arm/p24.webp","cap":"Arm and Forearm.pdf, slide 24","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"The anterior forearm compartment has 8 muscles that generally flex the wrist and digits and pronate the forearm; **6½ of the 8** are supplied by the median nerve. The superficial layer arises from the common flexor tendon (CFT) at the medial epicondyle.\n\nFrom lateral to medial, the superficial layer is the pronator teres (PT), **flexor carpi radialis (FCR)**, palmaris longus (PL), and flexor carpi ulnaris (FCU). The FCR inserts on the bases of metacarpals 2 and 3, and **its tendon is the landmark for finding the radial artery**: at the lateral wrist, the radial artery is palpated just lateral to the FCR tendon.\n\nFor reference, the palmaris longus is absent in about 13% of people, and the ulnar nerve passes between the two heads of the FCU.","why":{"0":"The ulnar artery runs on the medial forearm and is found near the flexor carpi ulnaris.","1":"The anterior interosseous artery is a branch of the common interosseous artery that runs on the front of the interosseous membrane; it is not palpated using the FCR tendon.","3":"The common interosseous artery is a deep proximal branch of the ulnar artery.","4":"The deep brachial artery is the vessel that accompanies the radial nerve in the arm."},"one":"The FCR tendon is the landmark for locating the radial artery in the distal forearm."},"w10_arm-24":{"q":"After passing behind the medial epicondyle, the ulnar nerve enters the forearm by traveling between the two heads of:","o":["Pronator teres","Flexor digitorum superficialis","Flexor carpi radialis","Flexor carpi ulnaris","Palmaris longus"],"a":3,"src":"Arm and Forearm.pdf, slide 24, 33","img":[{"u":"img/w10_arm/p24.webp","cap":"Arm and Forearm.pdf, slide 24","w":1200,"h":900},{"u":"img/w10_arm/p33.webp","cap":"Arm and Forearm.pdf, slide 33","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"Among the superficial anterior forearm muscles, the **flexor carpi ulnaris (FCU)** has a humeral head arising from the common flexor tendon, and the **ulnar nerve passes between its two heads** to enter the forearm. The FCU inserts on the base of metacarpal 5.\n\nAs a matching pair, the **median nerve** enters the forearm between the two heads of the **pronator teres**. Lock in which nerve goes with which muscle so you do not confuse these two \"between the heads\" passages.\n\nIn the forearm the ulnar nerve supplies only the FCU and the medial half of the flexor digitorum profundus (1½ muscles); the rest is median nerve territory.","why":{"0":"The nerve that passes between the two heads of the pronator teres is the median nerve.","1":"The flexor digitorum superficialis also has humero-ulnar and radial heads, but the standard route for the ulnar nerve into the forearm is between the two heads of the FCU.","2":"The flexor carpi radialis is the landmark for the radial artery, not a passage for the ulnar nerve.","4":"The palmaris longus is a superficial muscle that continues as the palmar aponeurosis; it does not transmit the ulnar nerve."},"one":"The ulnar nerve enters between the two heads of the FCU; the median nerve enters between the two heads of the pronator teres."},"w10_arm-25":{"q":"Flexor digitorum profundus is innervated by the:","o":["Median nerve to both halves of the muscle","Ulnar nerve to both halves of the muscle","Radial nerve to both halves of the muscle","Anterior interosseous nerve alone","Median nerve radially and ulnar nerve ulnarly"],"a":4,"src":"Arm and Forearm.pdf, slide 26, 33","img":[{"u":"img/w10_arm/p26.webp","cap":"Arm and Forearm.pdf, slide 26","w":1200,"h":900},{"u":"img/w10_arm/p33.webp","cap":"Arm and Forearm.pdf, slide 33","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"The deep layer of the anterior compartment has three muscles. The **flexor digitorum profundus (FDP)** inserts on the bases of distal phalanges 2–5 and flexes the DIP joints; the **flexor pollicis longus (FPL)** inserts on the base of distal phalanx 1; and the **pronator quadratus** runs transversely from the ulna to the radius.\n\nThe FDP is unusual in having **dual innervation**: the **radial half (index and middle fingers)** is supplied by the **median nerve**, and the **ulnar half (ring and little fingers)** by the **ulnar nerve**. That is why, of the 8 anterior compartment muscles, the median nerve supplies 6½ and the ulnar nerve 1½ (FCU + medial half of FDP).\n\nThe anterior interosseous nerve (AIN), the deep branch of the median nerve, supplies the FPL and pronator quadratus. The FDS inserts by split tendons on middle phalanges 2–5 and flexes the PIP joints.","why":{"0":"The median nerve supplies only the radial half of the FDP; the ulnar half is supplied by the ulnar nerve.","1":"The ulnar nerve supplies only the ulnar half of the FDP and the FCU.","2":"The radial nerve supplies the posterior compartment muscles and has nothing to do with the FDP.","3":"The anterior interosseous nerve supplies the FPL and pronator quadratus; it is not the sole nerve to the whole FDP."},"one":"The FDP has dual innervation: radial half by the median nerve, ulnar half by the ulnar nerve."},"w10_arm-26":{"q":"All 11 muscles of the posterior compartment of the forearm are innervated by the:","o":["Radial nerve","Median nerve","Ulnar nerve","Musculocutaneous nerve","Axillary nerve"],"a":0,"src":"Arm and Forearm.pdf, slide 29, 33","img":[{"u":"img/w10_arm/p29.webp","cap":"Arm and Forearm.pdf, slide 29","w":1200,"h":900},{"u":"img/w10_arm/p33.webp","cap":"Arm and Forearm.pdf, slide 33","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"The posterior forearm compartment has **11 muscles** that generally extend the wrist and digits and supinate, and **all are supplied by the radial nerve**. The superficial layer arises from the common extensor tendon (CET) at the lateral epicondyle.\n\nThe six superficial muscles are the brachioradialis (BR), extensor carpi radialis longus (ECRL), extensor carpi radialis brevis (ECRB, where the CET origin begins), extensor digitorum (ED, inserting via the extensor expansions), extensor digiti minimi (EDM), and extensor carpi ulnaris (ECU, ulnar deviation). Only the brachioradialis acts in **elbow flexion** rather than wrist extension.\n\nIn front of the lateral epicondyle the radial nerve gives muscular branches to the BR and ECRL; its superficial branch runs deep to the brachioradialis, and its deep branch supplies the remaining four superficial muscles and the five deep muscles.","why":{"1":"The median nerve supplies 6½ muscles of the anterior compartment, not the whole posterior compartment.","2":"The ulnar nerve supplies only the FCU and the medial half of the FDP in the anterior compartment.","3":"The musculocutaneous nerve is responsible only for the three anterior arm muscles and the lateral forearm skin.","4":"The axillary nerve supplies the deltoid and teres minor."},"one":"All 11 muscles of the posterior forearm compartment are supplied by the radial nerve."},"w10_arm-27":{"q":"Which muscle of the posterior forearm compartment functions primarily in elbow flexion rather than in wrist or digital extension?","o":["Extensor carpi radialis longus","Brachioradialis","Supinator","Extensor carpi ulnaris","Anconeus"],"a":1,"src":"Arm and Forearm.pdf, slide 29, 33","img":[{"u":"img/w10_arm/p29.webp","cap":"Arm and Forearm.pdf, slide 29","w":1200,"h":900},{"u":"img/w10_arm/p33.webp","cap":"Arm and Forearm.pdf, slide 33","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"The rule for the posterior compartment is \"extension and supination,\" but there is an exception.\n\nThe **brachioradialis** is the first muscle of the superficial posterior layer, yet its action is **elbow flexion**. The radial nerve gives it (and the ECRL) a muscular branch in front of the lateral epicondyle. The brachioradialis also forms the lateral border of the cubital fossa.\n\nThe other superficial muscles extend the wrist and digits (ED, EDM) or extend and ulnarly deviate the wrist (ECU), and the supinator wraps around the radius to supinate. Be sure to add the brachioradialis as the exception to the \"posterior compartment = extension\" rule.","why":{"0":"The extensor carpi radialis longus extends the wrist and deviates it radially.","2":"The supinator is a deep-layer muscle that wraps around the radius and supinates the forearm.","3":"The extensor carpi ulnaris extends the wrist and produces ulnar deviation.","4":"The anconeus is a small muscle that assists elbow extension; it is not a flexor."},"one":"The brachioradialis is a posterior compartment muscle, but it flexes the elbow."},"w10_arm-28":{"q":"Extensor pollicis longus inserts on the:","o":["Radial base of metacarpal 1","Base of proximal phalanx 1","Base of distal phalanx 1","Ulnar side of the extensor digitorum tendon to the index","Pisiform and hook of the hamate"],"a":2,"src":"Arm and Forearm.pdf, slide 30, 31","img":[{"u":"img/w10_arm/p30.webp","cap":"Arm and Forearm.pdf, slide 30","w":1200,"h":900},{"u":"img/w10_arm/p31.webp","cap":"Arm and Forearm.pdf, slide 31","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"Match each of the five deep posterior muscles to its thumb bone and they won't get mixed up.\n\nThe **abductor pollicis longus (APL)** inserts on the radial base of metacarpal 1; the **extensor pollicis brevis (EPB)** on the base of the first **proximal** phalanx; and the **extensor pollicis longus (EPL)** on the base of the first **distal** phalanx. The **extensor indicis (EI)** joins the ulnar side of the extensor digitorum tendon to the index finger, and the **supinator** wraps around the radius.\n\nThe EPL hooks around the dorsal (Lister's) tubercle of the radius like a pulley and forms the medial (ulnar) border of the anatomical snuffbox. If you reflect the extensor carpi ulnaris and extensor digitorum on a posterior specimen, you can see these five deep muscles and their relation to the posterior interosseous nerve (PIN).","why":{"0":"The muscle inserting on the radial base of metacarpal 1 is the abductor pollicis longus (APL).","1":"The muscle inserting on the base of the first proximal phalanx is the extensor pollicis brevis (EPB).","3":"The muscle that joins the ulnar side of the extensor digitorum tendon is the extensor indicis (EI).","4":"The pisiform and hook of the hamate are the medial attachments of the flexor retinaculum."},"one":"Deep thumb extensors: APL → MC1, EPB → PP1, EPL → DP1."},"w10_arm-29":{"q":"In the forearm, the ulnar artery typically terminates by forming the:","o":["Deep palmar arch","Princeps pollicis artery","Radial recurrent artery","Superficial palmar arch","Posterior interosseous artery"],"a":3,"src":"Arm and Forearm.pdf, slide 32","img":[{"u":"img/w10_arm/p32.webp","cap":"Arm and Forearm.pdf, slide 32","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"The brachial artery divides into the ulnar and radial arteries at the level of the radial neck in the cubital fossa.\n\nThe **ulnar artery** is the **medial** artery of the forearm. Its proximal branches are the anterior and posterior ulnar recurrent arteries and the **common interosseous artery** (which divides into anterior and posterior interosseous arteries), and in the hand it ends as the **superficial palmar arch**.\n\nThe **radial artery** is the **lateral** artery of the forearm; it gives off the radial recurrent artery and the princeps pollicis artery, among others, and ends as the **deep palmar arch**. Pairing \"ulnar = superficial arch, radial = deep arch\" lets you carry the forearm blood supply straight into the wrist and hand.","why":{"0":"The deep palmar arch is where the radial artery ends.","1":"The princeps pollicis artery is a branch of the radial artery system.","2":"The radial recurrent artery is a proximal branch of the radial artery.","4":"The posterior interosseous artery comes from the common interosseous artery (a branch of the ulnar artery); it is not the termination of the ulnar artery."},"one":"The ulnar artery ends as the superficial palmar arch; the radial artery ends as the deep palmar arch."},"w10_arm-30":{"q":"Once the deep branch of the radial nerve has finished piercing the supinator muscle, it is often referred to as the:","o":["Anterior interosseous nerve","Superficial radial nerve","Recurrent branch of the median nerve","Lateral antebrachial cutaneous nerve","Posterior interosseous nerve"],"a":4,"src":"Arm and Forearm.pdf, slide 33","img":[{"u":"img/w10_arm/p33.webp","cap":"Arm and Forearm.pdf, slide 33","w":1200,"h":900}],"ch":"w10_arm","chn":"Arm and Forearm","week":10,"exp":"The radial nerve divides in front of the lateral epicondyle. Muscular branches go to the brachioradialis and ECRL; the **superficial branch** descends deep to the brachioradialis to supply the wrist and dorsum of the hand; and the **deep branch** supplies the remaining four superficial and five deep muscles (11 posterior compartment muscles in total).\n\nOnce the deep branch has **completely pierced the supinator**, it is often called the **posterior interosseous nerve (PIN)**. A deep posterior compartment specimen shows the PIN and its relationship to the five deep muscles.\n\nDo not confuse it with the deep branch the median nerve gives off after passing between the heads of the pronator teres: that is the **anterior interosseous nerve (AIN)**, which supplies the flexor pollicis longus and pronator quadratus.","why":{"0":"The anterior interosseous nerve (AIN) is the deep branch of the median nerve.","1":"The superficial radial nerve is a sensory branch that runs deep to the brachioradialis; it does not pierce the supinator.","2":"The recurrent branch of the median nerve is a hand branch that supplies the thenar muscles.","3":"The lateral antebrachial cutaneous nerve is the terminal branch of the musculocutaneous nerve."},"one":"When the deep branch of the radial nerve emerges from the supinator, it is called the posterior interosseous nerve (PIN)."},"w10_wrist-1":{"q":"From lateral to medial, the four bones of the proximal carpal row are the:","o":["Scaphoid, lunate, triquetrum, and pisiform","Scaphoid, lunate, pisiform, and triquetrum","Trapezium, trapezoid, capitate, and hamate","Lunate, scaphoid, triquetrum, and pisiform","Scaphoid, capitate, lunate, and hamate"],"a":0,"src":"Wrist & Hand 2.pdf, slide 5","img":[{"u":"img/w10_wrist/p05.webp","cap":"Wrist & Hand 2.pdf, slide 5","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"The carpal bones are arranged in **two rows of four**.\n\nThe **proximal row**, from lateral to medial, is **scaphoid (with a tubercle) – lunate – triquetrum (triangular) – pisiform**. The distal row is **trapezium (with a tubercle) – trapezoid – capitate – hamate (with a hook)**.\n\nThe tubercles of the scaphoid and trapezium and the hook of the hamate are the pillars to which the flexor retinaculum attaches. The pisiform is a sesamoid bone lying in front of the triquetrum, the most medial and anterior bone of the proximal row.","why":{"1":"The pisiform and triquetrum are swapped: the triquetrum comes first and the pisiform is the most medial.","2":"This is the order of the distal row (lateral → medial).","3":"The scaphoid is the most lateral; the lunate does not come first.","4":"The capitate belongs to the distal row, not the proximal row."},"one":"Proximal row (lateral → medial): scaphoid – lunate – triquetrum – pisiform."},"w10_wrist-2":{"q":"Which carpal bone is characterized by a hook on its palmar surface?","o":["Pisiform","Hamate","Capitate","Trapezium","Scaphoid"],"a":1,"src":"Wrist & Hand 2.pdf, slide 5","img":[{"u":"img/w10_wrist/p05.webp","cap":"Wrist & Hand 2.pdf, slide 5","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"Distinguish the projections of the carpal bones by name.\n\nThe **hamate** has a **hook (hook of hamate)** on its palmar side. The hook and the pisiform form the **medial pillars** of the carpal tunnel.\n\nThe scaphoid and trapezium each have a **tubercle**, and these form the **lateral pillars**. The capitate is the largest bone of the distal row but has no hook. The ulnar artery curves around the hook of the hamate to form the superficial palmar arch, and the deep branch of the ulnar nerve passes close by, so a fracture of the hook (or a blow over it) puts these structures at risk.","why":{"0":"The pisiform is a sesamoid bone that forms part of the medial pillar, but it is not the bone with a hook.","2":"The capitate is the large bone of the distal row and has no hook.","3":"The trapezium has a tubercle and forms the saddle joint with the first metacarpal.","4":"The scaphoid has a tubercle, and a fracture of its waist carries a risk of avascular necrosis."},"one":"The hook of the hamate and the pisiform are the medial pillars of the carpal tunnel."},"w10_wrist-3":{"q":"The phalanges of one hand number 14 because the thumb lacks a:","o":["Proximal phalanx","Distal phalanx","Middle phalanx","Sesamoid bone at the MCP joint","Metacarpal bone"],"a":2,"src":"Wrist & Hand 2.pdf, slide 5","img":[{"u":"img/w10_wrist/p05.webp","cap":"Wrist & Hand 2.pdf, slide 5","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"Count the bones of one hand as 8 carpals, 5 metacarpals, and **14 phalanges**.\n\nDigits 2–5 each have **proximal, middle, and distal phalanges (PP, MP, DP)**, giving 12, and the **thumb (pollex)** **lacks a middle phalanx**, so it has only a proximal and distal phalanx (2), for a total of 14. The metacarpals are numbered MC1–MC5 from lateral to medial and are counted separately from the phalanges.\n\nClinically, this bone count is why the thumb has no PIP joint and only a single interphalangeal (IP) joint when we talk about DIP and PIP joints.","why":{"0":"The thumb does have a proximal phalanx.","1":"The thumb does have a distal phalanx.","3":"Sesamoid bones are not counted among the 14 phalanges; they are commonly found in front of the thumb MCP joint.","4":"The thumb has a first metacarpal; the metacarpals (5) are counted separately."},"one":"One hand has 14 phalanges because the thumb has no middle phalanx."},"w10_wrist-4":{"q":"The radiocarpal joint is formed by the distal radius and articular disc articulating with the:","o":["Scaphoid and lunate only","Distal row of carpal bones","Ulna, scaphoid, and capitate","Scaphoid, lunate, and triquetrum","Lunate, triquetrum, and pisiform"],"a":3,"src":"Wrist & Hand 2.pdf, slide 6","img":[{"u":"img/w10_wrist/p06.webp","cap":"Wrist & Hand 2.pdf, slide 6","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"In the wrist complex, the distal radioulnar joint is formed where the ulnar head meets the ulnar notch of the radius.\n\nThe **radiocarpal joint** is formed by the **distal radius and the articular disc** articulating with the **scaphoid, lunate, and triquetrum**. The pisiform does not take part directly. Abduction/adduction and flexion/extension occur at this joint.\n\nIts capsule is reinforced by the palmar radiocarpal and ulnocarpal ligaments, the dorsal radiocarpal ligament, and the radial and ulnar collateral ligaments. The ulna itself participates only indirectly, through the disc, so saying \"the ulna forms a broad articular surface directly with the carpals\" is incorrect.","why":{"0":"Not only the scaphoid and lunate but also the triquetrum takes part in this joint, via the articular disc.","1":"The distal row is mainly involved in the midcarpal and carpometacarpal joints.","2":"The ulna is separated by the disc, and the capitate belongs to the distal row.","4":"The pisiform is a sesamoid bone in front of the triquetrum and is not part of the radiocarpal articular surface."},"one":"Radiocarpal joint = distal radius + disc articulating with scaphoid, lunate, and triquetrum."},"w10_wrist-5":{"q":"The highly mobile first carpometacarpal joint, which permits flexion, extension, abduction, adduction, and rotation or circumduction, is between:","o":["Metacarpal 1 and the scaphoid","Metacarpal 1 and the trapezoid","Metacarpal 1 and the capitate","Metacarpal 2 and the trapezium","Metacarpal 1 and the trapezium"],"a":4,"src":"Wrist & Hand 2.pdf, slide 7","img":[{"u":"img/w10_wrist/p07.webp","cap":"Wrist & Hand 2.pdf, slide 7","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"Mobility of the carpometacarpal (CMC) joints varies greatly from digit to digit.\n\n**CMC I** is a **saddle joint** between the **first metacarpal and the trapezium**. It allows flexion/extension, abduction/adduction, and rotation/circumduction, which makes it the key to thumb opposition. **CMC II–V**, by contrast, have much less mobility.\n\nThe metacarpophalangeal (MCP) joints are reinforced by palmar ligaments and medial and lateral collateral ligaments, and three deep transverse metacarpal ligaments connect the palmar ligaments to one another. The interphalangeal joints (PIP, DIP) are hinge joints allowing only flexion and extension, reinforced by medial and lateral collateral ligaments.","why":{"0":"The scaphoid is the lateral bone of the proximal row and does not form a CMC joint directly with the first metacarpal.","1":"The trapezoid is associated mainly with the second metacarpal.","2":"The capitate is associated mainly with the third metacarpal.","3":"The bone that articulates with the trapezium is the first metacarpal, not the second."},"one":"CMC I is the highly mobile saddle joint between the first metacarpal and the trapezium."},"w10_wrist-6":{"q":"The interphalangeal joints of the fingers are best classified as:","o":["Hinge joints that permit flexion and extension","Ball-and-socket joints that permit circumduction","Plane joints with essentially no motion","Pivot joints specializing in rotation","Saddle joints like the first CMC joint"],"a":0,"src":"Wrist & Hand 2.pdf, slide 7","img":[{"u":"img/w10_wrist/p07.webp","cap":"Wrist & Hand 2.pdf, slide 7","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"Distinguish the finger joints by type and allowed motion.\n\nThe **interphalangeal joints (PIP and DIP)** are **hinge joints**, and their movements are **flexion and extension**. Medial and lateral **collateral ligaments** reinforce them and prevent side-to-side wobbling. Because the thumb has no middle phalanx, it has only one IP joint.\n\nThe MCP joints are reinforced by palmar ligaments and collateral ligaments, and three deep transverse metacarpal ligaments link the palmar ligaments. Only CMC I is a saddle joint with a wide range of motion; CMC II–V have little mobility.","why":{"1":"Ball-and-socket joints, like the shoulder, move about many axes; this is not the type of an IP joint.","2":"Plane joints describe some of the intercarpal joints; IP joints clearly flex and extend.","3":"An example of a pivot joint is the proximal radioulnar joint; rotation is not the main motion at the IP joints.","4":"The saddle joint is the first CMC (trapezium–MC1)."},"one":"PIP and DIP joints are hinge joints that only flex and extend, reinforced by collateral ligaments."},"w10_wrist-7":{"q":"Medially, the flexor retinaculum of the wrist attaches to the:","o":["Scaphoid and trapezium","Pisiform and hook of the hamate","Radial styloid and dorsal tubercle","Ulnar styloid and triquetrum only","Capitate and lunate"],"a":1,"src":"Wrist & Hand 2.pdf, slide 8, 10","img":[{"u":"img/w10_wrist/p08.webp","cap":"Wrist & Hand 2.pdf, slide 8","w":1200,"h":900},{"u":"img/w10_wrist/p10.webp","cap":"Wrist & Hand 2.pdf, slide 10","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"The **flexor retinaculum** is continuous with the antebrachial fascia but is a much thicker band.\n\nMedially it attaches to the **pisiform and the hook of the hamate**; laterally it attaches to the **scaphoid and trapezium** (their tubercles). These attachments are the medial and lateral pillars of the carpal tunnel. The retinaculum prevents the flexor tendons from bow-stringing.\n\nThe **extensor retinaculum** is also continuous with the antebrachial fascia; it attaches to the distal anterior border of the radius and the ulnar styloid process and holds down the dorsal extensor tendons.","why":{"0":"The scaphoid and trapezium are the lateral attachments of the flexor retinaculum.","2":"The distal anterior border of the radius and the ulnar styloid are attachments of the extensor retinaculum.","3":"The ulnar styloid relates to the extensor retinaculum; the medial attachments of the flexor retinaculum are the pisiform and the hook of the hamate.","4":"The capitate and lunate are not the medial or lateral pillars of the retinaculum."},"one":"Flexor retinaculum: medial = pisiform and hook of hamate; lateral = tubercles of scaphoid and trapezium."},"w10_wrist-8":{"q":"The extensor retinaculum attaches to the distal anterior border of the radius and to the:","o":["Pisiform and hook of the hamate","Tubercles of the scaphoid and trapezium","Styloid process of the ulna","Hook of the hamate and palmar aponeurosis","Common flexor tendon at the medial epicondyle"],"a":2,"src":"Wrist & Hand 2.pdf, slide 8","img":[{"u":"img/w10_wrist/p08.webp","cap":"Wrist & Hand 2.pdf, slide 8","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"The structure that holds down the tendons on the back of the wrist is the **extensor retinaculum**. It is continuous with the antebrachial fascia and attaches to the **distal anterior border of the radius** and the **styloid process of the ulna**.\n\nDeep to it are six extensor tendon compartments, numbered from lateral to medial. The first (most lateral) compartment contains the abductor pollicis longus (APL) and extensor pollicis brevis (EPB), and stenosis here is the anatomic basis of De Quervain disease.\n\nTo avoid confusing its attachments with those of the flexor retinaculum: dorsal + ulnar styloid = extensor retinaculum; palmar + pisiform/hook of hamate = flexor retinaculum.","why":{"0":"The pisiform and hook of the hamate are the medial attachments of the flexor retinaculum.","1":"The tubercles of the scaphoid and trapezium are the lateral attachments of the flexor retinaculum.","3":"The hook of the hamate and the palmar aponeurosis are not attachments of the extensor retinaculum.","4":"The common flexor tendon is the elbow structure from which the superficial anterior forearm muscles arise."},"one":"The extensor retinaculum attaches to the distal anterior border of the radius and the ulnar styloid process."},"w10_wrist-9":{"q":"The first (most lateral) extensor compartment deep to the extensor retinaculum contains the tendons of:","o":["Extensor pollicis longus alone","Extensor carpi radialis longus and brevis","Extensor digitorum and extensor indicis","Abductor pollicis longus and extensor pollicis brevis","Extensor carpi ulnaris alone"],"a":3,"src":"Wrist & Hand 2.pdf, slide 9","img":[{"u":"img/w10_wrist/p09.webp","cap":"Wrist & Hand 2.pdf, slide 9","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"Beneath the extensor retinaculum, the extensor tendons are divided into **six compartments** numbered from lateral to medial. In the cross-section figure, the most lateral (L) is compartment 1.\n\nThe **first compartment** contains the **abductor pollicis longus (APL)** and **extensor pollicis brevis (EPB)**. These two tendons pass over the radial styloid, and stenosis of this compartment is a common cause of radial-sided wrist pain.\n\nThe fourth compartment holds the extensor digitorum and extensor indicis, the fifth the extensor digiti minimi, and the sixth (most medial) the extensor carpi ulnaris. Compartments 2 and 3 are occupied by the radial wrist extensors and the extensor pollicis longus; use the numbers and tendon names in the figure to tell them apart.","why":{"0":"The extensor pollicis longus is not in the first compartment; it lies in a more medial compartment and hooks around the dorsal tubercle.","1":"The extensor carpi radialis longus and brevis lie in a compartment medial to the first.","2":"The extensor digitorum and extensor indicis are the contents of the fourth compartment.","4":"The extensor carpi ulnaris is the tendon of the sixth, most medial compartment."},"one":"The first (most lateral) extensor compartment = APL + EPB."},"w10_wrist-10":{"q":"Carpal tunnel syndrome is usually produced by compression of the median nerve secondary to:","o":["Thrombosis of the ulnar artery in Guyon’s canal","Fracture of the ulnar styloid process","Tightness of the extensor retinaculum","Impingement of the radial nerve at the wrist","Inflammation of the synovial sheaths of the flexor tendons"],"a":4,"src":"Wrist & Hand 2.pdf, slide 9, 11","img":[{"u":"img/w10_wrist/p09.webp","cap":"Wrist & Hand 2.pdf, slide 9","w":1200,"h":900},{"u":"img/w10_wrist/p11.webp","cap":"Wrist & Hand 2.pdf, slide 11","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"**Carpal tunnel syndrome** results from compression of the **median nerve** inside the carpal tunnel. A common cause is **inflammation of the synovial sheaths** around the flexor tendons, which raises the pressure inside the tunnel. Overuse, swelling of the tendons and synovium, rheumatoid arthritis, and cysts arising from the wrist joint can also increase the pressure.\n\nThe raised pressure is thought to cause venous congestion and hypoxic injury of the capillary endothelium within the median nerve itself. Patients report pain and numbness in the median nerve territory, and thenar weakness and wasting may develop. Reproducing the symptoms by lightly tapping over the flexor retinaculum is Tinel's sign.\n\nInitial treatment aims to reduce inflammation and repetitive irritation; if there is no improvement, decompression by dividing the flexor retinaculum may be needed after nerve conduction studies.","why":{"0":"An ulnar artery lesion in Guyon's canal is a problem of the ulnar nerve and vessels, not compression of the median nerve in the carpal tunnel.","1":"An ulnar styloid fracture is not the typical mechanism of carpal tunnel syndrome.","2":"The roof over the median nerve is the flexor retinaculum, not the extensor retinaculum.","3":"The superficial branch of the radial nerve runs on the lateral dorsal wrist and is not a structure inside the carpal tunnel."},"one":"Carpal tunnel syndrome usually results from flexor synovial sheath inflammation compressing the median nerve."},"w10_wrist-11":{"q":"The lateral pillars of the carpal tunnel are the tubercles of the:","o":["Scaphoid and trapezium","Pisiform and hamate","Lunate and capitate","Trapezoid and capitate","Scaphoid and lunate"],"a":0,"src":"Wrist & Hand 2.pdf, slide 10","img":[{"u":"img/w10_wrist/p10.webp","cap":"Wrist & Hand 2.pdf, slide 10","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"The carpal tunnel is the passage beneath the flexor retinaculum.\n\nThe **lateral pillars** are the **tubercles of the scaphoid and trapezium**; the **medial pillars** are the **pisiform and the hook of the hamate**. In a proximal section the pisiform, triquetrum, hamate, capitate, and scaphoid form the floor; in a distal section the hook of the hamate, capitate, trapezoid, and trapezium form the floor.\n\nThe listed contents are the **median nerve** (the most sensitive structure), the **FPL, FDS, and FDP tendons**, and the **FCR tendon**. The FCR runs through a separate passage within the flexor retinaculum but is \"considered part of the carpal tunnel.\" The ulnar nerve and artery lie medially, outside the carpal tunnel (in the ulnar tunnel).","why":{"1":"The pisiform and hamate are the medial pillars.","2":"The lunate and capitate may form part of the floor of the tunnel, but they are not the lateral pillars.","3":"The trapezoid and capitate form the floor in the distal section; they are not the lateral pillars.","4":"The lunate is not one of the lateral pillars."},"one":"Carpal tunnel lateral pillars = tubercles of scaphoid and trapezium; medial = pisiform and hook of hamate."},"w10_wrist-12":{"q":"The palmar aponeurosis is a thickening of the superficial layer of deep fascia of the hand and is continuous with the flexor retinaculum and the tendon of:","o":["Flexor carpi radialis","Palmaris longus","Flexor carpi ulnaris","Flexor digitorum superficialis","Abductor digiti minimi"],"a":1,"src":"Wrist & Hand 2.pdf, slide 10","img":[{"u":"img/w10_wrist/p10.webp","cap":"Wrist & Hand 2.pdf, slide 10","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"The **palmar aponeurosis** is a thickening of the superficial layer of the deep fascia of the hand and is continuous with the **tendon of the palmaris longus** and the **flexor retinaculum**. Its longitudinal fibers run down toward the digits, including the fourth and fifth, and transverse fibers connect them. The palmaris brevis lies over its medial part.\n\nWhen the longitudinal bands of this aponeurosis thicken, shorten, and adhere to the skin, the ring and little fingers are pulled into partial flexion at the MCP and PIP joints: **Dupuytren contracture**.\n\nThe palmaris longus is absent in about 13% of people, but the aponeurosis itself is still present even without it.","why":{"0":"The flexor carpi radialis tendon passes through the lateral passage of the carpal tunnel and is not continuous with the aponeurosis.","2":"The flexor carpi ulnaris inserts toward the pisiform and is not the proximal continuation of the aponeurosis.","3":"The flexor digitorum superficialis tendons pass through the carpal tunnel and insert on the middle phalanges.","4":"The abductor digiti minimi is a hypothenar muscle, not the tendon continuous with the aponeurosis."},"one":"The palmar aponeurosis is continuous with the palmaris longus tendon and the flexor retinaculum."},"w10_wrist-13":{"q":"In a transverse section at the distal carpal row, which neurovascular pair lies outside the carpal tunnel on its ulnar side?","o":["Median nerve and flexor pollicis longus","Radial artery and flexor carpi radialis","Ulnar nerve and ulnar artery","Anterior interosseous nerve and artery","Superficial radial nerve and cephalic vein"],"a":2,"src":"Wrist & Hand 2.pdf, slide 10, 11","img":[{"u":"img/w10_wrist/p10.webp","cap":"Wrist & Hand 2.pdf, slide 10","w":1200,"h":900},{"u":"img/w10_wrist/p11.webp","cap":"Wrist & Hand 2.pdf, slide 11","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"On a transverse wrist section and MRI, the median nerve and long flexor tendons pass beneath the flexor retinaculum (the roof), and **outside it on the ulnar side** lie the **ulnar nerve and ulnar artery** in their own passage. This passage is the ulnar tunnel (Guyon's canal).\n\nIn the same section the radial artery is lateral, and the palmaris longus is superficial to the retinaculum. So carpal tunnel release divides the flexor retinaculum to free the median nerve,
