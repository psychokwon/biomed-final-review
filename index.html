eater splanchnic nerves from the abdominal chain only"],"a":1,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 34, 35","img":[{"u":"img/w11_heart/p34.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 34","w":1200,"h":900},{"u":"img/w11_heart/p35.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 35","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The cardiac nerves arise from the **vagus nerve (parasympathetic)** and the **sympathetic chain**. Their fibers form the **cardiac plexus** around the aortic arch and pulmonary arteries.\n\nIn the figure, the yellow nerve bundles descending toward the ascending aorta and pulmonary artery are the cardiac nerves, and the area circled in yellow around the tracheal bifurcation and right pulmonary artery is the cardiac plexus.","why":{"0":"The phrenic nerve carries pericardial sensation and supplies the diaphragm, but the stated sources of the cardiac plexus are the vagus nerve and sympathetic chain.","2":"The recurrent laryngeal nerve is a vagal branch to the larynx, not the sole source of the cardiac plexus.","3":"The hypoglossal and accessory nerves are cranial nerves supplying the tongue, sternocleidomastoid, and trapezius, not cardiac nerves.","4":"The greater splanchnic nerves are sympathetic nerves to the abdominal foregut."},"one":"Cardiac nerves come from the vagus (parasympathetic) and the sympathetic chain and form the cardiac plexus."},"w11_heart-29":{"q":"Sympathetic fibers to the heart produce which combination of effects?","o":["Slow the heart rate, reduce force of beat, and constrict vessels","Slow the heart rate, increase force of beat, and constrict vessels","Increase the heart rate, reduce force of beat, and constrict vessels","Increase the heart rate, increase force of beat, and constrict vessels","Increase the heart rate, increase force of beat, and dilate coronary vessels"],"a":4,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 36","img":[{"u":"img/w11_heart/p36.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 36","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"**Sympathetic fibers** tune the heart for a \"fight or flight\" state: they **increase the heart rate**, **increase the force of the beat**, and **dilate the coronary vessels**.\n\nThe coronary vessels must open so that the faster, stronger myocardium gets more oxygen and nutrients. These fibers reach the heart from the sympathetic chain through the cardiac plexus.","why":{"0":"Slowing the rate, reducing the force, and constricting vessels are parasympathetic effects.","1":"Sympathetic fibers raise the heart rate rather than slowing it, and they dilate rather than constrict the coronary vessels.","2":"Reducing the force of the beat and constricting vessels are not sympathetic effects.","3":"Increased rate and force are correct, but sympathetic fibers dilate the coronary vessels rather than constricting them."},"one":"Sympathetic fibers increase heart rate and contractile force and dilate the coronary vessels."},"w11_heart-30":{"q":"Parasympathetic fibers to the heart produce which combination of effects?","o":["Slow the heart rate, reduce force of beat, and constrict vessels","Increase the heart rate, increase force of beat, and dilate coronary vessels","Increase the heart rate, reduce force of beat, and dilate vessels","Slow the heart rate, increase force of beat, and dilate vessels","Slow the heart rate, reduce force of beat, and dilate coronary vessels"],"a":0,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 36","img":[{"u":"img/w11_heart/p36.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 36","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"**Parasympathetic fibers** enter the cardiac plexus via the vagus nerve. Their effects are opposite to the sympathetic: they **slow the heart rate**, **reduce the force of the beat**, and **constrict the vessels**.\n\nTheir role is to keep the heart from beating faster and harder than needed at rest. Memorize the three effects (rate, force, coronary vessel tone) as pairs so you can tell them apart even when the options mix them.","why":{"1":"Increased rate, increased force, and coronary dilation are sympathetic effects.","2":"Parasympathetic fibers lower the heart rate rather than raising it, and they constrict rather than dilate vessels.","3":"Increasing the force and dilating vessels are not parasympathetic effects.","4":"Decreased rate and force are correct, but parasympathetic fibers constrict rather than dilate the vessels."},"one":"Parasympathetic fibers slow the heart rate, reduce contractile force, and constrict the vessels."},"w11_cv_histo-1":{"q":"Which pairing correctly matches a vessel-wall layer with its counterpart in the heart wall?","o":["Tunica intima with endocardium; tunica media with myocardium; tunica adventitia with epicardium","Tunica intima with epicardium; tunica media with endocardium; tunica adventitia with myocardium","Tunica intima with myocardium; tunica media with epicardium; tunica adventitia with endocardium","Tunica intima with pericardium; tunica media with endocardium; tunica adventitia with myocardium","Tunica intima with endocardium; tunica media with pericardium; tunica adventitia with myocardium"],"a":0,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 2, 3","img":[{"u":"img/w11_cv_histo/p02.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 2","w":1200,"h":900},{"u":"img/w11_cv_histo/p03.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 3","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"Vessel walls and the heart wall follow the same three-layer logic. The **tunica intima** corresponds to the **endocardium**, the **tunica media** to the **myocardium**, and the **tunica adventitia** to the **epicardium**.\n\nIn the overview of the whole circulation, large veins, elastic arteries, muscular arteries, arterioles, venules, fenestrated capillaries, and continuous capillaries are all drawn as variations on the same layered structure. The **pericardium** that surrounds the heart is made of fibroelastic connective tissue and **limits expansion** so the heart is not overstretched. The pericardium is not the counterpart of one of the three heart-wall layers; it is the sac wrapped around the outside.","why":{"1":"The intima corresponds to the endocardium, not the epicardium; the media corresponds to the myocardium and the adventitia to the epicardium.","2":"Every layer is out of order; the innermost is intima–endocardium.","3":"The pericardium is not a counterpart layer of the heart wall; it is a fibroelastic sac around the heart that limits expansion.","4":"The counterpart of the media is the myocardium, not the pericardium."},"one":"Intima = endocardium, media = myocardium, adventitia = epicardium; the fibroelastic pericardium limits cardiac expansion."},"w11_cv_histo-2":{"q":"From the heart chamber outward, which sequence of layers is correct?","o":["Myocardium, endocardium, fibrous pericardium, pericardial cavity, epicardium, parietal pleura","Fibrous pericardium, visceral serous pericardium, myocardium, endocardium, parietal pleura","Endocardium, myocardium, epicardium, pericardial cavity, parietal serous layer, fibrous pericardium","Endocardium, pericardial cavity, myocardium, fibrous pericardium, epicardium, parietal pleura","Epicardium, myocardium, endocardium, pericardial cavity, fibrous pericardium, parietal pleura"],"a":2,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 4","img":[{"u":"img/w11_cv_histo/p04.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 4","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"Going outward from the heart chamber, the order is **endocardium** → **myocardium** → **epicardium**. The epicardium contains adipose tissue, and its surface is the **visceral layer of serous pericardium**.\n\nOutside that is the potential space, the **pericardial cavity**, followed by the **parietal layer of serous pericardium** and finally the outermost **fibrous pericardium**. The pericardial cavity lies between the visceral and parietal layers, not inside the myocardium.","why":{"0":"The endocardium must be innermost and the fibrous pericardium outermost; the order is scrambled.","1":"The fibrous pericardium is the outermost layer, not the innermost.","3":"The pericardial cavity lies between the visceral serous layer (epicardium) and the parietal serous layer, not between the endocardium and myocardium.","4":"The epicardium cannot be innermost; the chamber lining is the endocardium."},"one":"From inside out: endocardium – myocardium – epicardium (visceral serous layer) – pericardial cavity – parietal serous layer – fibrous pericardium."},"w11_cv_histo-3":{"q":"The free surface of the pericardium is lined by which tissue?","o":["Stratified squamous keratinized epithelium","Transitional epithelium","Ciliated pseudostratified columnar epithelium","Hyaline cartilage","Mesothelium"],"a":4,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 5","img":[{"u":"img/w11_cv_histo/p05.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 5","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"The free surface of the pericardium is lined by **mesothelium**, the simple squamous epithelium covering serous membranes. In tissue sections it appears as a thin, dark line of cells on the surface of the connective tissue.\n\nThis mesothelium secretes serous fluid so that the visceral and parietal layers glide smoothly as the heart beats. It is different from keratinized stratified squamous epithelium like the skin, the ciliated epithelium of the airways, or the transitional epithelium of the bladder.","why":{"0":"Keratinized stratified squamous epithelium is characteristic of the epidermis and does not line the pericardium.","1":"Transitional epithelium lines the urinary tract (renal pelvis, bladder, etc.).","2":"Ciliated pseudostratified columnar epithelium is the typical epithelium of the respiratory airways.","3":"Hyaline cartilage is found in the trachea, joint surfaces, and similar sites; it does not cover the pericardium."},"one":"The free surface of the pericardium is lined by serous-fluid-secreting mesothelium."},"w11_cv_histo-4":{"q":"Coronary arteries are embedded in which layer of the heart wall?","o":["Endocardium","Epicardium","The subendocardial Purkinje layer only","The fibrous pericardium exclusive of fat","The parietal pleura"],"a":1,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 6","img":[{"u":"img/w11_cv_histo/p06.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 6","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"The **epicardium** is covered by **mesothelium**, which secretes serous fluid, and it adheres to the myocardium. This layer contains **loose connective tissue** with veins, nerves, and fat, and the **coronary arteries are embedded in it**.\n\nIn a section you see, in order, the surface mesothelium, the connective tissue and nerves beneath it, fat, and then myocardium. The fact that the coronary arteries lie in epicardial fat, not in the endocardium or fibrous pericardium, also matters clinically.","why":{"0":"The endocardium is the lining of the chambers, not where the coronary arteries are embedded.","2":"Purkinje fibers lie just beneath the ventricular endocardium (subendocardium); the coronary arteries are in the epicardium.","3":"The fibrous pericardium is the outermost sac; the coronary arteries are in the epicardium on the surface of the heart.","4":"The parietal pleura lines the thoracic cavity and is not a layer of the heart wall."},"one":"The coronary arteries are embedded in the epicardium, which contains mesothelium plus loose connective tissue, fat, and nerves."},"w11_cv_histo-5":{"q":"Atrial myocardium is relatively thin and is the source of which hormone?","o":["Antidiuretic hormone","Erythropoietin","Thyroxine","Atrial natriuretic peptide","Parathyroid hormone"],"a":3,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 7","img":[{"u":"img/w11_cv_histo/p07.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 7","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"Atrial myocardium is **relatively thin** compared with the ventricles, shows **fatty infiltration** near the epicardium, and produces **atrial natriuretic peptide (ANP)**.\n\nWhen the atria are stretched, ANP is released, increasing sodium and water excretion and relaxing blood vessels to reduce blood volume. Ventricular myocardium, in contrast, is thicker (especially the left ventricle), has spirally arranged muscle fibers attached to the cardiac skeleton, and is richly vascularized.","why":{"0":"Antidiuretic hormone is made in the hypothalamus and released from the posterior pituitary.","1":"Erythropoietin is secreted mainly by the kidney.","2":"Thyroxine is a thyroid hormone.","4":"Parathyroid hormone comes from the parathyroid glands."},"one":"Atrial myocardium is thin and secretes ANP; ventricular myocardium is thicker and spirally arranged."},"w11_cv_histo-6":{"q":"Ventricular muscle fibers are attached to the cardiac skeleton and are arranged:","o":["Spirally","As a single straight longitudinal band only","In concentric bony rings like osteons","As a random unattached mesh with no skeleton insertion","Exclusively as circular fibers around the atria"],"a":0,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 7, 8","img":[{"u":"img/w11_cv_histo/p07.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 7","w":1200,"h":900},{"u":"img/w11_cv_histo/p08.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 8","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"Ventricular myocardium is thick, especially in the left ventricle, and its fibers are arranged **spirally**. These fibers attach to the **cardiac skeleton**, and the blood supply is rich.\n\nThanks to the spiral arrangement, the ventricles don't just squeeze; they contract with a wringing twist that ejects blood efficiently. The figure shows ventricular wall muscle winding down around the heart.","why":{"1":"Ventricular fibers are not a single straight longitudinal band; they wind spirally.","2":"Concentric bony rings are the osteon structure of bone, not myocardium.","3":"Ventricular fibers do attach to the cardiac skeleton.","4":"The spiral arrangement is a ventricular feature; it is not just rings around the atria."},"one":"Ventricular muscle fibers are arranged spirally and attach to the cardiac skeleton; the left ventricle is especially thick."},"w11_cv_histo-7":{"q":"Compared with ventricular endocardium, atrial endocardium is:","o":["Thinner and irregular, and distant from any conducting fibers of the wall","Absent, because atria are lined only by myocardium","Thicker and smoother, with fibroelastic tissue and few smooth muscle cells","Composed of hyaline cartilage and osteoid","Identical in thickness, but lined by mesothelium rather than endothelium"],"a":2,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 9","img":[{"u":"img/w11_cv_histo/p09.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 9","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"**Atrial endocardium** is **thicker** than ventricular endocardium, looks **smoother**, contains **fibroelastic connective tissue**, and has a **few smooth muscle cells**.\n\n**Ventricular endocardium**, by contrast, is **thinner and irregular** and lies next to the **Purkinje fibers**. In the section, the ventricular side shows large, pale-staining Purkinje cells just beneath the endocardium.","why":{"0":"Thinner and irregular describes the ventricular endocardium.","1":"The atria do have an endocardium, and it is actually thicker than in the ventricles.","3":"The endocardium is not cartilage or osteoid.","4":"The surface of the endocardium is endothelium; mesothelium covers the epicardium and pericardium. The thickness is not the same either."},"one":"Atrial endocardium is thicker and smoother; ventricular endocardium is thinner, irregular, and next to Purkinje fibers."},"w11_cv_histo-8":{"q":"Purkinje fibers lie in the subendocardium of the inner ventricular walls and, compared with cardiomyocytes, are:","o":["Smaller, with more myofibrils and fewer mitochondria","Identical in size, with no difference in conduction speed","Larger, with more myofibrils and no mitochondria","Confined to the epicardial fat around coronary arteries","Larger, with fewer myofibrils, many mitochondria, and faster conduction"],"a":4,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 10, 11","img":[{"u":"img/w11_cv_histo/p10.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 10","w":1200,"h":900},{"u":"img/w11_cv_histo/p11.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 11","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"**Purkinje fibers** lie in the inner ventricular walls in the **subendocardium**, just beneath the endocardium. In the section they appear as large, pale cells between the luminal endocardium and the deeper myocardium.\n\nThese cells are **larger** than ordinary cardiomyocytes, with **fewer myofibrils** and **many mitochondria**. They conduct action potentials **faster and more efficiently** than other heart cells, so the right and left ventricles contract in synchrony.","why":{"0":"The opposite: Purkinje cells are larger, with fewer myofibrils and many mitochondria.","1":"Both size and conduction speed differ from ordinary cardiomyocytes; Purkinje fibers are faster.","2":"Larger is correct, but they have fewer myofibrils, not more, and they have many mitochondria, not none.","3":"They are not in the epicardium where the coronary arteries are, but beneath the ventricular endocardium."},"one":"Purkinje fibers are large subendocardial conducting cells with few myofibrils and many mitochondria, so they conduct quickly."},"w11_cv_histo-9":{"q":"The cardiac skeleton consists of dense connective tissue that separates atria from ventricles and includes valves made of fibrous connective tissue lined by:","o":["Mesothelium","Endothelium","Keratinized epidermis","Hyaline cartilage","Osteoblasts"],"a":1,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 12","img":[{"u":"img/w11_cv_histo/p12.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 12","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"The **cardiac skeleton** is made of **dense connective tissue**. It **separates the atria from the ventricles**, serves as the **attachment site for cardiac muscle**, and contains the **heart valves**.\n\nThe valves are made of **fibrous connective tissue**, and their surfaces are covered by **endothelium**. A continuous endothelium reduces thrombosis and turbulence. Mesothelium is the covering of the epicardium and pericardium.","why":{"0":"Mesothelium covers the free surfaces of the epicardium and pericardium; valve surfaces are covered by endothelium.","2":"Keratinized epidermis is skin and is not found on valves.","3":"Normal heart valves are fibrous connective tissue, not hyaline cartilage.","4":"Osteoblasts are bone-forming cells, not a valve covering."},"one":"The cardiac skeleton is dense connective tissue that separates atria from ventricles and anchors muscle; valves are fibrous connective tissue covered by endothelium."},"w11_cv_histo-10":{"q":"In a histologic section of an atrioventricular valve stained so that dense collagen appears blue, the thin strands extending from the cusp (labeled CT) are:","o":["Purkinje fibers of the subendocardium","Coronary arteries in epicardial fat","Pectinate muscles of the atrial wall","Chordae tendineae","Fenestrated elastic laminae of the aorta"],"a":3,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 13","img":[{"u":"img/w11_cv_histo/p13.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 13","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"In a section of an atrioventricular valve, the deep blue-stained part is the **dense connective tissue** of the cusp (part of the cardiac skeleton). The thin strands hanging from the cusp toward the ventricle (CT) are the **chordae tendineae**.\n\nThe chordae tendineae connect the cusps to the papillary muscles and keep the valve from everting into the atrium during systole. The thin covering of the cusp surface is endothelium, and the red tissue below is myocardium.","why":{"0":"Purkinje fibers are large conducting cells beneath the ventricular endocardium, not chordae tendineae hanging from a valve cusp.","1":"The coronary arteries are embedded in epicardial fat and are not the thin strands in this valve section.","2":"Pectinate muscles are muscular ridges on the inner surface of the atria (especially the auricles).","4":"Fenestrated elastic laminae are a feature of the media of elastic arteries."},"one":"The thin strands extending from the dense connective tissue of an AV valve cusp are the chordae tendineae."},"w11_cv_histo-11":{"q":"The sinoatrial node is called the pacemaker of the heart because its cells have a “leaky” plasma membrane that allows generation of action potentials. These cells are:","o":["Small muscle cells in the right atrial wall, with sympathetic and parasympathetic innervation","Large Purkinje cells confined to the left ventricular apex, without autonomic nerves","Smooth muscle cells of the aortic tunica media, without a pacemaker role","Fibroblasts of the fibrous pericardium, forming only the outer sac","Mesothelial cells of the parietal pleura, lining the thoracic cavity wall"],"a":0,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 14","img":[{"u":"img/w11_cv_histo/p14.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 14","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"Histologically, the **sinoatrial node** lies in the **wall of the right atrium** and consists of **small muscle cells**. It receives an arterial and nerve supply and is innervated by **both sympathetic and parasympathetic** fibers.\n\nIts cell membranes are **\"leaky,\"** so the cells can generate action potentials spontaneously, which is why it is called the **pacemaker**. Unlike the large Purkinje cells, the node is characterized by small muscle cells.","why":{"1":"Large Purkinje cells are in the ventricular subendocardium; SA node cells are small muscle cells in the right atrial wall.","2":"Smooth muscle of the aortic media regulates the vessel and is not a pacemaker.","3":"Fibroblasts of the fibrous pericardium do not initiate impulses.","4":"Mesothelium of the parietal pleura is a serous lining cell of the thoracic cavity."},"one":"The SA node consists of small muscle cells in the right atrial wall with dual autonomic innervation; its leaky membranes let it fire spontaneously as the pacemaker."},"w11_cv_histo-12":{"q":"In a histologic section of the sinoatrial node region, the artery that supplies the node is identified as the:","o":["Anterior interventricular artery","Musculophrenic artery","SA nodal artery","Posterior interventricular artery","Left marginal artery"],"a":2,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 15","img":[{"u":"img/w11_cv_histo/p15.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 15","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"At the center of the SA node section is a distinct vessel profile: the **SA nodal artery**. The nodal tissue (a cluster of small muscle cells) is outlined in an oval next to this artery.\n\nThe abundant fat around it reflects the location: the subepicardium of the right atrial wall near the entry of the superior vena cava. The node is supplied by this artery and by nerves.","why":{"0":"The anterior interventricular artery is a branch of the left coronary artery that runs in the anterior interventricular groove.","1":"The musculophrenic artery is a branch of the internal thoracic artery supplying the lower pericardium.","3":"The posterior interventricular artery is usually a branch of the right coronary artery running in the posterior interventricular groove.","4":"The left marginal artery is a branch of the left coronary artery supplying the margin of the left ventricle."},"one":"In an SA node section, the SA nodal artery is seen next to the node."},"w11_cv_histo-13":{"q":"The atrioventricular bundle (of His) is formed of small cardiac muscle cells that penetrate the cardiac skeleton, then show a gradual increase in cell size and terminate in:","o":["Pectinate muscles of the right auricle","Mesothelium of the fibrous pericardium","Smooth muscle of the tunica media","Chordae tendineae of the mitral valve only","Purkinje fibers"],"a":4,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 16","img":[{"u":"img/w11_cv_histo/p16.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 16","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"The **AV node** receives action potentials from the atria. The **AV bundle (of His)** is made of **small cardiac muscle cells** that **penetrate the cardiac skeleton**, forming the only electrical pathway to the ventricles.\n\nIt then divides into the **right and left bundle branches**, the cells **gradually increase in size**, and the conducting fibers finally terminate as **Purkinje fibers**. Because the cardiac skeleton insulates the atria from the ventricles, impulses could not cross to the ventricles without this bundle.","why":{"0":"Pectinate muscles are contractile muscles of the atria (auricles), not the termination of the AV bundle.","1":"The mesothelium of the fibrous pericardium is not part of the conduction system.","2":"Smooth muscle of the vessel media is not the termination of the AV bundle.","3":"Chordae tendineae connect valves to papillary muscles; they are not the end of the conducting fibers."},"one":"The AV bundle is made of small cardiac muscle cells that penetrate the cardiac skeleton, divide into bundle branches, enlarge, and end as Purkinje fibers."},"w11_cv_histo-14":{"q":"Purkinje fibers are large impulse-conducting cells deep to the ventricular endocardium. They stain lightly primarily because their cytoplasm contains abundant:","o":["Myelin","Glycogen","Keratin","Osteoid","Hemosiderin"],"a":1,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 18","img":[{"u":"img/w11_cv_histo/p18.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 18","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"Purkinje fibers are **large impulse-conducting cells** located **deep to the ventricular endocardium** at the ends of the AV bundle branches. Their cytoplasm is **rich in glycogen**, so they **stain more lightly** than ordinary myocardium.\n\nAt high magnification, a few myofibrils (MF) remain at the periphery of the cell, while the center looks pale and empty because of glycogen (G). This appearance tells you the cell is specialized for conduction rather than contraction.","why":{"0":"Myelin is the lipid sheath around many peripheral axons and is not why Purkinje cells stain lightly.","2":"Keratin is an epithelial intermediate filament, not the main component of Purkinje cytoplasm.","3":"Osteoid is bone matrix.","4":"Hemosiderin is an iron-storage pigment and does not explain the normal pale staining of Purkinje fibers."},"one":"Purkinje fibers are large conducting cells deep to the ventricular endocardium that stain lightly because of abundant glycogen."},"w11_cv_histo-15":{"q":"The tunica intima always contains endothelium with an underlying basal lamina. The internal elastic lamina is present only in larger arteries, and pericytes are stem cells that can:","o":["Form the outer fibrous pericardium","Secret atrial natriuretic peptide","Myelinate Purkinje fibers","Replace damaged endothelial cells","Synthesize the enamel of developing teeth"],"a":3,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 19","img":[{"u":"img/w11_cv_histo/p19.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 19","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"The **tunica intima** of a vessel always contains **endothelium** with an underlying **basal lamina**. Beneath that is a thin layer of connective tissue, the **subendothelium**. The **internal elastic lamina** is present **only in larger arteries**.\n\n**Pericytes** are described as **stem cells** that can replace damaged endothelial cells. Keep straight that endothelium is the common element of all vessels, while the internal elastic lamina is an extra structure of larger arteries.","why":{"0":"The fibrous pericardium is a dense connective tissue sac, not something pericytes form.","1":"ANP is made by atrial myocardium.","2":"Purkinje fibers are not myelinated peripheral nerves.","4":"Enamel is made by ameloblasts."},"one":"The intima always has endothelium and a basal lamina; the internal elastic lamina is only in larger arteries; pericytes can replace damaged endothelium."},"w11_cv_histo-16":{"q":"The tunica media typically contains smooth muscle plus elastic and reticular fibers, while the tunica adventitia contains type I collagen and elastic fibers and is supplied by:","o":["Vasa vasorum and innervated by sympathetic nerves","Purkinje fibers and the sinoatrial node","Lymph only, with no vessels or nerves in the wall","Fenestrated capillaries of the renal glomerulus alone","The atrioventricular bundle of His"],"a":0,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 20, 21","img":[{"u":"img/w11_cv_histo/p20.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 20","w":1200,"h":900},{"u":"img/w11_cv_histo/p21.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 21","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"The **tunica media** usually contains **smooth muscle** and often **elastic and reticular fibers**. In large arteries the **external elastic lamina** marks the outer boundary of the media.\n\nThe **tunica adventitia** consists of **type I collagen** and **elastic fibers**, contains the **vasa vasorum** (small vessels that nourish the walls of large vessels), and is innervated by **sympathetic nerves**. A scanning electron micrograph shows the lumen, endothelium, intima, media, and adventitia in sequence.","why":{"1":"Purkinje fibers and the SA node are the cardiac conduction system, not the nutrient or nerve supply of the adventitia.","2":"The adventitia does contain vasa vasorum and sympathetic nerves.","3":"The fenestrated capillaries of the renal glomerulus are specialized for filtration and do not supply the adventitia of ordinary vessels.","4":"The AV bundle is a cardiac conduction pathway."},"one":"The media has smooth muscle with elastic and reticular fibers; the adventitia has type I collagen, elastic fibers, vasa vasorum, and sympathetic nerves."},"w11_cv_histo-17":{"q":"In a comparison of a small artery and a small vein, which feature is characteristic of the vein?","o":["A much thicker tunica media than the companion artery","A prominent internal and external elastic lamina, with no valves","Valves in the lumen and a relatively thinner wall","Fenestrated elastic laminae filling the media, as in the aorta","Absence of an endothelium and of any adventitia"],"a":2,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 22","img":[{"u":"img/w11_cv_histo/p22.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 22","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"Looking at a small artery and a small vein side by side, both have intima, media, and adventitia, but in different proportions. The artery has a thick media and prominent **internal and external elastic laminae**.\n\nThe vein has a relatively thinner wall and a wider lumen, with **valves** in the lumen. The **vasa vasorum** in the adventitia can be seen in both. Valves prevent backflow of blood.","why":{"0":"A thicker media is a feature of the artery.","1":"Prominent internal and external elastic laminae are seen in the artery, and having no valves is also the artery.","3":"A media filled with fenestrated elastic laminae is characteristic of elastic arteries (the aorta, etc.).","4":"Veins do have an endothelium and an adventitia."},"one":"A small vein has a thinner wall, wider lumen, and valves compared with an artery, which has a prominent media and elastic laminae."},"w11_cv_histo-18":{"q":"The media of elastic arteries is characterized by fenestrated elastic laminae, smooth muscle cells, vasa vasorum, and which type of collagen?","o":["Type I collagen only, with no type III","Type II collagen of hyaline cartilage","Type IV collagen limited to bone osteoid","Type VII collagen of anchoring fibrils only","Type III collagen"],"a":4,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 23","img":[{"u":"img/w11_cv_histo/p23.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 23","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"The media of **elastic arteries** contains layer upon layer of **fenestrated elastic laminae**, along with **smooth muscle cells**, **type III collagen**, and **vasa vasorum**. The intima contains endothelium, subendothelial connective tissue, smooth muscle, and an internal elastic lamina.\n\nThe fenestrated elastic laminae act like a windkessel, smoothing out blood pressure between systole and diastole. Special stains clearly show the wavy elastic laminae of the media. Type I collagen is emphasized more in the adventitia.","why":{"0":"The collagen given for the media is type III; type I is the main collagen of the adventitia.","1":"Type II collagen is characteristic of hyaline cartilage.","2":"Type IV collagen is found mainly in basement membranes and is not exclusive to bone osteoid; the collagen given for the elastic artery media is type III.","3":"Type VII collagen relates to the anchoring fibrils of the dermal-epidermal junction."},"one":"The media of elastic arteries contains fenestrated elastic laminae, smooth muscle, type III collagen, and vasa vasorum."},"w11_cv_histo-19":{"q":"Elastic arteries such as the aorta, subclavians, and iliacs have an adventitia that limits vessel expansion. An aneurysm is:","o":["A fatty plaque that collects on the intima but never changes vessel diameter","An abnormal widening or ballooning of a portion of an artery due to wall weakness","A competent venous valve that prevents retrograde flow in a muscular vein","A normal, uniform tapering of an arteriole as it becomes a capillary","A blind-ended lymphatic capillary that begins in loose connective tissue"],"a":1,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 24, 25","img":[{"u":"img/w11_cv_histo/p24.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 24","w":1200,"h":900},{"u":"img/w11_cv_histo/p25.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 25","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"The adventitia of elastic arteries contains **type I collagen**, elastic fibers, vasa vasorum, and nerves, and it **limits vessel expansion**. Examples are the **aorta, subclavian arteries, and iliac arteries**.\n\nAn **aneurysm** is an **abnormal widening or ballooning** of a portion of an artery due to weakness of the vessel wall. Abdominal aortic aneurysms are classified by their relation to the renal arteries as suprarenal, pararenal, juxtarenal, or infrarenal.","why":{"0":"A fatty plaque is a finding of atherosclerosis and is not the same as the definition of an aneurysm (dilation from wall weakness).","2":"A normal venous valve is not an aneurysm.","3":"An arteriole tapering into a capillary is a normal transition.","4":"A blind-ended lymphatic capillary is the start of the lymphatic system, not an aneurysm."},"one":"The adventitia of elastic arteries (aorta, subclavian, iliac) limits expansion; an aneurysm is abnormal ballooning of an artery from wall weakness."},"w11_cv_histo-20":{"q":"Muscular arteries such as the femoral and brachial arteries are distinguished by a prominent internal elastic lamina and a media of smooth muscle cells that:","o":["Secret atrial natriuretic peptide","Form fenestrated elastic laminae like those of the aorta","Are absent, leaving only an endothelium and adventitia","Control blood flow","Conduct action potentials faster than Purkinje fibers"],"a":3,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 26, 27","img":[{"u":"img/w11_cv_histo/p26.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 26","w":1200,"h":900},{"u":"img/w11_cv_histo/p27.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 27","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"The intima of **muscular arteries** consists of endothelium, scant subendothelial connective tissue, and a **prominent internal elastic lamina**. The media contains **smooth muscle that controls blood flow**, type I collagen and elastic fibers, and an **external elastic lamina**.\n\nThe adventitia contains type I collagen, elastic fibers, vasa vasorum, and sympathetic nerves, and limits expansion. Examples are the **femoral** and **brachial** arteries. Unlike elastic arteries, the media is not packed with fenestrated elastic laminae; smooth muscle is the main component.","why":{"0":"ANP is a product of atrial myocardium.","1":"Fenestrated elastic laminae as the main structure of the media describes elastic arteries; the main cell of the muscular artery media is smooth muscle.","2":"Muscular arteries have a thick smooth muscle media.","4":"Fast conduction is done by Purkinje fibers, not vascular smooth muscle."},"one":"Muscular arteries (femoral, brachial) have a prominent internal elastic lamina and a smooth muscle media that controls blood flow."},"w11_cv_histo-21":{"q":"Arterioles have a few layers of smooth muscle in the media, a thin adventitia, and a diameter:","o":["Less than 0.5 mm","Always greater than 10 mm","Fixed at 30 to 40 µm with a discontinuous endothelium","Equal to that of the ascending aorta","Measured in centimeters, like large elastic arteries"],"a":0,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 28","img":[{"u":"img/w11_cv_histo/p28.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 28","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"The intima of **arterioles** consists of endothelium, a basal lamina, and possibly an internal elastic lamina. The media has **a few layers of smooth muscle**, and the adventitia is **thin connective tissue**. Their diameter is **less than 0.5 mm**.\n\nArterioles create peripheral resistance and regulate blood flow to tissues. A discontinuous endothelium with a 30–40 µm lumen is the feature of sinusoidal capillaries, and diameters in centimeters fit large elastic arteries like the aorta.","why":{"1":"Greater than 10 mm fits large arteries; the standard for arterioles is less than 0.5 mm.","2":"A 30–40 µm diameter with a discontinuous endothelium is characteristic of sinusoidal capillaries.","3":"The ascending aorta is an elastic artery and is much larger than an arteriole.","4":"Diameters in centimeters belong to large elastic arteries, not arterioles."},"one":"Arterioles are less than 0.5 mm in diameter, with a few layers of smooth muscle in the media and a thin adventitia."},"w11_cv_histo-22":{"q":"Atherosclerosis is a condition in which fatty material collects along the walls of arteries, then thickens, hardens by forming calcium deposits, and may:","o":["Convert the vessel into a lymphatic capillary","Produce competent venous valves in the same artery","Eventually block the arteries","Replace all elastic laminae with hyaline cartilage","Transform arterioles into fenestrated capillaries"],"a":2,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 28, 29","img":[{"u":"img/w11_cv_histo/p28.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 28","w":1200,"h":900},{"u":"img/w11_cv_histo/p29.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 29","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"**Atherosclerosis** is a condition in which **fatty material collects along the walls of arteries**. This material **thickens**, **hardens by forming calcium deposits**, and may eventually **block the arteries**.\n\nOn gross specimens you see a narrowed lumen and a rough intima with yellow plaques, ulceration, and calcification. When the artery is blocked, the tissue it supplied becomes ischemic.","why":{"0":"Atherosclerosis does not turn an artery into a lymphatic capillary.","1":"Venous valves are structures of veins; atherosclerosis does not create valves in an artery.","3":"The definition is not replacement of elastic laminae by hyaline cartilage; the key points are fat accumulation, thickening, calcification, and occlusion.","4":"Arterioles turning into fenestrated capillaries is not atherosclerosis."},"one":"In atherosclerosis, fat builds up in arterial walls, which thicken and calcify and can eventually block the artery."},"w11_cv_histo-23":{"q":"Capillaries lack a tunica media, have an intima of endothelium, basal lamina, and pericytes, and function as exchange vessels that also perform:","o":["Pacemaker impulse initiation for the ventricles","Formation of the cardiac skeleton","Conduction faster than Purkinje fibers","Production of atrial natriuretic peptide","Metabolic and antithrombogenic functions"],"a":4,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 30","img":[{"u":"img/w11_cv_histo/p30.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 30","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"The intima of **capillaries** consists of **endothelium and a basal lamina**, plus **pericytes**. There is **no tunica media**, and the adventitia has only a few reticular fibers.\n\nCapillaries are **exchange vessels**, and they also perform **metabolic** and **antithrombogenic functions**: the endothelium exchanges substances and keeps blood clots from forming easily.","why":{"0":"Pacemaking is the role of the SA node.","1":"The cardiac skeleton is dense connective tissue and is not formed by capillaries.","2":"The fastest cardiac conduction is a feature of Purkinje fibers.","3":"ANP is made by atrial myocardium."},"one":"Capillaries are exchange vessels without a media that also perform metabolic and antithrombogenic functions."},"w11_cv_histo-24":{"q":"Continuous capillaries have tight junctions, no fenestrations, and frequent pinocytic vesicles. They are found in the:","o":["Kidney glomeruli, where fenestrations lack diaphragms","CNS, muscle, lung, bone, skin, and thymus","Liver sinusoids with a discontinuous endothelium","Splenic cords only, among all organs","Bone marrow sinusoids exclusively"],"a":1,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 31","img":[{"u":"img/w11_cv_histo/p31.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 31","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"**Continuous capillaries** have **tight junctions** between endothelial cells, **no fenestrations** in the wall, and often show **pinocytic vesicles**.\n\nThey are found in the **CNS, muscle, lung, bone, skin, and thymus**. They suit places like the blood-brain barrier, where the movement of substances must be tightly controlled. The figure labels occluding junctions, pinocytosis, transcytosis, and gas exchange.","why":{"0":"Glomerular capillaries in the kidney are fenestrated, and their fenestrations lack diaphragms.","2":"Liver sinusoids are sinusoidal capillaries with a discontinuous endothelium.","3":"The splenic cords are where sinusoidal capillaries are found; they are not on the list for continuous capillaries.","4":"Bone marrow sinusoids are also sinusoidal capillaries."},"one":"Continuous capillaries have tight junctions and no fenestrations and are found in the CNS, muscle, lung, bone, skin, and thymus."},"w11_cv_histo-25":{"q":"Fenestrated capillaries contain pores with diaphragms in organs such as the pancreas, endocrine glands, and intestines. An exception is the kidney, where the fenestrations:","o":["Are replaced by tight junctions without any pores","Are found only in the tunica adventitia of elastic arteries","Always have thicker diaphragms than those of the intestine","Lack diaphragms","Are confined to the epicardium of the heart"],"a":3,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 32","img":[{"u":"img/w11_cv_histo/p32.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 32","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"**Fenestrated capillaries** have **pores with diaphragms** in their endothelium. They are found in the **pancreas, endocrine glands, and intestines**.\n\nThe exception is the **kidney**, where the fenestrations **lack diaphragms**, which makes plasma filtration freer. The figure separately labels \"fenestrations with diaphragms\" and \"fenestrations without diaphragms.\"","why":{"0":"Glomerular capillaries are not the continuous type with only tight junctions; they have fenestrations without diaphragms.","1":"Fenestrations are a feature of the endothelium of fenestrated capillaries, not a structure of the adventitia of elastic arteries.","2":"The distinctive feature of renal fenestrations is that they lack diaphragms, not that their diaphragms are thicker.","4":"The exceptional organ for fenestrated capillaries is the kidney; they are not confined to the epicardium."},"one":"Fenestrated capillaries have pores with diaphragms, but in the kidney the fenestrations lack diaphragms."},"w11_cv_histo-26":{"q":"Sinusoidal capillaries, found in bone marrow, spleen, liver, lymphoid organs, and some endocrine organs, have a large lumen of 30 to 40 µm and:","o":["A discontinuous endothelium and an incomplete basal lamina","Tight junctions and no fenestrations, as in the CNS","A thick tunica media of many smooth muscle layers","Pores with diaphragms identical to those of intestinal capillaries","A complete, continuous basal lamina and no gaps"],"a":0,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 33","img":[{"u":"img/w11_cv_histo/p33.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 33","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"**Sinusoidal capillaries** are found in **bone marrow, spleen, liver, lymphoid organs, and some endocrine organs**. They have a large lumen of **30–40 µm**, a **discontinuous endothelium**, and an **incomplete basal lamina**.\n\nThis structure lets large molecules pass in and out; the figure notes that in the spleen red blood cells can pass through the gaps. Distinguish them from the tight junctions and lack of fenestrations of continuous capillaries and from the diaphragm-covered pores of fenestrated capillaries.","why":{"1":"Tight junctions and no fenestrations characterize continuous capillaries (CNS, etc.).","2":"Capillaries have no media; a thick smooth muscle media is a feature of arteries.","3":"Pores with diaphragms are a feature of typical fenestrated capillaries; sinusoids have a discontinuous endothelium and an incomplete basal lamina.","4":"The basal lamina of sinusoids is incomplete and has gaps."},"one":"Sinusoidal capillaries have a large 30–40 µm lumen, a discontinuous endothelium, and an incomplete basal lamina."},"w11_cv_histo-27":{"q":"Small and medium veins have no internal elastic lamina, a thick adventitia described as fascia, and valves. Varicose veins have become dilated and tortuous, often due to:","o":["Hyperactive precapillary sphincters alone","Excess type III collagen in elastic-artery media","Incompetent valves","A missing tunica intima in all capillaries","Fusion of the fibrous pericardium to the sternum"],"a":2,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 34, 35","img":[{"u":"img/w11_cv_histo/p34.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 34","w":1200,"h":900},{"u":"img/w11_cv_histo/p35.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 35","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"**Venules** have a **wider lumen and thinner wall** than arterioles, with pericytes and circular smooth muscle in the media. Small and medium veins have endothelium, **no internal elastic lamina**, smooth muscle and collagen in the media, a **thick adventitia described as fascia (\"fascia!\")**, vasa vasorum, and **valves**.\n\n**Varicose veins** are veins that have become **dilated and tortuous**, often because of **incompetent valves**. When the valves fail to close, blood flows backward and pools, and the vein stretches.","why":{"0":"Precapillary sphincters regulate capillary flow; the common cause given for varicose veins is valve incompetence.","1":"Type III collagen in the elastic artery media is unrelated to varicose veins.","3":"Capillaries do have an endothelial intima; this is not the cause of varicose veins.","4":"Attachment of the fibrous pericardium to the sternum is a normal attachment and not a cause of varicose veins."},"one":"Small/medium veins lack an internal elastic lamina, have a thick adventitia and valves; varicose veins usually result from incompetent valves."},"w11_cv_histo-28":{"q":"Large veins are characterized by a well-developed tunica intima, a thin tunica media, and a thick tunica adventitia that contains:","o":["Fenestrated elastic laminae as in the aortic media","Purkinje fibers and the atrioventricular node","Only endothelium, with no connective tissue or muscle","A prominent internal elastic lamina and no vasa vasorum","Smooth muscle, collagenous connective tissue, and vasa vasorum"],"a":4,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 36","img":[{"u":"img/w11_cv_histo/p36.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 36","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"**Large veins** have a **well-developed intima**, a **thin media** (smooth muscle and collagen), and a **thick adventitia**. This thick adventitia contains **smooth muscle**, **collagenous connective tissue**, and **vasa vasorum**.\n\nUnlike arteries, smooth muscle in large veins can be more prominent in the adventitia than in the media. The section shows the thick adventitia (TA) outside the thin media (TM).","why":{"0":"A media filled with fenestrated elastic laminae is characteristic of elastic arteries.","1":"Purkinje fibers and the AV node are the cardiac conduction system.","2":"The adventitia of large veins is rich in smooth muscle and collagenous connective tissue.","3":"A prominent internal elastic lamina fits arteries, and the adventitia of large veins does contain vasa vasorum."},"one":"Large veins have a well-developed intima, a thin media, and a thick adventitia with smooth muscle, collagen, and vasa vasorum."},"w11_cv_histo-29":{"q":"Lymphatic capillaries begin as blind-ended tubes that return tissue fluid unidirectionally to the blood. Their endothelial cells lack tight junctions and have an incomplete basal lamina. Edema is:","o":["A normal, transient emptying of all lymphatic trunks","Swelling caused by an abnormal accumulation of fluid in body tissues","Fusion of a lymphatic vessel with an elastic artery media","A competent venous valve in a large vein","Calcified plaque that occludes a coronary artery"],"a":1,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 37, 38","img":[{"u":"img/w11_cv_histo/p37.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 37","w":1200,"h":900},{"u":"img/w11_cv_histo/p38.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 38","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"Lymphatic vessels return tissue fluid to the blood **unidirectionally**. Lymphatic capillaries begin as **blind-ended tubes**, and their endothelial cells **lack tight junctions and have an incomplete basal lamina**. Large lymphatic vessels resemble veins.\n\n**Edema** is swelling caused by an **abnormal accumulation of fluid** in body tissues. Lymphatic capillaries pick up the fluid that leaves the capillaries but doesn't return to the venous side; when this process breaks down, edema develops. The figure shows hydrostatic pressure at the arteriolar end, osmotic pressure at the venular end, and lymphatic capillaries collecting the leftover fluid.","why":{"0":"Edema is not the normal emptying of lymphatic trunks; it is abnormal fluid accumulation in tissues.","2":"Fusion of a lymphatic vessel with an elastic artery media is not the definition of edema.","3":"A normal venous valve is not edema.","4":"Calcified plaque is a finding of atherosclerosis."},"one":"Lymphatic capillaries begin as blind tubes without tight junctions that return tissue fluid; edema is swelling from abnormal fluid accumulation in tissues."},"w11_cv_histo-30":{"q":"When precapillary sphincters contract, blood in the microcirculation:","o":["Fills true capillaries so the bed is well perfused","Flows backward from venules into arterioles through the heart","Is forced into the lymphatic capillaries exclusively","Bypasses the capillary bed, as through a thoroughfare channel","Stops in the aorta and cannot enter muscular arteries"],"a":3,"src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 39","img":[{"u":"img/w11_cv_histo/p39.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 39","w":1200,"h":900}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11,"exp":"Specialized structures of the microcirculation include the **precapillary sphincter**, **postcapillary venule**, **preferred channels**, **arteriovenous anastomoses**, and **vasa vasorum**.\n\nWhen the sphincters **relax**, the true capillaries are well perfused. When they **contract**, blood **bypasses** the capillary bed and drains to the venule through a **thoroughfare channel** or arteriovenous anastomosis. The metarteriole is the beginning of this shortcut.","why":{"0":"True capillaries are well perfused when the sphincters are relaxed.","1":"Blood does not flow backward from venules to arterioles through the heart.","2":"The bypass route is a thoroughfare channel or AV anastomosis; blood does not all go into lymphatic capillaries.","4":"Sphincter contraction does not stop flow in the aorta; it only changes perfusion of the local capillary bed."},"one":"When precapillary sphincters contract, blood bypasses the capillary bed (e.g., via a thoroughfare channel); when they relax, the bed is well perfused."},"w11_resp_inf-1":{"q":"Why are lower respiratory tract infections generally more serious than upper respiratory tract infections?","o":["They more often produce a bull neck and airway obstruction.","They are caused only by toxin-producing (toxigenic) bacterial strains.","Gas exchange in the lungs is compromised.","They remain confined to the nasal cavity and the pharynx.","They cannot be spread by respiratory droplets at all."],"a":2,"src":"6b. Respiratory Infections (handwritten).pdf, slide 2","img":[{"u":"img/w11_resp_inf/p02.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 2","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Upper respiratory tract infections occur in the nasal cavity, pharynx, larynx, and nearby structures, and are relatively less severe: sinusitis, pharyngitis, otitis media, tonsillitis, laryngitis, and the common cold.\n\nThe lower respiratory tract includes the trachea, bronchi, and lungs. Because **gas exchange in the lungs is compromised**, lower respiratory tract infections such as bronchitis and pneumonia are more serious. On the severity line, upper is \"Less\" and lower is \"More.\"","why":{"0":"A bull neck and airway obstruction are upper-airway findings of diphtheria, not the reason lower respiratory infections are more serious.","1":"The note that only toxigenic strains cause disease is about diphtheria, not the reason lower respiratory infections are more severe.","3":"The lower respiratory tract includes the trachea, bronchi, and lungs, so it is not confined to the nasal cavity and pharynx.","4":"Many lower respiratory infections also spread by respiratory droplets; inability to spread is not the reason for severity."},"one":"Lower respiratory tract infections are more serious because gas exchange in the lungs is compromised."},"w11_resp_inf-2":{"q":"Which Corynebacterium diphtheriae strains cause diphtheria?","o":["Only toxigenic strains that actually possess the toxin.","All strains, whether or not they produce any toxin.","Only nontoxigenic strains that colonize intact skin.","Only strains that lack metachromatic granules.","Only strains spread by contaminated water mist."],"a":0,"src":"6b. Respiratory Infections (handwritten).pdf, slide 4","img":[{"u":"img/w11_resp_inf/p04.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 4","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Among the general features of *C. diphtheriae*, **\"Toxigenic strains cause DIPHTHERIA\"** is emphasized, with the handwritten note **\"only ones that have toxins.\"**\n\nStrains without the toxin gene can colonize but do not cause diphtheria. The toxin is encoded by a gene acquired from a bacteriophage.","why":{"1":"Not all strains cause diphtheria; only strains that carry the toxin cause disease.","2":"Nontoxigenic strains do not cause diphtheria; cutaneous diphtheria is also toxin-related.","3":"Metachromatic granules are a staining feature of *C. diphtheriae*, not what determines whether a strain has the toxin.","4":"Spread by water mist is the route for *Legionella*; diphtheria spreads mainly by respiratory droplets."},"one":"Diphtheria is caused only by toxigenic strains that carry the toxin."},"w11_resp_inf-3":{"q":"Diphtheria toxin causes disease primarily by which mechanism?","o":["Forming pores that lyse alveolar macrophages in the lung.","Inhibiting protein synthesis by inactivating EF2 (elongation factor 2).","Paralyzing ciliated airway cells so mucus cannot be cleared.","Degrading secretory IgA on mucosal surfaces of the airway.","Inhibiting lysosome-phagosome fusion inside macrophages."],"a":1,"src":"6b. Respiratory Infections (handwritten).pdf, slide 7","img":[{"u":"img/w11_resp_inf/p07.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 7","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Diphtheria toxin inhibits **protein synthesis (translation)** in eukaryotic cells. Specifically, it **inactivates elongation factor 2 (EF2)**, blocking translation. In the figure, \"Protein Synthesis\" is marked as inhibited by this toxin.\n\nIt causes local tissue destruction, and the toxin spreads rapidly and can affect any tissue (myocarditis, peripheral neuropathy, etc.).","why":{"0":"Lysing macrophages is not the mechanism of diphtheria toxin.","2":"Paralyzing ciliated cells is the mechanism of pertussis toxin (*B. pertussis*).","3":"Degrading secretory IgA is the action of the *H. influenzae* IgA protease.","4":"Inhibiting lysosome-phagosome fusion is the mechanism of *Legionella*."},"one":"Diphtheria toxin inactivates EF2 and inhibits protein synthesis (translation)."},"w11_resp_inf-4":{"q":"Enlarged cervical lymph nodes and neck swelling in diphtheria are classically described as which finding?","o":["A claw-hand deformity from peripheral nerve injury.","Rusty or blood-tinged sputum from alveolar exudate.","Dark-red “currant jelly” sputum from a pneumonia.","A bull neck (cervical lymphadenitis with neck swelling).","A wrist-drop deformity from radial nerve damage."],"a":3,"src":"6b. Respiratory Infections (handwritten).pdf, slides 8, 9","img":[{"u":"img/w11_resp_inf/p08.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 8","w":1200,"h":900},{"u":"img/w11_resp_inf/p09.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 9","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Among the signs of diphtheria, **neck swelling**, enlarged lymph nodes, and airway obstruction are emphasized. This appearance is the **bull neck**, that is, cervical lymphadenitis.\n\nBull neck is a classic finding to link to diphtheria by both image and term. Claw hand and wrist drop are peripheral nerve findings in leprosy.","why":{"0":"Claw hand is a peripheral nerve finding in leprosy.","1":"Rusty sputum is a finding of pneumococcal pneumonia.","2":"Currant jelly sputum is the classic finding of *Klebsiella* pneumonia.","4":"Wrist drop is a peripheral nerve finding in leprosy."},"one":"The neck swelling and cervical lymphadenitis of diphtheria are called a bull neck."},"w11_resp_inf-5":{"q":"Pharyngitis with a thick grayish, adherent pseudomembrane is labeled “diphtheria of the oral cavity.” The same organism may also produce which other starred clinical image?","o":["Painful genital ulcers of chancroid (H. ducreyi).","A leonine (lion-like) facial appearance of leprosy.","Cool, anesthetic skin patches of tuberculoid leprosy.","Erythema overlying a positive tuberculin (PPD) test.","A chronic nonhealing skin ulcer (cutaneous diphtheria)."],"a":4,"src":"6b. Respiratory Infections (handwritten).pdf, slides 10, 6","img":[{"u":"img/w11_resp_inf/p10.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 10","w":1200,"h":900},{"u":"img/w11_resp_inf/p06.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 6","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"The pharyngitis photo shows a thick, grayish, adherent exudate (**pseudomembrane**) labeled **\"diphtheria of oral cavity.\"** The pseudomembrane is made of mucosal cell debris and inflammatory products.\n\nNext to the skin ulcer photo on the same slide is a star with **\"Q's\"** (exam questions). *C. diphtheriae* infects not only the upper airway but also the **skin**, producing a chronic, nonhealing skin ulcer with a gray membrane (cutaneous diphtheria). You need to recognize both images.","why":{"0":"Painful genital ulcers are a finding of *H. ducreyi* (chancroid).","1":"A leonine face is the facial deformity of leprosy.","2":"Anesthetic skin patches belong to tuberculoid leprosy, not the diphtheritic skin ulcer.","3":"Induration and erythema of a positive PPD is the tuberculosis skin reaction, not a diphtheria ulcer."},"one":"Oral diphtheria is pseudomembranous pharyngitis, and the cutaneous form of the same organism is a nonhealing skin ulcer (Q's)."},"w11_resp_inf-6":{"q":"Haemophilus ducreyi is noted as the cause of which disease?","o":["An STI with painful genital ulcers (chancroid).","Community-acquired pneumonia with rusty sputum.","Whooping cough in children younger than 2 years.","Atypical pneumonia after inhaling dried bird feces.","Cavitary pulmonary tuberculosis with hemoptysis."],"a":0,"src":"6b. Respiratory Infections (handwritten).pdf, slide 14","img":[{"u":"img/w11_resp_inf/p14.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 14","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"*H. ducreyi* causes **an STI with painful genital ulcers**, i.e., **chancroid**.\n\nIn the same genus, *H. influenzae* (especially Hib) causes meningitis, otitis media and sinusitis, and pneumonia in children under 5. Meningitis and pneumonia are starred, and children is underlined. Don't confuse the two organisms.","why":{"1":"Community-acquired pneumonia with rusty sputum is *S. pneumoniae*.","2":"Whooping cough in children under 2 is *B. pertussis*.","3":"Atypical pneumonia after inhaling dried bird feces is *C. psittaci* (psittacosis).","4":"Cavitary pulmonary tuberculosis is *M. tuberculosis*."},"one":"H. ducreyi causes an STI with painful genital ulcers (chancroid)."},"w11_resp_inf-7":{"q":"The major virulence factor of Haemophilus influenzae type b (Hib), boxed and starred, is which structure?","o":["An IgA protease that degrades circulating serum IgM.","A polyribophosphate (PRP) capsule that is antiphagocytic.","Pneumolysin that directly damages respiratory epithelium.","Cord factor (trehalose dimycolate) in a waxy cell wall.","A large capsule that produces “currant jelly” sputum."],"a":1,"src":"6b. Respiratory Infections (handwritten).pdf, slide 15","img":[{"u":"img/w11_resp_inf/p15.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 15","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"The major virulence factor of Hib is the **polyribophosphate (PRP) capsule**, which is **antiphagocytic**. The Hib vaccine targets exactly this capsule.\n\nThe organism is a gram-negative rod that grows on chocolate agar and requires factor X (hemin) and factor V (NAD⁺). It also has an IgA protease, but the boxed and starred major virulence factor is the PRP capsule.","why":{"0":"IgA protease is another factor that degrades secretory IgA, not the boxed and starred major virulence factor (PRP capsule), and its target is not serum IgM.","2":"Pneumolysin (a hemolysin) is a virulence factor of *S. pneumoniae*.","3":"Cord factor (trehalose dimycolate) is a virulence factor of *M. tuberculosis*.","4":"The large polysaccharide capsule that produces currant jelly sputum is the virulence factor of *Klebsiella*."},"one":"The major virulence factor of Hib is the antiphagocytic polyribophosphate (PRP) capsule."},"w11_resp_inf-8":{"q":"Streptococcus pneumoniae is best described morphologically as which organism?","o":["A slender, slightly bent acid-fast rod.","A motile gram-negative bacillus.","A gram-positive diplococcus.","A gram-negative coccobacillus.","A wall-less pleomorphic bacterium."],"a":2,"src":"6b. Respiratory Infections (handwritten).pdf, slide 18","img":[{"u":"img/w11_resp_inf/p18.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 18","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"*S. pneumoniae* is a **gram-positive diplococcus**, and this description is boxed and starred. It is also alpha-hemolytic.\n\nThis is basic morphologic differentiation: distinguish it from an acid-fast rod (*M. tuberculosis*), gram-negative bacilli (*Legionella*, etc.), a coccobacillus (*B. pertussis*), and a wall-less organism (*Mycoplasma*).","why":{"0":"A slender, slightly bent acid-fast rod is *M. tuberculosis*.","1":"A motile gram-negative bacillus is closer to *Legionella*; *S. pneumoniae* is gram-positive.","3":"A gram-negative coccobacillus is the morphology of *B. pertussis*.","4":"A wall-less, pleomorphic organism is *Mycoplasma*."},"one":"Streptococcus pneumoniae is a gram-positive diplococcus."},"w11_resp_inf-9":{"q":"Streptococcus pneumoniae is starred as the most common cause of which infections?","o":["Whooping cough in infants and young children.","Walking pneumonia in otherwise healthy adults.","Legionnaires’ disease acquired from shower mist.","Community-acquired pneumonia and adult bacterial meningitis.","Chancroid with painful genital ulcers."],"a":3,"src":"6b. Respiratory Infections (handwritten).pdf, slide 19","img":[{"u":"img/w11_resp_inf/p19.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 19","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"*S. pneumoniae* is an obligate human parasite that also lives in the **nasopharynx** of many healthy people. The starred key point is that it is **the most common cause of community-acquired pneumonia** and also the most common cause of **adult bacterial meningitis**.\n\nIt is also an important cause of otitis media, sinusitis, mastoiditis, and bacteremia.","why":{"0":"The cause of whooping cough in infants and young children is *B. pertussis*.","1":"Walking pneumonia is the nickname for *Mycoplasma* pneumonia.","2":"Legionnaires' disease from shower mist is *L. pneumophila*.","4":"Chancroid is *H. ducreyi*."},"one":"S. pneumoniae is the most common cause of community-acquired pneumonia and adult bacterial meningitis."},"w11_resp_inf-10":{"q":"In pneumococcal pathogenesis, which two starred factors drive the infection?","o":["A PRP capsule plus an IgA protease and nothing else.","An exotoxin that destroys cilia, producing walking pneumonia.","Inhibition of lysosome-phagosome fusion plus secreted proteases.","Cord factor and sulfolipids (sulfatides) in a waxy cell wall.","An antiphagocytic capsule and release of hemolysin (pneumolysin)."],"a":4,"src":"6b. Respiratory Infections (handwritten).pdf, slide 20","img":[{"u":"img/w11_resp_inf/p20.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 20","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"The two starred and underlined factors in pneumococcal pathogenesis are the **capsule** and **hemolysin (pneumolysin)**.\n\nVirulence depends directly on the polysaccharide capsule, which blocks phagocytosis. Released pneumolysin damages the respiratory epithelium. As a result, fluid, red cells, and white cells leak into the alveoli, producing a **productive cough**, and the bacteria spread to the lymphatics and blood.","why":{"0":"A PRP capsule and IgA protease are factors of *H. influenzae*.","1":"A cilia-destroying exotoxin and walking pneumonia are features of *Mycoplasma*.","2":"Inhibiting lysosome-phagosome fusion and proteases are mechanisms of *Legionella*.","3":"Cord factor and sulfolipids are cell wall virulence factors of *M. tuberculosis*."},"one":"S. pneumoniae damages respiratory epithelium through an antiphagocytic capsule and release of pneumolysin (hemolysin)."},"w11_resp_inf-11":{"q":"The sputum character starred in pneumococcal pneumonia is which of the following?","o":["Blood-tinged, pink or rusty sputum.","Thick, dark-red “currant jelly” sputum.","A purely nonproductive, dry cough only.","Foul-smelling sputum from a primary liver abscess.","Copious watery sputum that never contains blood."],"a":0,"src":"6b. Respiratory Infections (handwritten).pdf, slide 23","img":[{"u":"img/w11_resp_inf/p23.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 23","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Among the symptoms of pneumococcal pneumonia (fever, chills, productive cough), **blood-tinged, pink or rusty sputum** is underlined and starred. Dyspnea is glossed as \"shortness of breath.\"\n\nDistinguishing this rusty sputum from the **currant jelly sputum** of *Klebsiella* is a classic differential point.","why":{"1":"Currant jelly sputum is the classic finding of *Klebsiella* pneumonia.","2":"A dry, nonproductive cough is emphasized more for intracellular organisms such as *Legionella*; pneumococcus causes a productive cough.","3":"The liver is the number-one site of *Klebsiella* abscesses, not a feature of pneumococcal sputum.","4":"Watery sputum without blood is not the starred rusty sputum."},"one":"The classic sputum of pneumococcal pneumonia is blood-tinged, pink or rusty."},"w11_resp_inf-12":{"q":"Who is most affected by Bordetella pertussis, and what does its toxin do to airway epithelium?","o":["Adults with COPD; it lyses alveolar walls and raises diffusing capacity.","Children under 2 years; it paralyzes ciliated cells so bacteria cannot be cleared.","Alcoholics; it produces currant-jelly sputum and lung abscesses.","Patients with AIDS; it causes disseminated MAC infection.","Bird handlers; it causes an influenza-like atypical pneumonia."],"a":1,"src":"6b. Respiratory Infections (handwritten).pdf, slide 29","img":[{"u":"img/w11_resp_inf/p29.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 29","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Pertussis mainly affects **children under 2 years** (underlined and starred). The bacteria attach to ciliated cells of the upper airway, and pertussis toxin spreads to ciliated cells of the trachea and bronchi.\n\nThe toxin **paralyzes** these cells so the cilia **cannot sweep bacteria out**. The toxin also inhibits phagocytes. As a result, mucus and bacteria accumulate.","why":{"0":"Lysis of alveolar walls and changes in diffusing capacity are not the mechanism of pertussis toxin.","2":"Currant jelly sputum and lung abscesses are emphasized for *Klebsiella*, especially in alcoholics.","3":"The opportunistic infection in AIDS is MAC (nontuberculous mycobacteria).","4":"Atypical pneumonia from inhaling bird droppings is *C. psittaci*."},"one":"Pertussis is most severe in children under 2; its toxin paralyzes ciliated cells so bacteria can't be cleared."},"w11_resp_inf-13":{"q":"The starred explanation of the whooping sound in pertussis is which sequence?","o":["Alveoli exude rusty sputum that then blocks the glottis.","A pharyngeal pseudomembrane obstructs the larynx and trachea.","Mucus builds up, and the cough that tries to clear it results in whooping cough.","Bronchospasm from a type I hypersensitivity produces the whoop.","Vocal-cord paralysis from diphtheria toxin produces the whoop."],"a":2,"src":"6b. Respiratory Infections (handwritten).pdf, slide 31","img":[{"u":"img/w11_resp_inf/p31.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 31","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"The mechanism of pertussis is written in one line: **mucus builds up**, and **the cough that tries to clear it** results in **whooping cough** (starred and underlined).\n\nThis follows from the ciliary paralysis described just before. Because the cilia can't push out bacteria and mucus, mucus accumulates, and a characteristic, prolonged cough develops to expel it.","why":{"0":"Rusty sputum is a finding of pneumococcal pneumonia, not the mechanism of whooping cough.","1":"Airway obstruction by a pseudomembrane is a finding of diphtheria.","3":"Whooping cough is not explained as type I hypersensitivity asthma.","4":"Diphtheria toxin inhibits protein synthesis and does not explain the whoop of pertussis."},"one":"Ciliary paralysis lets mucus build up, and the cough that tries to clear it produces whooping cough."},"w11_resp_inf-14":{"q":"Legionella is an aquatic organism that lives inside other organisms and is transmitted by which route?","o":["Person-to-person respiratory droplets only.","Ingestion of raw infected cow’s milk.","Inhalation of dust that contains dried bird feces.","Water in a fine mist (for example, shower mist).","Prolonged close skin contact over many months."],"a":3,"src":"6b. Respiratory Infections (handwritten).pdf, slides 33, 38","img":[{"u":"img/w11_resp_inf/p33.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 33","w":1200,"h":900},{"u":"img/w11_resp_inf/p38.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 38","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"*Legionella* is an **aquatic organism** and a facultative intracellular parasite that **lives inside other organisms** such as amoebae and alveolar macrophages (boxed and starred).\n\nTransmission is by **water in a fine mist**, with **shower mist** given as an example. Cooling towers, water heaters, water purifiers, spas, and showers, **anywhere there is water or spray**, can be a source. It is not transmitted person to person.","why":{"0":"*Legionella* does not spread by person-to-person droplets; it spreads by water mist.","1":"Drinking raw milk is how *M. bovis* passes from cattle to humans.","2":"Inhaling dust with dried bird feces is the route for *C. psittaci* (psittacosis).","4":"Prolonged close contact over many months describes transmission of leprosy."},"one":"Legionella lives inside aquatic organisms and is transmitted by fine water mist, such as from showers."},"w11_resp_inf-15":{"q":"The starred incubation period of Chlamydia psittaci (after inhalation of dried bird feces) is which interval?","o":["2 to 5 days","1 to 3 days","2 to 12 weeks","1 to 20 years","5 to 14 days"],"a":4,"src":"6b. Respiratory Infections (handwritten).pdf, slides 41, 40","img":[{"u":"img/w11_resp_inf/p41.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 41","w":1200,"h":900},{"u":"img/w11_resp_inf/p40.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 40","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Psittacosis (*C. psittaci*) is acquired by inhaling **dust containing dried bird feces** and causes **atypical pneumonia**. In the summary table, the **5–14 day incubation period** is circled and starred.\n\nDon't confuse it with the incubation periods of diphtheria (2–5 days), pneumococcus (1–3 days), tuberculosis (2–12 weeks), or leprosy (1–20 years).","why":{"0":"2–5 days is the incubation period of diphtheria.","1":"1–3 days is the incubation period of pneumococcus.","2":"2–12 weeks is the incubation period of tuberculosis.","3":"1–20 years is the incubation period of leprosy."},"one":"The incubation period of psittacosis (C. psittaci) is 5–14 days."},"w11_resp_inf-16":{"q":"Mycoplasma is starred for which two structural features?","o":["It lacks a rigid cell wall and is very small.","It has a lipid-rich, acid-fast cell wall.","It is a gram-positive encapsulated diplococcus.","It grows as serpentine cords in liquid medium.","It is an aquatic organism that lives inside amoebae."],"a":0,"src":"6b. Respiratory Infections (handwritten).pdf, slide 43","img":[{"u":"img/w11_resp_inf/p43.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 43","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11,"exp":"Two features of *Mycoplasma*, that it **lacks a rigid cell wall** and is **small**, are circled and starred. It is pleomorphic and requires cholesterol for growth.\n\nBecause it has no cell wall, **β-lactams such as penicillin don't work**, but it is inhibited by tetracycline. Its exotoxin destroys cilia and ciliated cells, and because symptoms are mild it is called **walking pneumonia**.","why":{"1":"A lipid-rich, acid-fast cell wall is a feature of mycobacteria.","2":"A gram-positive encapsulated diplococcus is *S. pneumoniae*.","3":"Serpentine cord growth is a finding of *M. tuberculosis* (cord factor).","4":"The aquatic organism living inside amoebae is *Legionella*."},"one":"Mycoplasma lacks a rigid cell wall and is very small, so cell-wall antibiotics like penicillin don't work."},"w11_resp_inf-17":{"q":"The “classic question” finding of Klebsiella pneumonia, and the usual rank of its abscesses, are which of the following?","o":["Rusty sputum; abscesses primarily in bone, secondarily in skin.","Dark-red bloody “currant jelly” sputum; abscesses 1° in the liver and 2° in the lungs.","A prolonged whooping cough; abscesses confined to the nasopharynx.","A nonproductive cough; abscesses limited to the kidney only.","Bull-neck swelling; abscesses 1° in the spleen and 2° in the brain."],"a":1,"src":"6b. Respiratory Infections (handwritten).pdf, slide 47","img":[{"u":"img/w11_resp_inf/p47.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 47","w":1200,"h":900}],"ch":"w11_resp_inf","chn":"Respiratory Infections"
