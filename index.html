air is due to water vapor (47 mmHg) saturating the air in the airways."},"w11_pulm_phys-5":{"q":"Which statement best describes pulmonary surfactant?","o":["It is a secretory product of type I alveolar pneumocytes.","It increases the work required to expand the lung.","It decreases the work of breathing.","It increases the surface tension of the alveolar lining liquid.","It increases the movement of fluid from the capillaries into the alveolar spaces."],"a":2,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q5) / 8b. Pulmonary Physiology 2026.pdf, slides 23, 26, 27","img":[{"u":"img/w11_pulm_phys/p23.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 23","w":1200,"h":900},{"u":"img/w11_pulm_phys/p26.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 26","w":1200,"h":900},{"u":"img/w11_pulm_phys/p27.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 27","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Why this is correct**\n\nThe inside of each alveolus is coated with a thin layer of water. The mutual attraction of water molecules, **surface tension**, constantly pulls the alveoli toward collapse. Surfactant, secreted by type II pneumocytes, **lowers** this surface tension. As a result, the lungs inflate more easily (compliance ↑) and the effort needed to inhale, the **work of breathing, decreases**. Surfactant has numerous other important functions as well, such as keeping small alveoli from collapsing and helping prevent pulmonary edema.","why":{"0":"Surfactant is made by **type II** cells, not type I. Type I cells cover about 95% of the alveolar surface and form the gas-exchange surface.","1":"The opposite: it reduces the work of expanding the lung.","3":"It lowers surface tension; it does not raise it.","4":"Surface tension also acts to pull fluid from the capillaries into the alveoli. Surfactant reduces that force, so it **helps prevent** fluid from leaking into the alveoli (pulmonary edema)."},"one":"Pulmonary surfactant lowers surface tension and so decreases the work of breathing."},"w11_pulm_phys-6":{"q":"Air hunger while hiking at high altitude is caused by","o":["inhalation of dry atmospheric air.","a lower fraction of O2 in the inspired mountain air.","increased CO2 content in the inspired mountain air.","increased barometric pressure.","decreased barometric pressure."],"a":4,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q6) / 8b. Pulmonary Physiology 2026.pdf, slides 12, 65","img":[{"u":"img/w11_pulm_phys/p12.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 12","w":1200,"h":900},{"u":"img/w11_pulm_phys/p65.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 65","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Why this is correct (PIO₂ = FIO₂ × (PB − PH₂O))**\n\nAt high altitude the **fraction of O₂ (FIO₂) is still 21%**. What changes is the total **barometric pressure (PB)**. The higher you go, the lower the pressure, so the same 21% gives a lower actual O₂ partial pressure (PIO₂). For example, at a barometric pressure of 500 mmHg, PIO₂ = (500 − 47) × 0.21 ≈ 95 mmHg, far below the 150 mmHg at sea level. The result is hypoxemia from decreased inspired PO₂. The peripheral chemoreceptors sense this and drive breathing, producing the feeling of air hunger.","why":{"0":"Inspired air is saturated with water vapor in the airways anyway, so dryness itself is not the cause.","1":"The most common trap: even at altitude the O₂ **fraction stays 0.21**.","2":"The CO₂ content of mountain air is nearly zero, the same as at sea level.","3":"Barometric pressure decreases at altitude; it does not increase."},"one":"Air hunger at altitude comes from decreased barometric pressure lowering inspired PO₂, not from a lower O₂ fraction."},"w11_pulm_phys-7":{"q":"During a forced expiration from total lung capacity, what primarily limits flow rate?","o":["The force of contraction of expiratory muscles.","The contraction of the diaphragm.","Constriction of bronchial smooth muscle","Elasticity of the chest wall","Airway compression"],"a":4,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q7) / 8b. Pulmonary Physiology 2026.pdf, slides 35, 36","img":[{"u":"img/w11_pulm_phys/p35.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 35","w":1200,"h":900},{"u":"img/w11_pulm_phys/p36.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 36","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Why this is correct**\n\nDuring a forced exhalation, intrapleural pressure becomes strongly positive. Pressure inside the airway falls progressively from the alveoli toward the mouth. At some point, **intrapleural pressure exceeds the pressure inside the airway**, so the airway is squeezed harder from outside than from inside and **compresses**. Resistance rises and expiratory flow falls.\n\nThe key is that the harder you push, the higher intrapleural pressure goes and the more it squeezes the airway. Beyond a certain effort, flow does not increase any further (effort-independent). So what \"primarily limits\" flow is airway compression, not muscle force. In emphysema, loss of the elastic support that holds airways open makes this especially severe.","why":{"0":"Expiratory muscle force increases flow at first, but beyond a certain level it has no further effect because of airway compression.","1":"The diaphragm is an inspiratory muscle; it relaxes during expiration.","2":"Bronchial smooth muscle constriction raises resistance in diseases such as asthma, but it is not the main limit on forced expiration in a normal person.","3":"Chest wall elasticity helps set the FRC balance point; it is not the main limit on forced expiratory flow."},"one":"Flow during a forced expiration from total lung capacity is limited primarily by dynamic airway compression."},"w11_pulm_phys-8":{"q":"What happens with normal quiet expiration?","o":["Airway resistance increases significantly.","Alveolar pressure exceeds atmospheric pressure.","Intra-pleural pressure gradually falls.","Alveoli collapse.","The diaphragm moves downward."],"a":1,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q8) / 8b. Pulmonary Physiology 2026.pdf, slides 16, 18, 32","img":[{"u":"img/w11_pulm_phys/p16.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 16","w":1200,"h":900},{"u":"img/w11_pulm_phys/p18.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 18","w":1200,"h":900},{"u":"img/w11_pulm_phys/p32.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 32","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Why this is correct**\n\nAir flows from high pressure to low pressure, and airflow is proportional to the difference between alveolar and atmospheric pressure. Quiet expiration is **passive**. When the inspiratory muscle (the diaphragm) relaxes, the elastic recoil of the stretched lungs squeezes them inward, so **alveolar pressure rises slightly above atmospheric** (e.g., +1 cmH₂O) and air flows out. At the end of expiration, alveolar pressure returns to atmospheric.","why":{"0":"Airway resistance does not change much in quiet expiration; increased resistance from dynamic compression happens during forced expiration.","2":"Intrapleural pressure becomes more negative during inspiration and **less negative (rises)** during expiration. \"Gradually falls\" describes inspiration.","3":"In normal lungs, surfactant and the balance between chest wall and lung keep the alveoli from collapsing during expiration.","4":"The diaphragm moves downward during inspiration; during expiration it relaxes and moves upward."},"one":"Normal quiet expiration is passive: alveolar pressure exceeds atmospheric pressure, so air flows out."},"w11_pulm_phys-9":{"q":"An 18 y/o high school star basketball player has a forced vital capacity of 5 L, a FRC of 3 L, and a RV of 1.2 L. What is his total lung capacity?","o":["9.2 L","8.0 L","7.2 L","6.2 L","5.0 L"],"a":3,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q9) / 8b. Pulmonary Physiology 2026.pdf, slide 8","img":[{"u":"img/w11_pulm_phys/p08.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 8","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Calculation**\n\nTotal lung capacity (TLC) = vital capacity (VC) + residual volume (RV)\n\n= 5 + 1.2 = **6.2 L**\n\nVital capacity is the amount you can exhale after a maximal inhalation, and residual volume is the air still left in the lungs after that. Together they give the maximum volume the lungs can hold. In normal lungs FVC is essentially equal to VC, so you can use FVC as VC. **The FRC (3 L) is a distractor.** FRC = ERV + RV, so it already includes RV; adding FRC to VC would count RV twice.","why":{"0":"9.2 = 5 + 3 + 1.2, the error of adding all three numbers.","1":"8.0 = 5 + 3 (FVC + FRC), which double-counts RV.","2":"7.2 does not come from any valid combination.","4":"5.0 is FVC alone, leaving out RV."},"one":"TLC = FVC + RV = 5 + 1.2 = 6.2 L."},"w11_pulm_phys-10":{"q":"At what lung volume or capacity do the lungs and chest wall normally have opposite and equal recoil tendencies?","o":["FVC","FRC","RV","IRV","ERV"],"a":1,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q10) / 8b. Pulmonary Physiology 2026.pdf, slide 17","img":[{"u":"img/w11_pulm_phys/p17.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 17","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Why this is correct**\n\nBecause of their elasticity, the lungs always tend to **recoil inward**, while the chest wall tends to **spring outward**. After a quiet exhalation with all respiratory muscles relaxed, these two forces are equal in size and opposite in direction, so they balance. The lung volume at this equilibrium is the **functional residual capacity (FRC)**. Because the two forces pull in opposite directions, the intrapleural space has a pressure below atmospheric, which helps keep the alveoli from collapsing.","why":{"0":"FVC is a volume measured on pulmonary function testing, not the relaxed equilibrium state.","2":"At RV the chest wall's outward spring is much stronger; you only reach it by forcefully exhaling with muscle effort.","3":"IRV is the extra volume you can inhale above a quiet inspiration; it is not the equilibrium point.","4":"ERV is the extra volume you can exhale from FRC; it is a volume, not the equilibrium position itself."},"one":"FRC is the equilibrium point where the lung's inward recoil and the chest wall's outward recoil are equal and opposite."},"w11_pulm_phys-11":{"q":"A man with normal lungs and a normal arterial Pco2 takes an overdose of a barbiturate which reduces his alveolar ventilation by ½ but does not change his output of CO2. Which of the following is a consequence of the overdose?","o":["PvO2 > PaO2","PaO2 > PAO2","PACO2 doubles.","PACO2 decreases by 50%.","PaCO2 decreases by 50%."],"a":2,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q11) / 8b. Pulmonary Physiology 2026.pdf, slide 11","img":[{"u":"img/w11_pulm_phys/p11.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 11","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Why this is correct**\n\nThis is the same principle as alveolar ventilation versus PCO₂: with constant CO₂ production, PACO₂ ∝ 1/VA. When VA is halved, PACO₂ **doubles** (40 → about 80 mmHg). Barbiturates depress the brainstem respiratory centers and cause hypoventilation, and hypoventilation causes CO₂ retention and respiratory acidosis.","why":{"0":"Venous blood has already given up O₂ to the tissues, so its PO₂ is always lower than arterial PO₂ (about 40 vs 95 mmHg).","1":"O₂ diffuses from the alveoli into the blood, so arterial PO₂ cannot be higher than alveolar PO₂; even normally there is an A-a difference of 5–15 mmHg.","3":"When ventilation falls, PCO₂ rises rather than falls; a 50% decrease would result from doubling ventilation.","4":"When ventilation falls, PCO₂ rises rather than falls; a 50% decrease would result from doubling ventilation."},"one":"If CO₂ production is unchanged and alveolar ventilation is halved, alveolar PCO₂ doubles."},"w11_pulm_phys-12":{"q":"Which of the following is correct regarding V/Q?","o":["It is independent of age.","Anatomic and physiologic shunting cause mismatch.","It is unrelated to COPD.","It is stable after puberty.","Breathing 100% O2 corrects for V/Q mismatch regardless of the cause."],"a":1,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q12) / 8b. Pulmonary Physiology 2026.pdf, slides 47, 50","img":[{"u":"img/w11_pulm_phys/p47.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 47","w":1200,"h":900},{"u":"img/w11_pulm_phys/p50.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 50","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Why this is correct**\n\nV/Q is the ratio of air entering an alveolus (V) to blood flowing past it (Q). A **shunt** is blood that bypasses ventilated alveoli. An example of anatomic shunt is part of the bronchial circulation draining directly into the pulmonary veins. Shunted blood effectively has V/Q = 0, so it creates V/Q mismatch. That is why even healthy people have an alveolar-arterial PO₂ difference (A-a gradient) of about 5–15 mmHg.","why":{"0":"V/Q nonuniformity increases with age, and the A-a gradient also rises with age, so V/Q is neither independent of age nor fixed after puberty.","3":"V/Q nonuniformity increases with age, and the A-a gradient also rises with age, so V/Q is neither independent of age nor fixed after puberty.","2":"COPD is a classic cause of V/Q mismatch and hypoxemia.","4":"Breathing 100% O₂ **does not** correct an anatomic right-to-left shunt, because shunted blood never passes ventilated alveoli."},"one":"Anatomic and physiologic shunts create blood flow with V/Q = 0 and thus cause V/Q mismatch."},"w11_pulm_phys-13":{"q":"A patient with lung disease who is breathing air has an arterial PO2 and Pco2 of 49 and 48 mm Hg, respectively and a respiratory exchange ratio of 0.8. What does this indicate?","o":["COVID-19 infection.","Restrictive lung disease.","Congestive heart failure.","V/Q mismatch.","Decreased AO2 – aO2."],"a":3,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q13) / 8b. Pulmonary Physiology 2026.pdf, slides 13, 48","img":[{"u":"img/w11_pulm_phys/p13.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 13","w":1200,"h":900},{"u":"img/w11_pulm_phys/p48.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 48","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Calculation**\n\nPAO₂ = PIO₂ − PaCO₂/R = 150 − 48/0.8 = 150 − 60 = **90 mmHg**\n\nA-a difference = PAO₂ − PaO₂ = 90 − 49 = **41 mmHg**\n\nThe normal A-a difference is 5–15 mmHg. **Above 15 mmHg indicates impaired oxygenation and V/Q mismatch.** At 41 mmHg it is markedly increased, so V/Q mismatch is the answer. If the hypoxemia were due to simple hypoventilation, the A-a difference would be normal. Plugging the numbers into the formula is the key step.","why":{"0":"COVID-19, restrictive lung disease, and heart failure are all **specific diseases that can cause** V/Q mismatch, but blood-gas values alone cannot point to a specific disease. What the numbers directly indicate is the physiologic abnormality, V/Q mismatch.","1":"COVID-19, restrictive lung disease, and heart failure are all **specific diseases that can cause** V/Q mismatch, but blood-gas values alone cannot point to a specific disease. What the numbers directly indicate is the physiologic abnormality, V/Q mismatch.","2":"COVID-19, restrictive lung disease, and heart failure are all **specific diseases that can cause** V/Q mismatch, but blood-gas values alone cannot point to a specific disease. What the numbers directly indicate is the physiologic abnormality, V/Q mismatch.","4":"The calculated A-a difference is **increased**, not decreased."},"one":"The A-a difference calculated with the alveolar gas equation is elevated at 41 mmHg, indicating V/Q mismatch."},"w11_pulm_phys-14":{"q":"An increase in which of the following will increase the affinity of hemoglobin for bound oxygen?","o":["Body temperature","Pco2","[H+]","2,3 DPG","Inhaled carbon monoxide"],"a":4,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q14) / 8b. Pulmonary Physiology 2026.pdf, slides 60, 61","img":[{"u":"img/w11_pulm_phys/p60.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 60","w":1200,"h":900},{"u":"img/w11_pulm_phys/p61.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 61","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Why this is correct**\n\nCO also increases the affinity of Hb for bound O₂: carbon monoxide makes hemoglobin **hold more tightly onto the O₂ it has already bound**. When CO occupies some of Hb's binding sites, the Hb molecule shifts into a shape that is reluctant to release O₂. The oxyhemoglobin dissociation curve **shifts left**, so less O₂ is unloaded in the tissues, which makes CO even more dangerous.","why":{"0":"Increased body temperature helps hot, exercising muscle unload O₂ (decreases affinity).","1":"Increased PCO₂ helps CO₂-rich tissues unload O₂ (decreases affinity).","2":"Increased [H⁺] (acidity) decreases affinity.","3":"Increased 2,3-DPG, a red-cell metabolite, decreases affinity. Memory aid: in hard-working tissue (hot, acidic, high CO₂), hemoglobin lets go of O₂ (right shift)."},"one":"Carbon monoxide increases hemoglobin's affinity for the O₂ it has already bound (left shift of the curve)."},"w11_pulm_phys-15":{"q":"Acute carbon monoxide poisoning will most likely","o":["reduce the arterial PO2.","affect the reading of a pulse oximeter.","reduce the amount of oxygen dissolved in plasma.","reduce the oxygen content of the blood.","decrease the affinity of hemoglobin for oxygen."],"a":3,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q15) / 8b. Pulmonary Physiology 2026.pdf, slides 55, 61","img":[{"u":"img/w11_pulm_phys/p55.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 55","w":1200,"h":900},{"u":"img/w11_pulm_phys/p61.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 61","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Why this is correct**\n\nCO binds Hb far more tightly than O₂ does and takes over O₂ binding sites. Hb saturation falls and the **oxygen content of the blood decreases**. However, **arterial PO₂ does not change** (\"without altering the arterial PO₂\"). Oxygen content = dissolved O₂ + Hb-bound O₂, and it is the Hb-bound portion that falls.","why":{"0":"PO₂ is the pressure created by O₂ **dissolved** in plasma. If ventilation and diffusion in the lung are normal, PaO₂ stays normal.","2":"Dissolved O₂ = 0.003 × PO₂, so if PO₂ is unchanged, dissolved O₂ is unchanged.","4":"CO actually **increases** hemoglobin's affinity for oxygen.","1":"In real clinical practice, a standard pulse oximeter cannot distinguish carboxyhemoglobin from oxyhemoglobin, so SpO₂ may read falsely normal. But the core point here is that arterial PO₂ stays normal while the blood's oxygen content decreases, so the answer is D."},"one":"Acute CO poisoning reduces the oxygen content of the blood while leaving arterial PO₂ unchanged."},"w11_pulm_phys-16":{"q":"In what form is most carbon dioxide transported in the venous blood?","o":["Dissolved CO2.","Bicarbonate.","Carbamino compounds.","Carbonic acid.","Carboxyhemoglobin."],"a":1,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q16) / 8b. Pulmonary Physiology 2026.pdf, slides 66, 67","img":[{"u":"img/w11_pulm_phys/p66.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 66","w":1200,"h":900},{"u":"img/w11_pulm_phys/p67.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 67","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Why this is correct**\n\nBlood carries CO₂ mostly as **bicarbonate (HCO₃⁻)**. The sequence is:\n\n① CO₂ produced in the tissues enters red blood cells.\n\n② Carbonic anhydrase rapidly drives CO₂ + H₂O → H₂CO₃.\n\n③ H₂CO₃ dissociates into H⁺ + HCO₃⁻.\n\n④ H⁺ binds to Hb, and HCO₃⁻ exits to the plasma in exchange for Cl⁻ (the chloride shift).","why":{"0":"Dissolved CO₂ is a small fraction (about 5–10%).","2":"Carbamino compounds (CO₂ attached to amino groups of Hb) account for only a portion (about 5–10%).","3":"Carbonic acid dissociates into H⁺ and HCO₃⁻ as soon as it forms, so it is not a transport form.","4":"Carboxyhemoglobin is **carbon monoxide (CO)** bound to Hb; the similar name is a trap. (CO₂ bound to Hb is carbaminohemoglobin.)"},"one":"Most CO₂ in venous blood is transported as bicarbonate (HCO₃⁻)."},"w11_pulm_phys-17":{"q":"Which statement below is inconsistent with normal gas exchange and normal gas transport events?","o":["Hyperventilation reduces the alveolar PCO2.","The difference between alveolar and arterial PO2 increases with V/Q mismatch.","Acidemia increases the affinity of hemoglobin for oxygen.","Most of the transported oxygen is bound to hemoglobin.","An increase in arterial PO2 will increase the oxygen content of blood."],"a":2,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q17) / 8b. Pulmonary Physiology 2026.pdf, slide 60","img":[{"u":"img/w11_pulm_phys/p60.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 60","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Why this is correct**\n\nThis question asks for the statement that is NOT consistent. Increased [H⁺] (acidemia) shifts the curve to the **right** (Bohr effect) and **decreases** hemoglobin's O₂ affinity. So C, \"acidemia increases the affinity,\" is the false statement and the answer.","why":{"0":"Hyperventilation blows off more CO₂, lowering PACO₂.","1":"An A-a difference above 15 mmHg indicates V/Q mismatch.","3":"Of the roughly 20 mL/dL of O₂ in blood, nearly all is bound to Hb; dissolved O₂ is only 0.003 × 95 ≈ 0.3 mL/dL.","4":"When PO₂ rises, dissolved O₂ (0.003 × PO₂) increases and saturation stays the same or rises, so oxygen content increases."},"one":"Acidemia decreases hemoglobin's O₂ affinity (Bohr effect), so the statement that it increases affinity is false."},"w11_pulm_phys-18":{"q":"A normal healthy 25 y/o male has a hemoglobin content of 14.5 gm/dl blood and a SaO2 of 97%. How much oxygen is his hemoglobin transporting?","o":["20 vol%","20 ml/dl","18.8 ml/dl","14.5 ml/dl","1.34 ml/dl"],"a":2,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q18) / 8b. Pulmonary Physiology 2026.pdf, slides 55, 62","img":[{"u":"img/w11_pulm_phys/p55.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 55","w":1200,"h":900},{"u":"img/w11_pulm_phys/p62.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 62","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Calculation (Hb-bound O₂ = Hb (g/dL) × 1.34 mL O₂/g Hb × % saturation/100)**\n\n14.5 × 1.34 × 0.97 = 19.43 × 0.97 ≈ **18.8 mL/dL**\n\n1.34 is the maximum amount of O₂ (mL) that 1 g of Hb can bind. The question asks only about oxygen carried \"by his hemoglobin,\" so dissolved O₂ (0.003 × PO₂ ≈ 0.3 mL/dL) is not added.","why":{"0":"20 vol% and 20 mL/dL are the same unit; this is the textbook \"normal oxygen carrying capacity of about 20 mL/dL,\" not a value calculated from this person's numbers.","1":"20 vol% and 20 mL/dL are the same unit; this is the textbook \"normal oxygen carrying capacity of about 20 mL/dL,\" not a value calculated from this person's numbers.","3":"14.5 is just the Hb concentration (g/dL) copied over, a trap.","4":"1.34 is the binding constant per gram of Hb, not the result."},"one":"Hemoglobin-bound oxygen = 14.5 × 1.34 × 0.97 ≈ 18.8 mL/dL."},"w11_pulm_phys-19":{"q":"What best characterizes the central chemoreceptors?","o":["They are located in the pons.","They are unresponsive to changes in either PO2 or PCO2 of the blood.","They are activated by pH changes in surrounding extracellular fluid.","They exist in the carotid and aortic bodies.","They are stimulated by the opening of Ca2+ sensitive potassium channels."],"a":2,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q19) / 8b. Pulmonary Physiology 2026.pdf, slide 80","img":[{"u":"img/w11_pulm_phys/p80.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 80","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Why this is correct**\n\nThe central (medullary) chemoreceptors are sensitive to the **pH of the cerebrospinal fluid**, which is linked to PCO₂. Here is how it works: CO₂ in the blood crosses the blood-brain barrier (BBB) easily, but H⁺ does not. CO₂ that enters the CSF reacts with H₂O to form H⁺, lowering the pH of the extracellular fluid around the receptors. The receptors sense this pH change and increase breathing.","why":{"0":"They are located on the ventral surface of the **medulla**, not the pons.","1":"They respond strongly to changes in blood PCO₂ (indirectly, via pH). It is true they don't respond to PO₂, but \"unresponsive to either\" is wrong.","3":"The carotid and aortic bodies are the **peripheral** chemoreceptors.","4":"Potassium channels are part of the glomus cell mechanism of the peripheral chemoreceptors: in hypoxia, O₂-sensitive K⁺ channels close and the cell depolarizes. This does not describe the central chemoreceptors."},"one":"Central chemoreceptors are activated by pH changes in the surrounding extracellular fluid (CSF)."},"w11_pulm_phys-20":{"q":"What best describes respiratory center activity?","o":["The normal rhythmic pattern of breathing originates from neurons in the pons and medulla.","Inspiratory activity originates in the dorsal respiratory group of neurons in the pons.","Impulses from the pneumotaxic center switch on inspiratory activity.","The only output is via the phrenic nerves."],"a":0,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q20) / 8b. Pulmonary Physiology 2026.pdf, slides 75, 76, 77","img":[{"u":"img/w11_pulm_phys/p75.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 75","w":1200,"h":900},{"u":"img/w11_pulm_phys/p76.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 76","w":1200,"h":900},{"u":"img/w11_pulm_phys/p77.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 77","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Why this is correct**\n\nThe basic breathing rhythm is generated by the central controller in the brainstem. The dorsal respiratory group (DRG) and ventral respiratory group (VRG) of the medulla generate the rhythm, and the apneustic and pneumotaxic centers of the pons **fine-tune** it. So A, that neurons in the pons and medulla together produce the normal rhythmic pattern, is the best answer.","why":{"1":"The dorsal respiratory group is in the **medulla**, not the pons. It is true that the DRG contains mainly inspiratory neurons.","2":"The pneumotaxic center **switches off** inspiration rather than switching it on, shortening inspiration and increasing breathing rate. The center that prolongs inspiration is the apneustic center.","3":"Besides the phrenic nerves, there are several outputs, including the intercostal nerves to the intercostal muscles and nerves to the accessory muscles."},"one":"The normal rhythmic pattern of breathing originates from neurons in the pons and medulla."},"w11_pulm_phys-21":{"q":"What best characterizes glomus cells?","o":["They are located in the carotid sinus.","They form the BBB.","They exist in the airways of the lung.","They possess oxygen sensors."],"a":3,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q21) / 8b. Pulmonary Physiology 2026.pdf, slides 78, 79","img":[{"u":"img/w11_pulm_phys/p78.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 78","w":1200,"h":900},{"u":"img/w11_pulm_phys/p79.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 79","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Why this is correct**\n\nGlomus cells are the sensory cells of the **carotid body**, a peripheral chemoreceptor. When arterial PO₂ falls (hypoxemia), the glomus cell's oxygen-sensing mechanism (O₂-sensitive K⁺ channels) causes the cell to **depolarize**. Ca²⁺ then enters, neurotransmitter is released, and signals travel to the brainstem via the glossopharyngeal nerve. In short, glomus cells are the cells that carry the \"oxygen sensors.\"","why":{"0":"The carotid **sinus** houses **baroreceptors** that sense blood pressure. This is a trap that confuses it with the carotid **body**, where glomus cells are.","1":"The BBB is formed by tight junctions between brain capillary endothelial cells, among other things.","2":"There are no glomus cells in the airways; they are at the carotid bifurcation and the aortic arch."},"one":"Glomus cells are the peripheral chemoreceptor cells that possess oxygen sensors."},"w11_pulm_phys-22":{"q":"John is a 62 yr-old male who has been a heavy cigarette smoker for 40+ years. He is hospitalized because of COPD and supplied with 50% oxygen through a nasal cannula. Which of the following will change the most as a result of the oxygenation?","o":["His vital capacity.","His hematocrit.","The viscosity of his blood.","The oxygen content of his blood.","His lung diffusing capacity."],"a":3,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q22) / 8b. Pulmonary Physiology 2026.pdf, slides 55, 82","img":[{"u":"img/w11_pulm_phys/p55.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 55","w":1200,"h":900},{"u":"img/w11_pulm_phys/p82.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 82","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Why this is correct**\n\nIn COPD, V/Q mismatch causes hypoxemia. Giving high-concentration oxygen greatly raises inspired PO₂ (PIO₂). More O₂ then reaches even poorly ventilated (low V/Q) alveoli, so PaO₂ and Hb saturation rise and dissolved O₂ increases as well. Because oxygen content = dissolved O₂ + Hb-bound O₂, **the blood's oxygen content changes the most and the fastest**. (Remember that, unlike V/Q mismatch, a true shunt is not corrected even by 100% O₂.)","why":{"0":"Vital capacity is determined by the mechanical properties of the lungs and chest wall; breathing oxygen does not change it.","1":"Hematocrit, and the blood viscosity that depends on it, change through increased red-cell production in chronic hypoxia over weeks or more; they don't change much right after oxygen is started.","2":"Hematocrit, and the blood viscosity that depends on it, change through increased red-cell production in chronic hypoxia over weeks or more; they don't change much right after oxygen is started.","4":"Diffusing capacity (DL) is set by structure such as membrane area and thickness (Fick's law); it does not depend on inspired oxygen concentration."},"one":"When a COPD patient is given oxygen, the thing that changes most and most immediately is the oxygen content of the blood."},"w11_pulm_phys-23":{"q":"Humans inspire about 10,000 L of air daily. This air contains various substances some of which are potentially injurious to respiratory tissues. Mucocillliary transport is a vital mechanism designed to protect against injury. How is this mechanism best described?","o":["It moves inhaled particulates downward where they are destroyed by alveolar macrophages.","Biphasic ciliary activity moves the mucus layer containing inhaled particulates toward the pharynx.","Biphasic ciliary activity moves the fluid layer containing inhaled particulates toward the pharynx.","The mucus layer contains hydrolytic enzymes that digest inhaled particulates.","The fluid layer contains hydrolytic enzymes that digest inhaled particulates."],"a":1,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q23) / 8b. Pulmonary Physiology 2026.pdf, slides 86, 87","img":[{"u":"img/w11_pulm_phys/p86.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 86","w":1200,"h":900},{"u":"img/w11_pulm_phys/p87.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 87","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Why this is correct**\n\nSmall particles are removed by the **upward-moving mucus layer**, driven by ciliary action in the airways. The airway surface has two layers:\n\n· Lower layer: a watery **fluid layer** (periciliary fluid) in which the cilia move freely.\n\n· Upper layer: a sticky **mucus layer** that traps dust and bacteria.\n\nCilia beat in a **biphasic** pattern: a fast, forceful effective stroke and a slow recovery stroke. During the effective stroke, the cilia tips push the overlying mucus layer upward, carrying the mucus toward the pharynx, where it is swallowed or spat out (the mucociliary escalator).","why":{"0":"The direction is reversed: mucus moves up toward the pharynx, not down. Macrophages do handle particles that reach the alveoli, but that is a separate mechanism from mucociliary transport.","2":"What moves is the **mucus layer** on top, not the watery fluid layer beneath it.","3":"Mucociliary transport physically carries particles out; it does not digest them.","4":"Mucociliary transport physically carries particles out; it does not digest them."},"one":"In mucociliary transport, biphasic ciliary beating moves the mucus layer containing inhaled particles toward the pharynx."},"w11_pulm_phys-24":{"q":"What substrate in the blood is most likely to undergo modification or elimination during passage through the pulmonary vasculature?","o":["Histamine","Vasoactive intestinal peptide (VIP)","Angiotensin I","Angiotensin II","Substance P"],"a":2,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q24) / 8b. Pulmonary Physiology 2026.pdf, slides 85, 89","img":[{"u":"img/w11_pulm_phys/p85.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 85","w":1200,"h":900},{"u":"img/w11_pulm_phys/p89.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 89","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Why this is correct**\n\nThe surface of pulmonary capillary endothelial cells is packed with angiotensin-converting enzyme (ACE). As blood makes a single pass through the lungs, most angiotensin I (the weak form) is converted to angiotensin II, a powerful vasoconstrictor. Because the entire blood volume passes through the lungs, the lungs are the main site of this conversion.","why":{"3":"Angiotensin II is the **product made** in the lungs; it passes through largely unchanged and acts on systemic vessels.","0":"Histamine is not presented as a typical substrate processed by the lungs; the basis for the answer is the lung's conversion of angiotensin I to angiotensin II.","1":"Vasoactive intestinal peptide (VIP) is not presented as a typical substrate processed by the lungs; the answer is the conversion of angiotensin I.","4":"Substance P is not presented as a typical substrate processed by the lungs; the answer is the conversion of angiotensin I."},"one":"The blood-borne substance most modified in the lungs is angiotensin I, which ACE converts to angiotensin II."},"w11_pulm_phys-25":{"q":"Inflammation of the airways is most likely to result in","o":["increased ventilation of alveoli.","increased airway resistance.","reduced turbulence in airways.","dynamic compression of large airways.","increased FEV1."],"a":1,"src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q25) / 8b. Pulmonary Physiology 2026.pdf, slides 28, 30","img":[{"u":"img/w11_pulm_phys/p28.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 28","w":1200,"h":900},{"u":"img/w11_pulm_phys/p30.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 30","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11,"exp":"**Why this is correct**\n\nAirflow is proportional to the pressure difference and inversely proportional to airway resistance, and changes in smooth muscle tone alter airway diameter and thus resistance. Inflammation causes airway wall swelling (edema), more mucus secretion, and smooth muscle contraction, all of which **narrow the airway**. Because resistance is inversely proportional to the fourth power of the radius (Poiseuille's law), even slight narrowing causes a large **increase** in resistance. Asthma and bronchitis are classic examples.","why":{"0":"Narrower airways deliver less air to the alveoli, so alveolar ventilation actually decreases.","2":"In narrowed airways, air velocity rises at the same flow, so turbulence actually **increases**.","3":"Dynamic compression occurs during forced expiration when intrapleural pressure exceeds airway pressure, especially in emphysema with loss of elastic recoil. It is not the most direct result of inflammation.","4":"Higher resistance **decreases** the volume exhaled in one second (FEV1)."},"one":"Airway inflammation narrows the airways and increases airway resistance."},"w11_cv_phys-1":{"q":"Which statement best characterizes the normal right heart?","o":["It is a high pressure pump.","It forces blood into the vena cava.","It produces systolic pressures of 120 mm Hg.","It pumps a volume of blood equal to that pumped by the left heart.","It has greater afterload than the left heart."],"a":3,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q1) / 9b. Cardiovascular Physiology 2026.pdf, slides 52, 55","img":[{"u":"img/w11_cv_phys/p52.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 52","w":1200,"h":900},{"u":"img/w11_cv_phys/p55.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 55","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nThe outputs of the left and right ventricles are normally **equal in volume but not in pressure**. The two ventricles are connected in a single circuit; if the right heart pumped even slightly more than the left, the difference would keep piling up in the lungs. So in the normal state the outputs must match. The right heart is a \"volume pump,\" and the left heart is a \"pressure pump.\"","why":{"0":"The right heart is a **low-pressure** pump that sends blood into the low-pressure pulmonary circulation.","1":"The right heart **receives** blood from the venae cavae and pumps it into the pulmonary artery.","2":"120 mmHg is the **left** ventricular systolic pressure; right ventricular systolic pressure is about 25 mmHg.","4":"Afterload is mean pulmonary artery pressure for the right ventricle and mean systemic arterial pressure for the left. Pulmonary artery pressure is much lower, so right-heart afterload is **smaller**."},"one":"Normally the right and left hearts pump equal volumes of blood, but not at equal pressures."},"w11_cv_phys-2":{"q":"Assuming no change in the other forces, what effect will an increase in plasma oncotic pressure have on capillary fluid dynamics?","o":["An increase in capillary filtration.","An increase in net filtration pressure.","A decrease in capillary absorption.","An increase in interstitial hydrostatic pressure.","A decrease in capillary filtration."],"a":4,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q2) / 9b. Cardiovascular Physiology 2026.pdf, slides 14, 15","img":[{"u":"img/w11_cv_phys/p14.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 14","w":1200,"h":900},{"u":"img/w11_cv_phys/p15.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 15","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Starling forces**\n\nNet filtration = (CHP + TOP) − (POP + THP)\n\n· CHP (capillary hydrostatic pressure) and TOP (tissue oncotic pressure): forces that push water **out**\n\n· POP (plasma oncotic pressure) and THP (tissue hydrostatic pressure): forces that hold water **in**\n\nPlasma oncotic pressure is the pull of plasma proteins (mainly albumin) drawing water into the vessel. When it rises, the subtracted side of the equation gets bigger, net filtration falls, and **filtration decreases**.","why":{"0":"The opposite: filtration and net filtration pressure decrease.","1":"The opposite: filtration and net filtration pressure decrease.","2":"The force pulling water into the vessel increases, so absorption actually **increases**.","3":"With less filtration, less water moves into the interstitium, so interstitial hydrostatic pressure does not rise."},"one":"Increased plasma oncotic pressure strengthens the force holding water in the vessel, so capillary filtration decreases."},"w11_cv_phys-3":{"q":"What is primarily responsible for the increased blood flow to active muscle?","o":["Dilation of small veins and venules.","Dilation of capillaries.","Constriction of arterioles.","Venoconstriction.","Accumulation of vasodilatory metabolites in the muscle."],"a":4,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q3) / 9b. Cardiovascular Physiology 2026.pdf, slide 18","img":[{"u":"img/w11_cv_phys/p18.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 18","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nBlood flow in the microcirculation is controlled by local tissue metabolites. As muscle works, CO₂, H⁺, lactate, K⁺, and adenosine accumulate while O₂ falls. These metabolites **relax arteriolar smooth muscle** in that muscle. Wider arterioles mean lower resistance (resistance ∝ 1/r⁴), so blood flow rises sharply. This is active hyperemia: hard-working tissue pulls in more blood for itself.","why":{"0":"Veins are **capacitance vessels**, not resistance vessels. Changes in venous diameter affect blood storage and venous return more than flow regulation.","3":"Veins are **capacitance vessels**, not resistance vessels. Changes in venous diameter affect blood storage and venous return more than flow regulation.","1":"Capillaries have no smooth muscle and cannot dilate on their own; flow changes are determined by the upstream arterioles.","2":"Arteriolar **constriction** would actually reduce blood flow."},"one":"Increased blood flow to active muscle is mainly due to arteriolar dilation from accumulated vasodilatory metabolites."},"w11_cv_phys-4":{"q":"What best characterizes normal veins?","o":["They are resistance vessels.","They are exchange vessels.","They are more compliant than arteries.","They have thicker walls than arteries.","They contain less blood than arteries."],"a":2,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q4) / 9b. Cardiovascular Physiology 2026.pdf, slide 9","img":[{"u":"img/w11_cv_phys/p09.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 9","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nCompliance is distensibility: how much volume increases for a small rise in pressure. Veins have thin walls with little elastic tissue, so they are **highly compliant** (\"veins are highly compliant\"). That is why they act as the reservoir (capacitance vessels) holding about two-thirds of total blood volume. Mobilizing this stored blood when needed increases venous return and cardiac output.","why":{"0":"The resistance vessels are the **arterioles**.","1":"The exchange vessels are the **capillaries**.","3":"Veins have **thinner** walls than arteries.","4":"Veins hold much **more** blood than arteries."},"one":"Veins are more compliant than arteries and so act as capacitance vessels."},"w11_cv_phys-5":{"q":"Turbulence in the vasculature is most likely to occur","o":["in capillaries.","in venules.","with increased blood viscosity.","when the hematocrit is low.","in vessels arranged in series."],"a":3,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q5) / 9b. Cardiovascular Physiology 2026.pdf, slides 11, 12","img":[{"u":"img/w11_cv_phys/p11.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 11","w":1200,"h":900},{"u":"img/w11_cv_phys/p12.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 12","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nTurbulence is more likely when (a) vessel diameter is large, (b) **blood viscosity is low**, (c) velocity is high, or (d) a vessel is locally narrowed. Hematocrit, the fraction of blood made up of red cells, is the biggest determinant of blood viscosity. When hematocrit is **low**, as in anemia, viscosity falls and turbulence develops more easily; this is also why murmurs can be heard in anemic patients. (This follows the Reynolds number: density × diameter × velocity / viscosity.)","why":{"0":"Capillaries have tiny diameters and slow flow, so turbulence almost never occurs there.","1":"Venules have small diameters and slow flow, so turbulence almost never occurs there.","2":"**Increased** viscosity actually makes turbulence less likely.","4":"Series versus parallel arrangement is a concept for calculating total resistance, not a condition for turbulence."},"one":"When hematocrit is low and blood viscosity falls, turbulence develops more easily in the vasculature."},"w11_cv_phys-6":{"q":"What is the most important factor favoring normal filtration across capillaries?","o":["Plasma oncotic pressure.","Tissue oncotic pressure.","Hydrostatic pressure.","Tissue hydrostatic pressure.","Lymph flow."],"a":2,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q6) / 9b. Cardiovascular Physiology 2026.pdf, slides 14, 15","img":[{"u":"img/w11_cv_phys/p14.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 14","w":1200,"h":900},{"u":"img/w11_cv_phys/p15.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 15","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nThe forces that drive filtration are CHP (capillary hydrostatic pressure) and TOP (tissue oncotic pressure). By far the larger one is **capillary hydrostatic pressure**, the blood pressure generated by the heart and transmitted to the capillaries (about 30–35 mmHg at the arterial end). That is why filtration happens mainly at the arterial end, where hydrostatic pressure is high, and absorption at the venous end, where it has fallen.","why":{"0":"Plasma oncotic pressure **opposes** filtration (it holds water in).","1":"Tissue oncotic pressure does favor filtration, but its value is small because the interstitium normally contains little protein.","3":"Tissue hydrostatic pressure opposes filtration, and its value is small (near 0).","4":"Lymph flow is the route that removes excess filtered fluid from the interstitium, not a force that causes filtration."},"one":"The most important factor favoring normal capillary filtration is hydrostatic pressure."},"w11_cv_phys-7":{"q":"What does an increase in the slope of phase 4 of slow response action potentials result in?","o":["Increased heart rate","Decreased heart rate","Decreased firing rate of the SA node","Decreased inward conductance of calcium current","Increased outward conductance of potassium current."],"a":0,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q7) / 9b. Cardiovascular Physiology 2026.pdf, slides 25, 26, 56","img":[{"u":"img/w11_cv_phys/p25.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 25","w":1200,"h":900},{"u":"img/w11_cv_phys/p26.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 26","w":1200,"h":900},{"u":"img/w11_cv_phys/p56.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 56","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nPacemaker cells such as those of the SA node depolarize slowly on their own during phase 4 (spontaneous depolarization), driven by the funny current (If), Ca²⁺ currents, and others. When this upslope is **steeper, the cell reaches threshold sooner**. Action potentials fire more often, so the SA node firing rate rises and **heart rate increases**. This is exactly how sympathetic (β₁) stimulation raises heart rate.","why":{"1":"This is the result of a **decreased** slope (parasympathetic, ACh).","2":"This is the result of a **decreased** slope (parasympathetic, ACh).","3":"Inward calcium (and If) current must **increase** to steepen the slope; a decrease has the opposite effect.","4":"Increased outward potassium current (opening of K-ACh channels) hyperpolarizes the cell and **flattens** the slope; that is a parasympathetic action."},"one":"A steeper phase 4 slope in slow-response action potentials reaches threshold sooner and increases heart rate."},"w11_cv_phys-8":{"q":"Which phase of the fast response action potential is maintained by Na/K ATPase?","o":["Phase 0","Phase 1","Phase 2","Phase 3","Phase 4"],"a":4,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q8) / 9b. Cardiovascular Physiology 2026.pdf, slide 23","img":[{"u":"img/w11_cv_phys/p23.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 23","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nPhase 4 is the period when the resting membrane potential is restored and **stable**. During an action potential, Na⁺ enters the cell and K⁺ leaves. The Na⁺/K⁺ ATPase uses ATP to pump 3 Na⁺ out and 2 K⁺ in, restoring the ion gradients. This maintains the resting membrane potential (about −90 mV), so it is most directly linked to phase 4.","why":{"0":"Phase 0: rapid depolarization from opening of fast Na⁺ channels.","1":"Phase 1: early repolarization from inactivation of fast Na⁺ channels.","2":"Phase 2: the plateau, from a balance of L-type Ca²⁺ influx and K⁺ efflux.","3":"Phase 3: repolarization as Ca²⁺ channels close and K⁺ flows out."},"one":"Phase 4 (the resting membrane potential) of the fast-response action potential is maintained by the Na⁺/K⁺ ATPase."},"w11_cv_phys-9":{"q":"Which phase of the slow response action potential is affected by adrenergic agonists?","o":["Phase 0","Phase 1","Phase 2","Phase 3","Phase 4"],"a":4,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q9) / 9b. Cardiovascular Physiology 2026.pdf, slide 56","img":[{"u":"img/w11_cv_phys/p56.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 56","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nWhen adrenergic agonists bind β₁ receptors on pacemaker cells, they affect If and Ca²⁺ currents and **increase the slope of phase 4** of the slow-response action potential. As a result, the SA node firing rate increases. This pairs with the question on the phase 4 slope and heart rate.","why":{"1":"Slow-response action potentials **have no phases 1 or 2**; they have only phases 0, 3, and 4, so this option does not apply at all.","2":"Slow-response action potentials **have no phases 1 or 2**; they have only phases 0, 3, and 4, so this option does not apply at all.","0":"Phase 0 (the upstroke from L-type Ca²⁺ influx) is also somewhat affected by sympathetic stimulation, but the key target that changes heart rate is the phase 4 slope.","3":"Phase 3 is repolarization from K⁺ efflux; it is not the answer being tested."},"one":"Adrenergic agonists increase the phase 4 slope of the slow-response action potential and raise heart rate."},"w11_cv_phys-10":{"q":"What change in the EKG comes with a bundle branch block (BBB)?","o":["An increase in the PR interval.","A wider QRS complex.","A decrease in the PR interval.","Atrial fibrillation.","Absence of T waves."],"a":1,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q10) / 9b. Cardiovascular Physiology 2026.pdf, slides 27, 32, 33","img":[{"u":"img/w11_cv_phys/p27.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 27","w":1200,"h":900},{"u":"img/w11_cv_phys/p32.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 32","w":1200,"h":900},{"u":"img/w11_cv_phys/p33.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 33","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nExcitation travels SA node → AV node → bundle of His → **right and left bundle branches** → Purkinje fibers. The QRS complex is the time it takes for the ventricles to depolarize. If one bundle branch is blocked, that ventricle loses its fast conduction pathway. Instead, excitation must spread slowly cell to cell from the other ventricle, so ventricular depolarization takes longer and **the QRS widens** (≥ 0.12 s).","why":{"0":"A longer PR interval reflects delayed AV nodal conduction, i.e., first-degree AV block; a bundle branch block is a problem below the AV node.","2":"A shorter PR interval is seen with an accessory pathway (e.g., WPW syndrome) or faster AV nodal conduction.","3":"Atrial fibrillation is a reentrant arrhythmia of the atria, separate from bundle branch block.","4":"T waves are still present in bundle branch block (their shape may change)."},"one":"In bundle branch block, ventricular depolarization is delayed, so the QRS complex widens."},"w11_cv_phys-11":{"q":"What is the most life-threatening cardiac arrhythmia ?","o":["Atrial flutter","Atrial fibrillation","Ventricular tachycardia","Sinus rhythm","Ventricular fibrillation"],"a":4,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q11) / 9b. Cardiovascular Physiology 2026.pdf, slide 42","img":[{"u":"img/w11_cv_phys/p42.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 42","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nIn ventricular fibrillation, the ventricular muscle just quivers chaotically from reentrant excitation. The ventricles cannot contract together, so they **eject no blood at all**. Pulse and blood pressure disappear, and brain damage and death follow within minutes. Immediate defibrillation is required.","why":{"0":"Atrial flutter is an atrial problem. Even without effective atrial contraction, the ventricles keep pumping, so it is not immediately fatal (though there is a long-term risk of clots and stroke).","1":"Atrial fibrillation is an atrial problem. Even without effective atrial contraction, the ventricles keep pumping, so it is not immediately fatal (though there is a long-term risk of clots and stroke).","2":"Ventricular tachycardia is dangerous and can degenerate into ventricular fibrillation, but output is often partly maintained, so it is less lethal than VF.","3":"Sinus rhythm is the **normal** rhythm."},"one":"The most life-threatening arrhythmia is ventricular fibrillation."},"w11_cv_phys-12":{"q":"Which of the following is a cholinergic response to stimulation of M receptors in the SA node of the heart by ACh as observed on an EKG?","o":["Missing P waves.","Decreased PR interval","Longer RR interval","Longer QT interval","Missing T waves"],"a":2,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q12) / 9b. Cardiovascular Physiology 2026.pdf, slides 32, 56","img":[{"u":"img/w11_cv_phys/p32.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 32","w":1200,"h":900},{"u":"img/w11_cv_phys/p56.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 56","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nWhen ACh binds M₂ receptors, K-ACh channels open and the phase 4 slope flattens. SA node firing slows, and AV nodal delay lengthens. The **RR interval** is the time from one R wave to the next. When heart rate slows, the RR interval **lengthens**. (Heart rate = 60 / RR interval in seconds.)","why":{"0":"P waves represent atrial depolarization, so they still appear as long as the SA node fires, even slowly.","1":"ACh slows AV nodal conduction, so the PR interval tends to **increase**.","3":"The QT interval may lengthen slightly at slower heart rates, but the direct, characteristic finding of SA nodal M-receptor stimulation is a longer RR interval.","4":"T waves (ventricular repolarization) do not disappear."},"one":"ACh stimulation of M receptors in the SA node slows the heart rate, lengthening the RR interval on the EKG."},"w11_cv_phys-13":{"q":"James is a 58-yr-old with a history of cigarette smoking and two myocardial infarctions. A routine EKG shows that the mean electrical axis of his heart is shifted toward the left of normal. What does this indicate?","o":["A first degree conduction block","Right ventricular hypertrophy","Left ventricular hypertrophy","Ectopic pacemakers","Third degree heart block"],"a":2,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q13) / 9b. Cardiovascular Physiology 2026.pdf, slide 33","img":[{"u":"img/w11_cv_phys/p33.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 33","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nThe mean electrical axis is the overall direction of ventricular depolarization current. More current flows toward the **thicker** side of the myocardium, so the axis tilts that way. When the left ventricle hypertrophies, the axis shifts **to the left (left axis deviation)**. With his history of myocardial infarctions and smoking (risk factors for hypertension and coronary disease), it makes sense that the remaining left ventricular muscle has thickened under the greater load.","why":{"0":"First-degree block shows up as a prolonged PR interval and is unrelated to axis.","1":"Right ventricular hypertrophy shifts the axis to the **right**.","3":"Ectopic pacemakers produce beats from abnormal sites (premature beats, etc.), which is different from a sustained leftward shift of the mean axis.","4":"Third-degree block is complete dissociation of P waves and QRS complexes; axis deviation is not its key finding."},"one":"Left deviation of the mean electrical axis suggests left ventricular hypertrophy."},"w11_cv_phys-14":{"q":"What cardiac arrhythmia is best illustrated by the EKG tracing shown on the right?","o":["Tachycardia.","Atrial fibrillation","Bradycardia.","Ventricular fibrillation","Third degree heart block"],"a":3,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q14) / 9b. Cardiovascular Physiology 2026.pdf, slides 42, 46","img":[{"u":"img/w11_cv_phys/p42.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 42","w":1200,"h":900},{"u":"img/w11_cv_phys/p46.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 46","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nIn the tracing, **P waves, QRS complexes, and T waves cannot be distinguished at all**. There is only a continuous irregular waveform of varying size, shape, and spacing. That means the ventricular muscle is quivering chaotically without coordination, the classic picture of ventricular fibrillation. EKGs are interpreted from the shape and spacing of the waves.","why":{"0":"In tachycardia, uniform QRS complexes would repeat rapidly.","1":"In atrial fibrillation the baseline quivers in fine waves, but narrow **QRS complexes are still clearly visible** (only their spacing is irregular).","2":"Bradycardia is normally shaped waves appearing slowly.","4":"In third-degree block, P waves and QRS complexes each appear regularly but unrelated to each other; the waves themselves are recognizable."},"one":"An irregular waveform with no distinguishable P, QRS, or T waves is the classic EKG of ventricular fibrillation.","fig":{"u":"img/w11_cv_phys/fig_ekg.webp","cap":"EKG tracing (9a Study Q14–15)"}},"w11_cv_phys-15":{"q":"What physical finding would occur rapidly following initiation of the EKG pattern shown in question 14?","o":["A rapid, weak pulse","A seizure","A stroke","A sharp decline in blood pressure","Tachycardia"],"a":3,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q15) / 9b. Cardiovascular Physiology 2026.pdf, slide 42","img":[{"u":"img/w11_cv_phys/p42.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 42","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nIn ventricular fibrillation the ventricles cannot eject blood, so cardiac output (heart rate × stroke volume) effectively drops to zero and **blood pressure falls sharply**. No pulse can be felt, and consciousness is lost within seconds.","why":{"0":"In VF there is no ejection, so there is **no pulse** at all. A rapid, weak pulse is a finding in situations like hemorrhagic shock.","1":"Seizure-like movements can occur later from loss of cerebral blood flow, but the first and fastest key finding is the drop in blood pressure.","2":"Stroke is usually caused by a clot and is closer to a long-term complication of atrial fibrillation.","4":"Tachycardia is the name of an EKG rhythm, not a physical finding after VF; in VF there is no effective heartbeat at all."},"one":"Once ventricular fibrillation begins, there is no ejection and blood pressure falls sharply.","fig":{"u":"img/w11_cv_phys/fig_ekg.webp","cap":"EKG tracing (9a Study Q14–15)"}},"w11_cv_phys-16":{"q":"Which of the following is true about the cardiac cycle?","o":["High heart rates allow for increased EDV.","QRS complexes follow P waves on the EKG.","Increased cardiac contractility reduces cardiac output.","Stroke volume is independent of ventricular filling time.","Systolic pressure is highest in the right ventricle."],"a":1,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q16) / 9b. Cardiovascular Physiology 2026.pdf, slides 32, 49","img":[{"u":"img/w11_cv_phys/p32.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 32","w":1200,"h":900},{"u":"img/w11_cv_phys/p49.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 49","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nThe normal sequence is SA node firing → atrial depolarization (P wave) → AV nodal delay → ventricular depolarization (QRS) → ventricular repolarization (T wave). So **the QRS always follows the P wave**. Atrial contraction (after the P wave) first tops off the ventricles to fill the EDV, and then the ventricles contract (after the QRS).","why":{"0":"A fast heart rate shortens diastole (filling time), so EDV **decreases**.","2":"Increased contractility reduces ESV, so stroke volume and cardiac output **increase**.","3":"A longer filling time increases EDV, and by the Frank-Starling law stroke volume rises too, so they are not independent.","4":"Systolic pressure is highest in the **left ventricle** (about 120 vs 25 mmHg)."},"one":"In the cardiac cycle, the QRS complex always follows the P wave of atrial depolarization."},"w11_cv_phys-17":{"q":"Which cardiac arrhythmia is correctly matched with its effect on cardiac function?","o":["Atrial flutter: increased preload","Atrial fibrillation: increased afterload","Ventricular tachycardia: cardiac arrest","Mobitz 2 conduction block: increased cardiac output","Ventricular fibrillation: no pulse"],"a":4,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q17) / 9b. Cardiovascular Physiology 2026.pdf, slide 42","img":[{"u":"img/w11_cv_phys/p42.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 42","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nIn ventricular fibrillation the ventricles only quiver and eject nothing, so **there is no pulse**. This pairing is accurate, following the same principle as the VF questions above.","why":{"0":"In atrial flutter there is no effective atrial contraction and the fast rate shortens filling time, so preload (EDV) actually **decreases**.","1":"Afterload is set by arterial (aortic) pressure; atrial fibrillation does not increase afterload.","2":"Ventricular tachycardia **can** progress to cardiac arrest, but it doesn't always mean arrest, so it is not as definitive a match as E.","3":"Mobitz type II is a block in which some atrial impulses fail to reach the ventricles, so ventricular beats are dropped and cardiac output **decreases**."},"one":"Ventricular fibrillation produces no effective ejection, so there is no pulse."},"w11_cv_phys-18":{"q":"The normal response of baroreceptors to an abrupt increase in blood pressure is","o":["a decrease in sensitivity.","an increase in sensitivity.","an increase in firing rate.","a decrease in firing rate.","nothing since baroreceptors do not monitor blood pressure."],"a":2,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q18) / 9b. Cardiovascular Physiology 2026.pdf, slides 62, 63","img":[{"u":"img/w11_cv_phys/p62.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 62","w":1200,"h":900},{"u":"img/w11_cv_phys/p63.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 63","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nThe high-pressure baroreceptors in the carotid sinus and aortic arch are **stretch receptors**. When blood pressure rises, the vessel wall stretches more and their **firing rate increases**. Signals go to the nucleus tractus solitarius (NTS) in the medulla. Sympathetic activity then falls and parasympathetic activity rises, lowering heart rate and vascular resistance and bringing blood pressure back down.","why":{"0":"\"Sensitivity\" refers to the receptor's reference point (set point) itself. The immediate response to an abrupt pressure change is a change in firing rate, not sensitivity. (In chronic hypertension the set point is reset, but that is a different situation.)","1":"\"Sensitivity\" refers to the receptor's reference point (set point) itself. The immediate response to an abrupt pressure change is a change in firing rate, not sensitivity. (In chronic hypertension the set point is reset, but that is a different situation.)","3":"A decreased firing rate is the response when blood pressure **falls**.","4":"Baroreceptors are precisely the receptors that monitor blood pressure (mean arterial pressure)."},"one":"When blood pressure rises abruptly, baroreceptor (stretch receptor) firing rate increases."},"w11_cv_phys-19":{"q":"Which of the following contributes to the regulation of mean arterial blood pressure?","o":["Baroreceptor firing rate.","Activation of RAAS.","Effects of aldosterone.","Changes in TPR.","All of the above."],"a":4,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q19) / 9b. Cardiovascular Physiology 2026.pdf, slides 61, 65","img":[{"u":"img/w11_cv_phys/p61.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 61","w":1200,"h":900},{"u":"img/w11_cv_phys/p65.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 65","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\n· A, baroreceptor firing rate: handles **short-term** regulation over seconds.\n\n· B, RAAS activation, and C, aldosterone: **long-term** regulation by controlling water and Na⁺ lost in the urine. Aldosterone increases Na⁺ reabsorption in the kidney, expanding blood volume.\n\n· D, TPR: since mean arterial pressure ≈ cardiac output × total peripheral resistance, TPR directly determines arterial pressure.\n\nAll four contribute to regulating mean arterial pressure, so the answer is **E (all of the above)**.","why":{"0":"Baroreceptor firing contributes to short-term regulation over seconds, but by itself it is incomplete; RAAS, aldosterone, and TPR also regulate mean arterial pressure, so the answer is E.","1":"RAAS activation contributes to long-term regulation, but baroreceptors, aldosterone, and TPR are also involved, so the answer is E.","2":"Aldosterone is a long-term regulator that increases renal Na⁺ reabsorption and blood volume, but choosing it alone is incomplete; the answer is E.","3":"TPR contributes directly because mean arterial pressure ≈ cardiac output × TPR, but the other mechanisms also contribute, so the answer is E."},"one":"Baroreceptor firing, RAAS and aldosterone, and changes in TPR all contribute to regulating mean arterial pressure."},"w11_cv_phys-20":{"q":"Which mechanism in the regulation of blood pressure has the potential to be the most effective over time?","o":["Stress relaxation.","Vasomotor changes.","Altered cardiac output.","Renal handling of salt and water.","Autonomic responses."],"a":3,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q20) / 9b. Cardiovascular Physiology 2026.pdf, slide 65","img":[{"u":"img/w11_cv_phys/p65.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 65","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nLong-term regulation of mean arterial pressure is achieved by controlling the loss of water and Na⁺ in the urine, through the actions of the RAA system, arginine vasopressin, and atrial natriuretic peptide. The kidneys keep adjusting salt and water excretion until blood pressure returns to normal, so given enough time they have an essentially unlimited capacity to restore normal pressure.","why":{"0":"Stress relaxation is a vessel gradually relaxing its tension after being stretched, lowering pressure; its effect is limited and temporary.","1":"Vasomotor changes are **short-term** regulation over seconds to minutes. They are fast, but baroreceptors reset within days, so their effect fades over the long term.","2":"Changes in cardiac output are **short-term** regulation over seconds to minutes. They are fast, but baroreceptors reset within days, so their effect fades over the long term.","4":"Autonomic responses are **short-term** regulation over seconds to minutes. They are fast, but baroreceptors reset within days, so their effect fades over the long term."},"one":"Over time, the most effective blood pressure regulation is renal handling of salt and water."},"w11_cv_phys-21":{"q":"Cardiac glycosides inhibit Na+- K+ ATPase in cardiac myocytes. How does this affect cardiac function?","o":["It decreases cardiac contractility.","It increases cardiac contractility.","It slows spontaneous depolarization of the S-A node.","It reduces blood flow through coronary arteries.","It increases blood flow through coronary arteries."],"a":1,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q21) / 9b. Cardiovascular Physiology 2026.pdf, slide 48","img":[{"u":"img/w11_cv_phys/p48.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 48","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nIt's easiest to follow as a chain reaction:\n\n① A cardiac glycoside such as digoxin inhibits the Na⁺-K⁺ ATPase.\n\n② Na⁺ builds up inside the cell.\n\n③ The Na⁺ gradient across the membrane shrinks, so the Na⁺-Ca²⁺ exchanger cannot remove Ca²⁺ as well (\"indirectly inhibiting Na⁺-Ca²⁺ exchange\").\n\n④ Intracellular Ca²⁺ rises and more is stored in the sarcoplasmic reticulum (SR).\n\n⑤ More Ca²⁺ is released with the next contraction, so **contractility increases**.","why":{"0":"The opposite: cardiac glycosides are inotropes used to treat heart failure.","2":"Digoxin does have an additional vagal effect that slows AV nodal conduction, but the key effect of Na⁺-K⁺ ATPase inhibition asked about here is increased contractility.","3":"These drugs do not directly regulate coronary blood flow; coronary vessel dilators are a separate class.","4":"These drugs do not directly regulate coronary blood flow; coronary vessel dilators are a separate class."},"one":"Inhibition of the Na⁺-K⁺ ATPase by cardiac glycosides raises intracellular Ca²⁺ and increases cardiac contractility."},"w11_cv_phys-22":{"q":"What receptor is stimulated by adrenergic agents in the heart?","o":["α1","α2","β1","β2","M1."],"a":2,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q22) / 9b. Cardiovascular Physiology 2026.pdf, slides 56, 64","img":[{"u":"img/w11_cv_phys/p56.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 56","w":1200,"h":900},{"u":"img/w11_cv_phys/p64.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 64","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Why this is correct**\n\nSympathetic effects are produced by stimulation of **β₁ receptors in the heart** and α₁ and β₂ receptors in blood vessels. β₁ stimulation in the heart increases heart rate (steeper phase 4), contractility (phosphorylation of L-type Ca²⁺ channels), and conduction velocity. Memory aid: you have one heart → β**1**; two lungs → β**2**.","why":{"0":"α₁ acts mainly on **vascular** smooth muscle, causing constriction (e.g., skin and renal vessels).","1":"α₂ is mainly a presynaptic inhibitory receptor on nerve terminals.","3":"β₂ acts on **blood vessels** (dilating skeletal muscle arterioles) and relaxes bronchial smooth muscle.","4":"M receptors are **cholinergic (ACh)** receptors, not adrenergic, and the subtype in the heart is M₂, not M₁."},"one":"The receptor stimulated by adrenergic agents in the heart is β₁."},"w11_cv_phys-23":{"q":"Which of the following events in the cardiac cycle correctly corresponds to time points in the pressure tracing shown below?","o":["Isovolumetric contraction occurs between B and C.","Aortic valve closes at C.","Isovolumetric relaxation occurs between B and C.","Aortic valve closes at B.","Mitral valve closes at E."],"a":0,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q23) / 9b. Cardiovascular Physiology 2026.pdf, slides 49, 51","img":[{"u":"img/w11_cv_phys/p49.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 49","w":1200,"h":900},{"u":"img/w11_cv_phys/p51.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 51","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"exp":"**Reading the figure**\n\n· A: the small hump from atrial contraction (a wave)\n\n· **B**: ventricular pressure rises above atrial pressure → **AV (mitral) valve closes**, S1\n\n· **C**: ventricular pressure rises above aortic pressure → **aortic valve opens**, ejection begins\n\n· D: peak ventricular pressure\n\n· **E**: ventricular pressure falls below aortic pressure → **aortic valve closes**, S2 (the dicrotic notch on the aortic curve)\n\n· **F**: ventricular pressure falls below atrial pressure → **mitral valve opens**, filling begins\n\n**Why this is correct**\n\nFrom B (mitral closure) to C (aortic opening), **all valves are closed** and only ventricular pressure rises steeply. This is isovolumetric contraction.","why":{"1":"The aortic valve **opens** at C.","2":"Isovolumetric relaxation occurs between E (aortic valve closure) and F (mitral valve opening).","3":"The valve that closes at B is the mitral valve, not the aortic valve.","4":"The valve that closes at E is the aortic valve; the mitral valve closes at B and opens at F."},"one":"Isovolumetric contraction occurs between B, where the mitral valve closes, and C, where the aortic valve opens.","fig":{"u":"img/w11_cv_phys/fig_pressure.webp","cap":"Cardiac cycle pressure tracing (9a Study Q23)"}},"w11_cv_phys-24":{"q":"Which of the following has the greatest effect on blood flow through arterioles?","o":["The pressure gradient between the right and left ventricles.","The contractility of the ventricles.","Venous return.","The viscosity of the blood.","The diameter of the arterioles."],"a":4,"src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q24) / 9b. Cardiovascular Physiology 2026.pdf, slides 5, 8","img":[{"u":"img/w11_cv_phys/p05.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 5","w":1200,"h":900},{"u":"img/w11_cv_phys/p08.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 8","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,
