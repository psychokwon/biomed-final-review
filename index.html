 layers: external, internal, and innermost intercostals."},"w11_thorax-9":{"q":"Transversus thoracis muscles, seen on the interior of the anterior thoracic wall, are part of the:","o":["External intercostal layer","Innermost intercostals","Diaphragm","Pectoralis minor","External intercostal membrane only"],"a":1,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 15","img":[{"u":"img/w11_thorax/p15.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 15","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"The **transversus thoracis** is part of the **innermost intercostals**. It is seen on the **interior of the anterior thoracic wall**, shown as muscle slips running obliquely upward and laterally from the inner surface of the sternum and costal cartilages.\n\nThe same innermost layer also includes the **subcostal muscles** posteriorly. Don't confuse the transversus thoracis with the diaphragm (below) or the pectoralis minor (outside, on the front of the chest).","why":{"0":"The external intercostals are the most superficial layer and do not include the transversus thoracis.","2":"The diaphragm is the muscle covering the inferior thoracic aperture, not the transversus thoracis.","3":"The pectoralis minor is a pectoral girdle muscle on the outside of the anterior chest.","4":"The external intercostal membrane is the membranous continuation of the outer layer, not the transversus thoracis."},"one":"The transversus thoracis is part of the innermost intercostals on the inside of the anterior chest wall."},"w11_thorax-10":{"q":"Subcostal muscles, also part of the innermost intercostals, are distinguished because they:","o":["Attach only to the sternum and costal cartilages","Occupy a single intercostal space on the anterior wall","Are found exclusively in the cervical region","Cross 2 or 3 intercostal spaces","Insert on the clavicle and the first rib"],"a":3,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 16","img":[{"u":"img/w11_thorax/p16.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 16","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"The **subcostal muscles** are part of the **innermost intercostals** and are distinguished because they **cross 2 or 3 intercostal spaces**.\n\nThey lie on the inner surface of the posterior thoracic wall near the vertebrae and take a longer course than ordinary intercostals, which span only one space. Attachment to the sternum describes the transversus thoracis, and attachment to the clavicle and first rib describes muscles such as the scalenes.","why":{"0":"Lying on the inner surface of the sternum and costal cartilages describes the transversus thoracis.","1":"The subcostals cross 2–3 spaces, not one, and lie mainly posteriorly.","2":"The subcostals are in the thoracic wall near the vertebrae, not in the neck.","4":"Attachment to the clavicle and first rib is a feature of the scalenes and similar muscles."},"one":"The subcostals are part of the innermost layer and cross 2–3 intercostal spaces."},"w11_thorax-11":{"q":"A preganglionic sympathetic fiber that passes through the sympathetic chain without synapsing, then synapses outside the chain, travels in a:","o":["White ramus that ends in the same-level ganglion only","Gray ramus communicans to a spinal nerve","Splanchnic nerve that synapses outside the chain","Phrenic nerve supplying the diaphragm","Recurrent laryngeal branch of the vagus"],"a":2,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 19","img":[{"u":"img/w11_thorax/p18.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 18","w":1200,"h":900},{"u":"img/w11_thorax/p19.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 19","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"There are **four** possible routes for preganglionic and postganglionic sympathetic fibers: ① synapse at the same level; ② ascend in the trunk and synapse at a higher level; ③ descend in the trunk and synapse at a lower level; ④ **pass through the trunk without synapsing (as a splanchnic nerve)** and **synapse outside the sympathetic trunk**.\n\nThe figure labels the white ramus communicans, gray ramus communicans, and abdominopelvic splanchnic nerves, among others. The intercostal nerve is an anterior ramus, and the rami communicantes (singular: ramus communicans) connect it to the sympathetic trunk.","why":{"0":"Synapsing in the ganglion at the same level is the first of the four routes, not the splanchnic route that passes through and synapses outside the trunk.","1":"The gray ramus communicans is usually the route by which postganglionic fibers return to the spinal nerve.","3":"The phrenic nerve mainly carries somatic motor and sensory fibers for the diaphragm.","4":"The recurrent laryngeal nerve is a branch of the vagus, not the name of one of these four sympathetic routes."},"one":"A preganglionic fiber that passes through the sympathetic trunk without synapsing and synapses outside it travels in a splanchnic nerve."},"w11_thorax-12":{"q":"A potential collateral pathway in the thoracic wall is the anastomosis between the:","o":["Pulmonary trunk and the bronchial arterial branches","Azygos vein and the thoracic duct","Phrenic and vagus nerves","Left and right pulmonary veins only","Posterior and anterior intercostal arteries"],"a":4,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 14, 17, 21, 23","img":[{"u":"img/w11_thorax/p14.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 14","w":1200,"h":900},{"u":"img/w11_thorax/p17.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 17","w":1200,"h":900},{"u":"img/w11_thorax/p21.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 21","w":1200,"h":900},{"u":"img/w11_thorax/p23.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 23","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"A transverse section of the thoracic wall explicitly labels the **anastomosis between the posterior and anterior intercostal arteries (site of anastomosis / potential collateral pathway)**.\n\nThe posterior intercostal arteries come mainly from the thoracic aorta, and the anterior intercostal arteries from the **internal thoracic artery**. Because the two connect within the intercostal space, blood can bypass to the chest wall even if one proximal source narrows or is blocked.\n\nThe anterior intercostal, musculophrenic, and superior epigastric arteries are branches and terminations of the internal thoracic artery.","why":{"0":"The relationship between the pulmonary trunk and bronchial arteries belongs to the lung circulation, not the anastomosis labeled as a chest-wall collateral.","1":"The azygos vein is venous drainage and the thoracic duct a lymphatic channel; neither is this arterial anastomosis.","2":"The phrenic and vagus nerves are nerves, not an arterial collateral pathway.","3":"The pulmonary veins carry blood from the lungs to the left atrium and are not an intercostal arterial anastomosis of the chest wall."},"one":"The anastomosis between the posterior and anterior intercostal arteries is a potential collateral pathway in the thoracic wall."},"w11_thorax-13":{"q":"The internal thoracic artery terminates by dividing into the:","o":["Posterior intercostal arteries and the subclavian artery","Musculophrenic and superior epigastric arteries","Azygos and hemiazygos veins","Bronchial and pulmonary arteries","Lateral and anterior cutaneous nerves"],"a":1,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 23","img":[{"u":"img/w11_thorax/p23.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 23","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"The **internal thoracic artery** descends from the subclavian artery along the edge of the sternum and gives off the **anterior intercostal arteries**. Inferiorly it ends by dividing into the **musculophrenic artery** and the **superior epigastric artery**.\n\nThe musculophrenic artery follows the costal margin, and the superior epigastric artery continues down into the abdomen. The posterior intercostal arteries arise mainly from the aorta, so they are not terminal branches of the internal thoracic artery.","why":{"0":"The subclavian artery is the origin of the internal thoracic artery, and the posterior intercostal arteries usually come from the aorta.","2":"The azygos and hemiazygos are veins, not terminations of the internal thoracic artery.","3":"The bronchial and pulmonary arteries are lung vessels, not terminations of the internal thoracic artery.","4":"The anterior and lateral cutaneous nerves are branches of the intercostal nerves, not arterial branches."},"one":"The internal thoracic artery gives anterior intercostal branches and ends as the musculophrenic and superior epigastric arteries."},"w11_thorax-14":{"q":"Posterior intercostal veins drain to the:","o":["Azygos venous system","Internal thoracic veins only","Pulmonary veins","Portal vein","Inferior vena cava at T8 only"],"a":0,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 24","img":[{"u":"img/w11_thorax/p24.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 24","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"The **posterior intercostal veins** drain into the **azygos venous system**. The figure shows the **azygos vein** on the right entering the superior vena cava, and the **accessory hemiazygos** and **hemiazygos veins** on the left.\n\nThe azygos system is an important collateral route connecting the posterior chest wall and some retroperitoneal structures to the superior vena cava. Distinguish it from drainage into the pulmonary veins, portal vein, or internal thoracic veins alone.","why":{"1":"The internal thoracic veins drain the anterior chest wall; the main route given for the posterior intercostal veins is the azygos system.","2":"The pulmonary veins return gas-exchanged blood from the lungs to the left atrium.","3":"The portal vein carries blood from the digestive tract to the liver.","4":"It is true that the IVC crosses the diaphragm at T8, but the drainage destination given for the posterior intercostal veins is the azygos system."},"one":"Posterior intercostal veins drain into the azygos system (azygos, hemiazygos, accessory hemiazygos)."},"w11_thorax-15":{"q":"In the costal groove, the intercostal neurovascular structures are arranged from superior to inferior as:","o":["Nerve, artery, vein","Artery, nerve, vein","Vein, nerve, artery","Vein, artery, nerve","Artery, vein, nerve"],"a":3,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 25, 18, 20, 22","img":[{"u":"img/w11_thorax/p25.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 25","w":1200,"h":900},{"u":"img/w11_thorax/p18.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 18","w":1200,"h":900},{"u":"img/w11_thorax/p20.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 20","w":1200,"h":900},{"u":"img/w11_thorax/p22.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 22","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"In the costal groove, the neurovascular bundle is arranged from top to bottom as **vein–artery–nerve (VAN)**. The figure shows a blue vein, red artery, and yellow nerve in that order.\n\nThe nerve lies lowest and is therefore most exposed at the lower border of the rib. That is why a thoracentesis needle is inserted over the **upper border** of the rib below, avoiding the VAN in the groove. The intercostal nerve is the **anterior ramus** of a thoracic spinal nerve.\n\nThe intercostal nerves give off **anterior and lateral cutaneous branches** that supply the skin of the chest wall.","why":{"0":"The nerve is not on top; the correct order is vein–artery–nerve.","1":"The artery is not on top, and the nerve is not in the middle.","2":"The vein being on top is right, but the artery is in the middle and the nerve is lowest.","4":"Artery–vein–nerve is not the correct VAN order."},"one":"In the costal groove, from top down: vein–artery–nerve (VAN)."},"w11_thorax-16":{"q":"The boundaries of the superior thoracic aperture include the:","o":["Sternum, first rib, and first thoracic vertebra","Xiphisternal joint, the twelfth ribs, and vertebra T12","Sternal angle, second rib, and T4","Costal margin, xiphoid, and T10","Clavicle, scapula, and C7 vertebra"],"a":0,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 26","img":[{"u":"img/w11_thorax/p26.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 26","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"The boundaries of the **superior thoracic aperture** are the **sternum**, the **first rib**, and the **first thoracic vertebra (T1)**. The arrows in the figure point to these bony boundaries.\n\nThe xiphisternal joint, the twelfth ribs, and T12 are boundaries of the **inferior thoracic aperture**. The sternal angle and T4 may be important landmarks, but they are not given as bony boundaries of the superior aperture.","why":{"1":"These are the boundaries of the inferior thoracic aperture.","2":"The sternal angle, second rib, and T4 are not given as boundaries of the superior aperture.","3":"The costal margin and xiphoid are closer to the boundaries of the inferior aperture.","4":"The clavicle, scapula, and C7 are not listed as the three boundaries of the superior aperture."},"one":"The superior thoracic aperture is bounded by the sternum, first rib, and T1."},"w11_thorax-17":{"q":"Structures that pass through the superior thoracic aperture include the:","o":["Inferior vena cava at T8, abdominal aorta at T12, both kidneys, adrenal glands, lumbar trunks, and spleen","Thoracic aorta behind the diaphragm at T12, the cisterna chyli, both kidneys, and ureters","Kidneys, adrenal glands, lumbar plexus, and the lower rectum only","Trachea, esophagus, aortic branches, brachiocephalic veins, phrenic and vagus nerves, and thoracic duct","Esophagus at the T10 hiatus, the IVC at T8, the aorta at T12, and the spleen"],"a":3,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 27","img":[{"u":"img/w11_thorax/p27.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 27","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"The **contents** of the superior thoracic aperture are the **trachea**, **esophagus**, **branches from the aorta**, **brachiocephalic veins**, **phrenic and vagus nerves**, and **thoracic duct**.\n\nIn the figure, a dashed line marks the plane of the superior aperture. The IVC (T8), the esophageal hiatus (T10), and the aorta passing behind the diaphragm at T12 are levels for crossing the inferior aperture and diaphragm.","why":{"0":"The IVC crossing the diaphragm at T8 belongs to the inferior aperture.","1":"The aorta passing behind the diaphragm at T12 is likewise an inferior passage.","2":"The kidneys and adrenal glands are retroperitoneal structures, not contents of the superior aperture.","4":"The esophagus does pass through the superior aperture too, but the T10 hiatus alone cannot describe the contents of the superior aperture."},"one":"The trachea, esophagus, aortic branches, brachiocephalic veins, phrenic and vagus nerves, and thoracic duct pass through the superior thoracic aperture."},"w11_thorax-18":{"q":"Boundaries of the inferior thoracic aperture include the:","o":["Sternum, first rib, and the first thoracic vertebra","Clavicles, the manubrium, and also the seventh cervical vertebra","Sternal angle together with the second ribs only","T12, twelfth ribs, costal cartilages, and xiphisternal joint","Scapulae, clavicles, and the first ribs only"],"a":3,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 29","img":[{"u":"img/w11_thorax/p28.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 28","w":1200,"h":900},{"u":"img/w11_thorax/p29.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 29","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"The boundaries of the **inferior thoracic aperture** are the **T12 vertebra**, the **twelfth ribs**, the **costal cartilages**, and the **xiphisternal joint**. The boxes and arrows in the figure point to these lower boundaries.\n\nThe sternum, first rib, and T1 bound the superior aperture. The inferior aperture is **covered by the diaphragm**, and major structures pass through it at specific levels.","why":{"0":"The sternum, first rib, and T1 are the boundaries of the superior aperture.","1":"The clavicles and C7 are not given as boundaries of the inferior aperture.","2":"The sternal angle and second ribs are not the complete boundary of the inferior aperture.","4":"The scapulae and clavicles are not boundaries of the inferior aperture."},"one":"The inferior thoracic aperture is bounded by T12, the twelfth ribs, the costal cartilages, and the xiphisternal joint."},"w11_thorax-19":{"q":"The inferior vena cava passes through the diaphragm at which vertebral level?","o":["T6","T10","T12","C7","T8"],"a":4,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 30","img":[{"u":"img/w11_thorax/p30.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 30","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"The inferior thoracic aperture is **covered by the diaphragm**. The major passage levels are: the **inferior vena cava (IVC)** passes through the diaphragm at **T8**, the **esophagus** at **T10**, and the **aorta passes behind** the diaphragm at **T12**.\n\nA common mnemonic is I-8, E-10, A-12. The phrase \"passes behind\" emphasizes that the aortic hiatus lies between and behind the crura of the diaphragm. The figure viewed from above marks these passages with arrows.","why":{"0":"T6 is not given as the level at which the IVC crosses the diaphragm.","1":"T10 is the level at which the esophagus passes through the diaphragm.","2":"T12 is the level at which the aorta passes behind the diaphragm.","3":"C7 is not a passage level of the inferior aperture."},"one":"Diaphragm crossings: IVC at T8, esophagus at T10, aorta behind it at T12."},"w11_thorax-20":{"q":"“Bucket-handle” movements of the ribs during inspiration primarily increase the thorax’s:","o":["Vertical diameter only","Tracheal length","Transverse diameter","Peritoneal volume","Tension in the vocal ligaments"],"a":2,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 31","img":[{"u":"img/w11_thorax/p31.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 31","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"During inspiration, the diaphragm descends to increase the **vertical diameter**, and the intercostal muscles increase the **transverse** and **anteroposterior diameters**, so thoracic volume rises.\n\nThe **bucket-handle** movement of the ribs mainly increases the **transverse diameter**, while the **pump-handle** movement at the sternocostal joints increases the **anteroposterior diameter**.\n\nDuring expiration, the diaphragm and intercostals relax, thoracic volume decreases and intrathoracic pressure rises, aided by the elastic recoil of the lungs.","why":{"0":"The increase in vertical diameter is due mainly to descent of the diaphragm.","1":"The main effect of the bucket-handle movement is on the transverse diameter of the thorax, not the length of the trachea.","3":"Peritoneal volume is not the primary target of this rib movement.","4":"Vocal ligament tension relates to phonation and is not an effect of the bucket-handle movement."},"one":"Bucket-handle movement increases the transverse diameter; pump-handle movement increases the anteroposterior diameter."},"w11_thorax-21":{"q":"Which of the following is a named region of parietal pleura?","o":["Visceral pleura over the oblique fissure","Cervical pleura","Mesothelium of the pulmonary ligament at the hilum of the liver","Endothoracic fascia of the abdomen","Adventitia of the trachea"],"a":1,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 34","img":[{"u":"img/w11_thorax/p32.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 32","w":1200,"h":900},{"u":"img/w11_thorax/p33.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 33","w":1200,"h":900},{"u":"img/w11_thorax/p34.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 34","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"The pleura forms the pleural cavity and covers the lungs. The **parietal pleura** lines the chest wall side and the **visceral pleura** covers the lung surface, with the **pleural cavity** between them. The visceral pleura appears as a thin mesothelium on the lung surface.\n\nThe regions of the parietal pleura are the **costal**, **diaphragmatic**, **cervical**, and **mediastinal** pleura. In the figure, the upper arrow points to the cervical pleura above the lung apex, the lateral one to the costal pleura, the lower one to the diaphragmatic pleura, and the medial one to the mediastinal pleura.","why":{"0":"What covers the oblique fissure is visceral pleura, which is not a named region of parietal pleura.","2":"The pulmonary ligament relates to the pleural fold around the lung hilum, not a structure at the hilum of the liver.","3":"Endothoracic fascia is not the name of a region of parietal pleura.","4":"The adventitia of the trachea is the outer layer of the airway, not a region of parietal pleura."},"one":"The regions of the parietal pleura are costal, diaphragmatic, cervical, and mediastinal."},"w11_thorax-22":{"q":"Pleural recesses, seen where pleural reflections extend beyond the lungs, represent:","o":["Fused visceral pleura lying between the lobes of each lung surface","The pericardial cavity that surrounds the heart","Air-filled extensions continuous with the nasal cavity","Pleural-cavity regions the lungs do not fill, especially below","Direct openings of bronchi into the pleural space"],"a":3,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 35","img":[{"u":"img/w11_thorax/p35.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 35","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"In the figure of **pleural reflections and recesses**, the **pleural outline extends below** the lower edge of the lung. These empty spaces are **recesses** of the pleural cavity that the lungs do not completely fill, especially prominent inferiorly.\n\nDuring inspiration the lung edges can descend further into these recesses, and they are also places where pleural effusion fluid tends to collect. This is a different concept from the visceral pleura between lobes, the pericardial cavity, the nasal cavity, or bronchial openings.","why":{"0":"The visceral pleura can dip between lobes along the fissures, but the recesses are parts of the pleural cavity that the lungs do not fill.","1":"The pericardial cavity surrounds the heart and is different from the pleural recesses.","2":"The nasal cavity and sinuses are air spaces in the head.","4":"Bronchi open into the lung, not directly into the pleural space."},"one":"Pleural recesses are parts of the pleural cavity not completely filled by the lungs, extending especially below the lungs."},"w11_thorax-23":{"q":"Which statement about the lungs is correct?","o":["A middle lobe and a lingula present in both lungs","Middle lobe right only; lingula and cardiac notch left only","A transverse fissure present only in the left lung","Oblique fissures present only in the right lung","Three lobes on the left lung and only two lobes on the right lung"],"a":1,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 36","img":[{"u":"img/w11_thorax/p36.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 36","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"The lungs have **apices (singular: apex)**, **upper lobes**, and **lower lobes**. A **middle lobe** is present **only in the right lung**, and the **lingula** **only in the left lung**. **Oblique fissures** are present on both sides, and the **transverse fissure** is on the right (separating the middle lobe from the upper lobe). The **cardiac notch** is on the left.\n\nIn summary, the right lung has 3 lobes (upper, middle, lower) with oblique and transverse fissures; the left lung has 2 lobes (upper, lower) with an oblique fissure, the lingula, and the cardiac notch.","why":{"0":"The middle lobe is only on the right and the lingula only on the left.","2":"The transverse fissure is in the right lung.","3":"Oblique fissures are present in both lungs.","4":"The lobe counts are reversed: the right has 3 lobes and the left has 2."},"one":"The middle lobe and transverse fissure are right-only, the lingula and cardiac notch left-only, and oblique fissures are on both sides."},"w11_thorax-24":{"q":"Mediastinal relations listed for the left lung, but not for the right lung, include the:","o":["Superior vena cava and azygos vein","Right brachiocephalic vein only","Inferior vena cava on the diaphragmatic surface only","Middle-lobe pulmonary veins","Aorta and left subclavian artery"],"a":4,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 37, 38","img":[{"u":"img/w11_thorax/p37.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 37","w":1200,"h":900},{"u":"img/w11_thorax/p38.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 38","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"The mediastinal relations of the right lung are the **superior vena cava**, **azygos vein**, **heart**, and **trachea and esophagus**. Those of the left lung are the **aorta**, **trachea and esophagus**, **left subclavian artery**, and **heart**.\n\nThe heart and the trachea/esophagus are shared by both. The **aorta and left subclavian artery** are listed only for the left lung, and the **SVC and azygos vein** only for the right. On the mediastinal surfaces, the left lung bears an aortic impression and the right lung impressions of the azygos vein and SVC.","why":{"0":"The superior vena cava and azygos vein are relations of the right lung.","1":"The right brachiocephalic vein is not listed as a relation of the left lung.","2":"The inferior vena cava is not on the list of left lung relations.","3":"The middle lobe exists only in the right lung, so middle-lobe veins are not a relation of the left lung."},"one":"Left lung mediastinal relations feature the aorta and left subclavian artery; right lung relations feature the SVC and azygos vein."},"w11_thorax-25":{"q":"Compared with the left primary bronchus, the right primary bronchus is:","o":["More vertical, larger in diameter, and shorter","More horizontal, smaller in diameter, and longer","More vertical, smaller in diameter, and longer","More horizontal, larger in diameter, and shorter","Identical in orientation, caliber, and length"],"a":0,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 40","img":[{"u":"img/w11_thorax/p39.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 39","w":1200,"h":900},{"u":"img/w11_thorax/p40.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 40","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"In the tracheobronchial tree, the **right primary bronchus** is **more vertical**, **larger in diameter**, and **shorter** than the left. The figure emphasizes that the right main bronchus is steeper and shorter than the left.\n\nBecause of this anatomy, aspirated foreign bodies tend to enter the right main bronchus. From the larynx (thyroid cartilage, cricothyroid ligament, cricoid cartilage), the airway continues through the tracheal cartilages to the right and left main bronchi.","why":{"1":"Saying the right is more horizontal, narrower, and longer is the reverse.","2":"More vertical is correct, but the right is wider and shorter, not narrower and longer.","3":"The right is more vertical, not more horizontal.","4":"The right and left main bronchi do not have the same orientation, caliber, and length."},"one":"The right primary bronchus is more vertical, wider, and shorter."},"w11_thorax-26":{"q":"Lobar bronchi are _____ bronchi, and segmental bronchi are _____ bronchi.","o":["primary; secondary","tertiary; primary","secondary (2°); tertiary (3°)","tertiary (3°); secondary (2°)","primary; tertiary"],"a":2,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 41","img":[{"u":"img/w11_thorax/p41.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 41","w":1200,"h":900},{"u":"img/w11_thorax/p42.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 42","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"In the tracheobronchial tree, **lobar bronchi are secondary (2°) bronchi**, and **segmental bronchi are tertiary (3°) bronchi**. The primary bronchi are the right and left main bronchi.\n\nThe arrows in the figure point to colored segmental bronchial branches, and the following lung segment figure uses color to show the segment supplied by each segmental bronchus. These segments are the units of lung that can be separated and removed surgically.","why":{"0":"Lobar bronchi are secondary, not primary, and segmental bronchi are tertiary, not secondary.","1":"Segmental bronchi are indeed tertiary, but calling lobar bronchi primary is wrong.","3":"The orders of lobar and segmental bronchi are swapped.","4":"The primary bronchi are the main bronchi, and lobar bronchi are secondary, not tertiary."},"one":"Lobar bronchi are secondary (2°) and segmental bronchi tertiary (3°)."},"w11_thorax-27":{"q":"The pulmonary trunk divides into pulmonary arteries that:","o":["Oxygenated blood from the left ventricle out to the alveoli","Carry blood from the right heart to the lungs for gas exchange","Provide the sole nutrient supply to the bronchial walls","Drain lymph from hilar nodes into the thoracic duct","Bronchial arterial blood returned directly into the right atrium itself"],"a":1,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 43","img":[{"u":"img/w11_thorax/p43.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 43","w":1200,"h":900},{"u":"img/w11_thorax/p45.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 45","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"The **pulmonary circulation vessels** of the lung are the **pulmonary trunk**, **pulmonary arteries**, and **pulmonary veins**. The pulmonary trunk leaves the right ventricle and divides into the right and left pulmonary arteries, sending blood from the right heart to the lungs for gas exchange. The pulmonary veins leave the lungs and return to the left atrium.\n\nIn the Netter figure, the arteries are shown arising from the trunk and the veins heading toward the left atrium. Nutrient supply to the bronchial walls is mainly the job of the bronchial arteries arising from the aorta.","why":{"0":"Oxygenated blood from the left ventricle leaves through the aorta; it is not the flow in the pulmonary arteries.","2":"Nutrient blood to the bronchial walls is supplied mainly by the bronchial arteries.","3":"The pulmonary arteries are blood vessels, not lymphatic channels.","4":"The pulmonary veins return to the left atrium and do not send bronchial arterial blood directly to the right atrium."},"one":"The pulmonary trunk sends right-ventricular blood into the pulmonary arteries for gas exchange in the lungs."},"w11_thorax-28":{"q":"Bronchial arteries, shown arising from the descending aorta near the bronchi, provide:","o":["The entire venous drainage of the alveolar capillary bed","Outflow of the right ventricle through the pulmonary trunk itself","Lymphatic drainage from the visceral pleura to the hilum","The only arterial blood supply of the entire diaphragm","Systemic arterial blood to the airways and supporting lung tissue"],"a":4,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 44","img":[{"u":"img/w11_thorax/p44.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 44","w":1200,"h":900},{"u":"img/w11_thorax/p45.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 45","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"The **bronchial arteries** are shown in the figure as small branches arising near the **descending thoracic aorta** and heading to the bronchi. They bring **systemic arterial blood** to nourish the airway walls and the supporting tissue of the lung.\n\nThe large volume of blood for gas exchange is carried by the pulmonary arteries; the bronchial arteries are a separate nutrient circulation. Venous drainage of the alveolar capillaries is via the pulmonary veins, and the arterial supply of the diaphragm comes mainly from other systemic branches (e.g., the inferior phrenic and musculophrenic arteries).","why":{"0":"Venous drainage of the alveolar capillaries is handled by the pulmonary veins.","1":"Right ventricular outflow is the pulmonary trunk and pulmonary arteries.","2":"Bronchial arteries supply arterial blood; they are not a lymphatic drainage route.","3":"They are not described as the only arterial supply of the diaphragm; the branches in the figure go to the bronchi."},"one":"Bronchial arteries arise from the aorta and supply systemic arterial blood to the airways and supporting lung tissue."},"w11_thorax-29":{"q":"From the pulmonary hilum toward the trachea, the lymph node groups include:","o":["Deep cervical (scalene) nodes only","Cisterna chyli together with the lumbar nodes and the celiac nodes","Bronchopulmonary, tracheobronchial, and paratracheal nodes","Axillary, parasternal, and inguinal nodes","Intramammary and intercostal nodes only"],"a":2,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 46","img":[{"u":"img/w11_thorax/p46.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 46","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"The lymph nodes of the lung are given as the **bronchopulmonary nodes**, **tracheobronchial nodes**, and **paratracheal nodes**. The boxes in the figure highlight, in turn, the nodes beside the trachea (paratracheal), at the tracheal bifurcation (tracheobronchial), and at the hilum (bronchopulmonary).\n\nLymph generally flows from the hilum up to the subcarinal and paratracheal nodes. Axillary, inguinal, and celiac nodes are not major stations on this pulmonary route.","why":{"0":"The deep cervical (scalene) nodes may be related nodes higher up, but they are not the three groups given from the hilum toward the trachea.","1":"The cisterna chyli and lumbar and celiac nodes are abdominal and posterior wall lymphatic routes.","3":"Axillary, parasternal, and inguinal nodes are not the main stations of this pulmonary lymphatic route.","4":"Intramammary and intercostal nodes alone cannot describe the three node groups of the lung."},"one":"Lung lymph nodes run from bronchopulmonary (hilar) to tracheobronchial to paratracheal nodes."},"w11_thorax-30":{"q":"Pulmonary plexuses receive parasympathetic fibers from the _____ and sympathetic fibers from the _____.","o":["Vagus; sympathetic trunk","Phrenic nerve; vagus","Intercostal nerves; phrenic nerve","Sympathetic trunk; vagus","Recurrent laryngeal nerve; ansa cervicalis"],"a":0,"src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 47","img":[{"u":"img/w11_thorax/p47.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 47","w":1200,"h":900}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11,"exp":"The lungs are innervated through the **pulmonary plexuses**. **Parasympathetic fibers come from the vagus**, and **sympathetic fibers from the sympathetic trunk**. The box and arrow in the figure point to the plexus around the tracheal bifurcation.\n\nOption D is a trap that swaps the sources of parasympathetic and sympathetic fibers. The phrenic nerve mainly supplies the diaphragm, and the intercostal nerves the chest wall.","why":{"1":"The phrenic nerve mainly supplies the diaphragm and is not the parasympathetic source for the pulmonary plexus, and sympathetic fibers do not come from the vagus.","2":"The intercostal and phrenic nerves supply the chest wall and diaphragm and are not given as autonomic sources for the pulmonary plexus.","3":"The sources are swapped: parasympathetic from the vagus, sympathetic from the sympathetic trunk.","4":"The recurrent laryngeal nerve and ansa cervicalis are not given as parasympathetic or sympathetic sources for the pulmonary plexus."},"one":"Pulmonary plexuses get parasympathetic fibers from the vagus and sympathetic fibers from the sympathetic trunk."},"w11_heart-1":{"q":"The pericardium is best described as which of the following?","o":["A double-walled fibroserous sac around the heart and great vessels","A single fibrous membrane limited to the ventricular chambers","A mucous membrane confined to the middle mediastinum only","A synovial capsule surrounding only the great arteries","A serous sac that excludes the venae cavae and the aorta"],"a":0,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 2","img":[{"u":"img/w11_heart/p02.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 2","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The pericardium is a **double-walled fibroserous sac**. It encloses not only the heart itself but also the roots of the **great vessels** entering and leaving the heart.\n\nThe great vessels it encloses are the **aorta**, the **pulmonary arteries and veins**, and the **venae cavae**; in other words, both arteries and veins.\n\nIts inner part is the serous pericardium and its outer part the tough fibrous pericardium, which together help the heart beat stably within the thoracic cavity.","why":{"1":"It is not a single membrane of fibrous pericardium only, nor is it limited to the ventricles; it also encloses the atria and the roots of the great vessels.","2":"The pericardium is a fibrous and serous membrane, not a mucous membrane.","3":"A synovial capsule surrounds joints; it is different from the pericardium.","4":"The venae cavae and the aorta are among the great vessels enclosed by the pericardium."},"one":"The pericardium is a double-walled fibroserous sac enclosing the heart and great vessels (aorta, pulmonary arteries/veins, venae cavae)."},"w11_heart-2":{"q":"Which statement correctly locates the pericardium in the thorax?","o":["Anterior to the manubrium and first costal cartilages, at T1–T4","Posterior to the sternal body and 2nd–6th costal cartilages, at T5–T8","Posterior to the xiphoid and 7th–10th costal cartilages, at T9–T12","Lateral to the scapulae and third to fifth ribs, at C7–T3","Anterior to the lumbar vertebral bodies, at the level of L1–L3"],"a":1,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 3","img":[{"u":"img/w11_heart/p03.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 3","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The pericardium lies **posterior** to the **body of the sternum** and the **2nd–6th costal cartilages**, at the vertebral level of **T5–T8**.\n\nRemembering this range gives you a reference for understanding cardiac auscultation sites, pericardiocentesis, and median sternotomy. Placing it too high (T1–T4) or too low (T9 and below) would correspond to other mediastinal structures rather than the heart.","why":{"0":"Anterior to the manubrium and T1–T4 is above the heart (toward the superior mediastinum); the pericardium is behind the body of the sternum.","2":"The 7th–10th costal cartilages and T9–T12 are below the pericardium.","3":"Lateral to the scapulae is the posterolateral thorax, not the location of the pericardium.","4":"The pericardium is inside the thoracic cage, not at the lumbar level."},"one":"The pericardium lies behind the sternal body and 2nd–6th costal cartilages, at T5–T8."},"w11_heart-3":{"q":"A principal function of the fibrous pericardium is to:","o":["Secrete the serous fluid that fills the pleural cavity","Conduct impulses from the sinoatrial node to the ventricles","Protect the heart against overfilling","Form the muscular walls of the left ventricle","Drain lymph from the myocardium to axillary nodes"],"a":2,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 4","img":[{"u":"img/w11_heart/p04.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 4","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The fibrous pericardium is a tough connective tissue sac that barely stretches. Its most important function is to keep the heart from receiving too much blood at once, that is, to protect it against **overfilling**.\n\nIt is pierced by the **aorta**, **pulmonary trunk**, and **superior vena cava**, and it is fused to the **tunica adventitia of the great vessels**, the **posterior surface of the sternum**, and the **central tendon of the diaphragm**, anchoring the heart in place.","why":{"0":"Serous fluid is secreted into the pericardial cavity by the mesothelium of the serous pericardium; it is not the fluid of the pleural cavity.","1":"Impulse conduction is the job of the SA node, AV node, and AV bundle, not the fibrous pericardium.","3":"The wall of the left ventricle is formed by myocardium.","4":"Cardiac lymph drains to the tracheobronchial nodes; this is not a function of the fibrous pericardium."},"one":"The fibrous pericardium barely stretches, preventing overfilling, and is anchored to the great vessels' adventitia, the sternum, and the central tendon."},"w11_heart-4":{"q":"The visceral layer of serous pericardium is also known as the:","o":["Fibrous pericardium","Endocardium","Myocardium","Epicardium","Parietal pleura"],"a":3,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 5","img":[{"u":"img/w11_heart/p05.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 5","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The serous pericardium has two layers. The **parietal layer** lines the inner surface of the fibrous pericardium, and the **visceral layer** covers the surface of the heart directly. This visceral layer is the **epicardium**.\n\nThe potential space between the two serous layers is the **pericardial cavity**. It contains a small amount of serous fluid that reduces friction as the heart beats; a rapid increase in this fluid sets the stage for cardiac tamponade.","why":{"0":"The fibrous pericardium is the tough outermost sac, not the visceral serous layer.","1":"The endocardium is the innermost endothelial lining of the heart chambers.","2":"The myocardium is the thick muscle layer of the heart.","4":"The parietal pleura lines the thoracic cavity; it is not the visceral layer of the pericardium."},"one":"The visceral layer of serous pericardium is the epicardium; the space between it and the parietal layer is the pericardial cavity."},"w11_heart-5":{"q":"The pericardial sinuses are spaces within the pericardial sac located:","o":["Between the fibrous pericardium and the sternum","Inside the left ventricular chamber","Along the interventricular septum","Within the pleural cavities beside each lung","Behind the heart, as the transverse and oblique sinuses"],"a":4,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 6","img":[{"u":"img/w11_heart/p06.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 6","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The pericardial sinuses are spaces inside the pericardial sac **behind the heart**. There are two: the **transverse sinus** and the **oblique sinus**.\n\nThe transverse sinus is a passage running behind the aorta and pulmonary trunk and in front of the superior vena cava; in cardiac surgery the great vessels can be clamped or ligated by passing through it. The oblique sinus is a blind recess behind the left atrium, bounded by the pulmonary veins and the inferior vena cava. When the heart is removed, the openings of both sinuses are exposed.","why":{"0":"The space between the fibrous pericardium and the sternum is not a pericardial sinus; the fibrous pericardium is attached to the back of the sternum.","1":"The pericardial sinuses are spaces within the pericardial cavity, not inside a heart chamber.","2":"The interventricular septum is an internal structure of the heart and has nothing to do with the sinuses.","3":"The pleural cavities surround the lungs and are separate from the pericardial sinuses."},"one":"The pericardial sinuses are the transverse and oblique sinuses inside the pericardial sac behind the heart."},"w11_heart-6":{"q":"The pericardiacophrenic arteries travel with which nerve?","o":["Vagus nerve","Phrenic nerve","Recurrent laryngeal nerve","Sympathetic chain","Intercostal nerves"],"a":1,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 7","img":[{"u":"img/w11_heart/p07.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 7","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"One of the main arteries of the pericardium is the **pericardiacophrenic artery**, which travels with the **phrenic nerve**.\n\nIn a right lateral view of the thorax, this artery-nerve bundle descends along the side of the pericardial sac toward the diaphragm. The phrenic nerve carries not only motor fibers to the diaphragm but also sensation from the pericardium, so pericardial inflammation can refer pain to the same segments (C3–C5).","why":{"0":"The vagus nerve carries parasympathetic fibers to the heart but does not run in one bundle with the pericardiacophrenic artery.","2":"The recurrent laryngeal nerve goes to the larynx and does not accompany the pericardiacophrenic artery.","3":"The sympathetic trunk is the sympathetic source of the cardiac nerves, but it does not run down the side of the pericardium with this artery.","4":"The intercostal nerves run in the intercostal spaces and do not accompany this artery."},"one":"The pericardiacophrenic artery travels with the phrenic nerve along the side of the pericardial sac."},"w11_heart-7":{"q":"Besides the pericardiacophrenic arteries, arterial supply to the pericardium includes:","o":["Only the internal thoracic arteries, with no aortic twigs","Renal and superior mesenteric arterial branches","The musculophrenic artery and bronchial and esophageal aortic branches","The inferior epigastric and lumbar arteries alone","The anterior and posterior intercostal arteries exclusively"],"a":2,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 8, 9","img":[{"u":"img/w11_heart/p08.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 8","w":1200,"h":900},{"u":"img/w11_heart/p09.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 9","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The pericardium has several arterial sources. In addition to the pericardiacophrenic artery, the **musculophrenic artery** sends branches to the pericardium from below; it is one of the terminal branches of the internal thoracic artery.\n\nPosteriorly, the **bronchial arteries** and **esophageal arteries** of the **thoracic aorta** contribute. Add the coronary artery branches, and the pericardium receives blood from the front, below, and behind.","why":{"0":"Not only branches of the internal thoracic artery (pericardiacophrenic and musculophrenic) but also the bronchial and esophageal branches of the thoracic aorta supply the pericardium.","1":"The renal and superior mesenteric arteries are abdominal arteries, not sources for the pericardium.","3":"The inferior epigastric and lumbar arteries supply the abdominal wall.","4":"The intercostal arteries may contribute somewhat, but the sources given for the pericardium are the musculophrenic artery and the bronchial/esophageal branches."},"one":"Besides the pericardiacophrenic artery, the pericardium is supplied by the musculophrenic artery and the bronchial and esophageal branches of the thoracic aorta."},"w11_heart-8":{"q":"Which coronary vessels contribute to the blood supply of the pericardium?","o":["The circumflex branch of the left coronary artery only","The posterior interventricular artery of the right side only","The great cardiac vein together with the coronary sinus","The right coronary artery and a left coronary branch","The left marginal artery as the sole pericardial source"],"a":3,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 10","img":[{"u":"img/w11_heart/p10.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 10","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The arterial supply of the pericardium also includes the **coronary arteries**: specifically the **right coronary artery** and **a branch from the left coronary artery**.\n\nThe coronary arteries mainly feed the myocardium, but they also give small twigs to the visceral serous pericardium on the heart surface (epicardium). So the pericardium is supplied jointly by the pericardiacophrenic, musculophrenic, and aortic branches and the coronary arteries.","why":{"0":"The circumflex branch alone does not account for the pericardial supply; the right coronary artery and a left coronary branch are given.","1":"The posterior interventricular artery alone is not singled out.","2":"The great cardiac vein and coronary sinus are the heart's venous return, not arterial supply to the pericardium.","4":"The left marginal artery is not described as the only pericardial source."},"one":"The pericardium also receives blood from the right coronary artery and a branch of the left coronary artery."},"w11_heart-9":{"q":"The heart is located in which of the following regions?","o":["The anterior mediastinum, outside the pericardial sac","The posterior mediastinum, mostly on the right side","The superior mediastinum, lying only in front of the trachea","The abdominal cavity, immediately below the diaphragm","The middle mediastinum, in the pericardial sac, mostly left"],"a":4,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 11, 12","img":[{"u":"img/w11_heart/p11.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 11","w":1200,"h":900},{"u":"img/w11_heart/p12.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 12","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The heart lies in the **middle mediastinum**, inside the **pericardial sac**. It sits behind the sternum and is shifted mostly to the **left**. It is about the size of a closed fist.\n\nThat is why the apex lies in the left 5th intercostal space and the left lung has a cardiac notch. Be sure to distinguish the \"middle\" mediastinum from the anterior, posterior, and superior mediastinum.","why":{"0":"The heart is not in the anterior mediastinum; it is in the middle mediastinum, inside the pericardial sac.","1":"The posterior mediastinum contains the thoracic aorta, esophagus, and others; the heart is in the middle mediastinum, mostly on the left.","2":"The superior mediastinum contains the aortic arch, trachea, and others; the heart itself is in the middle mediastinum.","3":"The heart is inside the thoracic cage, not an abdominal structure."},"one":"The heart lies in the pericardial sac in the middle mediastinum, behind the sternum, mostly to the left."},"w11_heart-10":{"q":"The apex of the heart is formed by the left ventricle and is the site of the maximum heartbeat in the:","o":["5th intercostal space","2nd intercostal space","3rd intercostal space at the right sternal border","7th intercostal space in the midaxillary line","1st intercostal space at the sternal angle"],"a":0,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 13","img":[{"u":"img/w11_heart/p13.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 13","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The apex of the heart is formed by the **left ventricle**. On the chest wall it corresponds to the **5th intercostal space**, and the **site of maximum heartbeat (PMI)** is felt there (posterior to the 5th intercostal space).\n\nBecause the apex points down and to the left, it also projects to the lower left on an anterior view of the heart. The 2nd intercostal space is near the aortic and pulmonic auscultation areas and is not where the apex is.","why":{"1":"The 2nd intercostal space is near the aortic/pulmonary region (toward the base), not the apex.","2":"The right sternal border corresponds to the right border formed by the right atrium, not the apex.","3":"The 7th intercostal space in the midaxillary line is much lower and more lateral than the apex.","4":"The sternal angle (level of the 2nd costal cartilage) and the 1st intercostal space are far above the apex."},"one":"The apex is formed by the left ventricle, and the point of maximum impulse is felt in the 5th intercostal space."},"w11_heart-11":{"q":"The sternocostal (anterior) surface of the heart is formed mainly by the:","o":["Left atrium","Left ventricle","Right ventricle","Right auricle alone","Ascending aorta"],"a":2,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 14","img":[{"u":"img/w11_heart/p14.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 14","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The **sternocostal surface** of the heart is the same as its **anterior surface**, and most of it is formed by the **right ventricle**.\n\nViewed from the front, the right ventricle lies closest to the sternum and costal cartilages. The left ventricle forms the left border and apex, and the left atrium forms the posterior base, so neither is the main component of the anterior surface.","why":{"0":"The left atrium mainly forms the base (posterior surface) of the heart.","1":"The left ventricle forms the left border and apex; the main component of the anterior surface is the right ventricle.","3":"The right auricle is only part of the superior border and does not form the whole sternocostal surface.","4":"The ascending aorta is a great vessel arising from the base, not the anterior surface itself."},"one":"Most of the sternocostal (anterior) surface is formed by the right ventricle."},"w11_heart-12":{"q":"The base of the heart is the posterior surface and is formed mainly by the:","o":["Right ventricle","Left ventricle","Right auricle","Left atrium","Pulmonary valve"],"a":3,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 15","img":[{"u":"img/w11_heart/p15.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 15","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The **base** of the heart is its **posterior surface**, formed mostly by the **left atrium**. The **ascending aorta** and **pulmonary trunk** arise here, and the **superior vena cava** enters here.\n\nUnlike \"base\" in everyday language (the bottom), the anatomical base of the heart is superior and posterior. Since the apex points down and to the left, the base is the opposite side: posteriorly, at the left atrium.","why":{"0":"The right ventricle mainly forms the anterior (sternocostal) surface and the inferior border.","1":"The left ventricle forms the apex and the left border.","2":"The right auricle is part of the superior border and is not the main component of the base.","4":"The pulmonary valve is a valve in the right ventricular outflow tract and does not form the base."},"one":"The base is the posterior surface of the heart, formed mainly by the left atrium; the ascending aorta and pulmonary trunk arise here."},"w11_heart-13":{"q":"The pulmonary surface of the heart occupies the:","o":["Costodiaphragmatic recess of the right pleura","Hilum of the right lung","Cupola of the right pleural cavity","Oblique fissure of the right lung","Cardiac notch of the left lung"],"a":4,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 16, 17","img":[{"u":"img/w11_heart/p16.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 16","w":1200,"h":900},{"u":"img/w11_heart/p17.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 17","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The **pulmonary surface** of the heart occupies the **cardiac notch of the left lung**. Because the heart is shifted to the left, the anterior border of the left lung is pushed in, creating the notch.\n\nIn the same surfaces unit, the **diaphragmatic surface** is shown in a posterior view, which also marks the **oblique pericardial sinus** behind the left atrium. The pulmonary surface is the surface in contact with the left lung; the diaphragmatic surface is the one resting on the diaphragm.","why":{"0":"The costodiaphragmatic recess is a lower lateral pleural space not fully filled by the lung; it is not the pulmonary surface of the heart.","1":"The hilum of the right lung is where bronchi and pulmonary vessels enter and leave; it is not the pulmonary surface of the heart.","2":"The cupola is the pleural dome at the base of the neck, well away from the heart.","3":"The oblique fissure of the right lung is a cleft separating lung lobes, not the pulmonary surface of the heart."},"one":"The pulmonary surface of the heart occupies the cardiac notch of the left lung."},"w11_heart-14":{"q":"Which set correctly matches the borders of the heart with the chambers that form them?","o":["Right border: right atrium; inferior: right ventricle; left: left ventricle; superior: auricles and great vessels","Right border: left atrium; inferior: left ventricle; left: right ventricle; superior: the apex of the heart only","Right border: right ventricle; inferior: left atrium; left: right atrium; superior: the coronary sinus only","Right border: left ventricle; inferior: right atrium; left: pulmonary trunk; superior: the fossa ovalis only","Right border: the apex; inferior: left atrium; left: right atrium; superior: the right ventricle only"],"a":0,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 18","img":[{"u":"img/w11_heart/p18.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 18","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The four borders of the heart are:\n\n**Right border**: the **right atrium**. **Inferior border**: the **right ventricle**. **Left border**: the **left ventricle**. **Superior border**: the **auricles** and the **region where the great vessels attach**.\n\nLooking at the heart from the front, the right atrium outlines the right side, the right ventricle the bottom, and the left ventricle the left side and apex.","why":{"1":"The right border is the right atrium, not the left atrium, and the superior border is not the apex.","2":"The right border is the right atrium, not the right ventricle, and the coronary sinus is not the superior border.","3":"The left border is the left ventricle, not the pulmonary trunk; the fossa ovalis is a structure inside the right atrium.","4":"The apex is at the lower left, not the right border."},"one":"Right border = right atrium, inferior = right ventricle, left = left ventricle, superior = auricles and great vessel attachments."},"w11_heart-15":{"q":"Which of the following is a characteristic feature of the right atrium?","o":["A mitral (bicuspid) valve at its outflow","The fossa ovalis and the opening of the coronary sinus","A thick myocardium that forms the cardiac apex","The septomarginal trabecula and the pulmonary valve","Openings of the four pulmonary veins only"],"a":1,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 19","img":[{"u":"img/w11_heart/p19.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 19","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The main features of the **right atrium** are the **pectinate muscles**, the **crista terminalis**, the **sinus venarum**, the **fossa ovalis**, and the **openings of the coronary sinus, superior vena cava, and inferior vena cava**.\n\nThe crista terminalis separates the rough pectinate region from the smooth sinus venarum. The fossa ovalis is the remnant of the fetal foramen ovale after it closes. The coronary sinus is the main entry for cardiac venous blood into the right atrium.","why":{"0":"The mitral (bicuspid) valve is at the left atrioventricular orifice of the left ventricle.","2":"The thick myocardium that forms the apex belongs to the left ventricle.","3":"The septomarginal trabecula and the pulmonary valve are structures of the right ventricle.","4":"The openings of the pulmonary veins are a feature of the left atrium."},"one":"The right atrium has pectinate muscles, crista terminalis, sinus venarum, fossa ovalis, and the openings of the coronary sinus, SVC, and IVC."},"w11_heart-16":{"q":"Which structure is a distinctive feature of the right ventricle?","o":["The fossa ovalis","Openings of the pulmonary veins","The septomarginal trabecula","The mitral (bicuspid) valve","The sinus venarum"],"a":2,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 20","img":[{"u":"img/w11_heart/p20.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 20","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"Features of the **right ventricle** include the right AV orifice with the **tricuspid valve**, **papillary muscles**, **chordae tendineae**, the **septomarginal trabecula**, **trabeculae carneae**, the **supraventricular crest**, and the **pulmonary (semilunar) valve**.\n\nThe septomarginal trabecula (moderator band) crosses from the interventricular septum to the anterior papillary muscle and carries the right bundle branch, coordinating the timing of contraction.","why":{"0":"The fossa ovalis is a structure of the interatrial septum in the right atrium.","1":"The openings of the pulmonary veins are in the left atrium.","3":"The mitral valve is at the left AV orifice of the left ventricle; the right ventricle has the tricuspid valve.","4":"The sinus venarum is the smooth part of the right atrium."},"one":"The right ventricle has the tricuspid valve, papillary muscles, chordae tendineae, septomarginal trabecula, trabeculae carneae, and pulmonary valve."},"w11_heart-17":{"q":"Compared with the right atrium, the left atrium is characterized by:","o":["A thinner wall because it handles lower pressure","Pectinate muscles lining the entire chamber wall","Inflow of deoxygenated blood from the venae cavae","A thicker wall from higher pressure; pectinate muscles only in the auricle","A tricuspid valve at the left atrioventricular orifice"],"a":3,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 21","img":[{"u":"img/w11_heart/p21.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 21","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The interior of the **left atrium** is mostly **smooth**, and the **pectinate muscles (musculi pectinati)** are found **only in the auricle**. Oxygen-rich blood from the lungs enters through the **pulmonary veins** and passes on to the left AV orifice.\n\nBecause it receives blood that has passed through the pulmonary circulation, it is under **higher pressure** than the right atrium, and its **wall is thicker** as a result.","why":{"0":"The reverse is true: the left atrium is under higher pressure and has a thicker wall.","1":"Pectinate muscles are found only in the auricle, not throughout the chamber; the rest of the interior is smooth.","2":"Deoxygenated blood from the venae cavae enters the right atrium; the left atrium receives oxygenated blood from the pulmonary veins.","4":"The valve at the left AV orifice is the mitral (bicuspid) valve; the tricuspid valve is at the right AV orifice."},"one":"The left atrium has a thicker wall and a smooth interior, with pectinate muscles only in the auricle, and receives oxygenated blood from the pulmonary veins."},"w11_heart-18":{"q":"The left atrioventricular orifice of the left ventricle is guarded by the:","o":["Tricuspid valve","Pulmonary semilunar valve","Aortic valve only, with no atrioventricular valve","Thebesian valve of the coronary sinus","Mitral (bicuspid) valve"],"a":4,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 22","img":[{"u":"img/w11_heart/p22.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 22","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The **left ventricle** has **thick myocardium**, **trabeculae carneae**, the **mitral (bicuspid) valve** at the left AV orifice, **chordae tendineae**, **papillary muscles**, and the **aortic valve**.\n\nThe mitral valve has two cusps, hence the name bicuspid. During systole it closes so blood does not regurgitate into the left atrium and leaves only through the aortic valve. Distinguish it from the tricuspid valve of the right ventricle.","why":{"0":"The tricuspid valve is the valve of the right AV orifice.","1":"The pulmonary semilunar valve is in the right ventricular outflow tract.","2":"The left ventricle has both an AV valve (mitral) and the aortic valve.","3":"The thebesian valve is the small valve at the opening of the coronary sinus into the right atrium."},"one":"The left AV orifice of the left ventricle has the mitral (bicuspid) valve; the outflow tract has the aortic valve."},"w11_heart-19":{"q":"The right coronary artery arises from the:","o":["Left aortic sinus","Right aortic sinus","Pulmonary trunk just above the pulmonary valve","Coronary sinus in the atrioventricular groove","Descending thoracic aorta"],"a":1,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 23, 24","img":[{"u":"img/w11_heart/p23.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 23","w":1200,"h":900},{"u":"img/w11_heart/p24.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 24","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The right coronary artery arises from the **right aortic sinus**, the pocket behind a cusp of the aortic valve from which the artery originates.\n\nEach semilunar cusp has a **nodule** and **lunules**, and the space behind the cusp is the **sinus**. The origin of the right coronary artery is exactly this right aortic sinus.","why":{"0":"The left coronary artery arises from the left aortic sinus.","2":"The pulmonary trunk is not the origin of the coronary arteries.","3":"The coronary sinus collects venous blood into the right atrium; it is not an arterial origin.","4":"The descending thoracic aorta gives off the bronchial and esophageal arteries, but the coronary arteries arise from the aortic sinuses of the ascending aorta."},"one":"The right coronary artery arises from the right aortic sinus; the valve cusps have nodules and lunules."},"w11_heart-20":{"q":"After arising from the right aortic sinus, the right coronary artery runs in the:","o":["Anterior interventricular groove","Posterior interventricular groove only, with no atrioventricular course","Atrioventricular groove","Sulcus terminalis of the right atrium","Oblique pericardial sinus"],"a":2,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 25","img":[{"u":"img/w11_heart/p25.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 25","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"After its origin, the right coronary artery runs in the **atrioventricular groove (coronary sulcus)**. Viewed from the front, it follows the groove between the right atrium and right ventricle around to the right and toward the back of the heart.\n\nAlong this course it gives the SA nodal branch and the right marginal branch, and posteriorly it becomes the posterior interventricular artery. The vessel running in the anterior interventricular groove is the anterior interventricular branch of the left coronary artery.","why":{"0":"The vessel running in the anterior interventricular groove is the anterior interventricular branch of the left coronary artery.","1":"The right coronary artery first runs in the AV groove and gives off the posterior interventricular artery as a branch; it does not run only in the posterior interventricular groove from the start.","3":"The sulcus terminalis is a shallow groove on the outside of the right atrium, not the main course of the coronary artery.","4":"The oblique pericardial sinus is a pericardial space behind the left atrium, not an arterial course."},"one":"The right coronary artery runs in the atrioventricular (coronary) groove."},"w11_heart-21":{"q":"Branches of the right coronary artery include the:","o":["SA nodal branch, right marginal branch, and posterior interventricular artery","Anterior interventricular artery, circumflex branch, and left marginal branch","Great, middle, and small cardiac veins","Bronchial and esophageal arteries from the thoracic aorta","Musculophrenic and pericardiacophrenic arteries"],"a":0,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 26","img":[{"u":"img/w11_heart/p26.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 26","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"Branches of the right coronary artery running in the AV groove include the **SA nodal branch**, the **right marginal branch**, and the **posterior interventricular artery**.\n\nThe SA nodal branch supplies the heart's pacemaker, the right marginal branch supplies the inferior margin of the right ventricle, and the posterior interventricular artery supplies the posterior interventricular septum and adjacent ventricular walls. The anterior interventricular, circumflex, and left marginal branches belong to the left coronary artery.","why":{"1":"The anterior interventricular artery, circumflex branch, and left marginal branch are branches of the left coronary artery.","2":"The great, middle, and small cardiac veins are venous tributaries that drain into the coronary sinus.","3":"The bronchial and esophageal arteries are thoracic aortic branches to the pericardium, not coronary branches.","4":"The musculophrenic and pericardiacophrenic arteries supply the pericardium and are not branches of the right coronary artery."},"one":"Branches of the right coronary artery include the SA nodal branch, right marginal branch, and posterior interventricular artery."},"w11_heart-22":{"q":"The left coronary artery is found between the left auricle and the pulmonary trunk and gives off the:","o":["SA nodal branch, right marginal branch, and posterior interventricular artery","Great, middle, and small cardiac veins only","Bronchial and esophageal arteries","Anterior interventricular artery, circumflex branch, and left marginal branch","Pericardiacophrenic and musculophrenic arteries"],"a":3,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 27, 28","img":[{"u":"img/w11_heart/p27.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 27","w":1200,"h":900},{"u":"img/w11_heart/p28.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 28","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The **left coronary artery** is found between the **left auricle** and the **pulmonary trunk**. Its branches are the **anterior interventricular artery**, the **circumflex branch**, and the **left marginal branch**.\n\nThe anterior interventricular artery descends in the anterior interventricular groove to supply the anterior left ventricular wall and septum; the circumflex branch curves to the left in the AV groove; and the left marginal branch supplies the left margin of the left ventricle.","why":{"0":"These three are branches of the right coronary artery.","1":"The great, middle, and small cardiac veins are venous return, not arterial branches of the left coronary artery.","2":"The bronchial and esophageal arteries arise from the thoracic aorta and go to the pericardium and other structures.","4":"The pericardiacophrenic and musculophrenic arteries supply the pericardium."},"one":"The left coronary artery lies between the left auricle and pulmonary trunk and gives the anterior interventricular, circumflex, and left marginal branches."},"w11_heart-23":{"q":"The coronary sinus, the main vein of the heart, empties into the:","o":["Left atrium","Right atrium","Left ventricle","Superior vena cava","Pulmonary trunk"],"a":1,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 29","img":[{"u":"img/w11_heart/p29.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 29","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The **coronary sinus** is the **main vein of the heart** and opens into the **right atrium**. In a posterior view it is a large vein crossing the AV groove, and its opening into the right atrium is marked \"...here.\"\n\nIts tributaries are the **great cardiac vein**, **middle cardiac vein**, and **small cardiac vein**, and the figure also shows the **left marginal vein**. The great cardiac vein follows the anterior interventricular artery, and the middle cardiac vein follows the posterior interventricular artery.","why":{"0":"The coronary sinus opens into the right atrium, not the left; the pulmonary veins enter the left atrium.","2":"It does not open directly into a ventricle; its destination is the right atrium.","3":"The SVC brings systemic venous blood to the right atrium, but it is not where the coronary sinus drains.","4":"The pulmonary trunk is the arterial outflow of the right ventricle."},"one":"The coronary sinus, the main vein of the heart, opens into the right atrium and collects the great, middle, and small cardiac veins."},"w11_heart-24":{"q":"Lymphatics of the heart follow the coronary arteries and drain to the:","o":["Axillary lymph nodes","Superficial inguinal nodes","Celiac lymph nodes","Deep cervical nodes only","Tracheobronchial nodes"],"a":4,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 30","img":[{"u":"img/w11_heart/p30.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 30","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"Cardiac lymph collects in the **subepicardial plexus**, which drains the **myocardium** and **subendocardium**. The lymphatic vessels run **along the coronary arteries**.\n\nUltimately, cardiac lymph drains to the **tracheobronchial nodes**. These nodes lie around the tracheal bifurcation and main bronchi and are an important collecting point for lymph from both the heart and lungs.","why":{"0":"The axillary nodes mainly receive lymph from the upper limb and breast.","1":"The superficial inguinal nodes receive lymph from the lower limb and perineum.","2":"The celiac nodes receive lymph from the foregut organs of the abdomen.","3":"The deep cervical nodes may connect to the final route, but the heart drains directly to the tracheobronchial nodes."},"one":"Cardiac lymph drains from the subepicardial plexus along the coronary arteries to the tracheobronchial nodes."},"w11_heart-25":{"q":"The sinoatrial node initiates and regulates impulses, firing about 70 times per minute, and is located at the junction of the:","o":["Superior vena cava, right atrium, and crista terminalis","Inferior vena cava, left atrium, and pulmonary veins","Aortic valve, left ventricle, and interventricular septum","Coronary sinus, left auricle, and pulmonary trunk","Apex, left ventricle, and anterior interventricular groove"],"a":0,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 31","img":[{"u":"img/w11_heart/p31.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 31","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The **sinoatrial (SA) node** lies where the **superior vena cava (SVC)**, the **right atrium**, and the **crista terminalis** meet. It **initiates and regulates** the impulses of the heartbeat, firing about **70 times per minute**.\n\nThis location is in the upper posterior right atrium, near the entry of the SVC. Distinguish it from the AV node, which lies in the interatrial septum.","why":{"1":"The junction of the IVC, left atrium, and pulmonary veins is not the location of the SA node; the pulmonary veins enter the left atrium.","2":"The region of the aortic valve, left ventricle, and septum is where the bundle branches run, not the SA node.","3":"The coronary sinus opens into the right atrium, and the area between the left auricle and pulmonary trunk is where you find the left coronary artery.","4":"The apex and anterior interventricular groove are far from the SA node."},"one":"The SA node lies at the junction of the SVC, right atrium, and crista terminalis and is the pacemaker firing about 70 times per minute."},"w11_heart-26":{"q":"The atrioventricular node is located in the interatrial septum and is specialized to:","o":["Initiate impulses at about 70 times per minute as the primary pacemaker","Drain lymph from the myocardium to tracheobronchial nodes","Pass SA-node impulses to the ventricles after a built-in delay","Form the anterior papillary muscle of the left ventricle","Arise from the right aortic sinus and run in the atrioventricular groove"],"a":2,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 32","img":[{"u":"img/w11_heart/p32.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 32","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The **atrioventricular (AV) node** lies in the **interatrial septum**. It receives impulses from the SA node and passes them to the ventricles after a **built-in delay**.\n\nThis delay lets the atria contract first and fill the ventricles before the ventricles contract. Without it, atria and ventricles would contract almost simultaneously and could not eject blood effectively.","why":{"0":"The primary pacemaker firing about 70 times per minute is the SA node.","1":"Lymph drainage concerns the subepicardial plexus and the tracheobronchial nodes.","3":"Papillary muscles are contractile ventricular muscles, not the AV node.","4":"The vessel arising from the right aortic sinus and running in the AV groove is the right coronary artery."},"one":"The AV node lies in the interatrial septum and passes SA-node impulses to the ventricles after a delay."},"w11_heart-27":{"q":"The atrioventricular bundle divides into right and left bundle branches that carry impulses to the ventricular muscle. A right-sided conduction path travels in the:","o":["Crista terminalis of the right atrium","Coronary sinus along the posterior atrioventricular groove","Oblique pericardial sinus behind the left atrium","Septomarginal trabecula","Sinus venarum of the right atrium"],"a":3,"src":"15 - Heart 2024-2025 CANVAS.pdf, slide 33","img":[{"u":"img/w11_heart/p33.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 33","w":1200,"h":900}],"ch":"w11_heart","chn":"Heart","week":11,"exp":"The **atrioventricular bundle** divides into the **right and left bundle branches**, which carry impulses to the ventricular muscle. On the right, the conduction path travels in the **septomarginal trabecula**.\n\nThis trabecula is a muscular bridge crossing from the interventricular septum to the anterior papillary muscle of the right ventricle. Because the right bundle branch reaches the anterior papillary muscle quickly through this bridge, the timing of tricuspid valve closure is coordinated.","why":{"0":"The crista terminalis is the landmark for the location of the SA node, not the path of the bundle branches.","1":"The coronary sinus is a venous return route.","2":"The oblique pericardial sinus is a pericardial space, not part of the conduction system.","4":"The sinus venarum is the smooth part of the right atrium."},"one":"The AV bundle divides into right and left bundle branches, and the right bundle branch travels in the septomarginal trabecula."},"w11_heart-28":{"q":"Cardiac nerves that form the cardiac plexus originate from the:","o":["Phrenic nerves together with the intercostal nerves only","Vagus nerve (parasympathetic) and the sympathetic chain","Recurrent laryngeal nerves as the sole cardiac source","Hypoglossal and accessory nerves of the hindbrain","Gr
