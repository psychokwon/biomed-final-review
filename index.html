 while the ulnar nerve and artery were already outside the tunnel.\n\nThe median nerve is the most sensitive structure in the tunnel. Compression causes numbness and impaired thumb opposition, and in severe cases thenar wasting with an adducted, extended thumb: the **simian (ape) hand**.","why":{"0":"The median nerve and flexor pollicis longus are contents inside the carpal tunnel.","1":"The radial artery and FCR are lateral structures, and the FCR runs in its own passage; they are not the pair outside on the ulnar side.","3":"The anterior interosseous nerve and artery run deep in the forearm on the front of the interosseous membrane.","4":"The superficial radial nerve and cephalic vein lie closer to the lateral dorsal wrist."},"one":"The ulnar nerve and ulnar artery lie outside the carpal tunnel on its ulnar side (the ulnar tunnel)."},"w10_wrist-14":{"q":"Advanced median-nerve compression at the wrist may produce a simian hand, characterized by thenar wasting and a thumb that is:","o":["Abducted and opposed","Flexed at the interphalangeal joint only","Hyperextended at the MCP joint of the little finger","Adducted and extended","Clawed at the ring and little fingers only"],"a":3,"src":"Wrist & Hand 2.pdf, slide 11","img":[{"u":"img/w10_wrist/p11.webp","cap":"Wrist & Hand 2.pdf, slide 11","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"With prolonged compression of the median nerve in the carpal tunnel, the thenar muscles weaken and atrophy. As it progresses, the patient cannot oppose the thumb, the thenar eminence wastes, and the thumb takes an **adducted and extended** position: the **simian (ape) hand**.\n\nOpposition happens at the first CMC joint, so its loss directly reflects thenar dysfunction. Tapping over the median nerve at the flexor retinaculum may give a positive Tinel's sign.\n\nClawing of the ring and little fingers is the hallmark of ulnar nerve injury and must be distinguished from the simian hand.","why":{"0":"Abduction and opposition are normal thenar functions, and they are lost in the simian hand.","1":"Flexion at the thumb IP joint alone reflects the action of the flexor pollicis longus and is not the description of a simian hand.","2":"Hyperextension at the little-finger MCP fits the ulnar claw-hand pattern.","4":"Clawing of the ring and little fingers is characteristic of ulnar nerve injury."},"one":"Simian hand: thenar wasting + an adducted, extended thumb that cannot oppose."},"w10_wrist-15":{"q":"Which muscle does not contribute to the thenar eminence and is innervated by the deep branch of the ulnar nerve?","o":["Abductor pollicis brevis","Superficial head of flexor pollicis brevis","Opponens pollicis","Abductor pollicis longus","Adductor pollicis"],"a":4,"src":"Wrist & Hand 2.pdf, slide 13","img":[{"u":"img/w10_wrist/p13.webp","cap":"Wrist & Hand 2.pdf, slide 13","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"There are 19 intrinsic hand muscles: 5 are supplied by the median nerve and 14 by the ulnar nerve.\n\nOf the thumb muscles, the ones that form the eminence are the abductor pollicis brevis, flexor pollicis brevis, and opponens pollicis, supplied by the **recurrent branch of the median nerve**. The **adductor pollicis** **does not contribute** to the eminence and is supplied by the **deep branch of the ulnar nerve**. Its transverse head arises from the anterior surface of the third metacarpal and its oblique head from the capitate and the bases of the second and third metacarpals.\n\nThe abductor pollicis longus is a posterior forearm muscle, not an intrinsic hand muscle.","why":{"0":"The abductor pollicis brevis forms the thenar eminence and is supplied by the recurrent branch of the median nerve.","1":"The functionally important superficial head is supplied by the median nerve (lateral terminal branch) and forms part of the eminence.","2":"The opponens pollicis forms the eminence and is supplied by the recurrent branch of the median nerve.","3":"The abductor pollicis longus is a posterior forearm muscle supplied by the radial nerve system; it is not an intrinsic hand muscle."},"one":"The adductor pollicis does not form the thenar eminence and is supplied by the deep branch of the ulnar nerve."},"w10_wrist-16":{"q":"The larger, functionally significant superficial head of flexor pollicis brevis is innervated by the:","o":["Recurrent branch of the median nerve","Deep branch of the ulnar nerve","Superficial branch of the radial nerve","Anterior interosseous nerve","Posterior interosseous nerve"],"a":0,"src":"Wrist & Hand 2.pdf, slide 14","img":[{"u":"img/w10_wrist/p14.webp","cap":"Wrist & Hand 2.pdf, slide 14","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"The flexor pollicis brevis is described as having superficial and deep heads. Many modern anatomists downplay the small deep head, but Gray's Anatomy recognizes both heads and a dual nerve supply.\n\n**The key is the superficial head.** The large, functionally meaningful **superficial head** is supplied by the **lateral terminal branch (recurrent branch) of the median nerve**. The deep head, when present, is tiny or nonfunctional and may receive twigs from the deep branch of the ulnar nerve.\n\nFor the exam, start from \"thenar flexor pollicis brevis = median nerve,\" and remember only that the deep head may be an ulnar exception.","why":{"1":"The deep branch of the ulnar nerve goes to the small, nonfunctional deep head that may or may not be present; it is not the nerve to the superficial head.","2":"The superficial branch of the radial nerve is the sensory nerve of the lateral dorsum of the hand.","3":"The anterior interosseous nerve is a forearm branch that supplies the flexor pollicis longus and pronator quadratus.","4":"The posterior interosseous nerve supplies the deep extensors of the posterior compartment."},"one":"The functional superficial head of flexor pollicis brevis is supplied by the recurrent branch of the median nerve."},"w10_wrist-17":{"q":"Palmaris brevis, the thin wispy muscle that overlies the hypothenar eminence, is innervated by the:","o":["Deep branch of the ulnar nerve","Superficial branch of the ulnar nerve","Recurrent branch of the median nerve","Palmar cutaneous branch of the median nerve","Deep branch of the radial nerve"],"a":1,"src":"Wrist & Hand 2.pdf, slide 15","img":[{"u":"img/w10_wrist/p15.webp","cap":"Wrist & Hand 2.pdf, slide 15","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"The muscles that form the **hypothenar eminence** are the abductor digiti minimi, flexor digiti minimi brevis, and opponens digiti minimi, all supplied by the **deep branch of the ulnar nerve**.\n\nThe thin, wispy **palmaris brevis** that overlies them is different: it is supplied by the **superficial branch of the ulnar nerve**. It attaches to the hypothenar skin, slightly deepens the cup of the palm, and covers the ulnar nerve and artery.\n\nWithin the rule \"hypothenar muscles = deep ulnar branch,\" set aside the palmaris brevis as the one supplied by the superficial branch.","why":{"0":"The deep branch of the ulnar nerve supplies the abductor digiti minimi, flexor digiti minimi brevis, opponens digiti minimi, the interossei, and others.","2":"The recurrent branch of the median nerve supplies the three thenar muscles.","3":"The palmar cutaneous branch of the median nerve is a sensory branch to the lateral palm, not the motor nerve to the palmaris brevis.","4":"The deep branch of the radial nerve (PIN) supplies posterior forearm muscles."},"one":"Only the palmaris brevis is supplied by the superficial ulnar branch; the other hypothenar muscles get the deep branch."},"w10_wrist-18":{"q":"Lumbricals I and II, the lateral two worm-like muscles arising from the flexor digitorum profundus tendons, are:","o":["Bipennate and ulnar-innervated","Unipennate and ulnar-innervated","Unipennate and median-innervated","Bipennate and median-innervated","Unipennate and radial-innervated"],"a":2,"src":"Wrist & Hand 2.pdf, slide 16","img":[{"u":"img/w10_wrist/p16.webp","cap":"Wrist & Hand 2.pdf, slide 16","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"The lumbricals are four \"worm-like\" muscles lying just deep to the palmar aponeurosis, arising from the **flexor digitorum profundus (FDP) tendons**.\n\nThe **lateral two (I, II)** arise from the radial side of FDP tendons 1 and 2, are **unipennate**, and are supplied by **digital branches of the median nerve**. The **medial two (III, IV)** arise from the adjacent sides of FDP tendons 2, 3, and 4, are **bipennate**, and are supplied by the **deep branch of the ulnar nerve**.\n\nThe five intrinsic hand muscles supplied by the median nerve are the three thenar muscles plus lumbricals I and II.","why":{"0":"Bipennate and ulnar-innervated describes the medial lumbricals III and IV.","1":"I and II are indeed unipennate, but they are supplied by the median nerve, not the ulnar nerve.","3":"I and II are indeed median-innervated, but they are unipennate.","4":"The radial nerve does not supply the lumbricals or any intrinsic hand muscle."},"one":"Lumbricals I–II: unipennate, median nerve; III–IV: bipennate, deep ulnar branch."},"w10_wrist-19":{"q":"The five intrinsic hand muscles innervated by the median nerve are the:","o":["Four lumbricals and palmaris brevis","Three hypothenar muscles and lumbricals III–IV","Adductor pollicis and all seven interossei","Three thenar-eminence muscles and lumbricals I–II","Four dorsal interossei and opponens pollicis"],"a":3,"src":"Wrist & Hand 2.pdf, slide 16","img":[{"u":"img/w10_wrist/p16.webp","cap":"Wrist & Hand 2.pdf, slide 16","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"Of the 19 intrinsic hand muscles, **the median nerve supplies 5** and **the ulnar nerve 14**.\n\nThe median five are the **three muscles of the thenar eminence** (abductor pollicis brevis, superficial head of flexor pollicis brevis, opponens pollicis) and **lumbricals I and II**. The hypothenar muscles, palmaris brevis, adductor pollicis, all the interossei, and lumbricals III and IV belong to the ulnar nerve.\n\nThis distribution explains why carpal tunnel syndrome can cause weakness of thumb opposition and abduction together with weakness of the index and middle lumbricals.","why":{"0":"Of the four lumbricals, the medial two, as well as the palmaris brevis, are supplied by the ulnar nerve.","1":"The hypothenar muscles and lumbricals III–IV are supplied by the ulnar nerve.","2":"The adductor pollicis and all seven interossei are supplied by the deep branch of the ulnar nerve.","4":"The dorsal interossei are supplied by the deep ulnar branch; only the opponens pollicis is median."},"one":"Median-innervated intrinsic hand muscles (5) = 3 thenar + lumbricals I–II."},"w10_wrist-20":{"q":"The palmar interossei adduct the fingers (“PAD”), and they are:","o":["Bipennate, like the dorsal interossei","Four in number and median-innervated","Responsible for abduction of the digits","Absent on every finger except the index","Unipennate and deep-ulnar innervated"],"a":4,"src":"Wrist & Hand 2.pdf, slide 17","img":[{"u":"img/w10_wrist/p17.webp","cap":"Wrist & Hand 2.pdf, slide 17","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"The interossei of the metacarpal compartment are all supplied by the **deep branch of the ulnar nerve**, and there are seven of them.\n\nThe **palmar interossei (PI)** **adduct (PAD)** and are **unipennate**. The first runs from the medial side of the second metacarpal to the medial side of the second proximal phalanx, the second from the lateral side of the fourth metacarpal to the lateral side of the fourth proximal phalanx, and the third from the lateral side of the fifth metacarpal to the lateral side of the fifth proximal phalanx. The middle finger has no palmar interosseous.\n\nThe **dorsal interossei (DI)** **abduct (DAB)** and are **bipennate**. The axis of the hand is the middle (third) finger.","why":{"0":"Bipennate is the form of the dorsal interossei.","1":"There are three palmar interossei, and they are supplied by the deep ulnar branch, not the median nerve.","2":"Abduction (DAB) is the function of the dorsal interossei.","3":"The palmar interossei are on the second, fourth, and fifth digits; they are not limited to the index finger."},"one":"PAD: palmar interossei (unipennate, adduct). DAB: dorsal interossei (bipennate, abduct). All deep ulnar branch."},"w10_wrist-21":{"q":"Abduction and adduction of the fingers are defined with respect to the axis of the hand, which is the:","o":["Middle finger (digit 3)","Index finger (digit 2)","Ring finger (digit 4)","Thumb (digit 1)","Little finger (digit 5)"],"a":0,"src":"Wrist & Hand 2.pdf, slide 17","img":[{"u":"img/w10_wrist/p17.webp","cap":"Wrist & Hand 2.pdf, slide 17","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"Abduction and adduction by the interossei are defined relative to the **axis of the hand**, which is the **middle (third) finger**.\n\nMoving away from the middle finger is abduction (dorsal interossei); moving toward the axis is adduction (palmar interossei). The middle finger itself can be abducted to either side of the axis, which is why the second and third dorsal interossei insert on its lateral and medial proximal phalanx. Thumb abduction and adduction are defined in a different plane relative to the palm, so don't confuse them with the axis used for the finger interossei.","why":{"1":"The index finger is not the axis; the first dorsal interosseous abducts it laterally.","2":"The ring finger is not the axis; the fourth dorsal interosseous abducts it medially.","3":"The thumb is not the axis of the hand, and its abduction/adduction occur in a different plane.","4":"The little finger is not the axis; the abductor digiti minimi and the third palmar interosseous abduct and adduct it."},"one":"The axis for finger abduction and adduction is the middle (third) finger."},"w10_wrist-22":{"q":"In Dupuytren contracture, fibrous shortening of the palmar aponeurosis typically pulls the ring and little fingers into partial flexion at the:","o":["DIP joints only","MCP and PIP joints","Carpometacarpal joints only","Wrist and DIP joints","Interphalangeal joint of the thumb"],"a":1,"src":"Wrist & Hand 2.pdf, slide 18","img":[{"u":"img/w10_wrist/p18.webp","cap":"Wrist & Hand 2.pdf, slide 18","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"**Dupuytren contracture** is a disease in which the palmar fascia/aponeurosis thickens, shortens, and becomes fibrotic. As the longitudinal bands of the medial (ulnar) palmar aponeurosis degenerate, the **ring and little fingers** are pulled into partial flexion at the **metacarpophalangeal (MCP) and proximal interphalangeal (PIP) joints**. The distal interphalangeal (DIP) joints are typically less involved.\n\nIt begins as a painless nodule adherent to the skin, and gradually a raised ridge develops from the palm to the base of the fourth and fifth digits. Treatment is usually surgical excision of the fibrotic palmar fascia to free the fingers.","why":{"0":"The DIP joint is not the typical main site of flexion in this disease; the MCP and PIP joints are mainly flexed.","2":"The CMC joints are not the main joints deformed in Dupuytren contracture.","3":"The wrist and DIP joints are not the main sites of deformity.","4":"The thumb IP joint is not a typical site; the disease favors the fourth and fifth digits."},"one":"In Dupuytren contracture, the longitudinal aponeurotic bands flex the ring and little fingers at the MCP and PIP joints."},"w10_wrist-23":{"q":"Dupuytren contracture of the palmar fascia is frequently bilateral and is typically seen in:","o":["Young women after acute trauma","Children with trigger digits","Some men older than 50 years","Patients with acute median-nerve entrapment","Athletes immediately after a skier’s fall"],"a":2,"src":"Wrist & Hand 2.pdf, slide 18","img":[{"u":"img/w10_wrist/p18.webp","cap":"Wrist & Hand 2.pdf, slide 18","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"Dupuytren contracture is **frequently bilateral** and is typically seen in **some men older than 50**. The cause is not fully known, but there is evidence suggesting a **hereditary predisposition**.\n\nIt starts as a painless nodule in the palmar aponeurosis that adheres to the skin, and progressive contracture of the longitudinal bands flexes the fourth and fifth digits at the MCP and PIP joints. Its course differs from acute inflammation, nerve entrapment, or traumatic ligament rupture. Treatment is usually excision of the fibrotic palmar fascia to free the fingers.","why":{"0":"The typical patient is not a young woman but a middle-aged or older man, and it is not an acute traumatic condition.","1":"Pediatric trigger finger is stenosis at the A1 pulley, which is different from fibrosis of the aponeurosis.","3":"Median nerve entrapment (carpal tunnel syndrome) is characterized by numbness and night pain, not contracture of the aponeurosis.","4":"Skiing injuries are associated with injury to the thumb ulnar collateral ligament and are unrelated to Dupuytren."},"one":"Dupuytren contracture is common in men over 50, is often bilateral, and suggests a hereditary predisposition."},"w10_wrist-24":{"q":"The superficial palmar arch is formed primarily by the:","o":["Radial artery","Princeps pollicis artery","Anterior interosseous artery","Ulnar artery","Deep palmar branch of the radial artery alone"],"a":3,"src":"Wrist & Hand 2.pdf, slide 19","img":[{"u":"img/w10_wrist/p19.webp","cap":"Wrist & Hand 2.pdf, slide 19","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"The arteries of the hand form two arches.\n\nThe **superficial palmar arch** is formed mainly by the **ulnar artery**; its branches are the deep palmar branch, the common palmar digital arteries, and the proper palmar digital arteries. The **deep palmar arch** is formed mainly by the **radial artery** and gives the superficial palmar branch, the princeps pollicis, the radialis indicis, and the dorsal carpal and dorsal metacarpal arteries.\n\nJust carry forward the forearm rule \"ulnar artery → superficial arch, radial artery → deep arch\" into the hand.","why":{"0":"The radial artery mainly forms the deep palmar arch.","1":"The princeps pollicis is a branch of the radial artery (deep arch) system.","2":"The anterior interosseous artery is a deep forearm vessel, not the main artery forming the superficial arch.","4":"The deep palmar branch of the radial artery belongs to the deep arch side and is not the main vessel forming the superficial arch."},"one":"The superficial palmar arch is formed mainly by the ulnar artery; the deep arch mainly by the radial artery."},"w10_wrist-25":{"q":"The princeps pollicis and radialis indicis arteries typically arise from the:","o":["Superficial palmar arch","Ulnar artery in Guyon’s canal","Common palmar digital arteries","Anterior interosseous artery","Radial artery (deep palmar system)"],"a":4,"src":"Wrist & Hand 2.pdf, slide 19, 20","img":[{"u":"img/w10_wrist/p19.webp","cap":"Wrist & Hand 2.pdf, slide 19","w":1200,"h":900},{"u":"img/w10_wrist/p20.webp","cap":"Wrist & Hand 2.pdf, slide 20","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"In the hand, the radial artery forms the **deep palmar arch**, and its branches include the **princeps pollicis artery** and the **radialis indicis artery**. The dorsal carpal and dorsal metacarpal arteries also belong to this lateral system.\n\nThe ulnar artery forms the superficial palmar arch and gives off the common and proper palmar digital arteries to the fingers. An arteriogram of an adolescent hand shows these arches and branches together with the open epiphyseal growth plates of the long bones of the fingers.","why":{"0":"The superficial palmar arch is formed mainly by the ulnar artery and is not the typical origin of these two arteries.","1":"The ulnar artery in Guyon's canal continues into the ulnar-side arch and branches; it is not the standard origin of the princeps pollicis.","2":"The common palmar digital arteries arise from the superficial arch and split into the proper digital arteries.","3":"The anterior interosseous artery is a deep forearm vessel."},"one":"The princeps pollicis and radialis indicis arteries are branches of the radial artery (deep palmar system)."},"w10_wrist-26":{"q":"Cutaneous innervation of the thenar eminence and the lateral palm is provided by the:","o":["Median nerve","Ulnar nerve","Radial nerve","Musculocutaneous nerve","Medial antebrachial cutaneous nerve"],"a":0,"src":"Wrist & Hand 2.pdf, slide 21","img":[{"u":"img/w10_wrist/p21.webp","cap":"Wrist & Hand 2.pdf, slide 21","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"Cutaneous innervation of the hand is shared by three nerves.\n\nThe **median nerve** covers the **thenar eminence and lateral palm**, giving a palmar branch and digital nerves. On the palm, the thumb, index, middle, and radial half of the ring finger are median territory, and its autonomous zone over the tips of the index and middle fingers is especially distinct.\n\nThe ulnar nerve covers the hypothenar/medial palm and the medial dorsum, and the superficial branch of the radial nerve covers the lateral dorsum. The palmar cutaneous branch of the median nerve branches off proximal to the carpal tunnel, so sensation over the proximal palm may be relatively spared in carpal tunnel syndrome.","why":{"1":"The ulnar nerve supplies the hypothenar eminence, medial palm, and medial dorsum of the hand.","2":"The radial nerve supplies the lateral dorsum of the hand (superficial branch).","3":"The musculocutaneous nerve ends in the lateral forearm skin and does not supply the palm.","4":"The medial antebrachial cutaneous nerve supplies the skin of the medial forearm."},"one":"Median nerve: thenar eminence and lateral palm. Ulnar nerve: medial palm and medial dorsum. Radial nerve: lateral dorsum."},"w10_wrist-27":{"q":"The lateral dorsum of the hand is supplied by the:","o":["Ulnar nerve","Superficial branch of the radial nerve","Palmar digital branches of the median nerve only","Posterior antebrachial cutaneous nerve alone","Deep branch of the ulnar nerve"],"a":1,"src":"Wrist & Hand 2.pdf, slide 21","img":[{"u":"img/w10_wrist/p21.webp","cap":"Wrist & Hand 2.pdf, slide 21","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"Sensation on the dorsum of the hand differs between the lateral and medial sides.\n\nThe **lateral dorsum** is supplied by the **superficial branch of the radial nerve**, which gives dorsal digital branches. The **medial dorsum** is supplied by the ulnar nerve (dorsal branch). Part of the dorsal fingertips of the index and middle fingers belongs to palmar digital branches of the median nerve, which wrap around the fingertips to form its autonomous zone.\n\nThe deep branch of the radial nerve (PIN) is essentially motor and does not supply a broad area of dorsal skin, so lock in \"lateral dorsal sensation = superficial branch.\"","why":{"0":"The ulnar nerve supplies the medial dorsum (ulnar side of the ring finger and the little finger).","2":"Palmar digital branches of the median nerve cover only the autonomous zone on the dorsal fingertips, not the whole lateral dorsum.","3":"The posterior antebrachial cutaneous nerve supplies the skin of the posterior forearm and is not the main nerve of the lateral dorsum.","4":"The deep branch of the ulnar nerve is mainly the motor branch to the intrinsic hand muscles."},"one":"Lateral dorsal hand sensation = superficial radial nerve; medial dorsum = ulnar nerve."},"w10_wrist-28":{"q":"Besides the hypothenar and medial palmar skin, the ulnar nerve also supplies the:","o":["Entire dorsum of the hand","Lateral 3½ digits on the palmar surface","Medial dorsum of the hand","Skin of the anatomical snuffbox only","Posterior skin of the arm exclusively"],"a":2,"src":"Wrist & Hand 2.pdf, slide 21","img":[{"u":"img/w10_wrist/p21.webp","cap":"Wrist & Hand 2.pdf, slide 21","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"The ulnar nerve's cutaneous territory spans both the palm and the dorsum.\n\nOn the palm it covers the **hypothenar eminence and medial palm** (the little finger and ulnar side of the ring finger) through its superficial branch. In addition, the **medial dorsum of the hand** is also supplied by the ulnar nerve. This dorsal cutaneous branch arises proximal to the wrist (in the distal forearm), so compression in the ulnar tunnel at the wrist spares medial dorsal sensation, whereas compression at the elbow (cubital tunnel) can reduce medial dorsal sensation as well.\n\nThe palmar surface of the lateral 3½ digits is median territory, and the lateral dorsum is the superficial radial nerve.","why":{"0":"The lateral dorsum is radial nerve territory, so the ulnar nerve does not supply the entire dorsum.","1":"The palmar surface of the lateral 3½ digits is median nerve territory.","3":"The skin of the anatomical snuffbox belongs to the superficial radial nerve.","4":"The posterior skin of the arm is the territory of the posterior brachial cutaneous nerve, a branch of the radial nerve."},"one":"The ulnar nerve supplies the medial dorsum of the hand as well as the medial palm."},"w10_wrist-29":{"q":"Within the carpal tunnel, the structure described as the sensitive structure most vulnerable to compression is the:","o":["Tendon of flexor carpi radialis","Tendon of flexor pollicis longus","Superficial palmar arch","Median nerve","Ulnar nerve"],"a":3,"src":"Wrist & Hand 2.pdf, slide 10, 11","img":[{"u":"img/w10_wrist/p10.webp","cap":"Wrist & Hand 2.pdf, slide 10","w":1200,"h":900},{"u":"img/w10_wrist/p11.webp","cap":"Wrist & Hand 2.pdf, slide 11","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"Among the contents of the carpal tunnel, the **median nerve** is emphasized as **the sensitive structure**. The tendons (FPL, FDS, FDP, and the FCR in its separate passage) can swell with synovial inflammation and raise the pressure in the tunnel, but the symptoms appear mainly from compression of the median nerve.\n\nThe ulnar nerve is in a separate passage outside the tunnel on the ulnar side, and the superficial palmar arch lies in a more distal plane of the palm (palmar to the flexor tendons, just beneath the palmar fascia). So remember: \"vulnerable structure in the carpal tunnel = median nerve.\"","why":{"0":"The FCR tendon runs in its own separate passage and is not singled out as the most sensitive structure.","1":"The FPL tendon is a content of the tunnel, but the sensitive structure that suffers from compression is the median nerve.","2":"The superficial palmar arch is not a structure inside the carpal tunnel.","4":"The ulnar nerve lies outside the carpal tunnel on its ulnar side."},"one":"The most sensitive structure to compression in the carpal tunnel is the median nerve."},"w10_wrist-30":{"q":"Tinel’s sign at the wrist is elicited by gently tapping over the median nerve in the region of the:","o":["Extensor retinaculum","Anatomical snuffbox","Medial epicondyle","Hook of the hamate only","Flexor retinaculum"],"a":4,"src":"Wrist & Hand 2.pdf, slide 11","img":[{"u":"img/w10_wrist/p11.webp","cap":"Wrist & Hand 2.pdf, slide 11","w":1200,"h":900}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10,"exp":"In carpal tunnel syndrome, **Tinel's sign** is the reproduction of tingling or pain radiating into the median nerve territory when the median nerve is gently tapped over the **flexor retinaculum**.\n\nThis also explains why pressure at that spot irritates the median nerve. Tapping at the medial epicondyle of the elbow tests the ulnar nerve, and tapping near the hook of the hamate can irritate the ulnar nerve in the ulnar tunnel. The extensor retinaculum and snuffbox are not on the path of the median nerve.","why":{"0":"The extensor retinaculum is a band holding down the dorsal extensor tendons, not the site for tapping the median nerve.","1":"The anatomical snuffbox is a lateral dorsal depression near the radial artery and superficial radial nerve.","2":"Behind the medial epicondyle is where Tinel's test is done for the ulnar nerve.","3":"Tapping near the hook of the hamate can irritate the ulnar nerve in the ulnar tunnel."},"one":"Tinel's sign at the wrist is elicited by tapping the median nerve over the flexor retinaculum."},"w10_riedel-1":{"q":"Unrelieved peripheral-nerve compression may produce irreversible change through which sequence of events?","o":["Distal axonal degeneration, fibrosis, and muscle denervation","Isolated myelin edema without axonal injury","Hypertrophy of the denervated muscle belly","Proximal muscle hyperplasia with preserved axons","Venous congestion of the nerve sheath alone"],"a":0,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 5","img":[{"u":"img/w10_riedel/p05.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 5","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"When a peripheral nerve is compressed for a long time, structural changes accumulate.\n\nOnce **distal axonal degeneration**, a build-up of axonal material proximally, **fibrosis**, and **denervation of muscle** have occurred, some of the changes are already **irreversible**. So even if the compression is relieved late, sensory loss or muscle atrophy may not fully recover.\n\nThis pathophysiology is the basis for explaining that late surgery for carpal or cubital tunnel syndrome may \"stop the progression, but symptoms may remain.\" Decompressing at the stage of simple congestion or reversible edema gives a better prognosis.","why":{"1":"With continued compression, the process goes beyond myelin edema to axonal degeneration and fibrosis.","2":"Denervated muscle atrophies; it does not hypertrophy.","3":"The process is not proximal muscle hyperplasia with preserved axons.","4":"Venous congestion can be part of the early mechanism, but it is not the whole sequence leading to irreversible change."},"one":"Sustained compression causes axonal degeneration, fibrosis, and muscle denervation, making some changes irreversible."},"w10_riedel-2":{"q":"The most common compression neuropathy of the upper extremity is:","o":["Cubital tunnel syndrome","Carpal tunnel syndrome","Radial tunnel syndrome","Anterior interosseous syndrome","Ulnar tunnel (Guyon’s canal) syndrome"],"a":1,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 6, 10, 11, 21","img":[{"u":"img/w10_riedel/p06.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 6","w":1200,"h":900},{"u":"img/w10_riedel/p10.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 10","w":1200,"h":900},{"u":"img/w10_riedel/p11.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 11","w":1200,"h":900},{"u":"img/w10_riedel/p21.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 21","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"Among the entrapment neuropathies of the upper extremity, **the most common is carpal tunnel syndrome**, compression of the median nerve in the carpal tunnel. It causes pain and paresthesias in the median nerve distribution; symptoms are **worse at night and in extreme wrist positions**, and patients may drop things because of weakness or sensory change.\n\nThe **second most common** is **cubital tunnel syndrome**, compression of the ulnar nerve at the elbow. Ulnar tunnel syndrome, radial tunnel syndrome, and anterior interosseous syndrome are also on the differential list.\n\nThe most important diagnostic tool is the **history and physical examination (H&P)**. X-ray, CT, and MRI are not useful; EMG/NCS can confirm the diagnosis or help with double crush, diabetic neuropathy, or patients who are hard to examine.","why":{"0":"Cubital tunnel syndrome is the second most common compression neuropathy of the upper extremity.","2":"Radial tunnel syndrome is on the differential list but is not the most common.","3":"Anterior interosseous syndrome is a motor palsy of the deep branch of the median nerve and is not the most common.","4":"Ulnar tunnel syndrome is a less common entrapment of the ulnar nerve at the wrist."},"one":"The most common upper-extremity compression neuropathy is carpal tunnel syndrome; second is cubital tunnel syndrome."},"w10_riedel-3":{"q":"Symptoms of carpal tunnel syndrome are characteristically worse:","o":["Only after acute elbow trauma","During mid-day meals","At night and in extreme wrist positions","Exclusively with shoulder abduction","Only after a positive thumb grind test"],"a":2,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 10","img":[{"u":"img/w10_riedel/p10.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 10","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"The classic history of carpal tunnel syndrome is **pain and paresthesias** in the median nerve distribution, with symptoms that get worse **at night** and in **positions of extreme wrist flexion or extension**. Patients may also drop things because of weakness or sensory change.\n\nAt night many people unconsciously sleep with their wrists flexed, which raises pressure in the tunnel, and waking up with numbness is common. This history alone contributes a great deal to the clinical diagnosis; the history and exam matter more than imaging.","why":{"0":"Acute elbow trauma fits the history of an ulnar nerve injury.","1":"Symptoms are not specifically related to mid-day meals.","3":"Shoulder abduction is more related to symptoms of the lower trunk of the brachial plexus.","4":"The grind test is the test for thumb CMC arthritis."},"one":"Carpal tunnel syndrome: numbness and pain get worse at night and in extreme wrist positions."},"w10_riedel-4":{"q":"In the evaluation of suspected carpal tunnel syndrome, the most important diagnostic tool is:","o":["Plain radiographs of the wrist","CT of the carpal tunnel","MRI of the median nerve","History and physical examination","Routine bone scintigraphy"],"a":3,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 11","img":[{"u":"img/w10_riedel/p11.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 11","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"Many tests exist for carpal tunnel syndrome, but **the most important diagnostic tool is the history and physical examination (H&P)**.\n\n**X-ray, CT, and MRI are not useful.** EMG/NCS can confirm the diagnosis or help in cases of double crush, diabetic neuropathy, or when the physical exam is difficult.\n\nIn other words, clinical findings come first: the typical nocturnal numbness, symptoms in the median distribution, and the Phalen, Tinel, and direct compression tests. Don't try to \"confirm\" it with imaging first.","why":{"0":"Plain radiographs are not useful for this diagnosis.","1":"CT is also listed as an imaging test that is not useful.","2":"MRI is not useful for the primary diagnosis either.","4":"A bone scan is not a diagnostic tool for carpal tunnel syndrome."},"one":"The key to diagnosing carpal tunnel syndrome is the history and physical exam; X-ray, CT, and MRI are not useful."},"w10_riedel-5":{"q":"A Phalen’s test is considered positive when wrist flexion with the elbows on the table produces numbness and tingling in the radial digits within:","o":["10 seconds","15 seconds","30 seconds","90 seconds","60 seconds"],"a":4,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 12, 13","img":[{"u":"img/w10_riedel/p12.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 12","w":1200,"h":900},{"u":"img/w10_riedel/p13.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 13","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"In **Phalen's test** the patient rests the elbows on the table and holds the **wrists flexed**, and you watch for paresthesias provoked by that position. It is positive if numbness and tingling appear in the radial digits (median territory) **within 60 seconds**. The illustration shows both hands pressed together in wrist flexion, labeled \"ONE MINUTE.\"\n\nIt suggests carpal tunnel syndrome, but with a sensitivity of 0.75 and a specificity of 0.47 its specificity is not high. Interpret it together with the direct compression test (30 seconds, sensitivity 0.87, specificity 0.90) and Tinel's sign (sensitivity 0.60, specificity 0.67).","why":{"0":"10 seconds is not the positive threshold for Phalen's test.","1":"15 seconds is not the positive threshold for Phalen's test.","2":"30 seconds is the positive time for the direct median nerve compression test.","3":"90 seconds is not the stated threshold; Phalen's is 60 seconds."},"one":"Phalen's test: hold wrist flexion for 60 seconds; tingling in the radial digits = positive."},"w10_riedel-6":{"q":"Direct compression of the median nerve at the wrist (a Durkan-type test) is considered positive if paresthesias occur within:","o":["30 seconds","60 seconds","90 seconds","2 minutes","5 minutes"],"a":0,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 14, 15","img":[{"u":"img/w10_riedel/p14.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 14","w":1200,"h":900},{"u":"img/w10_riedel/p15.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 15","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"**Direct compression** of the median nerve at the wrist provokes paresthesias in response to pressure. It is considered positive if paresthesia appears **within 30 seconds**, and it fairly strongly suggests carpal tunnel syndrome. Its sensitivity is 0.87 and specificity 0.90, a higher specificity than Phalen's test (60 seconds, sensitivity 0.75, specificity 0.47) or Tinel's sign (sensitivity 0.60, specificity 0.67).\n\nTinel's sign taps the median nerve at the wrist to look for irritability at the site of axonal injury; tingling and shooting pain spread into the nerve's distribution. Use all three tests together and prioritize clinical findings over imaging.","why":{"1":"60 seconds is the positive time for Phalen's test.","2":"90 seconds is not the threshold for this direct compression test.","3":"2 minutes is not the stated positive threshold.","4":"5 minutes is far too long and is not the positive threshold."},"one":"Direct median nerve compression is positive with paresthesia within 30 seconds and is the most specific of the three tests."},"w10_riedel-7":{"q":"Static two-point discrimination greater than 6 mm in a patient being evaluated for carpal tunnel syndrome indicates:","o":["Early, fully reversible nerve irritability only","Advanced nerve dysfunction or nerve laceration","A normal finding in most adults","An isolated muscle end-plate disorder","Ulnar rather than median nerve disease"],"a":1,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 16, 17","img":[{"u":"img/w10_riedel/p16.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 16","w":1200,"h":900},{"u":"img/w10_riedel/p17.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 17","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"Two-point discrimination tests the discriminative sensation of a nerve. It is considered abnormal when **static two-point discrimination is greater than 6 mm** or **moving two-point discrimination is greater than 5 mm**.\n\nHowever, both of these indicate **advanced nerve dysfunction** or **nerve laceration**. In other words, they are not screening tests for early carpal tunnel syndrome; they become abnormal only once the damage is already severe.\n\nThe monofilament test applies progressively thicker filaments to the palmar fingers until the patient can tell which finger is touched. A value greater than 2.83 in the radial three digits suggests carpal tunnel syndrome, with a sensitivity of 0.83.","why":{"0":"Abnormal two-point discrimination indicates advanced dysfunction, not early irritability.","2":"Static two-point discrimination greater than 6 mm is not considered normal.","3":"This test measures discriminative sensation of a peripheral nerve and is not a specific finding of an end-plate disorder.","4":"This abnormality, tested in the radial digits, points to advanced damage in the median nerve distribution."},"one":"Static two-point discrimination > 6 mm (moving > 5 mm) indicates advanced nerve dysfunction or laceration."},"w10_riedel-8":{"q":"For intermediate carpal tunnel syndrome with possible weakness of thumb abduction and an irritable median nerve, the recommended treatment is:","o":["Observation alone for 12 months","Repeated steroid injection of the A1 pulley","Surgical decompression","Immediate thumb CMC arthrodesis","Radial-nerve transposition at the elbow"],"a":2,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 18, 19, 20","img":[{"u":"img/w10_riedel/p18.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 18","w":1200,"h":900},{"u":"img/w10_riedel/p19.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 19","w":1200,"h":900},{"u":"img/w10_riedel/p20.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 20","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"In intermediate carpal tunnel syndrome, there **may be weakness of thumb abduction**, and provoking the nerve is painful. The treatment at this stage is **surgical decompression**. On exam, the examiner resists palmar abduction of the thumb (abductor pollicis brevis) to assess strength.\n\nIn the late stage there is permanent sensory loss, muscle atrophy, and weak grasp, with or without pain. Treatment is again surgical decompression; symptoms may persist after surgery, but **progression and pain can be halted**. Atrophy that is already present is not a contraindication to surgery.\n\nThe late-stage photo shows a hand with a wasted thenar eminence and a decompression scar on the front of the wrist.","why":{"0":"Prolonged observation alone is not the recommended treatment at the intermediate stage.","1":"A1 pulley injection is the treatment for trigger finger.","3":"Thumb CMC fusion is not a treatment for this nerve entrapment.","4":"Moving the radial nerve at the elbow has nothing to do with median nerve decompression."},"one":"Intermediate and late carpal tunnel syndrome are treated with surgical decompression; late stage halts progression, but symptoms may remain."},"w10_riedel-9":{"q":"After decompression for late carpal tunnel syndrome with muscle atrophy and permanent sensory loss, surgery is expected to:","o":["Restore all lost sensation in every patient","Reverse established thenar atrophy completely","Cure nocturnal pain without affecting progression","Halt progression and pain, although symptoms may persist","Be contraindicated once atrophy is present"],"a":3,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 19, 20","img":[{"u":"img/w10_riedel/p19.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 19","w":1200,"h":900},{"u":"img/w10_riedel/p20.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 20","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"The late stage features permanent sensory loss, muscle atrophy, and weak grasp, with or without pain. Treatment is **surgical decompression**.\n\nAfter surgery, **symptoms may persist**. However, surgery **halts progression and relieves pain**; it does not guarantee that axons and muscle that have already changed irreversibly will return to normal. The presence of atrophy is not a contraindication to surgery.\n\nThe clinical photos show a hollowed thenar eminence, a hand making a fist after decompression, and a scar on the front of the wrist.","why":{"0":"In the late stage you cannot expect full recovery of sensation in every patient.","1":"Established thenar atrophy does not necessarily recover completely.","2":"The goal of surgery is to stop progression and reduce pain, not to remove pain while leaving progression unchecked.","4":"Decompression is still performed when atrophy is present; it is not contraindicated."},"one":"Decompression in late-stage disease halts progression and pain, but existing symptoms may remain."},"w10_riedel-10":{"q":"Cubital tunnel syndrome, the second most frequent upper-extremity nerve entrapment, may occur at any of several elbow sites, one of which is:","o":["The spinoglenoid notch","The transverse carpal ligament","Lister’s tubercle of the radius","The first dorsal extensor compartment","Osborne’s ligament"],"a":4,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 21, 22, 23","img":[{"u":"img/w10_riedel/p21.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 21","w":1200,"h":900},{"u":"img/w10_riedel/p22.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 22","w":1200,"h":900},{"u":"img/w10_riedel/p23.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 23","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"Cubital tunnel syndrome is compression of the ulnar nerve at the elbow and is the **second most common** nerve entrapment of the upper extremity. The incidence is even higher if transient numbness and paresthesias are included.\n\nCompression can occur anywhere along a **roughly 15 cm segment** around the elbow, and **five sites** are listed: the **medial intermuscular septum**, the **medial epicondyle**, the **epicondylar groove**, **Osborne's ligament**, and the **flexor carpi ulnaris (FCU)**.\n\nThe ulnar nerve supplies only 2 muscles in the forearm, but it is responsible for most of the hand muscles (14½) and ulnar-sided hand sensation, so the hand symptoms of an elbow entrapment can be substantial.","why":{"0":"The spinoglenoid notch is a structure of the scapula, not a site of ulnar nerve entrapment at the elbow.","1":"The transverse carpal ligament is the roof of the carpal tunnel and a site of median nerve entrapment.","2":"Lister's tubercle is the dorsal radial tubercle around which the extensor pollicis longus tendon turns.","3":"The first dorsal compartment is the site of De Quervain disease."},"one":"Osborne's ligament is one of the five possible compression sites in cubital tunnel syndrome."},"w10_riedel-11":{"q":"In a patient with numbness of the ring and little fingers, sensory loss over the dorsal ulnar hand suggests that the compression is:","o":["At the elbow (proximal to the dorsal branch)","Only in Guyon’s canal at the wrist","Of the median nerve in the carpal tunnel","Of the superficial radial nerve","Of the posterior cord in the axilla only"],"a":0,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 24, 25","img":[{"u":"img/w10_riedel/p24.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 24","w":1200,"h":900},{"u":"img/w10_riedel/p25.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 25","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"Typical symptoms of cubital tunnel syndrome are numbness and paresthesias of the ring and little fingers, medial elbow pain that radiates down the forearm or up toward the neck, weakness when opening a jar or bottle, and easy fatigue with repetitive activity.\n\n**Sensory loss over the dorsal ulnar hand** is important localizing information. The **dorsal cutaneous branch** of the ulnar nerve leaves in the forearm proximal to the wrist, so if sensation is lost in this area as well, the compression is likely more proximal, such as **at the elbow rather than at the wrist (Guyon's canal)**. Conversely, with entrapment only in the ulnar tunnel at the wrist, dorsal sensation is preserved.\n\nIf the ulnar Tinel's sign is also positive at the wrist, suspect **compression at two sites**. Confirming sensory deficits in the ring and little fingers with monofilament testing is also important.","why":{"1":"With entrapment only in Guyon's canal, the dorsal cutaneous branch has already branched off, so sensation over the dorsal ulnar hand is usually preserved.","2":"The median nerve territory is the radial digits and has nothing to do with the dorsal ulnar hand.","3":"The superficial radial nerve supplies sensation to the lateral dorsum of the hand.","4":"A posterior cord lesion broadly affects radial and axillary nerve territories and does not explain this finding alone."},"one":"Ring/little finger numbness plus loss of dorsal ulnar hand sensation suggests compression at the elbow (proximal to the dorsal branch)."},"w10_riedel-12":{"q":"The elbow flexion test for cubital tunnel syndrome, regarded as the equivalent of Phalen’s test at the wrist, must be held for:","o":["15 seconds","1 minute","3 minutes","5 minutes","10 seconds"],"a":1,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 26, 28","img":[{"u":"img/w10_riedel/p26.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 26","w":1200,"h":900},{"u":"img/w10_riedel/p28.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 28","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"The **elbow flexion test** is the provocative test equivalent to Phalen's test at the wrist. The elbow is held flexed for **1 minute**, and reproduction of paresthesias in the ring and little fingers is positive. **The false-positive rate is about 10%.**\n\nYou can also palpate along the ulnar nerve (medial arm, behind the medial epicondyle, ulnar border of the forearm) to check for irritability. Weakness of the intrinsic hand muscles appears later than numbness; assess it with first dorsal interosseous abduction or the \"cross-finger\" test, and with progression clawing appears.","why":{"0":"15 seconds is not the hold time for this test.","2":"3 minutes is longer than the stated hold time; the standard is 1 minute.","3":"5 minutes is not the stated hold time.","4":"10 seconds is too short and is not the standard hold time."},"one":"The elbow flexion test is held for 1 minute; reproduced ring/little finger tingling = positive (about 10% false positives)."},"w10_riedel-13":{"q":"A useful motor test later in cubital tunnel syndrome, after numbness has already appeared, is:","o":["Resisted thumb IP flexion only","The Phalen maneuver at the wrist","First dorsal interosseous or “cross-finger” test","Finkelstein’s test","The grind test of the thumb CMC joint"],"a":2,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 28","img":[{"u":"img/w10_riedel/p28.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 28","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"In cubital tunnel syndrome, **weakness of the intrinsic hand muscles appears later than numbness**. Useful motor tests are **abduction of the first dorsal interosseous** and the **\"cross-finger\" test**. In advanced stages **clawing** appears.\n\nThe first dorsal interosseous abducts the index finger laterally away from the middle-finger axis and is the bulging muscle in the first web space on the back of the hand. Atrophy of this muscle or weak resisted abduction suggests motor involvement of the ulnar nerve.","why":{"0":"Thumb IP flexion tests the flexor pollicis longus (anterior interosseous nerve), not the ulnar-innervated intrinsic muscles.","1":"Phalen's test is the provocative test for the median nerve in the carpal tunnel.","3":"Finkelstein's test is the test for the first dorsal compartment (De Quervain).","4":"The grind test assesses thumb CMC arthritis."},"one":"In cubital tunnel syndrome intrinsic weakness comes late; test it with first dorsal interosseous abduction or the cross-finger test."},"w10_riedel-14":{"q":"To isolate flexor digitorum superficialis, the examiner should:","o":["Stabilize the middle phalanx and test DIP flexion","Hold the wrist extended and test MCP flexion","Tap over the flexor retinaculum for shooting pain","Hold the other fingers extended and test PIP flexion","Ulnar-deviate a fist that encloses the thumb"],"a":3,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 35","img":[{"u":"img/w10_riedel/p35.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 35","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"The **flexor digitorum superficialis (FDS)** inserts on the middle phalanx and **flexes the PIP joint**. But the flexor digitorum profundus (FDP) can also flex the PIP, so to see the FDS alone you have to functionally block the FDP.\n\nThe FDP has a muscle belly shared by several fingers, so **holding the other fingers extended** makes it hard for the FDP to work in the finger being tested. Then, when the patient **flexes the PIP joint of the tested finger**, you are isolating the FDS. The figure shows one finger flexing at the PIP while the others are held extended.\n\nConversely, to test the FDP you stabilize the middle phalanx (keeping the PIP extended) and have the patient flex only the DIP.","why":{"0":"Stabilizing the middle phalanx and testing DIP flexion is the FDP test.","1":"MCP flexion after wrist hyperextension is not a test that isolates the FDS.","2":"Tapping over the retinaculum is Tinel's test.","4":"Ulnar deviation of a fist enclosing the thumb is Finkelstein's test."},"one":"FDS test: hold the other fingers extended and have the patient flex the PIP of the tested finger."},"w10_riedel-15":{"q":"To test flexor digitorum profundus of a finger, the examiner should:","o":["Hold the other fingers extended and test PIP flexion","Resist palmar abduction of the thumb","Compress both wrist arteries and then release one","Ask for isolated MCP extension against resistance","Stabilize the middle phalanx and test DIP flexion"],"a":4,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 34, 36","img":[{"u":"img/w10_riedel/p34.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 34","w":1200,"h":900},{"u":"img/w10_riedel/p36.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 36","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"The **flexor digitorum profundus (FDP)** inserts on the distal phalanx and **flexes the DIP joint**. DIP flexion is a function unique to the FDP, so you **stabilize the middle phalanx with the PIP extended** and ask the patient to **flex the DIP**. The figure shows the examiner's finger holding the middle phalanx while the distal segment flexes.\n\nIn a normal fist the fingers converge toward the scaphoid tubercle; with a rotational deformity, the fingers cross over each other when making a fist, which is called **digital scissoring**.","why":{"0":"Holding the other fingers extended and testing PIP flexion is the FDS test.","1":"Palmar abduction of the thumb tests the abductor pollicis brevis (median nerve).","2":"Compressing both arteries and releasing one is Allen's test.","3":"MCP extension is a function of the extrinsic extensors."},"one":"FDP test: stabilize the middle phalanx with the PIP extended and have the patient flex the DIP."},"w10_riedel-16":{"q":"Trigger digit, a common cause of hand pain with catching or locking of a flexor tendon, typically results from entrapment at the:","o":["A1 pulley, palmar to the metacarpal head","A2 pulley alone","First dorsal extensor compartment","Flexor retinaculum of the carpal tunnel","Sagittal band of the extensor hood"],"a":0,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 37, 38, 40","img":[{"u":"img/w10_riedel/p37.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 37","w":1200,"h":900},{"u":"img/w10_riedel/p38.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 38","w":1200,"h":900},{"u":"img/w10_riedel/p40.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 40","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"Trigger finger is one of the **most common causes of hand pain**; the flexor tendon gives a feeling of **catching and popping**. The digit may lock in flexion and need to be straightened passively, or conversely may be unable to flex fully, and a stiff, painful PIP joint can accompany it.\n\nA history of morning stiffness is common, symptoms improve with heat, and it may be related to repetitive activity. The entrapment occurs at the **A1 pulley**, which is easy to locate by pressing on the palm at the level of the metacarpal head and finding tenderness. In children you can see a thumb locked in flexion and surgical release at the A1 pulley.","why":{"1":"The typical entrapment site in trigger finger is the A1 pulley, not the A2.","2":"The first dorsal compartment is the site of De Quervain disease.","3":"The flexor retinaculum is the roof involved in carpal tunnel syndrome.","4":"Sagittal band injury relates to extensor tendon subluxation and MCP problems."},"one":"Trigger finger results from flexor tendon entrapment at the A1 pulley (palmar to the metacarpal head)."},"w10_riedel-17":{"q":"Most patients with trigger digit become symptom-free after two steroid injections given 6–8 weeks apart. Patients who fail two injections are:","o":["Treated with lifelong weekly injections","Surgical candidates","Managed with immediate ray amputation","Placed in a thumb spica cast","Restricted to night splints indefinitely"],"a":1,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 39, 40","img":[{"u":"img/w10_riedel/p39.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 39","w":1200,"h":900},{"u":"img/w10_riedel/p40.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 40","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"Most trigger finger patients are treated with **steroid injections given 6–8 weeks apart**. **Two injections make 70–80%** of patients symptom-free; **diabetic patients** have a lower success rate. Exercise is encouraged.\n\n**Patients who fail two injections are surgical candidates.** As with the locked thumb seen in children, surgery releases the A1 pulley so the tendon no longer catches. Amputation or a spica cast are not standard from the start.","why":{"0":"Repeating injections weekly for life is not the recommended course; surgery is considered after two failed injections.","2":"Ray amputation is not a treatment for trigger finger.","3":"A thumb spica is used for things like a stable thumb ulnar collateral ligament injury.","4":"Night splints alone indefinitely are not the standard next step after two failed injections."},"one":"Trigger finger that fails two injections (70–80% success, lower in diabetics) is treated surgically."},"w10_riedel-18":{"q":"De Quervain’s disease, stenosis of the first dorsal compartment (APL and EPB) over the radial styloid, is distinguished from thumb CMC arthritis by:","o":["A positive grind test with axial loading of the thumb","Night pain in the median digits","A negative grind test and a positive Finkelstein test","Kanavel signs in the thumb pulp","Thenar atrophy and a simian thumb posture"],"a":2,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 41, 42, 43, 67","img":[{"u":"img/w10_riedel/p41.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 41","w":1200,"h":900},{"u":"img/w10_riedel/p42.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 42","w":1200,"h":900},{"u":"img/w10_riedel/p43.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 43","w":1200,"h":900},{"u":"img/w10_riedel/p67.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 67","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"De Quervain disease is a common cause of **radial-sided hand pain**, especially in **women in their 40s and 50s**. The pathology is stenosis of the **first dorsal compartment** of the wrist, which irritates the **APL and EPB** tendons as they pass over the radial styloid.\n\nIt must be distinguished from **thumb CMC arthritis**. In De Quervain disease the **grind test** (axial loading of the thumb) **is negative**, and **Finkelstein's test** (thumb tucked into the fist, wrist deviated ulnarly) **is positive**. Narrowing of the CMC joint space and subluxation on X-ray point toward arthritis instead.\n\nInjection succeeds in about 50–60% and splinting alone in about 30%; the two can be combined, and patients who fail two injections are candidates for surgical release.","why":{"0":"A positive grind test suggests CMC arthritis; that is the opposite of what distinguishes De Quervain disease.","1":"Night pain in the median digits is typical of carpal tunnel syndrome.","3":"Kanavel signs are findings of pyogenic flexor tenosynovitis.","4":"Thenar atrophy and a simian hand are findings of advanced median nerve compression."},"one":"De Quervain disease: positive Finkelstein, negative grind test, which distinguishes it from thumb CMC arthritis."},"w10_riedel-19":{"q":"Allen’s test assesses patency of the palmar arterial arches by compressing the:","o":["Brachial artery alone at mid-arm","Cephalic and basilic veins at the elbow","Superficial palmar arch in mid-palm","Radial and ulnar arteries, then one released","Princeps pollicis artery on the thumb"],"a":3,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 44, 45, 46, 47","img":[{"u":"img/w10_riedel/p44.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 44","w":1200,"h":900},{"u":"img/w10_riedel/p45.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 45","w":1200,"h":900},{"u":"img/w10_riedel/p46.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 46","w":1200,"h":900},{"u":"img/w10_riedel/p47.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 47","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"The arteries of the hand are the **radial and ulnar arteries**; the **ulnar artery is often dominant**, and the radial artery is easily palpated at the lateral wrist.\n\nIn **Allen's test**, the patient makes a fist, you **compress the radial and ulnar arteries at the wrist simultaneously** until the palm blanches, and then **release one artery** to see whether blood flow returns. The illustration shows thumbs pressing on both arteries at the wrist. The test checks whether collateral circulation through the superficial and deep palmar arches is adequate.\n\nThe ulnar artery passes through Guyon's canal, anastomoses with the deep arch, and curves around the hook of the hamate to form the **superficial palmar arch**, which crosses the palm palmar to the flexor tendons, just under the palmar fascia. The deep arch lies dorsal to the adductor pollicis and anastomoses with the ulnar artery at the distal edge of Guyon's canal.","why":{"0":"Occluding only the brachial artery would not let you assess the collateral circulation between the two hand arteries separately.","1":"The cephalic and basilic veins are superficial veins; compressing them is not a test of the arterial arches.","2":"The test does not compress the arch itself in the palm.","4":"Compressing only the princeps pollicis artery is not Allen's test."},"one":"Allen's test: occlude the radial and ulnar arteries at the wrist, then release one at a time to check palmar arch patency."},"w10_riedel-20":{"q":"Rotational deformity of a metacarpal or phalangeal fracture is best detected by observing:","o":["Isolated loss of the nail plate","A positive Finkelstein test","Thenar muscle atrophy","Delayed capillary refill alone","Digital scissoring with active flexion"],"a":4,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 34, 48, 50, 61, 62","img":[{"u":"img/w10_riedel/p34.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 34","w":1200,"h":900},{"u":"img/w10_riedel/p48.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 48","w":1200,"h":900},{"u":"img/w10_riedel/p50.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 50","w":1200,"h":900},{"u":"img/w10_riedel/p61.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 61","w":1200,"h":900},{"u":"img/w10_riedel/p62.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 62","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"Metacarpal and phalangeal fractures make up about 10% of all fractures; half are work-related, and the **border digits (thumb and little finger)** are commonly involved. Evaluation looks at the mechanism, displacement, whether the fracture is open, intra-articular extension, **angulation and rotational deformity**, stability, and associated injuries.\n\nFracture patterns are transverse, oblique, spiral, and comminuted. **Rotational deformity** is detected as **digital scissoring, in which the fingers cross each other during active flexion** or when making a fist. In normal flexion the fingers converge toward the scaphoid without overlapping. Missing a rotational deformity severely impairs pinch and grip.\n\nFor PIP joint injuries (collateral ligaments, volar plate, dislocations, fractures and fracture-dislocations), a **dynamic external fixator** made of wire is sometimes used to achieve both stability and motion.","why":{"0":"Loss of the nail plate may accompany a distal phalanx crush, but it is not a sign of rotational deformity.","1":"Finkelstein's test is the test for De Quervain disease.","2":"Thenar atrophy is a finding of advanced median nerve compression.","3":"Capillary refill assesses blood flow, not rotational alignment."},"one":"Rotational deformity in a finger fracture is detected as digital scissoring during active flexion."},"w10_riedel-21":{"q":"The safe position for immobilizing an injured hand places the:","o":["MCP joints flexed and the IP joints extended","MCP joints extended and the IP joints fully flexed","Wrist, MCP, and IP joints in full extension","Thumb adducted tightly against the palm","Fingers fully hooked with the wrist flexed"],"a":0,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 51, 52, 53","img":[{"u":"img/w10_riedel/p51.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 51","w":1200,"h":900},{"u":"img/w10_riedel/p52.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 52","w":1200,"h":900},{"u":"img/w10_riedel/p53.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 53","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"The principles of finger fracture treatment are accurate reduction, keeping the uninjured fingers moving, elevation to control swelling, **immobilization in the safe position**, and early motion of the injured finger.\n\nThe **safe (intrinsic-plus) position** places the **MCP joints flexed and the IP joints extended**. In this position the MCP collateral ligaments are stretched and IP extension contractures are avoided. Conversely, prolonged immobilization in the \"comfortable\" position with the MCPs extended and IPs flexed easily leads to stiffness and contracture.\n\nThe figure contrasts a hand with the MCPs flexed and IPs nearly straight (the safe position) with a hand whose IPs are flexed and MCPs less flexed.\n\nAfter immobilization, follow-up X-rays confirm healing. Phalanges remodel over several months, and accurate reduction with early motion reduces deformity and stiffness.","why":{"1":"MCPs extended with IPs flexed is an unsafe immobilization position that readily causes contracture.","2":"Fully extending every joint makes the MCP collateral ligaments prone to shortening.","3":"Holding the thumb tightly adducted against the palm can cause a first web space contracture.","4":"Wrist flexion with hooked fingers is not the safe position."},"one":"The safe immobilization position for an injured hand is MCPs flexed, IPs extended."},"w10_riedel-22":{"q":"A crush injury of the distal phalanx that involves the nail matrix should be treated as:","o":["A closed fracture that never needs antibiotics","An open fracture, and oral antibiotics should be given","A mallet injury requiring immediate tendon repair","An indication for a fish-mouth drainage incision","Flexor tenosynovitis until proven otherwise"],"a":1,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 54","img":[{"u":"img/w10_riedel/p54.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 54","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"Distal phalanx fractures are usually **crush injuries**, often with an accompanying **nail matrix injury**. If the matrix is injured, the fracture is treated as an **open fracture** and **oral antibiotics** are given.\n\nIf the joint is not involved, reduction of the fracture is not necessarily required. A splint is applied for pain relief and protection, and the **MCP and PIP joints are kept moving** to prevent stiffness. The fish-mouth incision is one to avoid when draining a felon because it can cause tip necrosis; it is not the standard treatment for this fracture.","why":{"0":"When the matrix is injured, the fracture is considered open, not closed.","2":"An intra-articular avulsion of the dorsal base is a mallet finger, and most mallet injuries are treated nonoperatively (splinting); not every crush requires immediate tendon repair.","3":"The fish-mouth incision is avoided in felon drainage because of the risk of tip necrosis.","4":"A crush injury without Kanavel signs should not be labeled tenosynovitis."},"one":"A distal phalanx crush that injures the nail matrix is treated as an open fracture with oral antibiotics."},"w10_riedel-23":{"q":"Most mallet fingers are treated nonoperatively with a DIP extension splint, whereas most flexor digitorum profundus avulsions:","o":["Also heal reliably with DIP extension splinting","Are observed until a mallet deformity appears","Require surgical repair","Are treated with an A1-pulley steroid injection","Need only buddy taping of the PIP joint"],"a":2,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 55, 56, 57","img":[{"u":"img/w10_riedel/p55.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 55","w":1200,"h":900},{"u":"img/w10_riedel/p56.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 56","w":1200,"h":900},{"u":"img/w10_riedel/p57.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 57","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"Intra-articular injuries of the distal phalanx are divided into a dorsal-base **mallet** injury and a palmar-base **profundus avulsion**.\n\n**Most mallet fingers are treated nonoperatively.** Clinically the DIP droops and cannot be actively extended; if there is a bony avulsion, X-ray shows a dorsal base fragment. Treatment is a **splint holding the DIP in extension** (with the PIP free).\n\nIn contrast, **most FDP avulsions require surgical repair**. Once the tendon retracts toward the palm, splinting alone cannot restore its insertion.","why":{"0":"A DIP extension splint is the main treatment for mallet finger, not the standard for an FDP avulsion.","1":"Observing an FDP avulsion until a mallet deformity appears is not an appropriate course.","3":"A1 pulley injection is the treatment for trigger finger.","4":"Buddy taping the PIP cannot restore the FDP insertion."},"one":"Mallet finger is usually treated with a DIP extension splint; FDP avulsion usually needs surgery."},"w10_riedel-24":{"q":"At the finger, the extrinsic tendons extend the MCP joint and the intrinsic muscles flex the MCP joint. Extension of the PIP and DIP joints is produced by:","o":["The extrinsics alone","The lumbricals alone","The flexor digitorum profundus tendon","Both the extrinsics and the intrinsics","The dorsal interossei alone"],"a":3,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 58","img":[{"u":"img/w10_riedel/p58.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 58","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"Sort out the roles of finger extension and flexion joint by joint.\n\nThe **extrinsics** **extend the MCP joint**, and the **intrinsics** (lumbricals and interossei) **flex the MCP joint**. However, **both the extrinsics and the intrinsics** contribute to extending the PIP and DIP joints, because both join the central slip and the terminal tendon.\n\nWhen this balance is disrupted, boutonnière deformity, swan-neck deformity, and clawing result. The safe position for fracture immobilization (MCPs flexed, IPs extended) also takes this tendon mechanism and the length of the collateral ligaments into account.","why":{"0":"The extrinsics do not extend the PIP and DIP alone; the intrinsics also contribute through the central slip and terminal tendon.","1":"It is not a function of the lumbricals alone; the extrinsic extensors also contribute to IP extension.","2":"The flexor digitorum profundus is the muscle that flexes the DIP.","4":"It is not a function of the dorsal interossei alone; the extrinsic extensors also extend the IP joints."},"one":"Extrinsics extend the MCP, intrinsics flex the MCP; PIP and DIP extension is done by both together."},"w10_riedel-25":{"q":"Acceptable residual angulation after a small-finger metacarpal neck fracture is up to about:","o":["5 degrees","10–15 degrees","30–40 degrees","90 degrees","50–60 degrees"],"a":4,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 59, 60","img":[{"u":"img/w10_riedel/p59.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 59","w":1200,"h":900},{"u":"img/w10_riedel/p60.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 60","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"Metacarpal neck fractures commonly result from a direct blow. Treatment depends on **which metacarpal** is involved and the **degree of angulation**. The ring and little fingers **compensate for angulation better** than the index and middle fingers.\n\nAcceptable angulation is **10–15° for the index and middle**, **30–40° for the ring**, and **50–60° for the little finger**. Closed reduction uses the **Jahss maneuver** (with the MCP flexed, push the metacarpal head up through the proximal phalanx); the fracture is usually immobilized in a cast or gutter splint, and **motion begins at 2–3 weeks**. Surgery is rarely needed.","why":{"0":"5° is an unnecessarily strict standard for the little finger, which tolerates up to 50–60°.","1":"10–15° is the acceptable range for index and middle metacarpal necks.","2":"30–40° is the acceptable range for the ring metacarpal neck.","3":"90° is far beyond the acceptable range."},"one":"Acceptable metacarpal neck angulation: index/middle 10–15°, ring 30–40°, little 50–60°."},"w10_riedel-26":{"q":"A thumb ulnar collateral ligament injury is considered an unstable joint, usually requiring open repair, when laxity compared with the contralateral thumb exceeds:","o":["30 degrees","10 degrees","15 degrees","45 degrees of IP flexion lag","60 degrees of MCP hyperextension"],"a":0,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 63, 64, 65","img":[{"u":"img/w10_riedel/p63.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 63","w":1200,"h":900},{"u":"img/w10_riedel/p64.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 64","w":1200,"h":900},{"u":"img/w10_riedel/p65.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 65","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"Injury to the ulnar collateral ligament of the thumb MCP joint is common in skiers and ball-handling athletes, may occur together with a dorsal capsule tear or volar plate injury, and can be a midsubstance tear or a bony avulsion.\n\nThe key to treatment is assessing **joint stability**. **Laxity greater than 30° compared with the opposite thumb** means an **unstable joint**. The endpoint of the laxity is also assessed.\n\nA **stable joint** is treated with a **thumb spica cast for 4–6 weeks**; an **unstable joint requires open repair**. Chronic injuries can be reconstructed with a palmaris longus tendon graft.","why":{"1":"10° is below the threshold (30°) for instability.","2":"15° also falls short of the stated instability threshold.","3":"An IP extension lag relates to the assessment of mallet finger.","4":"60° of MCP hyperextension is not the criterion for UCL laxity."},"one":"Thumb UCL: laxity > 30° vs. the other side = unstable → open repair; stable = 4–6 weeks in a spica."},"w10_riedel-27":{"q":"Drainage of a felon (pulp-space infection) should use a midvolar or lateral incision because a fish-mouth incision risks:","o":["Recurrence of a mucous cyst","Tip necrosis","Triggering at the A1 pulley","Injury to the ulnar artery in Guyon’s canal","Isolated DIP extensor lag"],"a":1,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 70, 72, 73","img":[{"u":"img/w10_riedel/p70.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 70","w":1200,"h":900},{"u":"img/w10_riedel/p72.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 72","w":1200,"h":900},{"u":"img/w10_riedel/p73.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 73","w":1200,"h":900}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10,"exp":"A **felon** is an infection of the fat pad (pulp) of the fingertip, characterized by **severe throbbing pain and swelling**; the most common organism is ***Staphylococcus aureus***.\n\nA **midvolar or lateral** incision is recommended for drainage. A **fish-mouth incision** should be avoided because it can cause **tip necrosis**, and the touch pad should also be avoided. Afterward, warm soaks and dressings are recommended.\n\n**Paronychia**, an infection under the nail fold, is also most often caused by *S. aureus*; lifting the fold is enough, and the nail does not necessarily have to be removed.","why":{"0":"A mucous cyst is a tumor-category lesion and is not the main risk of a fish-mouth incision.","2":"A1 pulley triggering has no direct relation to felon drainage incisions.","3":"The ulnar artery in Guyon's canal is at the ulnar wrist and has nothing to do with a fingertip incision.","4":"A DIP extensor lag is a finding of mallet finger."},"one":"Drain a felon through a midvolar or lateral incision; avoid the fish-mouth incision because of the risk of tip necrosis."},"w10_riedel-28":{"q":"Which of the following is a classic Kanavel sign of pyogenic flexor tenosynovitis?","o":["Night pain relieved by shaking the hand","Pain with Finkelstein ulnar deviation","Severe pain on passive extension of the digit","Thenar atrophy with a simian thumb","A transilluminating dorsal wrist mass"],"a":2,"src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 74, 75, 76, 77, 78, 79","img":[{"u":"img/w10_riedel/p74.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 74","w":1200,"h":900},{"u":"img/w10_riedel/p75.webp","cap":"Riedel - Clinical Correlates
