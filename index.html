35.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 35","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"**Anxiety can exacerbate asthma symptoms.** Dentists and hygienists should be attuned to adult asthma patients who show signs of anxiety or stress before or during treatment.\n\n**Asthma and anxiety** (a starred item):\n- **The most important factor in overcoming dental anxiety is good dentist-patient communication**\n- Have the patient focus on **breathing regularly and slowly** during procedures\n- **Avoid caffeine and sugary foods** before the appointment\n- **High-protein foods** produce a calming effect","why":{"0":"Patients should avoid caffeine before the visit.","1":"Communication is the single most important factor.","3":"Sugary foods should be avoided before the visit.","4":"Long appointments are not listed as a way to overcome anxiety; communication is the key factor."},"one":"Good communication is the key to overcoming dental anxiety; slow breathing, no caffeine or sugar, and high-protein foods help."},"w12_asthma-25":{"q":"What are the indications for nitrous oxide in the dental setting?","o":["It is contraindicated in all asthmatic patients","Acute asthma attack with hypoxia only","Patients taking theophylline only","COPD only","Dental anxiety, gag reflex, and asthma with emotional stress"],"a":4,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 36","img":[{"u":"img/w12_asthma/p36.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 36","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"Indications compared:\n\n- **Nitrous oxide**: **dental anxiety**, **gag reflex**, **asthma with emotional stress**\n- **Oxygen**: **COPD**, **asthma**\n\nNitrous oxide also appears in the list of dental recommendations for asthmatic patients.","why":{"0":"Asthma with emotional stress is an indication for nitrous oxide.","1":"Hypoxia in an acute attack calls for oxygen.","2":"Theophylline is a caution about macrolide antibiotics, not a nitrous oxide indication.","3":"COPD is an indication for oxygen."},"one":"Nitrous oxide: dental anxiety, gag reflex, asthma with emotional stress; oxygen: COPD and asthma."},"w12_asthma-26":{"q":"What is the heritability of asthma and of dental caries, and how does caries in the primary teeth of asthmatic children compare?","o":["10% for asthma, 90% for caries; no difference in caries","90% for asthma, 40–60% for caries; nearly two-fold increase in caries in the primary teeth of children with asthma","50% for both; caries decreases in asthma","40–60% for asthma, 90% for caries; four-fold increase","Neither is heritable"],"a":1,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 37","img":[{"u":"img/w12_asthma/p37.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 37","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"**Asthma and oral health**:\n- **Genetic**: high heritability in both – **90% for asthma**, **40–60% for dental caries**\n- Asthmatic patients may have increased **cavities, bad breath and gum problems**\n- Studies report a **nearly two-fold increase in caries in the primary teeth of children with asthma** compared with children without asthma","why":{"0":"The figures are reversed, and caries increases in asthmatic children.","2":"Heritability is 90% for asthma and 40–60% for caries, and caries increases.","3":"Asthma is 90%, caries 40–60%, and the increase is nearly two-fold.","4":"Both are highly heritable."},"one":"Heritability is 90% for asthma and 40–60% for caries; asthmatic children have nearly twice the caries in primary teeth."},"w12_asthma-27":{"q":"Which oral effects are listed for β2-agonists?","o":["Increased bone mineral density","Gingival hyperplasia and hairy tongue","Increased IgA and lower S. mutans counts","Decreased salivation rate (higher incidence of calculus), decreased saliva pH, higher incidence of candidiasis, and sugar content","Increased salivation and higher saliva pH"],"a":3,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 38","img":[{"u":"img/w12_asthma/p38.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 38","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"Among the **factors** for dental erosion, periodontal disease and caries, **β2-agonists** cause:\n- **Decreased salivation rate** → **higher incidence of calculus**\n- **Decreased saliva pH**\n- **Higher incidence of candidiasis**\n- **Sugar content**\n\nThat is why fluoride is especially recommended for β2-agonist users.","why":{"0":"Decreased bone mineral density is a steroid effect, not an increase.","1":"Gingival hyperplasia and hairy tongue are not listed.","2":"Decreased IgA and increased S. mutans are steroid effects, and the direction here is reversed.","4":"Salivation and pH decrease, not increase."},"one":"β2-agonists: decreased salivation (more calculus), lower saliva pH, more candidiasis, sugar content."},"w12_asthma-28":{"q":"Besides lowering salivation and pH, which effects are listed for steroids?","o":["Immunosuppression with decreased IgA, higher salivary Streptococcus mutans counts, higher incidence of candidiasis, and decreased bone mineral density","Increased IgA and fewer bacteria","Higher salivary flow and enamel hardening","No oral effects","Increased bone mineral density"],"a":0,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 38","img":[{"u":"img/w12_asthma/p38.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 38","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"Effects of **steroids**:\n- **Decreased salivation rate and saliva pH**, **higher sugar content**\n- **Higher incidence of candidiasis**\n- **Immunosuppressive effect with decreased IgA**\n- **Higher Streptococcus mutans counts in saliva** than healthy controls\n- **Decreased bone mineral density**\n\nOther factors:\n- **Extrinsic**: more sweet drinks, acid soft drinks and sugary snacks\n- **Intrinsic**: GERD, orofacial abnormalities","why":{"1":"IgA decreases and S. mutans increases.","2":"Salivation decreases.","3":"There are several oral effects.","4":"Bone mineral density decreases."},"one":"Steroids: lower salivation and pH, sugar, candidiasis, decreased IgA (immunosuppression), more S. mutans, lower bone density."},"w12_asthma-29":{"q":"Which preventive measures are listed against medication-related oral damage, and why does nighttime inhaler use matter?","o":["Stop all asthma medication; nighttime use neutralizes acid","Antibiotics daily; nighttime use has no effect","Rinsing the mouth, sialagogues for low salivary flow, and sugar-free gum; inhaled therapy is often taken at night without oral hygiene and without masticatory movement","Brushing is contraindicated after an inhaler; nighttime use protects teeth","Avoid all fluids; nighttime use increases saliva"],"a":2,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 38, 39","img":[{"u":"img/w12_asthma/p38.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 38","w":1200,"h":675},{"u":"img/w12_asthma/p39.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 39","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"**Prevention**:\n- **Rinsing the mouth and controlling cofactors is mandatory**\n- **Sialagogue medication** for patients with a low salivary flow rate\n- Chewing **sugar-free gum**\n\n**Major factor: role of asthma medication.** Inhaled therapy is often taken **at night before bed without any oral hygiene**, and the **lack of masticatory movements** can increase the damage the medications themselves cause.","why":{"0":"The point is better oral care, not stopping asthma medication.","1":"Daily antibiotics are not listed, and nighttime use can increase damage.","3":"Patients should rinse after the inhaler, and nighttime use can increase damage.","4":"Avoiding fluids is not advised, and nighttime use worsens damage because there is no chewing."},"one":"Prevention: rinse, sialagogues, sugar-free gum. Inhaling at night without oral hygiene or chewing increases damage."},"w12_asthma-30":{"q":"Because asthmatics have increased risk for cavities and gum disease, which dental care recommendations are listed?","o":["Routine antibiotic premedication for all asthmatics","Fewer dental visits to reduce stress","Fluoride only if the patient uses steroids","Avoid informing the dentist of health changes","More frequent maintenance visits, fluoride interventions if using β2-agonist inhalers, caries prevention, antibiotic premedication if needed, stress reduction, and nitrous oxide for anxiety"],"a":4,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 40, 41","img":[{"u":"img/w12_asthma/p40.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 40","w":1200,"h":675},{"u":"img/w12_asthma/p41.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 41","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"In asthma treatment **oral health care providers play an important role**. Patients taking asthma medications **may need to monitor dental health more aggressively**.\n\n**Because of increased risk for cavities and gum disease**, asthmatics should:\n- **Increase frequency of dental maintenance visits**\n- **Fluoride interventions** if using **β2-agonist inhalers**\n- **Caries-prevention measures**\n- **Antibiotic premedication if needed**\n- **Stress-reduction techniques**\n- **Keep the dentist updated** on health changes\n- **Ask for nitrous oxide** to help reduce anxiety","why":{"0":"Antibiotic premedication is only if needed.","1":"Visits increase, not decrease.","2":"Fluoride is especially recommended for β2-agonist inhaler users.","3":"The dentist should be kept updated on health changes."},"one":"Asthmatics: more frequent visits, fluoride if on β2-agonists, caries prevention, antibiotics if needed, stress reduction, updates, nitrous oxide."},"w12_asthma-31":{"q":"Which general oral health care instruction is given for asthmatic patients?","o":["Instruct patients not to rinse after using an inhaler","Prescribe fluoride only for children","Prescribe fluoride for all asthmatics, especially those on β2-agonists (higher sugar content), and instruct them to rinse after using an inhaler","Never prescribe antifungal agents","Stop oral hygiene instruction for asthmatics"],"a":2,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 42","img":[{"u":"img/w12_asthma/p42.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 42","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"**General oral health care instructions** (a starred item):\n- **Prescribe fluoride supplements** (e.g. fluoride toothpaste) **for all asthmatic patients**, but **especially those taking β2-agonists** (**higher sugar content**)\n- **Instruct patients to rinse their mouths after using an inhaler**\n- **Reinforce oral hygiene instructions** to minimize gingivitis\n- Be aware of a possible need to prescribe **antifungal agents** for patients who **chronically use nebulized corticosteroids**","why":{"0":"Patients should rinse after using an inhaler.","1":"Fluoride is recommended for all asthmatic patients.","3":"Antifungals may be needed for chronic nebulized corticosteroid users.","4":"Oral hygiene instruction is reinforced."},"one":"Fluoride for all asthmatics (especially on β2-agonists), rinse after inhaler, reinforce hygiene, consider antifungals with chronic nebulized steroids."},"w12_asthma-32":{"q":"Which drugs should be avoided in asthmatic patients?","o":["Inhaled corticosteroids","Aspirin-containing drugs, NSAIDs, macrolide antibiotics in patients on theophylline, opiates, and adrenalin or levonordefrin in local anesthetics","Fluoride toothpaste and chlorhexidine","Acetaminophen only","Short-acting β2-agonists"],"a":1,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 43","img":[{"u":"img/w12_asthma/p43.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 43","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"**Drugs to be avoided in asthmatic patients**:\n- **Drugs containing aspirin**\n- **NSAIDs**\n- **Macrolide antibiotics** in patients treated with **theophylline**\n- **Opiates**\n- **Adrenalin or levonordefrin in local anesthetics**\n\nAspirin and NSAIDs are also asthma triggers.","why":{"0":"Inhaled corticosteroids are controller therapy.","2":"Fluoride and chlorhexidine are not on the list of drugs to avoid.","3":"Acetaminophen is not on the list.","4":"SABAs should be readily available and may be given prophylactically before the procedure."},"one":"Avoid aspirin, NSAIDs, macrolides with theophylline, opiates, and adrenalin or levonordefrin in local anesthetics."},"w12_asthma-33":{"q":"According to the take-home hints, when should elective dentistry be performed on an asthmatic patient?","o":["Only on asymptomatic patients; coughing, wheezing or an upper respiratory infection requires reappointment","Only after stopping all asthma medication","At any time, as long as the patient has an inhaler at home","Only during an upper respiratory infection","Only under general anesthesia"],"a":0,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 44","img":[{"u":"img/w12_asthma/p44.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 44","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"**Take-home hints** 1–3:\n1. **Update the medical history at every visit** – asthma activity, **increased use of rescue medication**, and any change in or presence of symptoms\n2. **Elective dentistry only on asymptomatic patients.** **Coughing, wheezing or an upper respiratory infection** means **reappointment**\n3. Make sure the patient has **taken the most recent scheduled dose** of antiasthma medication","why":{"1":"The patient should have taken the latest scheduled dose.","2":"The inhaler must be readily available in the office, and the patient must be asymptomatic.","3":"An upper respiratory infection requires reappointment.","4":"General anesthesia is not mentioned."},"one":"Elective care only when asymptomatic; reappoint for cough, wheeze or URI; update history every visit; confirm the latest dose."},"w12_asthma-34":{"q":"How should the patient's short-acting β2-agonist (SABA) be handled at a dental visit?","o":["It is not needed if the patient is well controlled","The SABA should be withheld for 24 hours before the visit","The dentist should replace it with a long-acting β2-agonist only","The patient's own SABA should be readily available, and the patient should take a prophylactic dose immediately prior to the procedure","It should be given only after an attack has lasted 30 minutes"],"a":3,"src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 44","img":[{"u":"img/w12_asthma/p44.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 44","w":1200,"h":675}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12,"exp":"**Take-home hints** 4–6:\n4. Be aware of **potential triggers in the office** and reduce or eliminate exposure\n5. The **patient's own short-acting β2-agonist** should be **readily available**\n6. Have the patient take a **prophylactic dose** of SABA **immediately prior to the procedure**","why":{"0":"Even in well-controlled patients the SABA is kept ready and given prophylactically.","1":"The SABA is not withheld; a prophylactic dose is taken right before the procedure.","2":"The patient's own short-acting agent should be ready.","4":"It is given prophylactically before the procedure and right away during an attack."},"one":"Keep the patient's own SABA ready, give a prophylactic dose right before the procedure, and reduce office triggers."},"w12_cv_dev-1":{"q":"By what time does the heart begin to beat, and by when is the primitive heart tube transformed into the adult-appearing four-chambered heart?","o":["Beats by day 18; four-chambered by 4 weeks","Beats by day 8; four-chambered by 23 weeks","Beats by day 23; four-chambered by 8 weeks","Beats only after birth; four-chambered by 8 weeks","Beats by week 12; four-chambered at birth"],"a":2,"src":"Cardiovascular System.pdf, slide 3","img":[{"u":"img/w12_cv_dev/p03.webp","cap":"Cardiovascular System.pdf, slide 3","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"Two key numbers from the heart development overview:\n\n- **By day 23 the heart begins to beat!**\n- The **primitive heart tube** is fully transformed into the adult-appearing **four-chambered heart by 8 weeks**.\n\nOverview: heart tube formation (origin, looping) → septation (atrial, atrioventricular, ventricular, outflow tracts) → vascular development (arterial, venous) → circulatory changes at birth.","why":{"0":"Day 18 is when vasculogenesis has spread through the intraembryonic mesoderm; four chambers come at 8 weeks.","1":"The numbers are swapped: beating by day 23, four chambers by 8 weeks.","3":"The heart beats from day 23 of embryonic life.","4":"Beating starts much earlier, by day 23."},"one":"The heart beats by day 23 and has four chambers by 8 weeks."},"w12_cv_dev-2":{"q":"From where are cardiac progenitor cells derived?","o":["Neural crest from the caudal neural tube","The caudal third of the primitive streak in late gastrulation","Ectoderm of the oropharyngeal membrane","Intraembryonic mesoderm emerging from the cranial third of the primitive streak during early gastrulation","Hypoblast of the yolk sac"],"a":3,"src":"Cardiovascular System.pdf, slide 6","img":[{"u":"img/w12_cv_dev/p06.webp","cap":"Cardiovascular System.pdf, slide 6","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**Establishing cardiac lineage** starts in **early gastrulation** when the mesoderm forms.\n\n- **Cardiac progenitor cells** derive from **intraembryonic mesoderm** emerging from the **cranial third of the primitive streak** during early gastrulation.\n- They leave the streak and **migrate cranial-laterally** to settle **on either side** of the primitive streak.","why":{"0":"Neural crest contributes cushion tissue in septation, but the progenitors are mesodermal.","1":"It is the cranial third, in early gastrulation.","2":"The oropharyngeal membrane becomes the future mouth.","4":"The hypoblast is replaced by definitive endoderm."},"one":"Cardiac progenitors come from intraembryonic mesoderm of the cranial third of the primitive streak in early gastrulation and migrate cranial-laterally."},"w12_cv_dev-3":{"q":"During gastrulation, what do the first ingressing epiblast cells form?","o":["Extraembryonic mesoderm only","Notochord only","Cardiac jelly","Ectoderm, which remains on the surface","Definitive endoderm, which eventually completely replaces the hypoblast"],"a":4,"src":"Cardiovascular System.pdf, slide 7","img":[{"u":"img/w12_cv_dev/p07.webp","cap":"Cardiovascular System.pdf, slide 7","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**Ingression** is \"the movement or migration of cells through the primitive streak\":\n- Epiblast cells **converge** toward the midline streak\n- They become **flask-shaped**, detach and slip underneath the ectoderm\n\nAll three germ layers derive from the **epiblast**:\n1. **First ingressing cells → definitive endoderm**, which eventually **completely replaces the hypoblast**\n2. Some diverge into the space below the epiblast → **intraembryonic mesoderm**, a loose mat between epiblast and endoderm\n3. **Cells remaining on the surface → ectoderm**\n\nIngression stops once endoderm and mesoderm are formed, and the germ disc extends cranially.","why":{"0":"The cells spreading below the epiblast become intraembryonic mesoderm.","1":"The first ingressing cells become definitive endoderm.","2":"Cardiac jelly is matrix deposited by the developing myocardium.","3":"Ectoderm is the cells that stay on the surface without ingressing."},"one":"Ingression: first cells → definitive endoderm (replaces hypoblast), next → intraembryonic mesoderm, surface cells → ectoderm."},"w12_cv_dev-4":{"q":"When does the vascular system appear, and what is the sequence that forms the endocardial heart tubes?","o":["Week 8; endocardial tubes → angioblastic cords → angiogenetic clusters","Middle of week 3; angiogenetic clusters → angioblastic cords (two longitudinal strands) → canalization into endocardial heart tubes","Week 1; neural folds → heart tube","Week 6; aortic arches → endocardial tubes","Middle of week 3; septum primum → septum secundum → heart tube"],"a":1,"src":"Cardiovascular System.pdf, slide 8","img":[{"u":"img/w12_cv_dev/p08.webp","cap":"Cardiovascular System.pdf, slide 8","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**Origin**: the vascular system appears in the **middle of week 3**.\n\n1. **Angiogenetic clusters**: mesenchymal cells proliferate into isolated clusters\n2. **Angioblastic cords**: the clusters arrange into **two longitudinal strands**\n3. They canalize → **endocardial heart tubes**\n\nThe heart-forming region is the **cardiac crescent anterior to the prochordal plate** (an NDE point).","why":{"0":"The order is reversed, and the timing is mid-week 3.","2":"Neural folds form the neural tube.","3":"The aortic arches come after heart tube formation.","4":"Septum primum and secundum belong to atrial septation in weeks 4–5."},"one":"Mid-week 3: angiogenetic clusters → two angioblastic cords → canalization → endocardial heart tubes."},"w12_cv_dev-5":{"q":"Where is the cardiogenic field (cardiac crescent) located relative to the prochordal plate?","o":["Anterior (cranial) to the prochordal plate","Posterior to the cloacal membrane","Within the notochord","Lateral to the allantois only","Inside the yolk sac wall"],"a":0,"src":"Cardiovascular System.pdf, slide 8","img":[{"u":"img/w12_cv_dev/p08.webp","cap":"Cardiovascular System.pdf, slide 8","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"The **cardiogenic field** that forms the endocardial heart tubes lies as a **cardiac crescent anterior to the prochordal plate**, flagged as an **NDE question** point.","why":{"1":"The cloacal membrane is caudal.","2":"The notochord is a midline axial structure, not the heart field.","3":"The allantois is caudal.","4":"Blood islands of the yolk sac are extraembryonic; the heart field is anterior to the prochordal plate."},"one":"The cardiogenic field (cardiac crescent) is anterior to the prochordal plate (NDE)."},"w12_cv_dev-6":{"q":"Which statements about the developing cardiovascular system are emphasized?","o":["It reaches a functional state long before any other organ system, grows from a simple bilaterally symmetrical plexus into an asymmetrical complex system, and the young heart is relatively enormous compared with the adult","It is the last organ system to function","It stays the same shape while the embryo grows","The embryonic heart is relatively tiny compared with the adult","It begins asymmetrical and becomes bilaterally symmetrical"],"a":0,"src":"Cardiovascular System.pdf, slide 9","img":[{"u":"img/w12_cv_dev/p09.webp","cap":"Cardiovascular System.pdf, slide 9","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"The underlined key points:\n- The cardiovascular system is not the first organ system to appear, but it **reaches a functional state long before any other**, while still relatively primitive.\n- It grows from a **simple, bilaterally symmetrical plexus** into an **asymmetrical complex system** of arteries, veins and capillaries: a dynamic process of new vessels, temporary detours, rerouting of flow and disappearance of previously dominant channels or whole subsystems.\n- It must **enlarge** as the embryo grows and **adapt** to changes in shape, and the heart must **grow** and differentiate from a simple tube into a four-chambered organ with four sets of valves while working.\n- Because it also supplies the extraembryonic (placental) tissue, **the young heart is relatively enormous compared with the adult organ**.","why":{"1":"It functions long before other systems.","2":"It keeps adapting to the embryo's changing shape.","3":"It is relatively enormous.","4":"It goes from symmetrical to asymmetrical."},"one":"The CV system functions first, goes from a symmetrical plexus to an asymmetrical system, and the embryonic heart is relatively enormous."},"w12_cv_dev-7":{"q":"Cranial (head) folding is caused by forward growth of the neural plate. Which three structures in the cranial rim result, and what do they become?","o":["Cloacal membrane → anus; allantois → bladder; yolk stalk → umbilicus","Amnion → skin; chorion → placenta; yolk sac → gut","Septum primum → fossa ovalis; truncus → aorta; sinus venosus → right atrium","Oropharyngeal membrane → future mouth; cardiogenic area → heart; septum transversum → part of diaphragm","Notochord → nucleus pulposus; somites → vertebrae; neural crest → ganglia"],"a":3,"src":"Cardiovascular System.pdf, slide 10, 5","img":[{"u":"img/w12_cv_dev/p10.webp","cap":"Cardiovascular System.pdf, slide 10","w":1200,"h":900},{"u":"img/w12_cv_dev/p05.webp","cap":"Cardiovascular System.pdf, slide 5","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**Embryonic folding** is active remodeling of tissue layers, and its **main force is differential growth** of structures. Craniocaudal and lateral folding transforms the flat disc into a **three-dimensional tube-within-a-tube**.\n\n**Head folding** is caused by **forward growth of the neural plate**, and the cranial rim of the disc contains:\n1. **Oropharyngeal membrane** → **future mouth**\n2. **Cardiogenic area** → **heart**\n3. **Septum transversum** → **part of the diaphragm**","why":{"0":"These are caudal structures, unrelated to head folding.","1":"These are extraembryonic membrane topics.","2":"These are fates of internal heart structures.","4":"Notochord, somites and neural crest are not the three results of head folding."},"one":"Head folding: oropharyngeal membrane → mouth, cardiogenic area → heart, septum transversum → part of diaphragm; folding is driven by differential growth."},"w12_cv_dev-8":{"q":"Which describes the layers of the primitive heart tube?","o":["Epicardium lines the lumen of the heart tube","Endocardium (an endothelium); myocardium (heart muscle) separated from the fused endocardial tubes by cardiac jelly deposited mainly by the myocardium; epicardium (visceral pericardium)","Only two layers form: endocardium and epicardium","Cardiac jelly is deposited by the endocardium and lies outside the epicardium","Endocardium (heart muscle); myocardium (endothelium); epicardium (parietal pericardium)"],"a":1,"src":"Cardiovascular System.pdf, slide 11","img":[{"u":"img/w12_cv_dev/p11.webp","cap":"Cardiovascular System.pdf, slide 11","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"As the heart tube fuses, **three layers** form:\n\n1. **Endocardium**: consists of an **endothelium**\n2. **Myocardium**: heart muscle. A thick extracellular matrix, the **cardiac jelly** (\"a cardio-myocytic progenitor\"), is **deposited mainly by the developing myocardium** and **separates the myocardium from the fused endocardial tubes**.\n3. **Epicardium**: the **visceral pericardium** covering the outside of the heart tube","why":{"0":"The lumen is lined by the endocardium.","2":"Three layers form, including the myocardium.","3":"Cardiac jelly is deposited mainly by the myocardium and lies between myocardium and endocardium.","4":"The endocardium is endothelium, the myocardium is muscle, and the epicardium is visceral pericardium."},"one":"Heart tube layers: endocardium (endothelium), myocardium (separated by cardiac jelly it deposits), epicardium (visceral pericardium)."},"w12_cv_dev-9":{"q":"Which region of the primitive heart tube becomes the right atrium and receives the umbilical, vitelline and common cardinal veins?","o":["Truncus arteriosus","Primitive ventricle","Primitive atria","Bulbus cordis","Sinus venosus"],"a":4,"src":"Cardiovascular System.pdf, slide 12","img":[{"u":"img/w12_cv_dev/p12.webp","cap":"Cardiovascular System.pdf, slide 12","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"The primitive heart tube elongates and **loops to the right**. Its five regions and fates:\n\n1. **Sinus venosus** → **right atrium** (remember the sinus venarum). It receives:\n   - **umbilical veins** ← placenta\n   - **vitelline veins** ← yolk sac\n   - **common cardinal veins** ← embryo\n2. **Primitive atria** → both **auricles** (and pectinate muscles of the right atrium)\n3. **Primitive ventricle** → by faster growth, the **left ventricle**\n4. **Bulbus cordis** → **right ventricle**\n5. **Truncus arteriosus** → **roots of the aorta and pulmonary trunk**","why":{"0":"The truncus arteriosus forms the aortic and pulmonary roots.","1":"The primitive ventricle forms the left ventricle.","2":"The primitive atria form the auricles and RA pectinate muscles.","3":"The bulbus cordis forms the right ventricle."},"one":"Sinus venosus → RA, primitive atria → auricles, primitive ventricle → LV, bulbus cordis → RV, truncus → aortic and pulmonary roots."},"w12_cv_dev-10":{"q":"Which pairing of primitive heart tube region and adult derivative is correct?","o":["Primitive atria → interventricular septum","Truncus arteriosus → right atrium","Bulbus cordis → right ventricle; primitive ventricle → left ventricle","Sinus venosus → pulmonary trunk","Bulbus cordis → left ventricle; primitive ventricle → right ventricle"],"a":2,"src":"Cardiovascular System.pdf, slide 12","img":[{"u":"img/w12_cv_dev/p12.webp","cap":"Cardiovascular System.pdf, slide 12","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"An easy pair to confuse:\n\n- The **primitive ventricle** develops by faster growth into the **left ventricle**.\n- The **bulbus cordis** develops into the **right ventricle**.\n\nThe rest: sinus venosus → right atrium, primitive atria → auricles (and RA pectinate muscles), truncus arteriosus → aortic and pulmonary roots.","why":{"0":"The primitive atria form the auricles.","1":"The truncus forms the aortic and pulmonary roots; the right atrium comes from the sinus venosus.","3":"The sinus venosus forms the right atrium.","4":"Left and right are swapped."},"one":"Primitive ventricle → LV; bulbus cordis → RV."},"w12_cv_dev-11":{"q":"Why does the heart tube form a bulboventricular loop to the right?","o":["It shortens and straightens","Its ends are fixed (venous end with the septum transversum, arterial end with the aortic arches), so as it grows and elongates inside the pericardial cavity it has nowhere to go but to fold","The septum primum pushes it to the right","Its ends are free, so it rotates passively","Blood flow stops during looping"],"a":1,"src":"Cardiovascular System.pdf, slide 13, 14","img":[{"u":"img/w12_cv_dev/p13.webp","cap":"Cardiovascular System.pdf, slide 13","w":1200,"h":900},{"u":"img/w12_cv_dev/p14.webp","cap":"Cardiovascular System.pdf, slide 14","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**Cardiac looping**:\n- The heart tube is initially **straight in an almost rostro-caudal direction**, **virtually fixed at its upper and lower ends**.\n- As it **grows and elongates**, it begins to fold or \"loop\" inside the **pericardial cavity**.\n- **The ends are fixed**: the **venous end with the septum transversum** and the **arterial end with the aortic arches**, so with **nowhere to go except to fold**, it forms a **bulboventricular loop to the right**.","why":{"0":"The tube grows and elongates, then folds.","2":"The septum primum belongs to atrial septation, not looping.","3":"The ends are fixed.","4":"Blood keeps flowing during looping."},"one":"With both ends fixed (septum transversum, aortic arches), the elongating tube folds into a bulboventricular loop to the right."},"w12_cv_dev-12":{"q":"Septation of the heart occurs concurrently during which weeks, and what two basic processes play key roles?","o":["Weeks 12–16; ossification and fusion of somites","Weeks 8 and 9; apoptosis and calcification","Weeks 4 and 5; vasculogenesis and intussusception only","Weeks 4 and 5; differential growth and remodeling, and endocardial-derived and neural crest-derived cushion tissue","Week 2; ingression and gastrulation"],"a":3,"src":"Cardiovascular System.pdf, slide 15","img":[{"u":"img/w12_cv_dev/p15.webp","cap":"Cardiovascular System.pdf, slide 15","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**Septation of the heart** comprises **concurrent processes during weeks 4 and 5**.\n\nTwo basic processes play key roles:\n1. **Differential growth and remodeling**\n2. **Endocardial-derived and neural crest-derived cushion tissue**\n\nTogether they divide the heart into RA, LA, RV and LV.","why":{"0":"Ossification and somite fusion are unrelated.","1":"Septation occurs in weeks 4–5.","2":"Vasculogenesis and intussusception are vascular development processes.","4":"Ingression and gastrulation are the earlier processes that form the germ layers; septation is weeks 4–5."},"one":"Heart septation occurs concurrently in weeks 4–5, driven by differential growth/remodeling and endocardial- and neural crest-derived cushion tissue."},"w12_cv_dev-13":{"q":"In atrial septation, how do the foramen primum and foramen secundum arise?","o":["Both are openings in the interventricular septum","The foramen secundum forms first, then the foramen primum","The foramen primum is the initial large opening below the growing septum primum; the foramen secundum forms by coalescence of perforations in the septum primum","Both are perforations in the septum secundum","The foramen primum forms in the septum secundum; the foramen secundum is the gap left by the septum secundum"],"a":2,"src":"Cardiovascular System.pdf, slide 16, 17, 18","img":[{"u":"img/w12_cv_dev/p16.webp","cap":"Cardiovascular System.pdf, slide 16","w":1200,"h":900},{"u":"img/w12_cv_dev/p17.webp","cap":"Cardiovascular System.pdf, slide 17","w":1200,"h":900},{"u":"img/w12_cv_dev/p18.webp","cap":"Cardiovascular System.pdf, slide 18","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**Atrial septation** is a required step in separating the systemic and pulmonary circulations.\n\n1. **Septum primum**: a thin **crescent-shaped myocardial wedge** from the **cranio-dorsal wall** that grows toward the **endocardial cushions** to complete growth.\n   - **Foramen (ostium) primum**: the **initial large opening**\n   - **Foramen secundum**: forms by **coalescence of perforations in the septum primum**\n2. **Septum secundum**: grows **immediately to the right** of the septum primum; its **incomplete growth** leaves an oval opening, the **foramen ovale**.","why":{"0":"These are atrial septal openings.","1":"The foramen primum comes first.","3":"The opening left in the septum secundum is the foramen ovale.","4":"Both foramina involve the septum primum; the septum secundum leaves the foramen ovale."},"one":"Foramen primum = initial gap under the septum primum; foramen secundum = coalesced perforations in the septum primum; foramen ovale = incomplete septum secundum."},"w12_cv_dev-14":{"q":"Which septum grows immediately to the right of the septum primum and leaves the foramen ovale because of incomplete growth?","o":["Septum secundum","Membranous ventricular septum","Aorticopulmonary septum","Septum transversum","Muscular interventricular septum"],"a":0,"src":"Cardiovascular System.pdf, slide 16, 17","img":[{"u":"img/w12_cv_dev/p16.webp","cap":"Cardiovascular System.pdf, slide 16","w":1200,"h":900},{"u":"img/w12_cv_dev/p17.webp","cap":"Cardiovascular System.pdf, slide 17","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"The **septum secundum** grows **immediately to the right** of the septum primum. Its **incomplete growth** leaves an oval opening, the **foramen ovale**.\n\nIn the definitive fetal separation of the atria the septum secundum does not completely close; **during embryonic and fetal life much of the blood entering the right atrium passes to the left atrium via the foramen ovale and the foramen secundum**.","why":{"1":"The membranous ventricular septum completes ventricular septation.","2":"The aorticopulmonary septum divides the outflow tract.","3":"The septum transversum becomes part of the diaphragm.","4":"The muscular interventricular septum divides the ventricles."},"one":"The septum secundum grows right of the septum primum and leaves the foramen ovale; fetal blood passes RA → LA through it and the foramen secundum."},"w12_cv_dev-15":{"q":"Why does the fetal atrial septal arrangement allow blood to flow only from the right atrium to the left atrium?","o":["The endocardial cushions block left-to-right flow","Pressure is always higher in the left atrium before birth, so flow goes left to right","The ductus arteriosus closes the foramen ovale","The stiff septum secundum collapses against the thin septum primum","The thin septum primum collapses against the stiff septum secundum, blocking backflow to the right atrium"],"a":4,"src":"Cardiovascular System.pdf, slide 20, 19","img":[{"u":"img/w12_cv_dev/p20.webp","cap":"Cardiovascular System.pdf, slide 20","w":1200,"h":900},{"u":"img/w12_cv_dev/p19.webp","cap":"Cardiovascular System.pdf, slide 19","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"This arrangement lets blood flow **from the right atrium to the left atrium but not in reverse**:\n\n- The **thin septum primum collapses against the stiff septum secundum**, effectively blocking backflow into the right atrium.\n- The septum primum therefore acts as a **one-way flap** over the foramen ovale.\n\nAnimation colors: blue = septum primum, green = septum secundum, red = blood flow.","why":{"0":"The endocardial cushions divide the AV canal.","1":"Fetal flow is right to left.","2":"The ductus arteriosus is a separate shunt between pulmonary trunk and aorta.","3":"The thin septum (primum) collapses against the stiff one (secundum)."},"one":"The thin septum primum collapses against the stiff septum secundum, giving one-way RA → LA flow."},"w12_cv_dev-16":{"q":"How is the atrioventricular canal divided?","o":["All four cushions fuse in the midline","It is surrounded by four endocardial cushions; the dorsal and ventral cushions project further into the lumen and fuse to form a septum, while the two lateral cushions never fuse","The truncus arteriosus divides it","Only the lateral cushions fuse","The septum secundum grows down to divide it"],"a":1,"src":"Cardiovascular System.pdf, slide 21","img":[{"u":"img/w12_cv_dev/p21.webp","cap":"Cardiovascular System.pdf, slide 21","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"The **atrioventricular canal** is surrounded by **four endocardial cushions**:\n\n1. The **dorsal and ventral cushions** project further into the lumen and **fuse → septum**\n   - The **two lateral cushions (right and left) never fuse**.\n2. The **atrioventricular valves are \"hollowed out\" from the ventricular side**.\n3. Septation creates **two flow tracts** from the atria into the primitive ventricle, establishing **two separate flow patterns**.","why":{"0":"Only the dorsal and ventral cushions fuse.","2":"The truncus arteriosus is the outflow tract.","3":"The lateral cushions never fuse.","4":"The septum secundum is an atrial septal structure."},"one":"AV canal: of four endocardial cushions, dorsal and ventral fuse into a septum, the lateral two never fuse, and the AV valves are hollowed out from the ventricular side."},"w12_cv_dev-17":{"q":"From which side are the atrioventricular valves \"hollowed out\"?","o":["From the pericardial side","From the atrial side","From the truncus arteriosus","From the ventricular side","From the sinus venosus"],"a":3,"src":"Cardiovascular System.pdf, slide 21","img":[{"u":"img/w12_cv_dev/p21.webp","cap":"Cardiovascular System.pdf, slide 21","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"The **atrioventricular valves are \"hollowed out\" from the ventricular side**.\n\nAt the same stage the dorsal and ventral endocardial cushions fuse into a septum, creating **two flow tracts** from the atria into the primitive ventricle.","why":{"0":"It is not the pericardial side.","1":"It is the ventricular side, not the atrial side.","2":"The truncus is the outflow tract, unrelated to the AV valves.","4":"The sinus venosus is the inflow region."},"one":"AV valves are hollowed out from the ventricular side."},"w12_cv_dev-18":{"q":"How is ventricular septation initiated?","o":["A protrusion between the presumptive right and left ventricles, the muscular interventricular septum, forms as flow through the two AV tracts expands the lateral ventricular walls","The aorticopulmonary septum grows down to divide the ventricles first","The lateral endocardial cushions fuse in the ventricle","The membranous septum forms first from the septum primum","The septum transversum invaginates into the ventricle"],"a":0,"src":"Cardiovascular System.pdf, slide 22","img":[{"u":"img/w12_cv_dev/p22.webp","cap":"Cardiovascular System.pdf, slide 22","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**Ventricular septation** is integrated with the ventricular outflow pathways.\n\n1. **Initiation**: a **protrusion** between the presumptive right and left ventricles, the **muscular interventricular septum**\n   - Flow through the **two atrioventricular tracts expands the lateral walls** of the two ventricles, forming the **muscular ventricular septum** extending upward.\n\nOutflow tract septation follows, and the membranous septum completes the process.","why":{"1":"The aorticopulmonary septum divides the outflow tract and later fuses with the muscular septum.","2":"The lateral cushions never fuse.","3":"The membranous septum is the final step.","4":"The septum transversum becomes part of the diaphragm."},"one":"Ventricular septation starts with the muscular interventricular septum, formed as AV flow expands the lateral walls."},"w12_cv_dev-19":{"q":"How is the cardiac outflow tract divided?","o":["The outflow tract is never divided","The ductus arteriosus splits the truncus","Paired endocardial-covered conotruncal swellings (right and left bulbar ridges) grow inward and fuse into a spiral aorticopulmonary septum, which fuses with the muscular ventricular septum","The four AV cushions fuse inside the truncus in a straight line","The septum primum grows into the truncus"],"a":2,"src":"Cardiovascular System.pdf, slide 23, 24","img":[{"u":"img/w12_cv_dev/p23.webp","cap":"Cardiovascular System.pdf, slide 23","w":1200,"h":900},{"u":"img/w12_cv_dev/p24.webp","cap":"Cardiovascular System.pdf, slide 24","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**Outflow tract septation**:\n- The outflow tract is divided by a pair of **endocardial-covered conotruncal swellings**.\n- They grow inward along the conotruncal segment (\"**molded by convergent flow**\").\n- They fuse to form the **aorticopulmonary septum** from the **right and left bulbar ridges**.\n- The **spiral flow** generates a **spiral septation** that **fuses with the muscular ventricular septum**, completing separation of the two parallel cardiac circuits (like two parallel upward-flowing garden hoses).\n- Because the septation spirals, it \"**swaps**\" the left/right ventricle-to-vessel anatomical relationship. Animation colors: green = right bulbar ridge, yellow = left bulbar ridge.","why":{"0":"The outflow tract is divided into aorta and pulmonary trunk.","1":"The ductus arteriosus derives from the 6th aortic arch.","3":"The AV cushions divide the AV canal, and the outflow septum is spiral.","4":"The septum primum divides the atria."},"one":"The R/L bulbar ridges (conotruncal swellings) fuse into a spiral aorticopulmonary septum that joins the muscular ventricular septum."},"w12_cv_dev-20":{"q":"What completes ventricular septation, and which is the most common heart malformation?","o":["The muscular septum alone; patent ductus arteriosus (~25%)","The septum transversum; coarctation of the aorta","The septum secundum; atrial septal defects (~75%)","The septum primum; tetralogy of Fallot (~50%)","The membranous ventricular septum, which lets the muscular septum fuse with the conotruncal septum; VSDs (~25%), most often in the membranous septum"],"a":4,"src":"Cardiovascular System.pdf, slide 25","img":[{"u":"img/w12_cv_dev/p25.webp","cap":"Cardiovascular System.pdf, slide 25","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**Completion of ventricular septation**:\n- Development of the **membranous ventricular septum** completes separation of the ventricles.\n- It allows the **muscular interventricular septum to fuse with the conotruncal septum**, making a **complete interventricular septum**.\n\n**Ventricular septal defects (VSDs)** are the **most common heart malformation (~25%)**, most commonly associated with the **membranous septum**.","why":{"0":"The membranous septum completes it, and VSD is the most common malformation.","1":"The septum transversum becomes part of the diaphragm.","2":"The septum secundum is atrial, and the most common malformation is VSD.","3":"The septum primum is atrial; tetralogy of Fallot is the most common cyanotic defect."},"one":"The membranous septum completes ventricular septation; VSD (~25%, mostly membranous) is the most common heart malformation."},"w12_cv_dev-21":{"q":"When and where do blood vessels form by vasculogenesis, and what are endothelial precursor cells (EPCs)?","o":["In the ectoderm by day 5; EPCs are fibroblasts","In the heart tube only, at birth; EPCs are cardiomyocytes","Throughout the endoderm by day 30; EPCs are erythrocytes","Throughout the intraembryonic mesoderm by day 18; EPCs are the same as angioblasts","Only in the yolk sac at week 8; EPCs are neural crest cells"],"a":3,"src":"Cardiovascular System.pdf, slide 27","img":[{"u":"img/w12_cv_dev/p27.webp","cap":"Cardiovascular System.pdf, slide 27","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**Vascular development**:\n- Blood vessels form by **vasculogenesis**.\n- They develop **throughout the intraembryonic mesoderm by day 18**\n- and coalesce into a pervasive network.\n\n**Endothelial precursor cells (EPCs) are the same as angioblasts.**","why":{"0":"It is mesoderm, not ectoderm, and EPCs are not fibroblasts.","1":"Not only the heart tube, and EPCs are not cardiomyocytes.","2":"It is mesoderm, not endoderm, and EPCs are not erythrocytes.","4":"It is throughout intraembryonic mesoderm by day 18, and EPCs are angioblasts."},"one":"Vasculogenesis occurs throughout intraembryonic mesoderm by day 18; EPCs = angioblasts."},"w12_cv_dev-22":{"q":"The vascular network grows and spreads by four main processes. Which is correctly defined?","o":["Angiogenesis is budding and sprouting of new vessels; vascular intussusception is splitting of existing vessels into new vessels","Angiogenesis is splitting of vessels; intussusception is sprouting","Intercalation is the death of EPCs","Vasculogenesis is the closure of the ductus arteriosus","Intussusception is the fusion of endocardial cushions"],"a":0,"src":"Cardiovascular System.pdf, slide 27","img":[{"u":"img/w12_cv_dev/p27.webp","cap":"Cardiovascular System.pdf, slide 27","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"The network grows and spreads by **four main processes**:\n1. **Continued formation, migration and coalescence of EPCs**\n2. **Angiogenesis**: **budding and sprouting** of new vessels\n3. **Vascular intussusception**: **existing vessels split** into new vessels\n4. **Intercalation** of new EPCs into the **walls of existing vessels**","why":{"1":"The definitions are swapped.","2":"Intercalation is new EPCs inserting into existing vessel walls.","3":"Vasculogenesis is vessel formation in the mesoderm.","4":"Intussusception is splitting of existing vessels."},"one":"Four processes: EPC formation/migration/coalescence, angiogenesis (sprouting), intussusception (splitting), intercalation (new EPCs into walls)."},"w12_cv_dev-23":{"q":"What are the fates of the 1st and 2nd aortic arches?","o":["1st → common carotid; 2nd → subclavian","1st → ductus arteriosus; 2nd → maxillary artery","1st → pulmonary arteries; 2nd → aortic arch","Both persist as the internal carotid arteries","Both largely disappear; a small portion of the 1st persists as the maxillary artery, and the 2nd leaves a transient remnant, the stapedial artery"],"a":4,"src":"Cardiovascular System.pdf, slide 28","img":[{"u":"img/w12_cv_dev/p28.webp","cap":"Cardiovascular System.pdf, slide 28","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"The **arterial system** derives mainly from the **paired dorsal aortae**.\n\nThe **aortic arches** arise from the **aortic sac** and terminate in the **dorsal aorta**; they are brought about by **folding of the embryo** and are **remodeled** into the great arteries of the upper thorax and neck.\n\n- **1st**: disappears [a small portion persists as the **maxillary artery**]\n- **2nd**: disappears [transient remnant: **stapedial artery**, which made the hole in the stapes]\n- 3rd: common carotid and proximal internal carotid arteries\n- 4th: left → aortic arch; right → proximal subclavian artery\n- 5th: essentially nonexistent (found in avian embryology)\n- 6th: pulmonary arteries\n\n**There are never all five arches at once!**","why":{"0":"Common carotid is the 3rd arch; proximal subclavian is the right 4th.","1":"The ductus arteriosus comes from the 6th.","2":"Pulmonary arteries are the 6th; the aortic arch is the left 4th.","3":"The proximal internal carotid comes from the 3rd."},"one":"1st → maxillary artery remnant, 2nd → transient stapedial artery; the arches never all exist at once."},"w12_cv_dev-24":{"q":"Which aortic arch forms the common carotid arteries and the proximal segment of the internal carotid arteries?","o":["1st","3rd","6th","4th","5th"],"a":1,"src":"Cardiovascular System.pdf, slide 28, 30","img":[{"u":"img/w12_cv_dev/p28.webp","cap":"Cardiovascular System.pdf, slide 28","w":1200,"h":900},{"u":"img/w12_cv_dev/p30.webp","cap":"Cardiovascular System.pdf, slide 30","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**3rd arches** → **common carotid arteries** and the **proximal segment of the internal carotid arteries**.\n\nCompare:\n- 1st → small maxillary artery remnant\n- 4th → left aortic arch segment, right proximal subclavian\n- 5th → essentially nonexistent\n- 6th → pulmonary arteries (left distal part persists until birth as the ductus arteriosus)","why":{"0":"The 1st leaves a small maxillary artery remnant.","2":"The 6th forms the pulmonary arteries.","3":"The 4th forms the aortic arch (left) and proximal subclavian (right).","4":"The 5th is essentially nonexistent."},"one":"3rd arch → common carotid + proximal internal carotid."},"w12_cv_dev-25":{"q":"What does the 4th aortic arch form on each side?","o":["It disappears on both sides","Left: the maxillary artery; right: the stapedial artery","Left: the aortic arch segment between the left common carotid and left subclavian arteries; right: the most proximal segment of the right subclavian artery","Both sides: the common carotid arteries","Left: the ductus arteriosus; right: the right pulmonary artery"],"a":2,"src":"Cardiovascular System.pdf, slide 28, 30","img":[{"u":"img/w12_cv_dev/p28.webp","cap":"Cardiovascular System.pdf, slide 28","w":1200,"h":900},{"u":"img/w12_cv_dev/p30.webp","cap":"Cardiovascular System.pdf, slide 30","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**4th arches**:\n- **Left**: the **segment of the aortic arch between the left common carotid and left subclavian arteries**\n- **Right**: the **most proximal segment of the right subclavian artery**\n\nCompare the **6th arches**:\n- Right: proximal part → proximal right pulmonary artery; distal part disappears early\n- Left: proximal part → proximal left pulmonary artery; **distal part persists until birth** (ductus arteriosus)","why":{"0":"The 4th does not disappear; it forms the aortic arch segment and proximal subclavian.","1":"The maxillary artery is the 1st, the stapedial the 2nd.","3":"The common carotids come from the 3rd.","4":"The ductus arteriosus and pulmonary arteries come from the 6th."},"one":"4th arch: left → aortic arch segment, right → proximal right subclavian."},"w12_cv_dev-26":{"q":"What is the fate of the 6th aortic arches?","o":["They disappear completely on both sides","They form the pulmonary arteries; on the left the distal part persists until birth as the ductus arteriosus, while on the right the distal part disappears early","They form the maxillary and stapedial arteries","They form the right subclavian artery","They form the common carotid arteries"],"a":1,"src":"Cardiovascular System.pdf, slide 28, 30","img":[{"u":"img/w12_cv_dev/p28.webp","cap":"Cardiovascular System.pdf, slide 28","w":1200,"h":900},{"u":"img/w12_cv_dev/p30.webp","cap":"Cardiovascular System.pdf, slide 30","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**6th arches** → **pulmonary arteries**.\n- **Right**: proximal part → **proximal right pulmonary artery**; distal part **disappears early**\n- **Left**: proximal part → **proximal left pulmonary artery**; distal part **persists until birth** → **ductus arteriosus**\n\nAfter birth the ductus arteriosus becomes the **ligamentum arteriosum**.\n\nNote the **5th is essentially nonexistent (found in avian embryology)**, and **all five arches never exist at once**.","why":{"0":"The 6th persists as pulmonary arteries and the ductus.","2":"Maxillary is the 1st, stapedial the 2nd.","3":"The proximal right subclavian is the right 4th.","4":"The common carotids are the 3rd."},"one":"6th arch → pulmonary arteries; left distal part → ductus arteriosus (later ligamentum arteriosum)."},"w12_cv_dev-27":{"q":"Which statement about the pharyngeal arches is correct?","o":["Their largest component is the cartilage","They have only muscle components","They support the walls of the hindgut","They support the lateral walls of the primordial pharynx (from the cranial foregut), and each has nerve, blood vessel and cartilage components, the largest being the artery of the aortic arch","They derive from the caudal midgut"],"a":3,"src":"Cardiovascular System.pdf, slide 29","img":[{"u":"img/w12_cv_dev/p29.webp","cap":"Cardiovascular System.pdf, slide 29","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**Preview**:\n- The **pharyngeal arches** support the **lateral walls of the primordial pharynx**, which derives from the **cranial part of the foregut**.\n- **Each arch has nerve, blood vessel and cartilage components**, the **largest being the artery of the aortic arch**.","why":{"0":"The largest component is the artery.","1":"They have nerve, vessel and cartilage components.","2":"It is the primordial pharynx (cranial foregut), not the hindgut.","4":"They relate to the cranial foregut."},"one":"Pharyngeal arches support the primordial pharynx walls; of their nerve, vessel and cartilage components, the aortic arch artery is largest."},"w12_cv_dev-28":{"q":"What do the vitelline arteries form?","o":["The coronary arteries","The internal iliac arteries","The celiac (foregut), superior mesenteric (midgut) and inferior mesenteric (hindgut) arteries","The common carotid arteries","The pulmonary arteries"],"a":2,"src":"Cardiovascular System.pdf, slide 31","img":[{"u":"img/w12_cv_dev/p31.webp","cap":"Cardiovascular System.pdf, slide 31","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"The **vitelline arteries** arise from and are associated with the **yolk sac**, and **gradually fuse** to form:\n- **Celiac artery** → **foregut**\n- **Superior mesenteric artery** → **midgut**\n- **Inferior mesenteric artery** → **hindgut**","why":{"0":"Coronary arteries are not listed as a vitelline fate.","1":"The internal iliacs come from the proximal umbilical arteries.","3":"The common carotids come from the 3rd aortic arch.","4":"The pulmonary arteries come from the 6th aortic arch."},"one":"Vitelline arteries → celiac (foregut), SMA (midgut), IMA (hindgut)."},"w12_cv_dev-29":{"q":"What do the umbilical arteries become?","o":["The celiac trunk and superior mesenteric artery","Fossa ovalis","Ligamentum arteriosum","Ligamentum teres and ligamentum venosum","Proximal portions become the internal iliac arteries (and the superior vesical artery); distal parts become the medial umbilical ligaments"],"a":4,"src":"Cardiovascular System.pdf, slide 31, 35","img":[{"u":"img/w12_cv_dev/p31.webp","cap":"Cardiovascular System.pdf, slide 31","w":1200,"h":900},{"u":"img/w12_cv_dev/p35.webp","cap":"Cardiovascular System.pdf, slide 35","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**Umbilical arteries**:\n- **Proximal portions** → **internal iliac arteries**\n- **Distal parts** → **medial umbilical ligament**\n\nIn the changes at birth: umbilical arteries → **medial umbilical ligament**, with the proximal part persisting as the **superior vesical artery**.","why":{"0":"Celiac and SMA come from the vitelline arteries.","1":"Fossa ovalis is the foramen ovale remnant.","2":"Ligamentum arteriosum is the ductus arteriosus remnant.","3":"Ligamentum teres and venosum are remnants of the umbilical vein and ductus venosus."},"one":"Umbilical arteries: proximal → internal iliac (superior vesical), distal → medial umbilical ligament."},"w12_cv_dev-30":{"q":"The venous systems are at first bilaterally symmetrical. Which describes the vitelline and umbilical systems?","o":["Vitelline drains the GI tract and gut derivatives (right vein → portal system and part of IVC; left degenerates); umbilical carries oxygenated blood from the placenta (right disappears; left anastomoses with the ductus venosus)","Both left veins persist and both right veins disappear in each system","Vitelline carries oxygenated blood from the placenta; umbilical drains the gut","Umbilical drains the head and neck","Vitelline drains the body wall"],"a":0,"src":"Cardiovascular System.pdf, slide 32","img":[{"u":"img/w12_cv_dev/p32.webp","cap":"Cardiovascular System.pdf, slide 32","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"The **venous systems** are at first **bilaterally symmetrical**, with three major components:\n\n1. **Vitelline system**: drains the **GI tract and gut derivatives**\n   - **Right vitelline vein**: cranial portion → **portal system and part of the IVC**\n   - **Left vitelline vein**: **degenerates**\n2. **Umbilical system**: carries **oxygenated blood from the placenta**\n   - **Right umbilical vein**: **disappears**\n   - **Left umbilical vein**: **anastomoses with the ductus venosus** → **ligamentum teres and ligamentum venosum**\n3. **Cardinal system**: drains the head, neck and body wall","why":{"1":"In the vitelline system the right persists and the left degenerates.","2":"The roles are swapped.","3":"The head and neck are drained by the anterior cardinal veins.","4":"The body wall is drained by the cardinal system."},"one":"Vitelline: drains gut, right → portal and part of IVC. Umbilical: placental O2 blood, left + ductus venosus → lig. teres and venosum."},"w12_cv_dev-31":{"q":"What does the cardinal venous system drain?","o":["The placenta","The head, neck and body wall: posterior cardinal veins drain the trunk (intercostal, iliac veins) and anterior cardinal veins drain the head and neck (jugular, subclavian veins)","The yolk sac only","The GI tract only","The lungs"],"a":1,"src":"Cardiovascular System.pdf, slide 32","img":[{"u":"img/w12_cv_dev/p32.webp","cap":"Cardiovascular System.pdf, slide 32","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"The **cardinal system** drains the **head, neck and body wall**:\n- **Posterior cardinal veins** → drain the **trunk** (intercostal, iliac veins)\n- **Anterior cardinal veins** → drain the **head and neck** (jugular, subclavian veins)","why":{"0":"Placental blood is carried by the umbilical system.","2":"The yolk sac and gut belong to the vitelline system.","3":"The GI tract is drained by the vitelline system.","4":"The lungs are not listed as a cardinal drainage area."},"one":"Cardinal system: posterior cardinals → trunk, anterior cardinals → head and neck."},"w12_cv_dev-32":{"q":"As venous inflow shifts to the right, what happens to the left sinus horn?","o":["It becomes the terminal segment of the IVC","It becomes the right atrium","It stops growing and becomes a small venous sac on the posterior wall of the heart, giving rise to the coronary sinus and the oblique vein of the left atrium","It becomes the superior vena cava","It becomes the ductus venosus"],"a":2,"src":"Cardiovascular System.pdf, slide 33","img":[{"u":"img/w12_cv_dev/p33.webp","cap":"Cardiovascular System.pdf, slide 33","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**Venous system**: through complicated remodeling, **all systemic venous blood drains into the right atrium via the newly formed superior and inferior venae cavae**.\n\n- As **venous inflow shifts to the right**, the **left sinus horn ceases to grow**.\n- It is transformed into a **small venous sac on the posterior wall of the heart**,\n- which gives rise to the **coronary sinus** and the **oblique vein of the left atrium**.\n- Also, a **remnant of the right vitelline vein becomes the terminal segment of the IVC**.","why":{"0":"The terminal IVC is a right vitelline remnant.","1":"The right atrium comes from the sinus venosus as inflow shifts right.","3":"The SVC is not the left sinus horn's fate.","4":"The ductus venosus anastomoses with the left umbilical vein and becomes the ligamentum venosum."},"one":"Left sinus horn → coronary sinus + oblique vein of LA; right vitelline remnant → terminal IVC; all systemic veins reach the RA via SVC and IVC."},"w12_cv_dev-33":{"q":"Fetal circulation is described as a remarkable example of economy in nature. What does it achieve?","o":["It sends the best-oxygenated blood to the lungs first","It sends all placental blood to the liver for storage","It sends desaturated blood to the brain","It shunts well-oxygenated blood from the placenta to the brain and heart, leaving relatively desaturated blood for less essential structures such as the lungs and liver","It keeps systemic and pulmonary circulations fully separate before birth"],"a":3,"src":"Cardiovascular System.pdf, slide 34","img":[{"u":"img/w12_cv_dev/p34.webp","cap":"Cardiovascular System.pdf, slide 34","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**Fetal circulation** is a **remarkable example of economy in nature**:\n\n- It **shunts well-oxygenated blood** from the placenta to the **brain and heart**,\n- leaving **relatively desaturated blood** for **less essential structures (e.g., lungs and liver)**.\n\nShunts in the figure: the **foramen ovale**, the **ductus arteriosus**, and return to the placenta via the **umbilical arteries**.","why":{"0":"The lungs are a less essential structure that gets relatively desaturated blood.","1":"The liver is also listed as receiving relatively desaturated blood.","2":"Well-oxygenated blood goes to the brain.","4":"Before birth the foramen ovale and ductus arteriosus connect the two circulations."},"one":"Fetal circulation: oxygen-rich placental blood to the brain and heart, desaturated blood to the lungs and liver."},"w12_cv_dev-34":{"q":"What causes the circulatory changes at birth?","o":["Closure of the septum transversum","Fusion of the endocardial cushions","Formation of the aortic arches","Rupture of the oropharyngeal membrane","Cessation of placental blood flow and the beginning of respiration"],"a":4,"src":"Cardiovascular System.pdf, slide 35","img":[{"u":"img/w12_cv_dev/p35.webp","cap":"Cardiovascular System.pdf, slide 35","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"The **circulatory changes at birth** have two causes:\n1. **Cessation of placental blood flow**\n2. **The beginning of respiration**\n\nThe changes are a **gradual closure due to functional changes**.","why":{"0":"The septum transversum becomes part of the diaphragm; it does not cause birth changes.","1":"Cushion fusion is septation in weeks 4–5.","2":"The aortic arches form and remodel in the embryonic period.","3":"The oropharyngeal membrane is an early structure related to the future mouth."},"one":"Birth changes are caused by cessation of placental flow and onset of respiration, with gradual closure due to functional changes."},"w12_cv_dev-35":{"q":"Which pairing of fetal structure and its postnatal remnant is correct?","o":["Ductus arteriosus → ligamentum arteriosum; oval foramen → fossa ovalis","Umbilical arteries → ligamentum teres","Umbilical vein → medial umbilical ligament","Ductus venosus → ligamentum arteriosum","Oval foramen → ligamentum venosum"],"a":0,"src":"Cardiovascular System.pdf, slide 35","img":[{"u":"img/w12_cv_dev/p35.webp","cap":"Cardiovascular System.pdf, slide 35","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**Changes at birth and their remnants**:\n1. **Umbilical arteries** → **medial umbilical ligament** (proximal part = **superior vesical artery**)\n2. **Umbilical vein and ductus venosus** → **ligamentum teres** and **ligamentum venosum**\n3. **Ductus arteriosus** → **ligamentum arteriosum**\n4. **Oval foramen** → **fossa ovalis**","why":{"1":"The umbilical arteries become the medial umbilical ligament.","2":"The medial umbilical ligament comes from the umbilical arteries; the umbilical vein becomes the ligamentum teres.","3":"The ductus venosus becomes the ligamentum venosum.","4":"The oval foramen becomes the fossa ovalis."},"one":"Umbilical arteries → medial umbilical lig.; umbilical vein/ductus venosus → lig. teres/venosum; ductus arteriosus → lig. arteriosum; oval foramen → fossa ovalis."},"w12_cv_dev-36":{"q":"Which four cardiac defects make up the tetralogy of Fallot?","o":["Pulmonary stenosis, ventricular septal defect, dextroposition (overriding) of the aorta, and right ventricular hypertrophy","Patent ductus arteriosus, aortic stenosis, VSD, and left atrial enlargement","Tricuspid atresia, ASD, PDA, and transposition","Atrial septal defect, mitral stenosis, left ventricular hypertrophy, and coarctation","Pulmonary stenosis, ASD, left ventricular hypertrophy, and dextrocardia"],"a":0,"src":"Cardiovascular System.pdf, slide 36","img":[{"u":"img/w12_cv_dev/p36.webp","cap":"Cardiovascular System.pdf, slide 36","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**Clinical note: tetralogy of Fallot**, flagged as the **most common of the NDE questions**.\n\nThe classic group of **four cardiac defects**:\n1. **Pulmonary stenosis** – obstruction of right ventricular outflow\n2. **Ventricular septal defect (VSD)**\n3. **Dextroposition of the aorta** – **overriding or straddling aorta**\n4. **Right ventricular hypertrophy**","why":{"1":"PDA, aortic stenosis and LA enlargement are not included.","2":"Tricuspid atresia and transposition are not included.","3":"ASD, mitral stenosis, LVH and coarctation are not the tetralogy.","4":"It is VSD, overriding aorta and RVH, not ASD, LVH and dextrocardia."},"one":"Tetralogy of Fallot: pulmonary stenosis, VSD, overriding aorta, RV hypertrophy (an NDE favorite)."},"w12_cv_dev-37":{"q":"How does tetralogy of Fallot arise, how common is it, and what is the treatment of choice?","o":["Premature closure of the foramen ovale; 1 in 10,000; repair in adulthood","Persistent 5th aortic arch; 1 in 50; no treatment needed","Unequal division of the truncus arteriosus (the pulmonary trunk may have no lumen or no orifice at the pulmonary valve); most common cyanotic congenital heart malformation (~1 in 1,000 live births); primary surgical repair of the pulmonary stenosis and VSD in early infancy","Failure of the septum secundum; most common acyanotic defect (~1 in 10); medication only","Abnormal looping to the left; 1 in 100,000; heart transplant at age 10"],"a":2,"src":"Cardiovascular System.pdf, slide 36","img":[{"u":"img/w12_cv_dev/p36.webp","cap":"Cardiovascular System.pdf, slide 36","w":1200,"h":900}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12,"exp":"**Cause**: the **division of the truncus arteriosus is so unequal** that the **pulmonary trunk has no lumen**, or there is **no orifice at the level of the pulmonary valve**.\n\n**Frequency**: the **most common cyanotic congenital heart malformation**, about **1 in 1,000 live-born infants**.\n\n**Treatment**: **primary surgical repair of defects 1 (pulmonary stenosis) and 2 (VSD) in early infancy** is the treatment of choice.","why":{"0":"It is unrelated to foramen ovale closure, and repair is in early infancy.","1":"The 5th arch is essentially nonexistent, and surgical repair is needed.","3":"The cause is unequal truncus division; it is cyanotic, and surgery is the treatment of choice.","4":"Looping is not the cause, and the frequency is about 1 in 1,000."},"one":"Tetralogy = unequal truncus division; most common cyanotic congenital heart defect (~1/1,000); repair pulmonary stenosis and VSD in early infancy."}}};

    +(S.retry&&S.score?'<p class="mu">Original score kept: '+S.score.c+'/'+S.score.t+'</p>':'')
    +'<p class="bad"><b>Wrong: '+w.length+'</b></p><ol>'+list(w)+'</ol><p class="mu"><b>Unanswered: '+u.length+'</b></p><ol>'+list(u)+'</ol>'
    +'<div class="row"><button id="rev">Review answers</button>'+(w.length+u.length?'<button id="rt" class="pri">Retry wrong &amp; unanswered</button>':'')+(S.retry?'<button id="ex">End retry</button>':'')+'</div></div>';
  app.innerHTML=h;back.onclick=home;rev.onclick=()=>{A.cur=0;save();render()};
  if(window.rt)rt.onclick=()=>{S.retry={ids:w.concat(u),mode:'study',ans:{},chk:{},cur:0,submitted:false};save();render()};
  if(window.ex)ex.onclick=()=>{S.retry=null;save();results()}}
const last=localStorage.getItem(LS+'last');
const pack=findPack(last);
if(pack && ready(pack)){set=pack;S=load(set.key)||fresh();if(!S.chk)S.chk={};save();render()}
else home();
</script></body></html>
